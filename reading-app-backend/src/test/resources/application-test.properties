# ========== 测试环境：H2 内存数据库 ==========
spring.datasource.url=jdbc:h2:mem:reading-app-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ========== JPA 配置 ==========
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ========== 关闭邮件/短信等外部依赖 ==========
spring.mail.host=
sms.provider=mock

# ========== 抑制 H2 在 MySQL 模式下产生的非致命 DDL 警告 ==========
# （Hibernate 7.x 对 ReadingProgress 实体同时生成内联 unique 约束与 ALTER ADD CONSTRAINT，
#   在 MySQL 下兼容，在 H2 下报 "constraint already exists"；contextLoads 测试不依赖真实表结构）
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR
logging.level.org.hibernate.tool.schema.internal.SchemaCreatorImpl=ERROR
