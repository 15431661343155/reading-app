<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 执行自定义 SQL
  function importSQL() {
    const sql = document.getElementById('sqlInput').value.trim();
    if (!sql) { alert('请输入SQL语句'); return; }

    fetch('/api/admin/import/sql', {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: sql
    })
            .then(r => r.json())
            .then(d => {
              document.getElementById('sqlResult').innerHTML =
                      `<div class="alert alert-${d.success ? 'success' : 'danger'}">${d.message}</div>`;
            });
  }

  // 快速生成测试数据
  function generateData() {
    const data = {
      title: document.getElementById('bookTitle').value,
      author: document.getElementById('bookAuthor').value,
      category: document.getElementById('bookCategory').value,
      intro: document.getElementById('bookIntro').value,
      chapterCount: parseInt(document.getElementById('chapterCount').value)
    };

    fetch('/api/admin/import/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    })
            .then(r => r.json())
            .then(d => {
              document.getElementById('genResult').innerHTML =
                      `<div class="alert alert-${d.success ? 'success' : 'danger'}">${d.message}</div>`;
            });
  }

  // 选中 TXT 后，用文件名预填书名/作者（仅作提示，后端仍会做完整解析）
  function parseNameFromFile(name) {
    let n = (name || '').replace(/\.(txt|epub|umd|azw3|mobi)$/i, '').trim();
    n = n.replace(/[（(\[【][^）)\]】]{0,40}(小说网|文学网|书屋|笔趣阁|全文阅读|免费下载|txt下载|最新章节|完本|全集|校对|精校|无删减|纯净版|整理|首发)[^）)\]】]{0,40}[）)\]】]/gi, '');
    n = n.replace(/(?:www\.)?[a-z0-9-]{1,30}\.(?:com|cn|net|org|cc|xyz|co|me)(?:\.[a-z]{2,3})?/gi, '');
    n = n.replace(/(笔趣阁|八一中文|顶点小说|起点中文网|纵横中文网|番茄小说|小说下载|全文阅读|免费下载|txt下载|最新章节目录|最新章节|全集下载|精校版|无删减版)/gi, '');
    n = n.replace(/[\s\-—_.]+$/, '').replace(/^[\s\-—_.]+/, '').trim();

    const junk = /(全集|完本|完结|全文|校对|精校|无删减|纯净版|整理|转自|来自|下载|更新|最新|目录|章节|小说网|笔趣|首发|推荐|收藏|阅读|书签|txt|epub|第[〇零一二三四五六七八九十百千万亿两廿0-9]{1,12}[章节回卷部篇集])/i;
    let title = n, author = '';

    let m = n.match(/^《([^》]{1,60})》\s*(.*)$/);
    if (m) {
      title = m[1].trim();
      const tail = m[2].trim();
      const am = tail.match(/^[（(\[【]\s*([^\s（）()\[\]【】]{1,20})\s*[）)\]】]$/);
      if (am && !junk.test(am[1])) author = am[1];
    } else {
      m = n.match(/^(.+?)\s*[（(\[【]\s*([^\s（）()\[\]【】]{1,20})\s*[）)\]】]\s*$/);
      if (m) {
        title = m[1].trim();
        if (!junk.test(m[2])) author = m[2].trim();
      }
    }
    title = title.replace(/[《》]/g, '').trim();
    if (junk.test(title)) title = n.replace(/[《》]/g, '').trim();
    return { title, author };
  }

  function onTxtFilePicked(input) {
    const hint = document.getElementById('txtFileNameHint');
    const file = input.files && input.files[0];
    if (!file) { hint.textContent = ''; return; }
    const r = parseNameFromFile(file.name);
    const tEl = document.getElementById('txtBookTitle');
    const aEl = document.getElementById('txtAuthor');
    if (!tEl.value && r.title) tEl.value = r.title;
    if (!aEl.value && r.author) aEl.value = r.author;
    hint.textContent = '识别结果：书名「' + (r.title || '未识别') + '」'
            + (r.author ? '，作者「' + r.author + '」' : '，未识别到作者')
            + '（可手动修改，最终以后端解析为准）';
  }

  // 上传 TXT
  function uploadTxt() {
    const file = document.getElementById('txtFile').files[0];
    const title = document.getElementById('txtBookTitle').value;
    const author = document.getElementById('txtAuthor').value;
    const category = document.getElementById('txtCategory').value;
    const autoExtract = document.getElementById('autoExtract').checked;

    if (!file) { alert('请选择文件'); return; }
    
    const formData = new FormData();
    formData.append('file', file);
    if (title) formData.append('title', title);
    if (author) formData.append('author', author);
    if (category) formData.append('category', category);
    formData.append('autoExtract', autoExtract);

    fetch('/api/admin/import/txt', {
      method: 'POST',
      body: formData
    })
            .then(r => r.json())
            .then(d => {
              document.getElementById('txtResult').innerHTML =
                      `<div class="alert alert-${d.success ? 'success' : 'danger'}">${d.message}</div>`;
            });
  }

  // 上传 EPUB
  function uploadEpub() {
    const file = document.getElementById('epubFile').files[0];
    const title = document.getElementById('epubBookTitle').value;
    const author = document.getElementById('epubAuthor').value;
    const category = document.getElementById('epubCategory').value;
    const keepStyle = document.getElementById('epubKeepStyle').checked;

    if (!file) { alert('请选择EPUB文件'); return; }

    const formData = new FormData();
    formData.append('file', file);
    if (title) formData.append('title', title);
    if (author) formData.append('author', author);
    if (category) formData.append('category', category);
    formData.append('keepStyle', keepStyle);

    fetch('/api/admin/import/epub', {
      method: 'POST',
      body: formData
    })
            .then(r => r.json())
            .then(d => {
              document.getElementById('epubResult').innerHTML =
                      `<div class="alert alert-${d.success ? 'success' : 'danger'}">${d.message}</div>`;
            });
  }
</script>
