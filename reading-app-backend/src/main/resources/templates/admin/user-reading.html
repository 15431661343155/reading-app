<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>用户阅读数据</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a href="/admin" class="navbar-brand">📚 管理后台</a>
    <div>
      <a href="/admin/users" class="btn btn-outline-light btn-sm">⬅ 返回用户管理</a>
    </div>
  </div>
</nav>

<div class="container mt-3">
  <h3 id="userTitle">用户阅读数据</h3>
  <hr>

  <!-- 书架 -->
  <h5>📚 书架</h5>
  <table class="table table-striped">
    <thead><tr><th>书名</th><th>加入时间</th><th>最后阅读</th></tr></thead>
    <tbody id="bookshelfTable"></tbody>
  </table>

  <!-- 阅读进度 -->
  <h5 class="mt-4">📖 最近阅读</h5>
  <table class="table table-striped">
    <thead><tr><th>书名</th><th>当前章节</th><th>更新时间</th></tr></thead>
    <tbody id="progressTable"></tbody>
  </table>

  <!-- 书签 -->
  <h5 class="mt-4">🔖 书签</h5>
  <table class="table table-striped">
    <thead><tr><th>书名</th><th>章节</th><th>预览</th><th>创建时间</th></tr></thead>
    <tbody id="bookmarkTable"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const userId = params.get('userId');
  const username = params.get('username');
  document.getElementById('userTitle').textContent = username + ' - 阅读数据';

  // 加载书架
  fetch(`/api/user/bookshelf/${userId}`)
          .then(r => r.json())
          .then(d => {
            const tbody = document.getElementById('bookshelfTable');
            if (!d.data || d.data.length === 0) {
              tbody.innerHTML = '<tr><td colspan="3">暂无数据</td></tr>';
              return;
            }
            tbody.innerHTML = d.data.map(b => `
        <tr>
          <td>${b.book?.title || '书籍' + b.bookId}</td>
          <td>${b.addedAt?.substring(0, 10) || '-'}</td>
          <td>${b.lastReadAt?.substring(0, 10) || '未阅读'}</td>
        </tr>
      `).join('');
          });

  // 加载阅读进度
  fetch(`/api/user/progress/recent/${userId}`)
          .then(r => r.json())
          .then(d => {
            const tbody = document.getElementById('progressTable');
            if (!d.data || d.data.length === 0) {
              tbody.innerHTML = '<tr><td colspan="3">暂无数据</td></tr>';
              return;
            }
            tbody.innerHTML = d.data.map(p => `
        <tr>
          <td>书籍${p.bookId}</td>
          <td>第${p.chapterIndex}章</td>
          <td>${p.updatedAt?.substring(0, 10) || '-'}</td>
        </tr>
      `).join('');
          });

  // 这里简化处理，只显示第一条书签所在书籍的书签
  fetch(`/api/user/progress/recent/${userId}`)
          .then(r => r.json())
          .then(d => {
            if (d.data && d.data.length > 0) {
              const bookId = d.data[0].bookId;
              return fetch(`/api/user/bookmark/${userId}/${bookId}`);
            }
            return Promise.resolve({data: []});
          })
          .then(r => r.json ? r.json() : r)
          .then(d => {
            const tbody = document.getElementById('bookmarkTable');
            if (!d.data || d.data.length === 0) {
              tbody.innerHTML = '<tr><td colspan="4">暂无数据</td></tr>';
              return;
            }
            tbody.innerHTML = d.data.map(bm => `
        <tr>
          <td>书籍${bm.bookId}</td>
          <td>${bm.chapterTitle}</td>
          <td>${bm.previewText?.substring(0, 30) || '-'}...</td>
          <td>${bm.createdAt?.substring(0, 10) || '-'}</td>
        </tr>
      `).join('');
          });
</script>
</body>
</html>
