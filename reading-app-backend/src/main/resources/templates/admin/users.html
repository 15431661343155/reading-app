<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>用户管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a href="/admin" class="navbar-brand">📚 阅读App管理后台</a>
    <div>
      <a href="/admin" class="btn btn-outline-light btn-sm me-2">🏠 首页</a>
      <a href="/admin/books" class="btn btn-outline-light btn-sm me-2">书籍管理</a>
      <a href="/admin/chapters" class="btn btn-outline-light btn-sm me-2">章节管理</a>
      <a href="/admin/import" class="btn btn-outline-light btn-sm me-2">数据导入</a>
      <a href="/admin/online-source" class="btn btn-outline-light btn-sm me-2">🌐 在线书源</a>
      <a href="/admin/book-source" class="btn btn-outline-light btn-sm me-2">⚙️ 书源管理</a>
      <a href="/admin/users" class="btn btn-outline-light btn-sm me-2">用户管理</a>
      <a href="/admin/resource" class="btn btn-outline-light btn-sm me-2">📦 资源管理</a>
      <a href="/admin/feedback" class="btn btn-outline-light btn-sm">💬 意见反馈</a>
    </div>
  </div>
</nav>

<div class="container mt-3">
  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>用户名</th>
      <th>昵称</th>
      <th>邮箱</th>
      <th>注册时间</th>
      <th>状态</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>
  <nav>
    <ul class="pagination" id="pagination"></ul>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let currentPage = 0;

  function loadUsers(page = 0) {
    currentPage = page;
    fetch(`/api/users?page=${page}&size=10`)
            .then(r => r.json())
            .then(d => {
              const tbody = document.getElementById('userTable');
              tbody.innerHTML = d.data.content.map(u => `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.username}</td>
                            <td>${u.nickname || '-'}</td>
                            <td>${u.email || '-'}</td>
                            <td>${u.createdAt ? u.createdAt.substring(0, 10) : '-'}</td>
                            <td>
                                <span class="badge bg-${u.status == 1 ? 'success' : 'danger'}">
                                    ${u.status == 1 ? '正常' : '禁用'}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="toggleStatus(${u.id}, ${u.status})">
                                    ${u.status == 1 ? '禁用' : '启用'}
                                </button>
                                <button class="btn btn-sm btn-info" onclick="viewReading(${u.id}, '${u.username}')">📖 阅读数据</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">删除</button>
                            </td>
                        </tr>
                    `).join('');
            });
  }

  function toggleStatus(id, currentStatus) {
    const newStatus = currentStatus == 1 ? 0 : 1;
    const action = newStatus == 1 ? '启用' : '禁用';
    if (confirm(`确定${action}该用户？`)) {
      fetch(`/api/users/${id}/status?status=${newStatus}`, {method: 'PUT'})
              .then(() => loadUsers(currentPage));
    }
  }

  function viewReading(userId, username) {
    window.location.href = `/admin/users/reading?userId=${userId}&username=${encodeURIComponent(username)}`;
  }

  function deleteUser(id) {
    if (confirm('确定删除该用户？此操作不可恢复！')) {
      fetch(`/api/users/${id}`, {method: 'DELETE'})
              .then(() => loadUsers(currentPage));
    }
  }

  loadUsers();
</script>
</body>
</html>
