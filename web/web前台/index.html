          '      <div class="form-group">',
          '        <label class="form-label" for="profile-gender">性别</label>',
          '        <select id="profile-gender" v-model.number="form.gender" class="form-input">',
          '          <option :value="0">保密</option>',
          '          <option :value="1">男</option>',
          '          <option :value="2">女</option>',
          '        </select>',
          '      </div>',

          '      <div class="form-group">',
          '        <label class="form-label">账号</label>',
          '        <div class="profile-readonly"><span>{{ form.username || "—" }}</span><span>{{ form.email || "未绑定邮箱" }}</span></div>',
          '        <p class="field-hint">用户名与邮箱是登录凭证，须走验证码链路修改，不能在这里直接改</p>',
          '      </div>',

          '      <div v-if="saveError" class="error-box"><span class="grow">{{ saveError }}</span></div>',

'      <div class="profile-actions">',
'        <button type="button" class="btn btn-primary" :disabled="saving" @click="save">{{ saving ? "保存中…" : "保存" }}</button>',
'        <button type="button" class="btn btn-ghost" :disabled="saving" @click="reset">重置</button>',
'      </div>',
'    </div>',
'',
'    <teleport to="body">',
'      <div v-if="showCrop" class="crop-modal-mask" @click.self="closeCrop">',
'        <div class="crop-modal">',
'          <div class="crop-modal-head"><h3>裁剪头像</h3><button type="button" class="crop-close" @click="closeCrop">×</button></div>',
'          <p class="crop-tip">拖动方框选择方形区域，也可拖动下方滑块调整裁剪大小</p>',
'          <div class="crop-stage" ref="cropStageRef">',
'            <img ref="cropImgRef" :src="cropSrc" @load="onCropImgLoad" alt="裁剪预览">',
'            <div class="crop-box" :style="`left:${crop.x}px;top:${crop.y}px;width:${crop.size}px;height:${crop.size}px`" @pointerdown="startCropDrag"></div>',
'          </div>',
'          <div class="crop-size-row"><label>裁剪大小</label><input type="range" min="30" max="100" v-model.number="cropSizePct" @input="onCropSizeChange"><span>{{ cropSizePct }}%</span></div>',
'          <p v-if="cropError" class="error-box"><span class="grow">{{ cropError }}</span></p>',
'          <div class="crop-modal-actions">',
'            <button type="button" class="btn btn-ghost" @click="closeCrop">取消</button>',
'            <button type="button" class="btn btn-primary" :disabled="cropLoading" @click="applyCrop">{{ cropLoading ? "处理中…" : "确定" }}</button>',
'          </div>',
'        </div>',
'      </div>',
'    </teleport>',
'  </div>',
'</div>',
        ].join(''),
        setup() {
          const loading = ref(false);
          const saving = ref(false);
          const loadError = ref('');
          const saveError = ref('');
          const pendingFile = ref(null);
          const avatarCleared = ref(false);
          const avatarHint = ref(AVATAR_HINT_IDLE);
          const form = reactive({ nickname: '', gender: 0, avatar: '', username: '', email: '' });

          // —— 头像裁剪 ——
          const showCrop = ref(false);
          const cropSrc = ref('');
          const cropSizePct = ref(90);
          const cropError = ref('');
          const cropLoading = ref(false);
          const crop = reactive({ x: 0, y: 0, size: 0 });
          const cropImgNatural = reactive({ w: 0, h: 0 });
          const cropImgDisplay = reactive({ w: 0, h: 0 });
          const cropImgRef = ref(null);
          const cropStageRef = ref(null);
          const lastPreviewUrl = ref('');

          const subText = computed(function () {
            if (!isLoggedIn.value) return '登录后可修改昵称、性别与头像';
            return '修改后保存到后端账号，App 与 Web 共用同一份资料';
          });

          function resetDraftFrom(data) {
            if (lastPreviewUrl.value) {
              URL.revokeObjectURL(lastPreviewUrl.value);
              lastPreviewUrl.value = '';
            }
            form.nickname = data.nickname || '';
            form.gender = data.gender == null ? 0 : data.gender;
            form.avatar = data.avatar || '';
            form.username = data.username || '';
            form.email = data.email || '';
            pendingFile.value = null;
            avatarCleared.value = false;
            avatarHint.value = AVATAR_HINT_IDLE;
          }

          async function loadProfile() {
            if (!isLoggedIn.value) return;
            loading.value = true;
            loadError.value = '';
            try {
              resetDraftFrom(await authApi.profile());
            } catch (e) {
              loadError.value = describeError(e, '个人资料加载失败');
            } finally {
              loading.value = false;
            }
          }

          function onAvatarPick(event) {
            const input = event.target;
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            if (!/^image\//.test(file.type)) {
              saveError.value = '请选择图片文件';
              return;
            }
            if (file.size > 5 * 1024 * 1024) {
              saveError.value = '图片大小不能超过 5MB';
              return;
            }
            saveError.value = '';
            cropSrc.value = URL.createObjectURL(file);
            cropError.value = '';
            showCrop.value = true;
          }

          function clearAvatar() {
            if (lastPreviewUrl.value) {
              URL.revokeObjectURL(lastPreviewUrl.value);
              lastPreviewUrl.value = '';
            }
            pendingFile.value = null;
            avatarCleared.value = true;
            form.avatar = '';
            avatarHint.value = '保存后恢复默认头像';
          }

          function closeCrop() {
            if (cropSrc.value) URL.revokeObjectURL(cropSrc.value);
            cropSrc.value = '';
            showCrop.value = false;
            cropError.value = '';
          }

          function onCropImgLoad(e) {
            const img = e.target;
            cropImgNatural.w = img.naturalWidth || 1;
            cropImgNatural.h = img.naturalHeight || 1;
            cropImgDisplay.w = img.offsetWidth || cropImgNatural.w;
            cropImgDisplay.h = img.offsetHeight || cropImgNatural.h;
            cropSizePct.value = 90;
            onCropSizeChange();
          }

          function onCropSizeChange() {
            const minSide = Math.min(cropImgDisplay.w, cropImgDisplay.h) || 1;
            const size = Math.round(minSide * cropSizePct.value / 100);
            crop.size = size;
            crop.x = Math.max(0, Math.min(cropImgDisplay.w - size, crop.x));
            crop.y = Math.max(0, Math.min(cropImgDisplay.h - size, crop.y));
          }

          function startCropDrag(e) {
            e.preventDefault();
            const startX = e.clientX, startY = e.clientY;
            const ox = crop.x, oy = crop.y;
            function move(ev) {
              const dx = ev.clientX - startX, dy = ev.clientY - startY;
              const maxX = cropImgDisplay.w - crop.size;
              const maxY = cropImgDisplay.h - crop.size;
              crop.x = Math.max(0, Math.min(maxX, ox + dx));
              crop.y = Math.max(0, Math.min(maxY, oy + dy));
            }
            function up() {
              window.removeEventListener('pointermove', move);
              window.removeEventListener('pointerup', up);
            }
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
          }

          function applyCrop() {
            const img = cropImgRef.value;
            if (!img) return;
            if (!cropImgDisplay.w || !cropImgDisplay.h) {
              cropError.value = '图片尚未加载完成，请稍候';
              return;
            }
            const scale = cropImgNatural.w / cropImgDisplay.w;
            const sx = crop.x * scale, sy = crop.y * scale, s = crop.size * scale;
            const OUT = 512;
            const canvas = document.createElement('canvas');
            canvas.width = OUT; canvas.height = OUT;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, OUT, OUT);
            try {
              ctx.drawImage(img, sx, sy, s, s, 0, 0, OUT, OUT);
            } catch (err) {
              cropError.value = '裁剪失败：无法读取图片';
              return;
            }
            cropLoading.value = true;
            canvas.toBlob(function (blob) {
              cropLoading.value = false;
              if (!blob) { cropError.value = '裁剪失败'; return; }
              const file = new File([blob], 'avatar.png', { type: 'image/png' });
              const url = URL.createObjectURL(blob);
              if (lastPreviewUrl.value) URL.revokeObjectURL(lastPreviewUrl.value);
              lastPreviewUrl.value = url;
              pendingFile.value = file;
              avatarCleared.value = false;
              form.avatar = url;
              avatarHint.value = '已裁剪并选好头像，点「保存」后上传';
              closeCrop();
            }, 'image/png');
          }

          async function save() {
            saveError.value = '';
            const nickname = (form.nickname || '').trim();
            if (nickname.length > 50) {
              saveError.value = '昵称最长 50 个字符';
              return;
            }
            saving.value = true;
            try {
              // avatar 三态：null = 不改；'' = 恢复默认；/avatars/** = 新上传
              let avatar = null;
              if (pendingFile.value) {
                const uploaded = await authApi.uploadAvatar(pendingFile.value);
                avatar = uploaded && uploaded.avatar ? uploaded.avatar : null;
              } else if (avatarCleared.value) {
                avatar = '';
              }
              const updated = await authApi.updateProfile({
                nickname: nickname,
                gender: form.gender,
                avatar: avatar,
              });
              resetDraftFrom(updated);
              // 顶栏的昵称/头像读的是 auth.user，这里同步一份，免得要刷新页面才更新
              setAuth(Object.assign({}, auth.user, {
                nickname: updated.nickname,
                avatar: updated.avatar,
                gender: updated.gender,
              }));
              showToast('资料已保存', 'success');
            } catch (e) {
              saveError.value = describeError(e, '保存失败');
            } finally {
              saving.value = false;
            }
          }

          function reset() {
            saveError.value = '';
            loadProfile();
          }

          function avatarSrc(path) {
            if (!path) return '';
            if (/^(https?:|blob:|data:)/i.test(path)) return path;
            return coverUrl(path);
          }

          onMounted(loadProfile);

          return {
            isLoggedIn: isLoggedIn, subText: subText,
            loading: loading, saving: saving, loadError: loadError, saveError: saveError,
            form: form, avatarHint: avatarHint,
            loadProfile: loadProfile, onAvatarPick: onAvatarPick, clearAvatar: clearAvatar,
            save: save, reset: reset, avatarSrc: avatarSrc, hideImg: hideImg,
            showCrop: showCrop, cropSrc: cropSrc, crop: crop, cropSizePct: cropSizePct,
            cropError: cropError, cropLoading: cropLoading, cropImgRef: cropImgRef, cropStageRef: cropStageRef,
            onCropImgLoad: onCropImgLoad, onCropSizeChange: onCropSizeChange,
            startCropDrag: startCropDrag, applyCrop: applyCrop, closeCrop: closeCrop,
          };
        },
      };

      /* ---------- 书籍详情 ---------- */
      const CHAPTER_COLLAPSED = 12;
      const CHAPTER_PAGE_SIZE = 60;

      const BookDetail = {
        template: [
          '<div class="detail-page">',
          '  <div v-if="loading" class="loading-state" style="padding: 80px 0;">加载中…</div>',
          '  <div v-else-if="error" class="error-box" style="margin: 40px 0;">',
          '    <span class="grow">{{ error }}</span>',
          '    <button class="btn btn-ghost btn-sm" @click="load">重试</button>',
          '  </div>',
          '  <template v-else-if="book">',
          '  <button type="button" class="btn btn-ghost btn-sm" style="margin-bottom:16px;" @click="goBack">← 返回</button>',
          '  <div class="detail-hero">',
          '    <div class="detail-cover" :style="{ background: gradientFor(book.title) }">',
          '      <img v-if="book.cover" class="cover-img" :src="coverUrl(book.cover)" :alt="book.title" @error="hideImg">',
          '      <span class="cover-layer">{{ book.title[0] }}</span>',
          '    </div>',
          '    <div class="detail-info">',
          '      <h1>{{ book.title }}</h1>',
          '      <div class="detail-meta">',
          '        <span>{{ book.author }}</span>',
          '        <span>{{ book.categoryLabel }}</span>',
          '        <span>{{ book.words }}</span>',
          '        <span>{{ book.chapterCount }} 章</span>',
          '        <span>{{ book.viewCount }} 阅读</span>',
          '        <span>{{ book.likeCount }} 点赞</span>',
          '      </div>',
          '      <div class="detail-tags">',
          '        <span class="tag warm">{{ book.statusText }}</span>',
          '        <span class="tag">{{ book.categoryLabel }}</span>',
          '        <span class="tag">更新于 {{ fromNow(book.updatedAt) }}</span>',
          '      </div>',
          '      <p class="detail-desc">{{ book.desc }}</p>',
          '      <div class="detail-actions">',
          '        <router-link :to="readLink" class="btn btn-primary">{{ hasProgress ? "继续阅读" : "立即阅读" }}</router-link>',
          '        <button v-if="isInShelf(book.id)" type="button" class="btn btn-soft" @click="removeFromShelf">移出书架</button>',
          '        <button v-else type="button" class="btn btn-soft" @click="addToShelf">加入书架</button>',
          '        <button type="button" class="btn btn-ghost" @click="share">分享</button>',
          '      </div>',
          '    </div>',
          '  </div>',

          '  <div class="book-detail-layout">',
          '    <div>',
          '      <div class="card chapter-card" ref="chapterCardRef">',
          '        <div class="card-header">',
          '          <h3 class="card-title">章节目录</h3>',
          '          <div class="chapter-header-actions">',
          '            <span class="card-more" style="cursor: default;">共 {{ chapterList.length }} 章</span>',
          '            <button type="button" class="chapter-sort-btn" @click="toggleChapterOrder">{{ chapterDesc ? "倒序" : "正序" }}</button>',
          '          </div>',
          '        </div>',
          '        <div class="card-body">',
          '          <div v-if="chaptersLoading" class="loading-state">目录加载中…</div>',
          '          <div v-else-if="!chapterList.length" class="empty-state sm"><span>这本书还没有章节</span></div>',
          '          <template v-else>',
          '            <div class="chapter-list">',
          '              <button type="button" v-for="chapter in visibleChapters" :key="chapter.id" class="chapter-item" @click="openChapter(chapter)">',
          '                <span>{{ chapter.title }}</span>',
          '              </button>',
          '            </div>',
          '            <div v-if="!expanded && chapterList.length > CHAPTER_COLLAPSED" class="chapter-expand">',
          '              <button type="button" class="btn btn-soft btn-sm" @click="expand">展开全部 {{ chapterList.length }} 章</button>',
          '            </div>',
          '            <div v-else-if="expanded && chapterPageCount > 1" class="pager">',
          '              <button type="button" :disabled="chapterPage === 0" @click="chapterPage = chapterPage - 1">上一页</button>',
          '              <span>第 {{ chapterPage + 1 }} / {{ chapterPageCount }} 页</span>',
          '              <button type="button" :disabled="chapterPage >= chapterPageCount - 1" @click="chapterPage = chapterPage + 1">下一页</button>',
          '            </div>',
          '          </template>',
          '        </div>',
          '      </div>',

          '      <div class="card" style="margin-top: 16px;">',
          '        <div class="card-header"><h3 class="card-title">书友评论</h3></div>',
          '        <div class="card-body">',
          '          <div class="empty-state sm">',
          '            <span>评论功能尚未开放（后端暂无对应接口）</span>',
          '          </div>',
          '        </div>',
          '      </div>',
          '    </div>',

          '    <aside>',
          '      <div class="card">',
          '        <div class="card-header"><h3 class="card-title">同类推荐</h3></div>',
          '        <div class="card-body">',
          '          <div v-if="!relatedBooks.length" class="empty-state sm"><span>暂无同类书籍</span></div>',
          '          <div v-else class="related-grid">',
          '            <router-link v-for="related in relatedBooks" :key="related.id" :to="\'/book/\' + related.id" class="related-card">',
          '              <div class="related-cover" :style="{ background: gradientFor(related.title) }">',
          '                <img v-if="related.cover" class="cover-img" :src="coverUrl(related.cover)" :alt="related.title" @error="hideImg">',
          '                <span class="cover-layer">{{ related.title[0] }}</span>',
          '              </div>',
          '              <h4>{{ related.title }}</h4>',
          '              <p>{{ related.author }}</p>',
          '            </router-link>',
          '          </div>',
          '        </div>',
          '      </div>',
          '    </aside>',
          '  </div>',
          '  </template>',
          '</div>',
        ].join(''),
        setup() {
          const route = useRoute();
          const router = useRouter();

          const book = ref(null);
          const chapterList = ref([]);
          const loading = ref(true);
          const chaptersLoading = ref(false);
          const error = ref('');
          const expanded = ref(false);
          const chapterPage = ref(0);
          const chapterDesc = ref(false);
          const chapterCardRef = ref(null);
          // 这本书的阅读进度（0 基章节号）；-1 表示还没有阅读记录。
          // 详情页要靠它决定按钮是「继续阅读」还是「立即阅读」，以及点进阅读器后落在哪一章。
          const readChapterIndex = ref(-1);

          const hasProgress = computed(function () { return readChapterIndex.value >= 0; });

          const readLink = computed(function () {
            const id = book.value ? book.value.id : route.params.id;
            const chapterNo = hasProgress.value ? readChapterIndex.value + 1 : 1;
            return '/read/' + id + '/' + Math.max(1, chapterNo);
          });

          const chapterPageCount = computed(function () {
            return Math.max(1, Math.ceil(chapterList.value.length / CHAPTER_PAGE_SIZE));
          });

          const visibleChapters = computed(function () {
            if (!expanded.value) return chapterList.value.slice(0, CHAPTER_COLLAPSED);
            const ordered = chapterDesc.value ? chapterList.value.slice().reverse() : chapterList.value;
            return ordered.slice(chapterPage.value * CHAPTER_PAGE_SIZE, (chapterPage.value + 1) * CHAPTER_PAGE_SIZE);
          });

          const relatedBooks = computed(function () {
            if (!book.value) return [];
            return store.books
              .filter(function (b) { return b.id !== book.value.id && b.category === book.value.category; })
              .slice(0, 4);
          });

          function expand() {
            expanded.value = true;
            chapterPage.value = 0;
          }

          function scrollChapterTop() {
            nextTick(function () {
              if (chapterCardRef.value) chapterCardRef.value.scrollIntoView({ block: 'start', behavior: 'smooth' });
            });
          }

          function toggleChapterOrder() {
            chapterDesc.value = !chapterDesc.value;
            expanded.value = true;
            chapterPage.value = 0;
            scrollChapterTop();
          }

          watch(chapterPage, scrollChapterTop);

          function openChapter(chapter) {
            router.push('/read/' + book.value.id + '/' + (chapter.index + 1));
          }

          // 返回：优先回到进入详情页之前的页面（书架/书城/首页等），无历史则回首页
          function goBack() {
            if (window.history.length > 1) router.back();
            else router.push('/');
          }

          async function load() {
            const id = Number(route.params.id);
            loading.value = true;
            error.value = '';
            book.value = null;
            chapterList.value = [];
            expanded.value = false;
            chapterPage.value = 0;
            readChapterIndex.value = -1;
            try {
              const detail = await bookApi.bookDetail(id);
              if (!detail) throw new Error('书籍不存在');
              book.value = detail;
              loading.value = false;
              // 阅读量埋点：打开详情页 +1（书城各子页的「热门」按它排序），失败静默
              bookApi.trackView(id);
              loadReadingProgress(id);
              chaptersLoading.value = true;
              try {
                chapterList.value = await bookApi.chapters(id);
              } catch (e) {
                chapterList.value = [];
                showToast(describeError(e, '目录加载失败'), 'error');
              } finally {
                chaptersLoading.value = false;
              }
            } catch (e) {
              error.value = describeError(e, '书籍详情加载失败');
              loading.value = false;
            }
          }

          // 查这本书读到第几章。以前详情页的按钮是写死的「立即阅读 → 第 1 章」，
          // 读过书再进来也照样显示「立即阅读」，点了还退回第一章。
          async function loadReadingProgress(id) {
            if (!isLoggedIn.value || !currentUserId.value) { readChapterIndex.value = -1; return; }
            let idx = -1;
            try {
              const p = await bookApi.progress(currentUserId.value, id);
              if (p && typeof p.chapterIndex === 'number' && p.chapterIndex >= 0) idx = p.chapterIndex;
            } catch (e) { /* 拿不到进度就按未读处理 */ }
            // 刚从阅读器返回时后端进度可能还没落库完，用 store 里已缓存的进度兜底，
            // 取更靠后的那个（进度不回退）。
            [store.recent, store.shelf].forEach(function (list) {
              (list || []).forEach(function (item) {
                const itemBookId = item.bookId !== undefined ? item.bookId : item.id;
                if (Number(itemBookId) === Number(id) && typeof item.chapterIndex === 'number' && item.chapterIndex > idx) {
                  idx = item.chapterIndex;
                }
              });
            });
            readChapterIndex.value = idx;
          }

          async function addToShelf() {
            if (!isLoggedIn.value) {
              router.push({ path: '/login', query: { redirect: route.fullPath } });
              return;
            }
            try {
              await bookApi.addToShelf(book.value.id);
              showToast('《' + book.value.title + '》已加入书架', 'success');
              await loadShelf();
            } catch (e) { showToast(describeError(e, '加入书架失败'), 'error'); }
          }

          async function removeFromShelf() {
            try {
              await bookApi.removeFromShelf(book.value.id);
              showToast('已移出书架');
              await loadShelf();
            } catch (e) { showToast(describeError(e, '移出失败'), 'error'); }
          }

          async function share() {
            const url = window.location.href;
            try {
              if (navigator.share) { await navigator.share({ title: book.value.title, url: url }); return; }
              await navigator.clipboard.writeText(url);
              showToast('链接已复制', 'success');
            } catch (e) {
              showToast('链接：' + url);
            }
          }

          onMounted(function () {
            load();
            if (!store.booksLoaded) loadBooks().catch(function () {});
          });
          watch(function () { return route.params.id; }, load);

          return {
            book: book, chapterList: chapterList, visibleChapters: visibleChapters,
            loading: loading, chaptersLoading: chaptersLoading, error: error,
            expanded: expanded, expand: expand, chapterPage: chapterPage, chapterPageCount: chapterPageCount,
            chapterDesc: chapterDesc, chapterCardRef: chapterCardRef, toggleChapterOrder: toggleChapterOrder,
            CHAPTER_COLLAPSED: CHAPTER_COLLAPSED,
            relatedBooks: relatedBooks, openChapter: openChapter, load: load,
            hasProgress: hasProgress, readLink: readLink,
            goBack: goBack,
            addToShelf: addToShelf, removeFromShelf: removeFromShelf, share: share,
            isInShelf: isInShelf, store: store,
            gradientFor: gradientFor, coverUrl: coverUrl, hideImg: hideImg, fromNow: fromNow,
          };
        },
      };

      /* ---------- 阅读器 ---------- */
      const DRAWER_PAGE_SIZE = 50;

      // web 端不分页，与 App 共用的阅读进度里「页」这一位没有意义。
      // 约定：web 保存的进度页数据 = 当前章节首页。
      // App 端的 scrollPosition 是章节内页码（1 基，reader.html 里 currentPage = scrollPosition - 1），
      // 所以固定上报 1，App 读到时正好落在该章第一页 —— 即「App 同步 web 记录只需对应章节」。
      const PROGRESS_CHAPTER_FIRST_PAGE = 1;

      const Reader = {
        template: [
          '<div class="reader-page" :class="\'theme-\' + reader.theme">',
          '  <div class="reader-toolbar">',
          '    <div class="reader-toolbar-left">',
          '      <button type="button" class="reader-btn" title="返回" aria-label="返回" @click="goBack">',
          '        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>',
          '      </button>',
          '      <button type="button" class="reader-btn" title="目录" aria-label="打开目录" @click="showDrawer = true">',
          '        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>',
          '      </button>',
          '    </div>',
          '    <div class="reader-title">{{ book ? book.title : "加载中" }} · {{ currentChapter.title }}</div>',
          '    <div class="reader-toolbar-right">',
          '      <button type="button" class="reader-btn" title="设置" aria-label="阅读设置" @click="showSettings = !showSettings">',
          '        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>',
          '      </button>',
          '    </div>',
          '  </div>',

          '  <div v-if="showResumeHint" class="reader-hint">',
          '    <span>上次读到第 {{ lastProgress.chapterIndex + 1 }} 章{{ lastProgress.chapterTitle ? "（" + lastProgress.chapterTitle + "）" : "" }}</span>',
          '    <button type="button" class="btn btn-soft btn-sm" @click="resume">跳转過去</button>',
          '  </div>',

          '  <div class="reader-content">',
          '    <div v-if="loading" class="loading-state" style="color: var(--reader-muted);">章节加载中…</div>',
          '    <div v-else-if="error" class="error-box" style="margin: 40px auto; max-width: 640px;">',
          '      <span class="grow">{{ error }}</span>',
          '      <button class="btn btn-ghost btn-sm" @click="loadChapter">重试</button>',
          '    </div>',
          '    <template v-else>',
          '      <h2>{{ currentChapter.title }}</h2>',
          '      <p v-for="(paragraph, idx) in paragraphs" :key="idx">{{ paragraph }}</p>',
          '      <p v-if="!paragraphs.length" style="color: var(--reader-muted); text-indent: 0;">本章暂无正文内容</p>',
          '    </template>',
          '  </div>',

          '  <div class="reader-nav">',
          '    <button type="button" class="reader-nav-btn" :disabled="chapterIndex <= 0 || loading" @click="goChapter(chapterIndex - 1)">',
          '      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>',
          '      上一章',
          '    </button>',
          '    <span class="reader-progress">{{ chapterList.length ? (chapterIndex + 1) + " / " + chapterList.length + " 章" : "—" }}</span>',
          '    <button type="button" class="reader-nav-btn" :disabled="chapterIndex >= chapterList.length - 1 || loading" @click="goChapter(chapterIndex + 1)">',
          '      下一章',
          '      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>',
          '    </button>',
          '  </div>',

          '  <div class="reader-drawer-overlay" :class="{ open: showDrawer }" @click="showDrawer = false"></div>',
          '  <div class="reader-drawer" :class="{ open: showDrawer }">',
          '    <div class="reader-drawer-header">',
          '      <div class="reader-drawer-header-row">',
          '        <div>',
          '          <h3>目录</h3>',
          '          <p>{{ book ? book.title : "" }} · 共 {{ chapterList.length }} 章</p>',
          '        </div>',
          '        <button type="button" class="drawer-sort-btn" @click="toggleDrawerOrder">{{ drawerDesc ? "倒序" : "正序" }}</button>',
          '      </div>',
          '    </div>',
          '    <div class="reader-drawer-list" ref="drawerListRef">',
          '      <button type="button" v-for="chapter in drawerChapters" :key="chapter.id" class="reader-drawer-item" :class="{ active: chapter.index === chapterIndex }" @click="goChapter(chapter.index); showDrawer = false">',
          '        <span>{{ chapter.title }}</span>',
          '      </button>',
          '    </div>',
          '    <div v-if="drawerPageCount > 1" class="reader-drawer-pager pager" style="padding: 8px 0;">',
          '      <button type="button" :disabled="drawerPage === 0" @click="drawerPage = drawerPage - 1">上一页</button>',
          '      <span>{{ drawerPage + 1 }} / {{ drawerPageCount }}</span>',
          '      <button type="button" :disabled="drawerPage >= drawerPageCount - 1" @click="drawerPage = drawerPage + 1">下一页</button>',
          '    </div>',
          '  </div>',

          '  <div class="reader-settings" :class="{ open: showSettings }">',
          '    <div class="reader-settings-row">',
          '      <span class="reader-settings-label">字号</span>',
          '      <div class="reader-size-controls">',
          '        <button type="button" class="reader-size-btn" aria-label="减小字号" @click="setFontSize(reader.fontSize - 2)">A-</button>',
          '        <span style="font-weight:700;width:28px;text-align:center;color:var(--reader-ink);">{{ reader.fontSize }}</span>',
          '        <button type="button" class="reader-size-btn" aria-label="增大字号" @click="setFontSize(reader.fontSize + 2)">A+</button>',
          '      </div>',
          '    </div>',
          '    <div class="reader-settings-row">',
          '      <span class="reader-settings-label">主题</span>',
          '      <div class="reader-theme-options">',
          '        <button type="button" class="reader-theme-option" :class="{ active: reader.theme === \'light\' }" style="background:#ffffff;border-color:#e2e2e2;" aria-label="浅色主题" @click="setTheme(\'light\')"></button>',
          '        <button type="button" class="reader-theme-option" :class="{ active: reader.theme === \'sepia\' }" style="background:#f4ecd8;border-color:#d4c9a8;" aria-label="护眼主题" @click="setTheme(\'sepia\')"></button>',
          '        <button type="button" class="reader-theme-option" :class="{ active: reader.theme === \'dark\' }" style="background:#1a1a1a;border-color:#444;" aria-label="深色主题" @click="setTheme(\'dark\')"></button>',
          '      </div>',
          '    </div>',
          '    <p class="field-hint" style="margin-top: 14px;">字号与主题会保存在本地，阅读进度会同步到账号</p>',
          '  </div>',
          '</div>',
        ].join(''),
        setup() {
          const route = useRoute();
          const router = useRouter();

          const bookId = computed(function () { return Number(route.params.bookId); });
          const chapterList = ref([]);
          const book = ref(null);
          const paragraphs = ref([]);
          const loading = ref(true);
          const error = ref('');
          const showDrawer = ref(false);
          const showSettings = ref(false);
          const drawerPage = ref(0);
          const drawerDesc = ref(false);
          const drawerListRef = ref(null);
          const lastProgress = ref(null);
          let progressTimer = null;

          // 阅读位置快照。
          // 离开阅读器时 route.params.chapterId 已经失效（undefined），由它算出的
          // chapterIndex 是 NaN，JSON 序列化成 null 回传后端，会把真实进度覆盖掉
          // （后端 updateProgress 是无条件 SET，null 会直接落库）。
          // 所以所有保存都读这份快照，快照只在路由确实停在某个章节时才更新。
          // web 不分页，快照只记章节：页数据固定为该章首页（见 PROGRESS_CHAPTER_FIRST_PAGE）。
          const savedPosition = { chapterIndex: -1 };

          // 本次进入阅读器后是否真的读过（换过章 / 滚动过）。
          // 与 App 共用同一条进度记录，打开书看一眼就退出不应该把另一端刚写入的位置顶掉。
          let hasRead = false;

          function syncPosition(chapterIdParam) {
            const raw = Number(chapterIdParam !== undefined ? chapterIdParam : route.params.chapterId) - 1;
            if (!Number.isFinite(raw) || raw < 0) return; // 已离开阅读器路由：保留上一次快照
            const idx = Math.min(raw, Math.max(0, chapterList.value.length - 1));
            if (savedPosition.chapterIndex >= 0 && idx !== savedPosition.chapterIndex) hasRead = true;
            savedPosition.chapterIndex = idx;
          }

          // 退出阅读器：回到进入阅读器之前的页面（书架/书城/详情等），无历史则回该书详情页
          function goBack() {
            if (window.history.length > 1) router.back();
            else router.push('/book/' + bookId.value);
          }

          const chapterIndex = computed(function () {
            const raw = Number(route.params.chapterId) - 1;
            if (!chapterList.value.length) return Math.max(0, raw);
            return Math.max(0, Math.min(raw, chapterList.value.length - 1));
          });

          const currentChapter = computed(function () {
            return chapterList.value[chapterIndex.value] || { id: 0, title: '加载中…', sortOrder: chapterIndex.value + 1 };
          });

          const drawerPageCount = computed(function () {
            return Math.max(1, Math.ceil(chapterList.value.length / DRAWER_PAGE_SIZE));
          });

          const drawerChapters = computed(function () {
            const ordered = drawerDesc.value ? chapterList.value.slice().reverse() : chapterList.value;
            return ordered.slice(drawerPage.value * DRAWER_PAGE_SIZE, (drawerPage.value + 1) * DRAWER_PAGE_SIZE);
          });

          function scrollDrawerTop() {
            nextTick(function () {
              if (drawerListRef.value) drawerListRef.value.scrollTop = 0;
            });
          }

          function toggleDrawerOrder() {
            drawerDesc.value = !drawerDesc.value;
            drawerPage.value = 0;
            scrollDrawerTop();
          }

          watch(drawerPage, scrollDrawerTop);

          const showResumeHint = computed(function () {
            if (!lastProgress.value) return false;
            return lastProgress.value.chapterIndex > 0 && chapterIndex.value === 0;
          });

          function persistSettings() {
            localStorage.setItem(READER_SETTINGS_KEY, JSON.stringify({ fontSize: store.reader.fontSize, theme: store.reader.theme }));
          }

          function setFontSize(size) {
            store.reader.fontSize = Math.min(26, Math.max(14, size));
            persistSettings();
            queueSave();
          }

          function setTheme(theme) {
            store.reader.theme = theme;
            persistSettings();
            queueSave();
          }

          function queueSave() {
            if (!isLoggedIn.value || !book.value) return;
            syncPosition();
            clearTimeout(progressTimer);
            progressTimer = setTimeout(function () { saveProgress(); }, 800);
          }

          async function saveProgress() {
            if (!isLoggedIn.value || !currentUserId.value || !book.value) return;
            syncPosition();
            // 没有任何阅读动作就退出：不写记录，避免把 App 端刚写入的位置顶掉
            if (!hasRead || savedPosition.chapterIndex < 0) return;
            const chapter = chapterList.value[savedPosition.chapterIndex];
            try {
              await bookApi.saveProgress({
                userId: currentUserId.value,
                bookId: book.value.id,
                // 带上章节 id，否则后端 updateProgress 会把该列覆盖成 null，
                // 后台「用户阅读数据」就看不到「读到哪一章」。
                chapterId: chapter ? chapter.id : null,
                chapterIndex: savedPosition.chapterIndex,
                // web 不分页：固定上报「该章第一页」，不传滚动像素偏移
                scrollPosition: PROGRESS_CHAPTER_FIRST_PAGE,
                // 字号/夜间/背景色/文本锚点刻意不上报：web 的阅读偏好只存在本地
                // (READER_SETTINGS_KEY)，后端进度记录是两端共用的，
                // 上报这些字段会把 App 端存的偏好顶掉。
              });
              loadRecent();
              // 进度变了，书架列表里的进度映射就过期了。标回「未加载」，
              // 下次进首页/书架页会重新拉一次，否则「最近在追 / 在读 N 本」
              // 还停留在旧数据上（新读的书不会出现）。
              store.shelfLoaded = false;
            } catch (e) { /* 进度保存失败不打断阅读 */ }
          }

          async function loadChapter() {
            const target = chapterList.value[chapterIndex.value];
            if (!target || !target.id) {
              paragraphs.value = [];
              return;
            }
            loading.value = true;
            error.value = '';
            try {
              const chapter = await bookApi.chapter(target.id);
              paragraphs.value = paragraphsFrom(chapter && chapter.content, target.title);
            } catch (e) {
              paragraphs.value = [];
              error.value = describeError(e, '章节正文加载失败');
            } finally {
              loading.value = false;
            }
          }

          async function loadAll() {
            loading.value = true;
            error.value = '';
            showDrawer.value = false;
            try {
              const id = bookId.value;
              const detail = await bookApi.bookDetail(id);
              if (!detail) throw new Error('书籍不存在');
              book.value = detail;
              chapterList.value = await bookApi.chapters(id);
              // 位置快照基线对齐到入口章节（章节列表已就位，clamp 才准确）。
              // 本次「打开书」不算读过：之后只有真的换章 / 滚动过才会写记录，
              // 免得打开看一眼就把另一端刚写入的位置顶掉。
              syncPosition();
              hasRead = false;
              loading.value = false;

              // 先取服务端进度再决定读哪一章：同一本书只有一条记录（last-write-wins），
              // 打开阅读器直接续读到上次退出的位置 —— 与 App「打开书采纳服务端位置」一致。
              // 只在 loadAll 里做这一次：之后用户在目录里点的章节不会再被拽回来。
              if (isLoggedIn.value && currentUserId.value) {
                try {
                  lastProgress.value = (await bookApi.progress(currentUserId.value, id)) || null;
                } catch (e) { lastProgress.value = null; }
              }
              const resumeIndex = lastProgress.value && typeof lastProgress.value.chapterIndex === 'number'
                ? lastProgress.value.chapterIndex : -1;
              const entryIndex = savedPosition.chapterIndex;
              if (resumeIndex >= 0 && resumeIndex < chapterList.value.length && resumeIndex !== entryIndex) {
                // 先把快照基线挪到续读章节，再切路由：这样路由监听里的 queueSave
                // 不会把「自动定位」误判成用户换章（hasRead 保持 false，不写记录）。
                savedPosition.chapterIndex = resumeIndex;
                router.replace('/read/' + id + '/' + (resumeIndex + 1));
                return;
              }
              await loadChapter();
            } catch (e) {
              error.value = describeError(e, '书籍加载失败');
              chapterList.value = [];
              paragraphs.value = [];
              loading.value = false;
            }
          }

          function goChapter(idx) {
            if (idx < 0 || idx >= chapterList.value.length) return;
            // 目录换章用 replace：不往历史栈里追加，返回键才回得去「进入阅读前的页面」
            // 而非逐章回退。路由参数变化仍会触发 watch → 重新 loadChapter。
            router.replace('/read/' + bookId.value + '/' + (idx + 1));
          }

          function resume() {
            if (!lastProgress.value) return;
            goChapter(lastProgress.value.chapterIndex);
          }

          // 用户确实读过才写记录：换章、滚动、点击（翻页/工具条）、滚轮、键盘。
          // 只打开书看一眼就退出不写，免得把另一端刚写入的位置顶掉
          // （同一本书只保留最后阅读退出时的那一条）。
          function markRead() {
            hasRead = true;
            queueSave();
          }
          function onScroll() { if (window.scrollY > 0) markRead(); }

          // 直接关标签页 / 切到后台不走路由守卫，用 pagehide + visibilitychange 兜住
          function onHide() {
            clearTimeout(progressTimer);
            saveProgress();
          }
          function onVisibilityChange() {
            if (document.visibilityState === 'hidden') onHide();
          }

          onMounted(function () {
            loadAll();
            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('wheel', markRead, { passive: true });
            window.addEventListener('pointerdown', markRead, { passive: true });
            window.addEventListener('keydown', markRead);
            window.addEventListener('pagehide', onHide);
            document.addEventListener('visibilitychange', onVisibilityChange);
          });
          watch(function () { return route.params.chapterId; }, function () {
            window.scrollTo(0, 0);
            loadChapter();
            queueSave();
          });
          watch(function () { return route.params.bookId; }, loadAll);
          watch(showDrawer, function (open) {
            if (open) drawerPage.value = Math.floor(chapterIndex.value / DRAWER_PAGE_SIZE);
          });
          watch(function () { return store.reader.theme; }, function (theme) {
            const dark = theme === 'dark';
            document.body.style.background = dark ? '#1a1a1a' : '';
          });
          // 离开阅读器前保存：此时路由还没切换，from.params 里是真实的章节号，
          // 用它刷新快照再保存，避免拿卸载后的失效参数去算位置。
          onBeforeRouteLeave(function (to, from) {
            syncPosition(from.params.chapterId);
            clearTimeout(progressTimer);
            saveProgress();
          });
          onUnmounted(function () {
            window.removeEventListener('scroll', onScroll);
            window.removeEventListener('wheel', markRead);
            window.removeEventListener('pointerdown', markRead);
            window.removeEventListener('keydown', markRead);
            window.removeEventListener('pagehide', onHide);
            document.removeEventListener('visibilitychange', onVisibilityChange);
            clearTimeout(progressTimer);
          });

          return {
            store: store, reader: store.reader,
            bookId: bookId, book: book, chapterList: chapterList, chapterIndex: chapterIndex,
            currentChapter: currentChapter, paragraphs: paragraphs, loading: loading, error: error,
            showDrawer: showDrawer, showSettings: showSettings, drawerPage: drawerPage,
            drawerDesc: drawerDesc, drawerListRef: drawerListRef, toggleDrawerOrder: toggleDrawerOrder,
            drawerPageCount: drawerPageCount, drawerChapters: drawerChapters,
            showResumeHint: showResumeHint, lastProgress: lastProgress,
            setFontSize: setFontSize, setTheme: setTheme, goChapter: goChapter,
            goBack: goBack,
            resume: resume, loadChapter: loadChapter,
          };
        },
      };

      /* ---------- 路由 ---------- */
      const App = {
        template: [
          '<header class="header">',
          '  <div class="header-inner">',
          '    <router-link to="/" class="brand" aria-label="回到首页"><img class="brand-mark" src="assets/brand-icon.png" alt="书阁阅读">书阁阅读</router-link>',
          '    <form class="search-box" @submit.prevent="submitSearch">',
          '      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">',
          '        <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path>',
          '      </svg>',
          '      <input v-model="keyword" type="search" placeholder="搜索书名、作者" aria-label="搜索书名或作者">',
          '    </form>',
          '    <nav class="nav">',
          '      <router-link v-for="item in navItems" :key="item.path" :to="item.path" class="nav-link" :class="{ active: isActive(item.path) }">{{ item.label }}</router-link>',
          '    </nav>',
          '    <div class="header-actions">',
          '      <button type="button" class="icon-btn" title="站内消息" aria-label="站内消息" @click="openMessages">',
          '        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>',
          '      </button>',
          '      <router-link v-if="!isLoggedIn" :to="{ path: \'/login\', query: { redirect: route.fullPath } }" class="btn btn-primary">登录</router-link>',
          '      <div v-else class="user-menu">',
          '        <button type="button" class="icon-btn" :title="displayName" aria-label="账号菜单" @click="menuOpen = !menuOpen" style="font-weight:800;font-size:14px;overflow:hidden;position:relative;display:grid;place-items:center;">',
          '          <span>{{ displayName[0] }}</span>',
          '          <img v-if="!avatar" src="assets/default-avatar.jpg" alt="头像" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;">',
          '          <img v-if="avatar" :src="coverUrl(avatar)" alt="头像" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;" @error="hideImg">',
          '        </button>',
          '        <div v-if="menuOpen" class="user-menu-panel">',
          '          <div class="user-menu-name">{{ displayName }}</div>',
          '          <router-link to="/bookshelf" class="user-menu-item" @click="menuOpen = false">我的书架</router-link>',
          '          <router-link to="/profile" class="user-menu-item" @click="menuOpen = false">个人中心</router-link>',
          '          <button type="button" class="user-menu-item" @click="doLogout">退出登录</button>',
          '        </div>',
          '      </div>',
          '    </div>',
          '  </div>',
          '</header>',

          '<main class="main"><router-view></router-view></main>',

          '<footer v-if="!isReaderRoute" class="footer">',
          '  <div>© 2026 书阁阅读 · 保留所有权利</div>',
          '  <div class="footer-sub">鲁ICP备2026056653号-1</div>',
          '</footer>',

          '<div class="toast-wrap" aria-live="polite">',
          '  <div v-for="t in toast.list" :key="t.id" class="toast" :class="t.type">{{ t.message }}</div>',
          '</div>',
        ].join(''),
        setup() {
          const route = useRoute();
          const router = useRouter();

          const navItems = [
            { path: '/', label: '首页' },
            { path: '/bookstore', label: '书城' },
            { path: '/bookshelf', label: '书架' },
            { path: '/discover', label: '发现' },
          ];

          const keyword = ref('');
          const menuOpen = ref(false);

          const displayName = computed(function () {
            if (!isLoggedIn.value) return '书友';
            return auth.user.nickname || auth.user.username || '书友';
          });
          const avatar = computed(function () { return auth.user ? auth.user.avatar : ''; });
          const isReaderRoute = computed(function () { return route.path.indexOf('/read/') === 0; });

          function isActive(path) {
            const current = route.path;
            if (path === '/') return current === '/';
            return current === path || current.indexOf(path + '/') === 0;
          }

          function submitSearch() {
            const q = keyword.value.trim();
            if (!q) { showToast('请输入关键词'); return; }
            router.push({ path: '/search', query: { q: q } });
          }

          function openMessages() {
            if (!isLoggedIn.value) {
              router.push({ path: '/login', query: { redirect: route.fullPath } });
              return;
            }
            showToast('站内消息暂未开放（后端接口仅 App 使用）');
          }

          function doLogout() {
            menuOpen.value = false;
            clearAuth();
            showToast('已退出登录');
            router.push('/');
          }

          onMounted(function () {
            loadCategories();
            if (isLoggedIn.value) { loadShelf(); loadRecent(); }
          });

          return {
            route: route, navItems: navItems, keyword: keyword, submitSearch: submitSearch,
            isActive: isActive, isReaderRoute: isReaderRoute,
            isLoggedIn: isLoggedIn, displayName: displayName, avatar: avatar,
            menuOpen: menuOpen, doLogout: doLogout, openMessages: openMessages,
            toast: toast,
            hideImg: hideImg, coverUrl: coverUrl,
          };
        },
      };

      const router = createRouter({
        history: createWebHashHistory(),
        routes: [
          { path: '/', name: 'home', component: Home },
          { path: '/bookstore', name: 'bookstore', component: Bookstore },
          { path: '/bookshelf', name: 'bookshelf', component: Bookshelf },
          { path: '/discover', name: 'discover', component: Discover },
          { path: '/discuss', redirect: '/discover' },
          { path: '/search', name: 'search', component: Search },
          { path: '/login', name: 'login', component: Login },
          { path: '/profile', name: 'profile', component: Profile },
          { path: '/book/:id', name: 'book', component: BookDetail },
          { path: '/read/:bookId/:chapterId', name: 'reader', component: Reader },
          { path: '/:pathMatch(.*)*', name: 'notFound', component: NotFound },
        ],
        scrollBehavior: function () { return { top: 0 }; },
      });

      createApp(App).use(router).mount('#app');
    })();
  </script>
  </body>
</html>
