<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书源管理 - 阅读App管理后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin-theme.css">
  <style>
    .source-card { margin-bottom: 12px; }
  </style>
<script src="assets/js/admin-auth.js?v=20261001"></script>
</head>
<body>
<nav class="admin-nav">
  <div class="admin-nav-inner">
    <a class="admin-nav-brand" href="index.html">
      <span class="brand-seal" aria-hidden="true"><span>书阁</span></span>
      <span class="brand-text">
        <span class="brand-title">管理后台</span>
        <span class="brand-sub">内容管理平台</span>
      </span>
    </a>
    <div class="admin-nav-links">
      <a href="index.html" class="">首页</a>
      <a href="books.html" class="">书籍管理</a>
      <a href="categories.html" class="">分类管理</a>
      <a href="import.html" class="">数据导入</a>
      <a href="online-source.html" class="-source">在线书源</a>
      <a href="book-source.html" class="is-active">书源管理</a>
      <a href="users.html" class="">用户管理</a>
      <a href="resource.html" class="">资源管理</a>
      <a href="feedback.html" class="">意见反馈</a>
    </div>
    <div class="admin-nav-auth">
      <span class="admin-auth-name" id="adminAuthName">管理员</span>
      <button type="button" class="admin-logout" onclick="adminLogout()">退出登录</button>
    </div>
  </div>
</nav>

<div class="container mt-4 admin-main">
  <div class="page-head">
  <span class="kicker">Source Engine</span>
  <h1 id="pageTitle">书源管理</h1>
  <p class="desc">配置与调试 App 内置书源规则</p>
  <div class="head-rule"></div>
</div>

  <div class="d-flex justify-content-end align-items-center mb-3">
    <div>
      <button class="btn btn-success me-2" onclick="showImportModal()">网络导入</button>
      <button class="btn btn-primary" onclick="showAddModal()">+ 添加书源</button>
    </div>
  </div>

  <div id="batchToolbar" class="card mb-3 d-none">
    <div class="card-body py-2 d-flex align-items-center gap-2">
      <span class="text-muted me-2">已选择 <span id="selectedCount">0</span> 项</span>
      <button class="btn btn-sm btn-outline-success" onclick="batchToggle(true)">批量启用</button>
      <button class="btn btn-sm btn-outline-warning" onclick="batchToggle(false)">批量禁用</button>
      <button class="btn btn-sm btn-outline-danger" onclick="batchDelete()">批量删除</button>
      <button class="btn btn-sm btn-outline-secondary ms-auto" onclick="clearSelection()">取消选择</button>
    </div>
  </div>

  <div id="sourceList"></div>
</div>

<div class="modal fade" id="sourceModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">添加书源</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="sourceId">
        <div class="mb-3">
          <label class="form-label">书源名称 *</label>
          <input type="text" class="form-control" id="sourceName" placeholder="例如：笔趣阁">
        </div>
        <div class="mb-3">
          <label class="form-label">书源类型标识 *</label>
          <input type="text" class="form-control" id="sourceType" placeholder="英文大写，例如：BIQUGE">
          <div class="form-text">唯一标识，添加后不可修改</div>
        </div>
        <div class="mb-3">
          <label class="form-label">书源分组</label>
          <input type="text" class="form-control" id="sourceGroup" placeholder="例如：中文精品">
        </div>
        <div class="mb-3">
          <label class="form-label">基础URL</label>
          <input type="text" class="form-control" id="baseUrl" placeholder="https://www.example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">书源描述</label>
          <input type="text" class="form-control" id="description" placeholder="简短描述">
        </div>
        <div class="mb-3">
          <label class="form-label">JSON 规则配置 *</label>
          <textarea class="form-control config-textarea" id="configJson" rows="18" placeholder='{
  "baseUrl": "https://www.example.com",
  "search": {
    "url": "/search?q={{keyword}}&page={{page}}",
    "list": ".search-item",
    "name": ".title",
    "author": ".author",
    "cover": ".cover img@src",
    "intro": ".intro",
    "urlRule": "a@href"
  },
  "detail": {
    "name": "h1",
    "author": ".author",
    "cover": ".cover img@src",
    "intro": ".intro"
  },
  "chapterList": {
    "list": ".chapter-list a",
    "name": "text",
    "urlRule": "@href"
  },
  "content": {
    "content": "#content",
    "replace": ["广告内容1", "广告内容2"]
  }
}'></textarea>
          <div class="form-text">
            支持 CSS 选择器，属性用 @attr 表示（如 img@src），文本用 text。
            搜索URL支持 {{keyword}} 和 {{page}} 占位符。
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">备注</label>
          <input type="text" class="form-control" id="remark">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" onclick="saveSource()">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="importModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">网络导入书源</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">书源链接 (URL)</label>
          <input type="text" class="form-control" id="importUrl" placeholder="https://example.com/book-source.json">
          <div class="form-text">支持单本书源 JSON 或书源数组 JSON</div>
        </div>
        <div id="importResult" class="d-none">
          <hr>
          <h6>导入结果</h6>
          <div id="importResultSummary" class="mb-2"></div>
          <div id="importResultDetails" class="small text-muted" style="max-height: 200px; overflow-y: auto;"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
        <button type="button" class="btn btn-success" id="btnImport" onclick="doImport()">开始导入</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="testModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">书源搜索测试</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">测试关键词</label>
          <div class="d-flex gap-2">
            <input type="text" class="form-control" id="testKeyword" value="test" placeholder="输入搜索关键词">
            <button class="btn btn-primary" onclick="runTest()">开始测试</button>
          </div>
        </div>
        <div id="testResult" class="d-none">
          <hr>
          <h6>测试结果</h6>
          <div id="testResultContent" class="small"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>

<footer class="admin-foot">
  <span>
    书阁 · 内容管理平台
    <span class="foot-sep">/</span>
    <span>阅读 App 运营控制台</span>
  </span>
  <span>请勿在公共设备上保持登录状态</span>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let sourceModal;
let importModal;
let testModal;
let selectedIds = new Set();
let allSources = [];
let currentTestSource = null;

document.addEventListener('DOMContentLoaded', function() {
  sourceModal = new bootstrap.Modal(document.getElementById('sourceModal'));
  importModal = new bootstrap.Modal(document.getElementById('importModal'));
  testModal = new bootstrap.Modal(document.getElementById('testModal'));
  loadSources();
});

function loadSources() {
  fetch('/api/admin/book-source/list')
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        allSources = res.data;
        renderSources(res.data);
      } else {
        alert('加载失败: ' + res.message);
      }
    });
}

function renderSources(sources) {
  const html = sources.map(s => `
    <div class="card source-card" data-id="${s.id}">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div class="d-flex align-items-start" style="gap:12px;">
            <input type="checkbox" class="form-check-input mt-1 source-checkbox" 
              ${selectedIds.has(s.id) ? 'checked' : ''} 
              onchange="toggleSelect(${s.id}, this.checked)">
            <div>
              <h5 class="card-title mb-1">${s.name}
                <span class="tag ${s.enabled ? 'tag-enabled' : 'tag-disabled'}">${s.enabled ? '启用' : '禁用'}</span>
                ${s.builtIn ? '<span class="tag tag-builtin">内置</span>' : ''}
              </h5>
              <div class="text-muted small mb-2">
                类型: ${s.sourceType} | 
                分组: ${s.sourceGroup || '-'} | 
                基础URL: <code>${s.baseUrl || '-'}</code> | 
                已导入: ${s.bookCount || 0} 本
              </div>
              <div class="small text-muted">${s.description || ''}</div>
            </div>
          </div>
          <div>
            <button class="btn btn-sm btn-outline-info me-1" onclick="testSource(${s.id})">测试</button>
            <button class="btn btn-sm btn-outline-primary me-1" onclick='editSource(${JSON.stringify(s).replace(/'/g, "&#39;")})'>编辑</button>
            <button class="btn btn-sm btn-outline-secondary me-1" onclick="toggleSource(${s.id})">
              ${s.enabled ? '禁用' : '启用'}
            </button>
            ${!s.builtIn ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteSource(${s.id})">删除</button>` : ''}
          </div>
        </div>
      </div>
    </div>
  `).join('');
  document.getElementById('sourceList').innerHTML = html || '<div class="text-center text-muted py-5">暂无书源</div>';
  updateBatchToolbar();
}

function showAddModal() {
  document.getElementById('modalTitle').textContent = '添加书源';
  document.getElementById('sourceId').value = '';
  document.getElementById('sourceName').value = '';
  document.getElementById('sourceType').value = '';
  document.getElementById('sourceType').disabled = false;
  document.getElementById('sourceGroup').value = '';
  document.getElementById('baseUrl').value = '';
  document.getElementById('description').value = '';
  document.getElementById('configJson').value = '';
  document.getElementById('remark').value = '';
  sourceModal.show();
}

function editSource(s) {
  document.getElementById('modalTitle').textContent = '编辑书源';
  document.getElementById('sourceId').value = s.id;
  document.getElementById('sourceName').value = s.name || '';
  document.getElementById('sourceType').value = s.sourceType || '';
  document.getElementById('sourceType').disabled = true;
  document.getElementById('sourceGroup').value = s.sourceGroup || '';
  document.getElementById('baseUrl').value = s.baseUrl || '';
  document.getElementById('description').value = s.description || '';
  document.getElementById('configJson').value = s.configJson || '';
  document.getElementById('remark').value = s.remark || '';
  sourceModal.show();
}

function saveSource() {
  const id = document.getElementById('sourceId').value;
  const data = {
    name: document.getElementById('sourceName').value,
    sourceType: document.getElementById('sourceType').value,
    sourceGroup: document.getElementById('sourceGroup').value,
    baseUrl: document.getElementById('baseUrl').value,
    description: document.getElementById('description').value,
    configJson: document.getElementById('configJson').value,
    remark: document.getElementById('remark').value,
    enabled: true
  };

  if (!data.name || !data.sourceType) {
    alert('书源名称和类型不能为空');
    return;
  }

  try {
    if (data.configJson) JSON.parse(data.configJson);
  } catch (e) {
    alert('JSON 格式错误: ' + e.message);
    return;
  }

  const url = id ? '/api/admin/book-source/update' : '/api/admin/book-source/add';
  const method = id ? 'PUT' : 'POST';
  if (id) data.id = parseInt(id);

  fetch(url, {
    method: method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        sourceModal.hide();
        loadSources();
        alert('保存成功');
      } else {
        alert('保存失败: ' + res.message);
      }
    });
}

function toggleSource(id) {
  if (!confirm('确定要切换启用状态吗？')) return;
  fetch(`/api/admin/book-source/${id}/toggle`, { method: 'POST' })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        loadSources();
      } else {
        alert('操作失败: ' + res.message);
      }
    });
}

function deleteSource(id) {
  if (!confirm('确定要删除该书源吗？删除后无法恢复！')) return;
  fetch(`/api/admin/book-source/${id}`, { method: 'DELETE' })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        loadSources();
        alert('删除成功');
      } else {
        alert('删除失败: ' + res.message);
      }
    });
}

function showImportModal() {
  document.getElementById('importUrl').value = '';
  document.getElementById('importResult').classList.add('d-none');
  document.getElementById('btnImport').disabled = false;
  importModal.show();
}

function doImport() {
  const url = document.getElementById('importUrl').value.trim();
  if (!url) {
    alert('请输入书源链接');
    return;
  }

  const btn = document.getElementById('btnImport');
  btn.disabled = true;
  btn.textContent = '导入中...';

  fetch('/api/admin/book-source/import-url', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url: url })
  })
    .then(r => r.json())
    .then(res => {
      btn.disabled = false;
      btn.textContent = '开始导入';

      if (res.success) {
        const data = res.data;
        document.getElementById('importResult').classList.remove('d-none');
        document.getElementById('importResultSummary').innerHTML =
          `<span class="badge bg-success">成功 ${data.success}</span> ` +
          `<span class="badge bg-secondary">跳过 ${data.skipped}</span> ` +
          `<span class="badge bg-danger">失败 ${data.failed}</span> ` +
          `<span class="text-muted">共 ${data.total} 条</span>`;
        document.getElementById('importResultDetails').innerHTML =
          data.messages.map(m => '<div>' + m + '</div>').join('');
        loadSources();
      } else {
        alert('导入失败: ' + res.message);
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.textContent = '开始导入';
      alert('请求失败: ' + err.message);
    });
}

function toggleSelect(id, checked) {
  if (checked) {
    selectedIds.add(id);
  } else {
    selectedIds.delete(id);
  }
  updateBatchToolbar();
}

function updateBatchToolbar() {
  const toolbar = document.getElementById('batchToolbar');
  const countEl = document.getElementById('selectedCount');
  countEl.textContent = selectedIds.size;
  if (selectedIds.size > 0) {
    toolbar.classList.remove('d-none');
  } else {
    toolbar.classList.add('d-none');
  }
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.source-checkbox').forEach(cb => cb.checked = false);
  updateBatchToolbar();
}

function batchToggle(enabled) {
  if (selectedIds.size === 0) return;
  const action = enabled ? '启用' : '禁用';
  if (!confirm(`确定要批量${action}选中的 ${selectedIds.size} 个书源吗？`)) return;

  fetch('/api/admin/book-source/batch/toggle', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: Array.from(selectedIds), enabled: enabled })
  })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        alert(`批量${action}完成：成功 ${res.data.success}，跳过 ${res.data.skipped}，失败 ${res.data.failed}`);
        selectedIds.clear();
        loadSources();
      } else {
        alert('操作失败: ' + res.message);
      }
    });
}

function batchDelete() {
  if (selectedIds.size === 0) return;
  if (!confirm(`确定要批量删除选中的 ${selectedIds.size} 个书源吗？\n\n内置书源将自动跳过。此操作不可恢复！`)) return;

  fetch('/api/admin/book-source/batch/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: Array.from(selectedIds) })
  })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        const msgs = res.data.messages || [];
        alert(`批量删除完成：成功 ${res.data.success}，跳过 ${res.data.skipped}，失败 ${res.data.failed}\n\n${msgs.slice(0, 10).join('\n')}${msgs.length > 10 ? '\n...' : ''}`);
        selectedIds.clear();
        loadSources();
      } else {
        alert('操作失败: ' + res.message);
      }
    });
}

function testSource(id) {
  const source = allSources.find(s => s.id === id);
  if (!source) return;
  currentTestSource = source;
  document.getElementById('testResult').classList.add('d-none');
  document.getElementById('testKeyword').value = '斗破苍穹';
  testModal.show();
}

function runTest() {
  if (!currentTestSource) return;
  const keyword = document.getElementById('testKeyword').value.trim();
  if (!keyword) {
    alert('请输入测试关键词');
    return;
  }

  const resultDiv = document.getElementById('testResult');
  const contentDiv = document.getElementById('testResultContent');
  resultDiv.classList.remove('d-none');
  contentDiv.innerHTML = '<div class="text-muted">测试中...</div>';

  fetch('/api/admin/online-source/search?keyword=' + encodeURIComponent(keyword) + '&sourceType=' + currentTestSource.sourceType + '&page=0&size=10')
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        const books = res.data || [];
        let html = '';
        html += '<div class="mb-2"><strong>搜索结果：</strong>' + books.length + ' 本</div>';
        if (books.length > 0) {
          html += '<div class="mb-2"><strong>第一本：</strong>' + (books[0].title || '(无标题)') + ' / ' + (books[0].author || '(无作者)') + '</div>';
          html += '<div class="mb-2"><strong>来源类型：</strong>' + (books[0].sourceType || '-') + '</div>';
          html += '<div class="mb-2"><strong>书籍链接：</strong><code>' + (books[0].sourceUrl || '-') + '</code></div>';
        } else {
          html += '<div class="alert alert-warning mb-2">未找到结果，请查看后端日志获取详细调试信息</div>';
          html += '<div class="mb-2"><strong>可能的原因：</strong></div>';
          html += '<ul class="mb-2 text-muted">';
          html += '<li>书源选择器规则不匹配</li>';
          html += '<li>网站需要特殊请求头或 Cookie</li>';
          html += '<li>网站启用了反爬或 Cloudflare</li>';
          html += '<li>书源依赖 JS 函数（如七猫），JS 执行可能出错</li>';
          html += '</ul>';
        }
        contentDiv.innerHTML = html;
      } else {
        contentDiv.innerHTML = '<div class="text-danger">测试失败：' + (res.message || '未知错误') + '</div>';
      }
    })
    .catch(err => {
      contentDiv.innerHTML = '<div class="text-danger">请求失败：' + err.message + '</div>';
    });
}
</script>
</body>
</html>
