    <div class="row g-2 align-items-center mb-2">
        <div class="col-md-3">
            <input type="text" id="searchInput" class="form-control" placeholder="搜索书名 / 作者（回车搜索）">
        </div>
        <div class="col-md-4">
            <!-- 分类筛选：主分类下拉 + 子分类多选（子分类为空＝该主分类下全部） -->
            <div data-cat-picker id="filterPicker" data-compact="1" data-empty-text="全部主分类"></div>
        </div>
        <div class="col-md-2">
            <select class="form-select" id="filterStatus" onchange="applyFilter()">
                <option value="">全部状态</option>
                <option value="0">连载中</option>
                <option value="1">已完结</option>
            </select>
        </div>
        <div class="col-md-1">
            <select class="form-select" id="filterSize" onchange="applyFilter()" title="每页条数">
                <option value="10">10 条</option>
                <option value="20">20 条</option>
                <option value="50">50 条</option>
                <option value="100">100 条</option>
            </select>
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button class="btn btn-outline-secondary flex-fill" type="button" onclick="clearFilter()">清除筛选</button>
            <button class="btn btn-primary flex-fill" type="button" onclick="showAddModal()">+ 添加</button>
        </div>
    </div>
    <div id="filterHint" class="small text-muted mb-2"></div>

    <!-- 批量操作工具栏 -->
    <div id="batchToolbar" class="batch-toolbar alert alert-info align-items-center mb-3 py-2 px-3">
        <span class="me-3">已选择 <strong id="selectedCount">0</strong> 本书籍</span>
        <button class="btn btn-sm btn-outline-danger me-2" onclick="batchDelete()">批量删除</button>
        <div class="dropdown me-2">
            <button class="btn btn-sm btn-outline-warning dropdown-toggle" type="button" data-bs-toggle="dropdown">
                批量改状态
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#" onclick="batchUpdateStatus(0)">连载中</a></li>
                <li><a class="dropdown-item" href="#" onclick="batchUpdateStatus(1)">已完结</a></li>
            </ul>
        </div>
        <!-- 批量改分类：主分类 + 子分类（多选），分类下拉里可直接「添加新分类」 -->
        <div class="d-flex align-items-start gap-2 me-2" style="min-width:420px; max-width:640px; flex:1 1 420px;">
            <div data-cat-picker id="batchPicker" data-compact="1" data-empty-text="不改主分类"
                 data-with-empty="1" class="flex-grow-1"></div>
            <button class="btn btn-sm btn-outline-secondary" type="button" onclick="batchApplyCategory()">应用到已选</button>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="clearSelection()">取消选择</button>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th>
            <th>ID</th>
            <th>书名</th>
            <th>作者</th>
            <th>分类</th>
            <th>章节</th>

                    <input type="text" class="form-control" id="editTitle">

                <div class="mb-3">
                    <label class="form-label">作者</label>
                    <input type="text" class="form-control" id="editAuthor">
                </div>
                <div class="mb-3">

                    <div data-cat-picker id="editPicker" data-empty-text="未指定主分类"></div>

                    <label class="form-label">简介</label>
                    <textarea class="form-control" id="editIntro" rows="4"></textarea>

<footer class="admin-foot">
  <span>
    书阁 · 内容管理平台
    <span class="foot-sep">/</span>
    <span>阅读 App 运营控制台</span>
  </span>
  <span>请勿在公共设备上保持登录状态</span>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentPage = 0;
    let modal;
    let viewModal;
    let selectedIds = new Set();
    // 服务端筛选条件：搜索/筛选一律交给后端分页查询，不再前端过滤
    let filterKeyword = '';
    let filterCategory = '';
    let filterSubs = [];
    let filterStatus = '';
    let pageSize = 10;
    let searchTimer = null;

    document.addEventListener('DOMContentLoaded', async function() {
        // 分类选择器依赖分类树，先取到再初始化，避免下拉框短暂为空
        await CategoryPicker.load();
        CategoryPicker.initAll(document);
        // 优先恢复上次离开书籍管理时的状态（搜索词 / 筛选 / 页码）：
        // 这样从章节页整页返回时是回到离开前的列表，而不是初始状态。
        const restored = restoreBooksState();
        // 分类筛选改动即查询（setValue 不会触发 onChange，故不会与初始 URL 筛选重复请求）
        if (filterPicker()) filterPicker().option.onChange = function () { applyFilter(); };
        bindSearchInput();
        if (restored >= 0) { loadBooks(restored); }
        else { initFilterFromUrl(); loadBooks(0); }
        // bootstrap 走 CDN：放在最后，CDN 抖动时不至于让列表和分类框都渲染不出来
        modal = new bootstrap.Modal(document.getElementById('bookModal'));
        viewModal = new bootstrap.Modal(document.getElementById('viewModal'));
    });

    /* ===================== 分类（主分类 + 子分类） ===================== */

    function filterPicker() { return CategoryPicker.of('filterPicker'); }
    function batchPicker() { return CategoryPicker.of('batchPicker'); }
    function editPicker() { return CategoryPicker.of('editPicker'); }

    /** 容错解析子分类：JSON 数组串 / 逗号分隔 / 空 */
    function parseSubs(raw) {
        if (!raw) return [];
        const s = String(raw).trim();
        if (!s) return [];
        if (s.charAt(0) === '[') {
            try {
                const arr = JSON.parse(s);
                if (Array.isArray(arr)) return arr.map(String).filter(Boolean);
            } catch (e) { /* 非法 JSON 退化为分隔符切分 */ }
        }
        return s.replace(/^\[|\]$/g, '').split(/[,，;；]/)
            .map(x => x.replace(/"/g, '').trim()).filter(Boolean);
    }

    /** 列表/详情展示用：主分类 · 子分类1/子分类2 */
    function categoryLabel(main, subsRaw) {
        const subs = parseSubs(subsRaw);
        const parts = [];
        if (main) parts.push(main);
        if (subs.length) parts.push(subs.join('/'));
        return parts.join(' · ');
    }

    // 书籍列表状态持久化：从章节页整页返回时恢复，避免回到初始状态
    function saveBooksState() {
      try {
        sessionStorage.setItem('booksListState', JSON.stringify({
          keyword: filterKeyword, category: filterCategory, subs: filterSubs,
          status: filterStatus, page: currentPage, size: pageSize
        }));
      } catch (e) { /* sessionStorage 不可用时忽略 */ }
    }
    function restoreBooksState() {
      try {
        const raw = sessionStorage.getItem('booksListState');
        if (!raw) return -1;
        const st = JSON.parse(raw);
        filterKeyword = st.keyword || '';
        filterCategory = st.category || '';
        filterSubs = st.subs || [];
        filterStatus = st.status || '';
        pageSize = st.size || 10;
        const si = document.getElementById('searchInput'); if (si) si.value = filterKeyword;
        const fs = document.getElementById('filterStatus'); if (fs) fs.value = filterStatus;
        const fz = document.getElementById('filterSize'); if (fz) fz.value = String(pageSize);
        const p = filterPicker(); if (p) p.setValue(filterCategory, filterSubs);
        return (typeof st.page === 'number') ? st.page : 0;
      } catch (e) { return -1; }
    }

    // 支持从数据导入页带筛选条件跳转过来：/admin/books?category=男生&sub=玄幻
    function initFilterFromUrl() {
        const q = new URLSearchParams(window.location.search);
        filterKeyword = q.get('keyword') || '';
        filterCategory = q.get('category') || '';
        filterSubs = q.getAll('sub').concat(q.getAll('subCategory')).filter(Boolean);
        filterStatus = q.get('status') || '';
        document.getElementById('searchInput').value = filterKeyword;
        if (filterStatus !== '') document.getElementById('filterStatus').value = filterStatus;
        const p = filterPicker();
        if (p) p.setValue(filterCategory, filterSubs);
    }

    function bindSearchInput() {
        const input = document.getElementById('searchInput');
        input.addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(function() {
                filterKeyword = input.value.trim();
                loadBooks(0);
            }, 350);
        });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                clearTimeout(searchTimer);
                filterKeyword = input.value.trim();
                loadBooks(0);
            }
        });
    }

    function applyFilter() {
        filterKeyword = document.getElementById('searchInput').value.trim();
        const v = filterPicker() ? filterPicker().getValue() : { main: '', subs: [] };
        filterCategory = v.main;
        filterSubs = v.subs;
        filterStatus = document.getElementById('filterStatus').value;
        pageSize = parseInt(document.getElementById('filterSize').value, 10) || 10;
        loadBooks(0);
    }

    function clearFilter() {
        document.getElementById('searchInput').value = '';
        document.getElementById('filterStatus').value = '';
        filterKeyword = '';
        filterCategory = '';
        filterSubs = [];
        filterStatus = '';
        if (filterPicker()) filterPicker().reset();
        loadBooks(0);
    }

    function buildBookQuery(page) {
        const p = new URLSearchParams();
        p.set('page', page);
        p.set('size', pageSize);
        if (filterKeyword) p.set('keyword', filterKeyword);
        if (filterCategory) p.set('category', filterCategory);
        // 子分类多选：同名重复参数，后端按 OR 处理
        filterSubs.forEach(s => p.append('subCategory', s));
        if (filterStatus !== '') p.set('status', filterStatus);
        return p.toString();
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }

    function loadBooks(page = 0) {
        currentPage = page;
        saveBooksState();
        fetch('/api/books?' + buildBookQuery(page))
            .then(r => r.json())
            .then(d => {
                const tbody = document.getElementById('bookTable');
                if (!d.success || !d.data) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">加载失败：'
                        + escapeHtml(d.message || '未知错误') + '</td></tr>';
                    return;
                }
                if (!d.data.content.length) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">没有符合条件的书籍</td></tr>';
                } else {
                    tbody.innerHTML = d.data.content.map(b => `
                        <tr data-id="${b.id}" class="${selectedIds.has(b.id) ? 'selected-row' : ''}">
                            <td><input type="checkbox" class="row-check" data-id="${b.id}" ${selectedIds.has(b.id) ? 'checked' : ''} onchange="toggleRow(${b.id}, this)"></td>
                            <td>${b.id}</td>
                            <td>${escapeHtml(b.title)}</td>
                            <td>${escapeHtml(b.author)}</td>
                            <td>${escapeHtml(categoryLabel(b.category, b.subCategories)) || '<span class="text-muted">未分类</span>'}</td>
                            <td>${b.chapterCount}</td>
                            <td>${b.status == 1 ? '完结' : '连载中'}</td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="editBook(${b.id})">编辑</button>
                                <button class="btn btn-sm btn-info" onclick="viewBook(${b.id})">查看</button>
                                <a class="btn btn-sm btn-outline-primary"
                                   href="chapters.html?bookId=${b.id}" title="管理这本书的章节">章节</a>
                                <button class="btn btn-sm btn-danger" onclick="deleteBook(${b.id})">删除</button>
                            </td>
                        </tr>
                    `).join('');
                }
                updateFilterHint(d.data);
                renderPagination(d.data);
                updateBatchToolbar();
            });
    }

    function updateFilterHint(pageData) {
        const parts = [];
        if (filterKeyword) parts.push('关键词「' + filterKeyword + '」');
        if (filterCategory) parts.push('主分类「' + filterCategory + '」');
        if (filterSubs.length) parts.push('子分类「' + filterSubs.join('/') + '」');
        if (filterStatus !== '') parts.push(filterStatus === '1' ? '已完结' : '连载中');
        document.getElementById('filterHint').textContent =
            '共 ' + pageData.totalElements + ' 本' + (parts.length ? ' · 筛选：' + parts.join(' / ') : '');
    }

    function toggleSelectAll(cb) {
        const checkboxes = document.querySelectorAll('.row-check');
        if (cb.checked) {
            checkboxes.forEach(c => {
                c.checked = true;
                selectedIds.add(parseInt(c.dataset.id));
                c.closest('tr').classList.add('selected-row');
            });
        } else {
            checkboxes.forEach(c => {
                c.checked = false;
                c.closest('tr').classList.remove('selected-row');
            });
            selectedIds.clear();
        }
        updateBatchToolbar();
    }

    function toggleRow(id, cb) {
        if (cb.checked) {
            selectedIds.add(id);
            cb.closest('tr').classList.add('selected-row');
        } else {
            selectedIds.delete(id);
            cb.closest('tr').classList.remove('selected-row');
        }
        updateBatchToolbar();
    }

    function clearSelection() {
        selectedIds.clear();
        document.querySelectorAll('.row-check').forEach(c => {
            c.checked = false;
            c.closest('tr').classList.remove('selected-row');
        });
        document.getElementById('selectAll').checked = false;
        updateBatchToolbar();
    }

    function updateBatchToolbar() {
        const toolbar = document.getElementById('batchToolbar');
        const count = selectedIds.size;
        document.getElementById('selectedCount').textContent = count;
        if (count > 0) {
            toolbar.classList.add('active');
        } else {
            toolbar.classList.remove('active');
        }
    }

    function batchDelete() {
        const ids = Array.from(selectedIds);
        if (ids.length === 0) return;
        if (!confirm(`确定要删除选中的 ${ids.length} 本书籍？\n\n此操作将同时删除这些书籍的所有章节、书架记录、阅读进度和书签，且不可恢复！`)) return;

        fetch('/api/books/batch-delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(ids)
        }).then(r => r.json())
        .then(d => {
            if (d.success) {
                alert(`成功删除 ${d.data} 本书籍`);
                selectedIds.clear();
                loadBooks(currentPage);
            } else {
                alert('删除失败: ' + d.message);
            }
        });
    }

    function batchUpdateStatus(status) {
        const ids = Array.from(selectedIds);
        if (ids.length === 0) return;
        const statusText = status === 1 ? '已完结' : '连载中';
        if (!confirm(`确定将选中的 ${ids.length} 本书籍状态改为「${statusText}」？`)) return;

        fetch('/api/books/batch-status', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ids: ids, status: status})
        }).then(r => r.json())
        .then(d => {
            if (d.success) {
                alert(`成功更新 ${d.data} 本书籍状态`);
                selectedIds.clear();
                loadBooks(currentPage);
            } else {
                alert('更新失败: ' + d.message);
            }
        });
    }

    /**
     * 批量改分类：主分类为空＝不改主分类，子分类为空＝清空子分类。
     * 两者都为空直接拦下，避免误操作把整批书变成「无分类」。
     */
    function batchApplyCategory() {
        const ids = Array.from(selectedIds);
        if (ids.length === 0) { alert('请先勾选要修改的书籍'); return; }
        const p = batchPicker();
        if (!p) return;
        const v = p.getValue();
        if (!v.main && !v.subs.length) {
            alert('请先选择主分类或子分类');
            return;
        }
        const desc = (v.main ? '主分类「' + v.main + '」' : '主分类保持不变')
            + '，子分类「' + (v.subs.length ? v.subs.join('、') : '清空') + '」';
        if (!confirm(`确定将选中的 ${ids.length} 本书籍改为：${desc}？`)) return;

        fetch('/api/books/batch-category', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ids: ids, category: v.main, subCategories: JSON.stringify(v.subs)})
        }).then(r => r.json())
        .then(d => {
            if (d.success) {
                alert(`成功更新 ${d.data} 本书籍分类`);
                selectedIds.clear();
                loadBooks(currentPage);
            } else {
                alert('更新失败: ' + d.message);
            }
        });
    }

    function renderPagination(pageData) {
        const pagination = document.getElementById('pagination');
        const totalPages = pageData.totalPages;
        const currentPageNum = pageData.number;
        
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = `<li class="page-item ${currentPageNum === 0 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadBooks(${currentPageNum - 1})">上一页</a>
        </li>`;

        const startPage = Math.max(0, currentPageNum - 2);
        const endPage = Math.min(totalPages - 1, currentPageNum + 2);

        for (let i = startPage; i <= endPage; i++) {
            html += `<li class="page-item ${i === currentPageNum ? 'active' : ''}">
                <a class="page-link" href="#" onclick="loadBooks(${i})">${i + 1}</a>
            </li>`;
        }

        html += `<li class="page-item ${currentPageNum === totalPages - 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadBooks(${currentPageNum + 1})">下一页</a>
        </li>`;

        pagination.innerHTML = html;
    }

    function showAddModal() {
        document.getElementById('modalTitle').textContent = '添加书籍';
        document.getElementById('editId').value = '';
        document.getElementById('editTitle').value = '';
        document.getElementById('editAuthor').value = '';
        if (editPicker()) editPicker().reset();
        document.getElementById('editIntro').value = '';
        document.getElementById('editStatus').value = '0';
        document.getElementById('editCover').value = '';
        document.getElementById('coverPreview').src = '';
        document.getElementById('coverPreview').style.display = 'none';
        document.getElementById('removeCoverBtn').style.display = 'none';
        modal.show();
    }

    function editBook(id) {
        fetch(`/api/books/${id}`)
            .then(r => r.json())
            .then(d => {
                const b = d.data;
                if (!d.success || b == null) {
                    alert('获取书籍详情失败：' + (d.message || '未知错误'));
                    return;
                }
                document.getElementById('modalTitle').textContent = '编辑书籍';
                document.getElementById('editId').value = b.id;
                document.getElementById('editTitle').value = b.title;
                document.getElementById('editAuthor').value = b.author;
                if (editPicker()) editPicker().setValue(b.category || '', parseSubs(b.subCategories));
                document.getElementById('editIntro').value = b.intro || '';
                document.getElementById('editStatus').value = b.status;
                document.getElementById('editCover').value = '';
                if (b.cover) {
                    document.getElementById('coverPreview').src = b.cover;
                    document.getElementById('coverPreview').style.display = 'block';
                    document.getElementById('removeCoverBtn').style.display = 'inline-block';
                } else {
                    document.getElementById('coverPreview').src = '';
                    document.getElementById('coverPreview').style.display = 'none';
                    document.getElementById('removeCoverBtn').style.display = 'none';
                }
                modal.show();
            });
    }

    function removeCover() {
        const bookId = document.getElementById('editId').value;
        if (bookId && confirm('确定要删除封面吗？')) {
            fetch(`/api/cover/${bookId}`, {method: 'DELETE'})
                .then(() => {
                    document.getElementById('coverPreview').src = '';
                    document.getElementById('coverPreview').style.display = 'none';
                    document.getElementById('removeCoverBtn').style.display = 'none';
                    document.getElementById('editCover').value = '';
                });
        }
    }

    function saveBook() {
        const id = document.getElementById('editId').value;
        const picked = editPicker() ? editPicker().getValue() : { main: '', subs: [] };
        const data = {
            title: document.getElementById('editTitle').value,
            author: document.getElementById('editAuthor').value,
            category: picked.main,
            subCategories: JSON.stringify(picked.subs),
            intro: document.getElementById('editIntro').value,
            status: parseInt(document.getElementById('editStatus').value)
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/books/${id}` : '/api/books';
        const coverFile = document.getElementById('editCover').files[0];

        fetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(r => r.json())
        .then(result => {
            modal.hide();
            const bookId = result.data.id;
            if (coverFile) {
                const formData = new FormData();
                formData.append('file', coverFile);
                fetch(`/api/cover/upload/${bookId}`, {
                    method: 'POST',
                    body: formData
                }).then(() => {
                    loadBooks(currentPage);
                }).catch(err => {
                    console.error('封面上传失败:', err);
                    loadBooks(currentPage);
                });
            } else {
                loadBooks(currentPage);
            }
        }).catch(err => {
            console.error('保存书籍失败:', err);
            alert('保存书籍失败，请重试');
        });
    }

    function deleteBook(id) {
        if (confirm('确定删除这本书？')) {
            fetch(`/api/books/${id}`, {method: 'DELETE'})
                .then(() => loadBooks(currentPage));
        }
    }

    function viewBook(id) {
        fetch(`/api/books/${id}`)
            .then(r => r.json())
            .then(d => {
                const b = d.data;
                if (!d.success || b == null) {
                    alert('获取书籍详情失败：' + (d.message || '未知错误'));
                    return;
                }
                document.getElementById('viewTitle').textContent = b.title;
                document.getElementById('viewAuthor').textContent = b.author;
                document.getElementById('viewCategory').textContent =
                    categoryLabel(b.category, b.subCategories) || '未分类';
                document.getElementById('viewStatus').innerHTML = b.status == 1
                    ? '<span class="badge bg-success">已完结</span>'
                    : '<span class="badge bg-warning">连载中</span>';
                document.getElementById('viewChapterCount').textContent = b.chapterCount;
                document.getElementById('viewViewCount').textContent = (b.viewCount || 0).toLocaleString();
                document.getElementById('viewLikeCount').textContent = (b.likeCount || 0).toLocaleString();
                document.getElementById('viewCreatedAt').textContent = b.createdAt ? b.createdAt.substring(0, 10) : '-';
                document.getElementById('viewUpdatedAt').textContent = b.updatedAt ? b.updatedAt.substring(0, 10) : '-';
                document.getElementById('viewIntro').textContent = b.intro || '暂无简介';

                const viewCover = document.getElementById('viewCover');
                if (b.cover) {
                    viewCover.src = b.cover;
                    viewCover.style.display = 'block';
                } else {
                    viewCover.src = '';
                    viewCover.style.display = 'none';
                }

                document.getElementById('viewWordCount').textContent =
                    (b.wordCount != null ? b.wordCount : 0).toLocaleString() + '字';

                viewModal.show();
            });
    }

    function previewCover(input) {
        const preview = document.getElementById('coverPreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
