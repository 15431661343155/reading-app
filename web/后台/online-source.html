<div class="container mt-4 admin-main">

  <p class="desc">对接在线公版书源，搜索并导入公版书籍</p>
  <div class="head-rule"></div>
</div>

  <div class="card mb-4">
    <div class="card-header bg-info text-white">
      在线公版书源
    </div>
    <div class="card-body">
      <p class="text-muted">
        对接在线公版书源，可直接搜索并导入公版书籍到书城。
        <br><span class="text-success">导入时会自动下载书籍全文并按 Chapter 分章保存。</span>
      </p>
      <div class="row">
        <div class="col-md-3">
          <select class="form-select" id="selectSource">
          </select>
        </div>
        <div class="col-md-6">
          <input type="text" class="form-control" id="searchKeyword" placeholder="输入书名或作者搜索，例如：Pride and Prejudice">
        </div>
        <div class="col-md-3">
          <button class="btn btn-primary" onclick="searchBooks()">搜索</button>
        </div>
      </div>
    </div>
  </div>

  <div id="searchResult" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5>搜索结果</h5>
      <span class="text-muted" id="resultCount"></span>
    </div>
    <div class="row" id="bookList">
    </div>
  </div>

  <div id="emptyState" class="text-center py-5">
    <div style="font-size: 64px;"></div>
    <p class="text-muted mt-3">选择书源，输入关键词搜索公版书籍</p>
  </div>
</div>

<!-- 书籍详情 Modal -->
<div class="modal fade" id="bookDetailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="detailModalTitle">书籍详情</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="detailModalBody">
        <div class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">加载中...</p></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>

<footer class="admin-foot">
  <span>
    书阁 · 内容管理平台
    <span class="foot-sep">/</span>
    <span>阅读 App 运营控制台</span>
  </span>
  <span>请勿在公共设备上保持登录状态</span>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let currentSource = 'all';

  function loadSources() {
    fetch('/api/admin/online-source/sources')
      .then(r => r.json())
      .then(d => {
        if (d.success && d.data) {
          const select = document.getElementById('selectSource');
          let html = '<option value="all">全部书源（扩大搜索范围）</option>';
          html += d.data.map(s =>
            `<option value="${s.type}">${s.name} - ${s.description}</option>`
          ).join('');
          select.innerHTML = html;
          if (d.data.length > 0) {
            currentSource = 'all';
            updateSearchPlaceholder();
          }
        }
      });

    document.getElementById('selectSource').addEventListener('change', function() {
      currentSource = this.value;
      updateSearchPlaceholder();
    });
  }

  function updateSearchPlaceholder() {
    const input = document.getElementById('searchKeyword');
    input.placeholder = '输入书名或作者搜索';
  }

  function searchBooks() {
    const keyword = document.getElementById('searchKeyword').value.trim();
    if (!keyword) {
      alert('请输入搜索关键词');
      return;
    }
    currentSource = document.getElementById('selectSource').value;

    document.getElementById('emptyState').classList.add('d-none');
    document.getElementById('searchResult').classList.remove('d-none');
    document.getElementById('bookList').innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">正在搜索...</p></div>';

    fetch(`/api/admin/online-source/search?keyword=${encodeURIComponent(keyword)}&sourceType=${currentSource}&page=0&size=20`)
      .then(r => r.json())
      .then(d => {
        if (d.success) {
          // 前端再次过滤：防御后端漏过的不相关结果（后端过滤 + 前端过滤 = 双重保证）
          const filtered = filterBooksByKeyword(d.data, keyword);
          renderBooks(filtered, keyword);
        } else {
          document.getElementById('bookList').innerHTML = `<div class="col-12"><div class="alert alert-danger">搜索失败：${d.message}</div></div>`;
        }
      })
      .catch(e => {
        document.getElementById('bookList').innerHTML = `<div class="col-12"><div class="alert alert-danger">网络错误：${e.message}</div></div>`;
      });
  }

  /** 归一化字符串用于模糊匹配（去空白、转小写、去标点符号） */
  function normalizeMatch(s) {
    if (!s) return '';
    return String(s).toLowerCase()
      .replace(/\s+/g, '')
      .replace(/[\p{P}\p{S}]/gu, '')
      .trim();
  }

  /**
   * 前端关键词过滤：title/author/intro 任一包含 keyword 保留；
   * 对「纯数字短关键词（长度≤2）」不参与 category 匹配，防止书源 tag 如 0_1 误命中。
   * @param {Array} books 书籍列表
   * @param {string} keyword 搜索关键词
   * @returns {Array} 过滤后的书籍
   */
  function filterBooksByKeyword(books, keyword) {
    if (!Array.isArray(books) || books.length === 0) return [];
    if (!keyword || !keyword.trim()) return books;
    const nkw = normalizeMatch(keyword);
    if (!nkw) return books;
    // 纯数字短关键词：不匹配 category（避免编号 tag 误命中）
    const shortNumeric = /^\d+$/.test(nkw) && nkw.length <= 2;
    const out = [];
    for (const b of books) {
      const nt = normalizeMatch(b.title);
      const na = normalizeMatch(b.author);
      const ni = normalizeMatch(b.intro);
      const nc = normalizeMatch(b.category);
      const titleAuthorIntroMatch = nt.includes(nkw) || na.includes(nkw) || ni.includes(nkw);
      const categoryMatch = !shortNumeric && nc.includes(nkw);
      if (titleAuthorIntroMatch || categoryMatch) {
        out.push(b);
      }
    }
    return out;
  }

  function renderBooks(books, keyword) {
    const countText = keyword && books.length === 0
      ? `共 0 本（关键词"${keyword}"无匹配，已过滤掉第三方书源默认返回的榜单）`
      : `共 ${books.length} 本`;
    document.getElementById('resultCount').textContent = countText;
    const container = document.getElementById('bookList');

    if (books.length === 0) {
      container.innerHTML = '<div class="col-12"><div class="alert alert-info">未找到相关书籍</div></div>';
      return;
    }

    container.innerHTML = books.map(book => {
      const srcUrl = encodeURIComponent(book.sourceUrl || '');
      const srcType = book.sourceType || currentSource;
      return `
      <div class="col-md-6 mb-3">
        <div class="card h-100" style="cursor:pointer" onclick="showBookDetail('${srcUrl}','${srcType}')">
          <div class="row g-0 h-100">
            <div class="col-md-3 d-flex align-items-center justify-content-center p-2">
              ${book.cover
                ? `<img src="${book.cover}" class="img-fluid rounded" style="max-height: 120px;" alt="${book.title}" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\'text-center\\'><div style=\\'font-size:32px\\'></div></div>'">`
                : '<div class="text-center"><div style="font-size: 32px;"></div></div>'
              }
            </div>
            <div class="col-md-9">
              <div class="card-body">
                <h6 class="card-title">${book.title}</h6>
                <p class="card-text small text-muted mb-1">作者：${book.author || '未知'}</p>
                <p class="card-text small text-muted mb-1">
                  分类：${book.category || '未分类'}
                  ${book.sourceType ? `<span class="badge bg-info ms-2">${book.sourceType}</span>` : ''}
                </p>
                <p class="card-text small text-muted mb-0"><span class="text-primary">点击查看详情 →</span></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    `}).join('');
  }

  /** 当前详情上下文：供章节正文返回使用 */
  let detailCtx = { sourceUrl: '', sourceType: '' };

  function showBookDetail(encodedSourceUrl, sourceType) {
    const sourceUrl = decodeURIComponent(encodedSourceUrl);
    detailCtx = { sourceUrl, sourceType };

    const modal = new bootstrap.Modal(document.getElementById('bookDetailModal'));
    document.getElementById('detailModalTitle').textContent = '书籍详情';
    document.getElementById('detailModalBody').innerHTML =
      '<div class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">加载中...</p></div>';
    modal.show();

    // 并行获取详情 + 章节目录
    const bookApi = `/api/admin/online-source/book?sourceType=${encodeURIComponent(sourceType)}&sourceBookId=${encodeURIComponent(sourceUrl)}`;
    const chapApi = `/api/admin/online-source/chapters?sourceType=${encodeURIComponent(sourceType)}&sourceBookId=${encodeURIComponent(sourceUrl)}`;

    Promise.all([
      fetch(bookApi).then(r => r.json()).catch(() => ({ success: false })),
      fetch(chapApi).then(r => r.json()).catch(() => ({ success: false }))
    ]).then(([bookResp, chapResp]) => {
      renderBookDetail(bookResp, chapResp);
    });
  }

  function renderBookDetail(bookResp, chapResp) {
    // 缓存响应供「返回目录」重新渲染
    detailCtx._lastBookResp = bookResp;
    detailCtx._lastChapResp = chapResp;
    const body = document.getElementById('detailModalBody');

    if (!bookResp.success || !bookResp.data) {
      body.innerHTML = '<div class="alert alert-danger">获取书籍详情失败：' + (bookResp.message || '未知错误') + '</div>';
      return;
    }

    const b = bookResp.data;
    let html = `
      <div class="row mb-3">
        <div class="col-md-3 text-center">
          ${b.cover
            ? `<img src="${b.cover}" class="img-fluid rounded mb-2" style="max-height: 200px;" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\\'font-size:48px\\'></div>'">`
            : '<div style="font-size: 48px;"></div>'}
        </div>
        <div class="col-md-9">
          <h5>${b.title || '未知书名'}</h5>
          <p class="text-muted mb-1">作者：${b.author || '未知'}</p>
          <p class="text-muted mb-1">分类：${b.category || '未分类'}</p>
          ${b.wordCount ? `<p class="text-muted mb-1">字数：${b.wordCount}</p>` : ''}
          ${b.lastChapter ? `<p class="text-muted mb-1">最新章节：${b.lastChapter}</p>` : ''}
          ${b.sourceType ? `<p class="mb-1"><span class="badge bg-info">${b.sourceType}</span></p>` : ''}
        </div>
      </div>`;

    if (b.intro) {
      html += `<div class="mb-3"><h6>简介</h6><p class="text-muted small" style="max-height:120px;overflow-y:auto;">${b.intro}</p></div>`;
    }

    // 章节目录
    if (chapResp.success && chapResp.data && chapResp.data.length > 0) {
      const chapters = chapResp.data;
      document.getElementById('detailModalTitle').textContent = `${b.title || '书籍详情'}（共 ${chapters.length} 章）`;
      html += '<div class="mb-2"><h6>章节目录</h6></div>';
      html += '<div class="panel-scroll">';
      html += '<ul class="list-group list-group-flush">';
      chapters.forEach((ch, idx) => {
        const title = ch[0] || ('第' + (idx + 1) + '章');
        const url = ch[1] || '';
        if (url) {
          html += `<li class="list-group-item list-group-item-action" style="cursor:pointer" onclick="showChapterContent(${idx})"><span class="text-muted small me-2">${idx + 1}.</span>${title}</li>`;
        } else {
          html += `<li class="list-group-item"><span class="text-muted small me-2">${idx + 1}.</span>${title}</li>`;
        }
      });
      html += '</ul></div>';
      // 缓存章节供正文预览
      detailCtx.chapters = chapters;
    } else {
      html += '<p class="text-muted">暂无章节目录</p>';
    }

    body.innerHTML = html;
  }

  function showChapterContent(chapterIndex) {
    const ch = detailCtx.chapters[chapterIndex];
    if (!ch || !ch[1]) return;
    const chapterUrl = ch[1];
    const chapterTitle = ch[0] || ('第' + (chapterIndex + 1) + '章');

    const body = document.getElementById('detailModalBody');
    body.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="mb-0">${chapterTitle}</h6>
        <button class="btn btn-sm btn-outline-secondary" onclick="backToDetail()">← 返回目录</button>
      </div>
      <div id="chapterContentArea" class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">加载正文中...</p></div>`;

    const api = `/api/admin/online-source/content?sourceType=${encodeURIComponent(detailCtx.sourceType)}&sourceBookId=${encodeURIComponent(detailCtx.sourceUrl)}&chapterUrl=${encodeURIComponent(chapterUrl)}`;
    fetch(api)
      .then(r => r.json())
      .then(d => {
        const area = document.getElementById('chapterContentArea');
        if (d.success && d.data) {
          area.className = '';
          area.innerHTML = `<div class="chapter-text" style="white-space:pre-wrap;font-size:15px;line-height:1.8;max-height:500px;overflow-y:auto;">${escapeHtml(d.data)}</div>`;
        } else {
          area.className = '';
          area.innerHTML = '<div class="alert alert-warning">获取正文失败：' + (d.message || '无内容') + '</div>';
        }
      })
      .catch(e => {
        document.getElementById('chapterContentArea').innerHTML =
          '<div class="alert alert-danger">网络错误：' + e.message + '</div>';
      });
  }

  /** 返回目录视图（用缓存的详情数据重新渲染） */
  function backToDetail() {
    if (detailCtx._lastBookResp && detailCtx._lastChapResp) {
      renderBookDetail(detailCtx._lastBookResp, detailCtx._lastChapResp);
    } else {
      // 退化为重新请求
      showBookDetail(encodeURIComponent(detailCtx.sourceUrl), detailCtx.sourceType);
    }
  }

  function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  document.getElementById('searchKeyword').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      searchBooks();
    }
  });

  loadSources();
</script>
</body>
