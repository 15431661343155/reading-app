# ============================================================
# 书阁阅读 · 4 子域部署（通用 nginx）
# ------------------------------------------------------------
# ⚠️ 本文件是手写参考模板；服务器上实际运行的是宝塔结构配置，
#    原件存档在 ./server-current/（2026-10-01 从服务器拉取）。
#    排查线上行为 / 重建环境以 server-current/ 为准；改线上配置后先更新存档。
# ------------------------------------------------------------
# 部署拓扑（与官网 官网/index.html 的跳转链接一一对应）：
#   官网(静态)      书阁阅读.xyz / www.书阁阅读.xyz / 8.148.8.146:8089  → /www/app/web/官网     (官网/index.html = 官网)
#   Web 书城(前台)   book.书阁阅读.xyz                                     → /www/app/web/web前台
#   管理后台         admin.书阁阅读.xyz                                    → /www/app/web/后台
#   下载页           download.书阁阅读.xyz                                 → 反代后端 /download
#
# 服务器实际根目录：/www/app/web（即 web/ 上传后的位置）。
# 本配置文件位于 web/部署配置/，该目录不属于任何站点根，不会被公网访问。
#
# 后端 Spring Boot 地址：127.0.0.1:8080（与 application.properties 的 server.port 一致）
#
# 关键约束（Cookie 鉴权）：
#   管理后台用 HttpOnly Cookie（ADMIN_TOKEN，JWT），且后端 SecurityConfig 的 CORS
#   【不开启 credentials】。因此「后台页面」与「后端 /api/」必须【同源】，
#   本配置把 admin.书阁阅读.xyz 的 /api/ 反代到后端，满足同源，Cookie 才带得过去。
#   Web 书城(book) 同样反代 /api/，保持同源，避免跨域问题。
#   （前台页面已把后端基址默认置空 → 请求同源 /api/...，不再写死 IP，
#     否则 https 页面请求 http 地址会被浏览器按「混合内容」拦截。）
#
# 中文目录：root 里用了「官网」「web前台」「后台」中文目录，nginx 以 UTF-8 文件系统
#   读取即可，无需在 location 里写中文路径（location 写中文易出编码坑），故这里只用 root 指定。
#
# 中文域名(IDN)：server_name 必须写 Punycode（xn-- 形式）！浏览器发往 nginx 的 Host 头
#   本身就是 Punycode（如 xn--1jq441m6jgqa.xyz），若写成 Unicode「书阁阅读.xyz」则永远
#   匹配不上 → 请求落到 default_server。故官网块特意加了 default_server 兜底，且所有
#   server_name 一律用 Punycode（下面注释里附了对应的中文域名，便于对照）。
#
# TLS：官网跳转链接已用 https://，所以各子域必须能响应 443 并提供证书；
#   证书路径请在下方取消注释并填好；若暂无证书，先把 web/官网/index.html 里的
#   https:// 全局替换为 http://，并删除各块里的 listen 443 ssl; 注释。
# ============================================================

# ---------- CC 防护（限流区域，http 层）----------
# 每 IP 10 req/s，burst 20 突发；各站点的 /api/ location 引用（limit_req 行）。
# 超限返回 429。App 正常使用（单人秒级 1-2 个请求）远低于阈值，不受影响。
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_status 429;

# ---------- 1. 官网（静态，主域 + 直接 IP:8089） ----------
server {
    listen 80 default_server;        # default_server：即使 Host 是中文域名(IDN)未匹配，也兜底到官网
    listen 8089;                      # 直接 IP 访问：http://8.148.8.146:8089
    # listen 443 ssl;                 # 启用 HTTPS 时取消注释并填证书
    server_name xn--1jq441m6jgqa.xyz www.xn--1jq441m6jgqa.xyz;   # 书阁阅读.xyz / www.书阁阅读.xyz（必须 Punycode）
    # ssl_certificate     /path/to/书阁阅读.xyz/fullchain.pem;
    # ssl_certificate_key /path/to/书阁阅读.xyz/privkey.pem;

    # —— 强制 HTTPS：仅域名访问 301 跳转；直接 IP:8089 保持 http 可用 ——
    # （启用 443 证书后取消注释；未配证书时开启会把全部流量 301 到打不开的 https）
    # if ($host = xn--1jq441m6jgqa.xyz)     { return 301 https://$host$request_uri; }
    # if ($host = www.xn--1jq441m6jgqa.xyz) { return 301 https://$host$request_uri; }

    root /www/app/web/官网;            # 官网 = 官网/ 子目录（域名根即官网）
    index index.html;
    charset utf-8;

    # 安全响应头（官网：字体走 miaoda.feishu.cn）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://miaoda.feishu.cn; font-src 'self' https://miaoda.feishu.cn; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 官网下载页（web/官网/Download.html）同源调用后端「公开」安装包接口：
    #   GET /api/app/apk/latest       → 最新安装包信息（版本/大小/日期/文件名/下载链接）
    #   GET /api/app/apk/download/<f>  → 公开下载安装包（无需登录）
    # 该前缀已在 SecurityConfig 中 permitAll；用 ^~ 阻止「location ~ \.(js|css)$」等正则静态块抢请求。
    location ^~ /api/app/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 官网为纯静态页；SPA 兜底（刷新深链落 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 2. Web 书城 book.书阁阅读.xyz ----------
server {
    listen 80;
    # listen 443 ssl;
    server_name book.xn--1jq441m6jgqa.xyz;          # book.书阁阅读.xyz（必须 Punycode）
    # ssl_certificate     /path/to/book.书阁阅读.xyz/fullchain.pem;
    # ssl_certificate_key /path/to/book.书阁阅读.xyz/privkey.pem;

    # —— 强制 HTTPS（启用 443 证书后取消注释）——
    # if ($scheme = http) { return 301 https://$host$request_uri; }

    # HTML_NOCACHE: HTML 禁缓存，页面更新即时生效
    location ~* \.html$ { expires -1; }
    location = / { expires -1; }
    root /www/app/web/web前台;         # 前台 Web 书城作为独立根
    index index.html;
    charset utf-8;

    # 安全响应头（书城：Google Fonts + 外链封面 http(s)，脚本/接口全部同源内联）
    # ⚠️ script-src 必须带 'unsafe-eval'：前台用 vue.global.prod.js（含运行时模板编译器，
    #    内部走 new Function），缺它页面直接 EvalError 白屏。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 后端 API：同源反代（前端用 /api/ 同源调用，已不写死主机）
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 书籍封面：后端以 /covers/** 提供（FileUploadConfig 映射到 uploads/covers/），
    # 必须同源反代到后端，否则请求会落到静态根目录 → 404（这正是书城封面不显示的根因）。
    # 用 ^~ 阻止「location ~ \.(jpg|png)$」这类正则静态块抢走请求（宝塔默认带该块）。
    location ^~ /covers/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前台为 SPA，刷新深链兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 3. 管理后台 admin.书阁阅读.xyz（Cookie 同源约束） ----------
server {
    listen 80;
    # listen 443 ssl;
    server_name admin.xn--1jq441m6jgqa.xyz;         # admin.书阁阅读.xyz（必须 Punycode）
    # ssl_certificate     /path/to/admin.书阁阅读.xyz/fullchain.pem;
    # ssl_certificate_key /path/to/admin.书阁阅读.xyz/privkey.pem;

    # —— 强制 HTTPS（启用 443 证书后取消注释；后台含登录凭证 Cookie，更应启用）——
    # if ($scheme = http) { return 301 https://$host$request_uri; }

    # HTML_NOCACHE: HTML 禁缓存，页面更新即时生效（配合 js ?v= 版本号）
    location ~* \.html$ { expires -1; }
    location = / { expires -1; }
    root /www/app/web/后台;            # 后台作为独立根（域名根即后台）
    index index.html;
    charset utf-8;

    # 安全响应头（后台：Bootstrap 走 cdn.jsdelivr.net，其余全同源）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 后端 API：必须与后台页面【同源】，否则 JWT Cookie 带不过去 → 全部 401
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 书籍封面：后台书籍管理列表也展示封面，同样需反代后端 /covers/**
    location ^~ /covers/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台页面都是真实 .html，兜底防刷新/伪路径 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 4. 下载页 download.书阁阅读.xyz（反代后端下载页） ----------
server {
    listen 80;
    # listen 443 ssl;
    server_name download.xn--1jq441m6jgqa.xyz;      # download.书阁阅读.xyz（必须 Punycode）
    # ssl_certificate     /path/to/download.书阁阅读.xyz/fullchain.pem;
    # ssl_certificate_key /path/to/download.书阁阅读.xyz/privkey.pem;

    # —— 强制 HTTPS（启用 443 证书后取消注释）——
    # if ($scheme = http) { return 301 https://$host$request_uri; }

    charset utf-8;

    # 安全响应头（下载页：内容全部由后端渲染，保守放开内联与 data: 图片）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # 后端已在 /download、/app、/apk 渲染下载页，APK 走 /api/admin/apk/download/。
    # 这里把整个子域反代到后端（小项目最简方案），故 root 指向哪个目录都无所谓。
    # 若想收紧，可只放行：location ~ ^/(download|app|apk|api/admin/apk/download/) { ... }
    location / {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------
# 用法：
#   1) 把整个 web/ 传到服务器 /www/app/web（各子域 root：/www/app/web/官网、/web前台、/后台）。
#   2) 复制本文件到 nginx 的 conf.d/（或 include 进主配置），nginx -t && nginx -s reload。
#   3) 证书：若启用 HTTPS，把每个 server 块的 ssl_certificate/key 填好并取消 listen 443 ssl;
#      注释；否则把 web/官网/index.html 的 https:// 改回 http://。
#   4) 访问验证：
#      官网    http://8.148.8.146:8089 或 https://书阁阅读.xyz
#      书城    https://book.书阁阅读.xyz
#      后台    https://admin.书阁阅读.xyz  → 登录走 /api/admin/auth/login
#      下载    https://download.书阁阅读.xyz  → 后端 /download 页
# ------------------------------------------------------------
