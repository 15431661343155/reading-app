# ============================================================
# 书阁阅读 · 宝塔面板 4 站点部署指引
# ------------------------------------------------------------
# 宝塔里为 4 个域名各建一个【独立站点】，每个站点的「配置文件」里粘贴对应片段。
# 基础根目录 = /www/app/web（通用 nginx.conf 亦使用同一路径，4 个子域各自独立根）。
#
# ⚠ 中文域名(IDN)必看：浏览器访问 书阁阅读.xyz 时，发到 nginx 的 Host 头是 Punycode
#   （xn--1jq441m6jgqa.xyz）。若站点绑定的域名写成 Unicode「书阁阅读.xyz」而宝塔未转
#   Punycode，则匹配不上 → 落到默认站点（可能是书城）。校验：访问 书阁阅读.xyz 若显示
#   成别的站点，九成是「该站点根目录指错」或「域名未正确匹配」。
#   → 主站(书阁阅读.xyz)的【网站目录】必须填 /www/app/web/官网（不是 web前台！）。
#
# 4 个站点：官网 / Web 书城 / 管理后台 / 下载页
#   官网      → 根 /www/app/web/官网             （纯静态，域名 书阁阅读.xyz）
#   Web 书城  → 根 /www/app/web/web前台           （域名 book.书阁阅读.xyz，需反代 /api/）
#   管理后台  → 根 /www/app/web/后台              （域名 admin.书阁阅读.xyz，需反代 /api/）
#   下载页    → 反代后端（域名 download.书阁阅读.xyz）
#
# 关键约束：后台与书城的 /api/ 必须【同源】反代到后端，否则后台 JWT Cookie 带不过去→401。
# 中文目录「前台」「后台」宝塔已支持 UTF-8，root 直接指到目录即可，不要在 location 写中文。
# ============================================================


# ---------- 站点 1：官网（书阁阅读.xyz）----------
# 宝塔建站时「根目录」填 /www/app/web/官网，域名绑 书阁阅读.xyz / www.书阁阅读.xyz。
# 把下面两段粘进该站点配置文件（覆盖默认 location /）：
location / {
    try_files $uri $uri/ /index.html;
}
# 若需直接 IP:8089 访问官网，在该站点「端口」里额外添加 8089 监听。


# ---------- 站点 2：Web 书城（book.书阁阅读.xyz）----------
# 宝塔建站「根目录」填 /www/app/web/web前台，域名绑 book.书阁阅读.xyz。
# 粘贴下面三段（前台用绝对路径 /api/ 调后端，必须同源反代；封面 /covers/ 同样要反代）：
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# 书籍封面：后端以 /covers/** 提供（FileUploadConfig），必须反代到后端，
# 否则封面请求落到静态根 → 404（书城封面不显示的根因）。
# 用 ^~ 阻止宝塔默认的「location ~ \.(jpg|png)$」正则静态块抢走请求。
location ^~ /covers/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location / {
    try_files $uri $uri/ /index.html;
}


# ---------- 站点 3：管理后台（admin.书阁阅读.xyz）----------
# 宝塔建站「根目录」填 /www/app/web/后台（域名根即后台，无需 /后台/ 前缀），
# 域名绑 admin.书阁阅读.xyz。粘贴下面三段（/api/ 同源反代；/covers/ 反代封面）：
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# 书籍封面：后台书籍列表也展示封面，同样需反代后端 /covers/**
# 同样用 ^~ 阻止正则静态块抢请求。
location ^~ /covers/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location / {
    try_files $uri $uri/ /index.html;
}
# 说明：后台页面都是真实 .html 文件，try_files 防止刷新/伪路径落到 404。
#       登录走 /api/admin/auth/login（后端 permitAll），成功后跳 后台/index.html。


# ---------- 站点 4：下载页（download.书阁阅读.xyz）----------
# 宝塔建站时「根目录」随便指一个空目录即可（实际由反代提供内容），域名绑 download.书阁阅读.xyz。
# 后端已在 /download、/app、/apk 渲染下载页，APK 走 /api/admin/apk/download/。
# 整站反代到后端（小项目最简）：
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}


# ---------- 安全响应头（4 站点统一加固，2026-10-01）----------
# 把对应站点的 5 行 add_header 粘进该站点配置文件的 server 层（与 location 平级即可）。
# 注意：粘贴后先「保存」再 nginx -t 校验、nginx -s reload；浏览器验证响应头生效。
# CSP 已按各站点实际引用的外部资源定制（官网字体走 miaoda.feishu.cn、后台 Bootstrap 走
# cdn.jsdelivr.net、书城字体走 Google Fonts + 外链封面），改了资源引用需同步调整 CSP。

# 官网（书阁阅读.xyz）粘贴：
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://miaoda.feishu.cn; font-src 'self' https://miaoda.feishu.cn; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Web 书城（book.）粘贴：
# ⚠️ script-src 必须带 'unsafe-eval'：前台用 vue.global.prod.js（含运行时模板编译器，
#    内部走 new Function），缺它页面直接 EvalError 白屏。
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# 管理后台（admin.）粘贴：
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# 下载页（download.）粘贴：
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;


# ---------- CC 防护 limit_req（2026-10-01）----------
# 第 1 步（http 层，必须）：宝塔面板 → 软件商店 → Nginx → 「配置修改」，
#   在 http { ... } 块内（如 server 块之前）加入下面 2 行后保存重载：
#     limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
#     limit_req_status 429;
# 第 2 步（站点层）：在「书城」「后台」「官网」站点的 /api/（官网为 /api/app/）location 里、
#   以及「下载页」站点的 location / 里，各加 1 行：
#     limit_req zone=api_limit burst=60 nodelay;
# 说明：每 IP 10 req/s、burst 20 突发，超限 429。App 正常使用远低于阈值不受影响。
# 注意：zone 定义只加一次（http 层重复定义会报 duplicate zone 错误）。


# ---------- 强制 HTTPS（2026-10-01）----------
# 方法一（推荐）：宝塔各站点 → SSL → 开启「强制 HTTPS」开关即可，效果等同方法二。
# 方法二（手改）：在各站点配置文件的 server 层加：
#     if ($scheme = http) { return 301 https://$host$request_uri; }
# ⚠ 前提：该站点 443 证书已就绪，否则开启后 http 流量会 301 到打不开的 https。
# 官网站点特殊：还监听 8089 供直接 IP 访问，若需保留 http 直连，改用按域名跳转——
#     if ($host = xn--1jq441m6jgqa.xyz)     { return 301 https://$host$request_uri; }
#     if ($host = www.xn--1jq441m6jgqa.xyz) { return 301 https://$host$request_uri; }
# （xn--1jq441m6jgqa.xyz 即 书阁阅读.xyz 的 Punycode）


# ---------- HTTPS 说明 ----------
# 官网跳转链接已用 https://，各子域需启用 SSL（宝塔站点里「SSL」申请/部署证书即可）。
# 若暂时无证书：把 web/index.html 里的 https:// 全局替换为 http://，上面各站点去掉 SSL 即可。
