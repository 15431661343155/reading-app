server
{
    charset utf-8;
    listen 80 default_server;
    listen 443 ssl default_server;
    listen 443 quic;
    http2 on;
    server_name admin.xn--1jq441m6jgqa.xyz;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/app/web/后台;



    include /www/server/panel/vhost/nginx/extension/admin.xn--1jq441m6jgqa.xyz/*.conf;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/admin.xn--1jq441m6jgqa.xyz.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/admin.xn--1jq441m6jgqa.xyz/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/admin.xn--1jq441m6jgqa.xyz/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/admin.xn--1jq441m6jgqa.xyz.conf;
    #REWRITE-END

    # force https (hardening 2026-10-01)
    if ($scheme = http) { return 301 https://$host$request_uri; }

    # security headers (hardening 2026-10-01)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    
    # 后台页面兜底（页面都是真实 .html 文件，此行防止刷新/伪路径 404）
    # HTML_NOCACHE: HTML 禁缓存，页面更新即时生效（配合 js ?v= 版本号）
    location ~* \.html$ { expires -1; }
    location = / { expires -1; }

    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 后端 API：同源反代。端口 = 后端 server.port = 8080
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;  # CC protection
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 书籍封面：后端以 /covers/** 提供（FileUploadConfig 映射到 uploads/covers/），
    # 必须反代到后端。用 ^~ 阻止下方「location ~ \.(jpg|png)$」正则静态块抢走请求，
    # 否则 /covers/xxx.jpg 会被当静态文件处理 → 404（书城封面不显示的根因）。
    location ^~ /covers/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }



    # 用户头像：后端以 /avatars/** 提供（FileUploadConfig 映射到 uploads/avatars/），
    # 必须反代到后端。用 ^~ 阻止下方「location ~ \.(jpg|png)$」正则静态块抢走请求，
    # 否则 /avatars/xxx.png 会被当静态文件处理 -> 404（书城/后台头像不显示的根因）。
    location ^~ /avatars/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/admin.xn--1jq441m6jgqa.xyz.log;
    error_log  /www/wwwlogs/admin.xn--1jq441m6jgqa.xyz.error.log;
}