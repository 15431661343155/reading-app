        if (Math.abs(v) > 0.02 && scrollY > 0 && scrollY < scrollMax) {
            scrollAnimId = requestAnimationFrame(step);
        } else {
            scrollAnimId = 0;
            isAnimating = false;
            notifyJavaPageChange();
        }
    }
    scrollAnimId = requestAnimationFrame(step);
}

/** 向下滚动一屏（点击"下一页"区域 / 自动翻页） */
function scrollNextScreen() {
    if (scrollY >= scrollMax - 0.5) { try { Android.onChapterEnd(); } catch (e) {} return; }
    animateScrollTo(Math.min(scrollMax, scrollY + scrollViewH));
}

/** 向上滚动一屏（点击"上一页"区域 / 自动翻页） */
function scrollPrevScreen() {
    if (scrollY <= 0.5) { try { Android.onChapterStart(); } catch (e) {} return; }
    animateScrollTo(Math.max(0, scrollY - scrollViewH));
}

/** 滚动模式下的"虚拟页码"：以"屏"为单位，使进度条/书签/跳转契约与分页模式一致 */
function virtualTotalPages() {
    if (isHtmlMode()) return htmlTotalPages();
    if (isScrollMode()) return Math.max(1, Math.ceil((scrollContentHeight || scrollViewH || 1) / (scrollViewH || 1)));
    return pages.length;
}
function virtualCurrentPage() {
    if (isHtmlMode()) return htmlCurrentPage() + 1;   // htmlCurrentPage 从 0 计，这里统一为从 1 计
    if (isScrollMode()) {
        var total = virtualTotalPages();
        return Math.min(total, Math.floor(scrollY / (scrollViewH || 1)) + 1);
    }
    return currentPage + 1;
}

/** 仅重绘当前显示（不改变排版）：滚动模式画长卷，否则画当前分页页 */
function redrawCurrent() {
    if (isScrollMode()) drawScroll();
    else drawPage(currentPage);
}

/** 重排版并立即重绘（字体/字号变化导致内容高度改变时使用） */
function relayoutAndRedraw() {
    if (!currentContent) return;
    if (isScrollMode()) {
        layoutScroll(currentContent, chapterTitle);
        clampScroll();
    } else {
        paginate(currentContent, chapterTitle);
        if (currentPage >= pages.length) currentPage = pages.length - 1;
        if (currentPage < 0) currentPage = 0;
    }
    redrawCurrent();
    notifyJavaPageChange();
}

// ============ 跟手拖拽翻页（覆盖 / 平移 / 上下） ============
// 非仿真模式下手指滑动时，书页实时跟随手指移动（松手前不真正翻页）；
// 松手后按「滑动距离 + 速度」决定翻到目标页还是回弹到当前页。
// 章节边界（首页向前 / 末页向后）没有目标页可渲染，改为橡皮筋阻尼，
// 松手且达到阈值时才请求换章，避免误触跳章。
var swipeEnabled = true;          // 与 Android「滑动翻页」开关同步
var drag = null;                  // 当前触摸/拖拽状态
var dragOldCvs = null;            // 当前页位图
var dragNewCvs = null;            // 目标页位图
var lastDragFinishTs = 0;         // 最近一次拖拽完成翻页的时间（防止与 Android onFling 重复翻页）
var lastDragActivityTs = 0;       // 最近一次拖拽收尾（含回弹）的时间
// ⚠️ 必须大于系统的点击判定阈值（ViewConfiguration touch slop = 8dp，CSS px 与 dp 等价）：
// 否则一次「点击」只要手指漂几像素就会进入跟手拖拽，既吞掉 Android 端的点击翻页，
// 还可能因为瞬时速度被算成甩动而翻到反方向的页。
var DRAG_SLOP = 16;               // 判定为拖拽的最小位移（CSS px）
var DRAG_COMMIT_RATIO = 0.2;      // 松手完成翻页所需的最小滑动比例
var DRAG_BOUNDARY_RATIO = 0.2;    // 章节边界触发换章的最小滑动比例
var DRAG_FLICK_MIN_RATIO = 0.08;  // 按速度判定甩动时的最小滑动比例（防点击抖动误翻）
var DRAG_COMMIT_VELOCITY = 0.45;  // px/ms：快速甩动时降低距离要求
var DRAG_EDGE_SHADOW = 30;        // 页边投影宽度（CSS px）

var touchStartX = 0;

/** Android「滑动翻页」开关同步 */
function setSwipeEnabled(enabled) {
    swipeEnabled = !!enabled;
    if (!swipeEnabled && drag && drag.active) finishDrag(drag, false);
}

/** 支持跟手翻页（分页动画）的模式；'updown' 已改为滚动模式，'none' / 'fade' / 'simulation' 走各自逻辑 */
function dragMode() {
    return (pageTurnMode === 'cover' || pageTurnMode === 'slide') ? pageTurnMode : null;
}

/** 复制当前画布内容到离屏 canvas（作为拖拽中的「当前页」位图） */
function copyCanvasTo(cvs) {
    if (!cvs) cvs = document.createElement('canvas');
    if (cvs.width !== canvas.width || cvs.height !== canvas.height) {
        cvs.width = canvas.width;
        cvs.height = canvas.height;
    }
    var c = cvs.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, cvs.width, cvs.height);
    c.drawImage(canvas, 0, 0);
    return cvs;
}

/** 把指定页渲染到离屏 canvas（直接复用 drawPage，省去 getImageData 的开销） */
function renderPageTo(cvs, pageIndex) {
    if (!cvs) cvs = document.createElement('canvas');
    if (cvs.width !== canvas.width || cvs.height !== canvas.height) {
        cvs.width = canvas.width;
        cvs.height = canvas.height;
    }
    var octx = cvs.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.scale(dpr, dpr);
    var mainCtx = ctx;
    ctx = octx;
    try {
        drawPage(pageIndex);
    } finally {
        ctx = mainCtx;
    }
    return cvs;
}

/** 把邻章分页结果的指定页渲染到离屏 canvas：临时交换全局 pages/chapterTitle 复用 drawPage
 *  （drawPage 页码用 pageIndex 参数、页眉读 chapterTitle，均不读 currentPage，交换面最小） */
function renderAdjacentPageTo(cvs, xt, pageIdx) {
    if (!cvs) cvs = document.createElement('canvas');
    if (cvs.width !== canvas.width || cvs.height !== canvas.height) {
        cvs.width = canvas.width;
        cvs.height = canvas.height;
    }
    var octx = cvs.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.scale(dpr, dpr);
    var mainCtx = ctx;
    var sPages = pages, sTitle = chapterTitle;
    ctx = octx;
    pages = xt.pages;
    chapterTitle = xt.title;
    try {
        drawPage(pageIdx);
    } finally {
        ctx = mainCtx;
        pages = sPages;
        chapterTitle = sTitle;
    }
    return cvs;
}

/** 开始拖拽：确定方向与是否有目标页，并预渲染两页位图 */
function beginDrag(d, dir) {
    var target = currentPage + dir;
    var valid = target >= 0 && target < pages.length;
    d.active = true;
    d.dir = dir;
    d.target = target;
    d.boundary = !valid;
    d.crossChapter = null;
    isAnimating = true;                 // 拖拽期间屏蔽外部翻页（音量键 / 进度条 / 自动翻页）
    dragOldCvs = copyCanvasTo(dragOldCvs);
    if (valid) {
        dragNewCvs = renderPageTo(dragNewCvs, target);
    } else {
        // ✅ 邻章已预加载：拖拽直接跟手展示邻章目标页（与普通跨页拖拽观感一致），不再做橡皮筋
        var xt = tryFetchAdjacentChapter(dir);
        if (xt) {
            d.crossChapter = xt;
            d.boundary = false;
            d.target = dir > 0 ? 0 : xt.pages.length - 1;
            dragNewCvs = renderAdjacentPageTo(dragNewCvs, xt, d.target);
        } else {
            dragNewCvs = null;
        }
    }
    if (animWatchdog) { clearTimeout(animWatchdog); animWatchdog = null; }
}

/** 按当前进度绘制拖拽帧（p：0=当前页，1=目标页） */
function dragDraw(d, p) {
    var CW = canvas.width, CH = canvas.height;
    var dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    // ---- 章节边界：当前页带阻尼位移，露出背景 ----
    if (d.boundary) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, CW, CH);
        if (bgTextureImg && bgTextureImg.complete) {
            ctx.drawImage(bgTextureImg, 0, 0, CW, CH);
        }
        var bOff = (d.vertical ? CH : CW) * p * (d.dir > 0 ? -1 : 1);
        if (d.vertical) ctx.drawImage(dragOldCvs, 0, bOff);
        else ctx.drawImage(dragOldCvs, bOff, 0);
        return;
    }

    if (d.mode === 'slide') {
        // ---- 平移：旧页滑出 + 新页滑入 ----
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, CW, CH);
        var sOld = d.dir > 0 ? -CW * p : CW * p;
        var sNew = d.dir > 0 ? CW * (1 - p) : -CW * (1 - p);
        ctx.drawImage(dragOldCvs, sOld, 0);
        ctx.drawImage(dragNewCvs, sNew, 0);
        return;
    }

    if (d.mode === 'updown') {
        // ---- 上下：旧页上/下移出 + 新页移入 ----
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, CW, CH);
        var uOld = d.dir > 0 ? -CH * p : CH * p;
        var uNew = d.dir > 0 ? CH * (1 - p) : -CH * (1 - p);
        ctx.drawImage(dragOldCvs, 0, uOld);
        ctx.drawImage(dragNewCvs, 0, uNew);
        return;
    }

    // ---- 覆盖：两个方向观感不同（刻意不对称，两个方向都跟手）----
    //   dir>0（手指左滑 / 下一页）：当前页在上层跟手左移 → 露出底层的下一页
    //   dir<0（手指右滑 / 上一页）：上一页在上层从左滑入 → 覆盖住当前页
    var topCvs, bottomCvs, topX;
    if (d.dir > 0) {
        bottomCvs = dragNewCvs; topCvs = dragOldCvs; topX = -CW * p;
    } else {
        bottomCvs = dragOldCvs; topCvs = dragNewCvs; topX = -CW * (1 - p);
    }
    ctx.drawImage(bottomCvs, 0, 0);            // 底层：静止的那页
    // 上层页的右边缘掠过下层页，在其右侧投阴影
    var shW = DRAG_EDGE_SHADOW * dpr;
    var edge = topX + CW;
    if (edge > 0 && edge < CW) {
        var l = Math.max(0, edge), r = Math.min(CW, edge + shW);
        if (r > l) {
            var g = ctx.createLinearGradient(l, 0, r, 0);
            g.addColorStop(0, 'rgba(0,0,0,0.28)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(l, 0, r - l, CH);
        }
    }
    ctx.drawImage(topCvs, topX, 0);            // 上层：移动的那页
    // 纸张边缘高光：上层页右边缘的那条纸边
    var hlW = Math.max(1, 2 * dpr);
    var ha = Math.max(0, edge - hlW), hb = Math.min(CW, edge);
    if (hb > ha) {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(ha, 0, hb - ha, CH);
    }
}

/** 松手收尾：commit=true 翻到目标页（边界则请求换章），false 回弹 */
function finishDrag(d, commit) {
    if (!d || !d.active) return;
    d.active = false;
    lastDragActivityTs = Date.now();
    var from = d.progress;
    var to = (commit && !d.boundary) ? 1 : 0;
    var dur = Math.max(90, Math.round(ANIM_DURATION * Math.abs(to - from)));
    var startTime = null;
    isAnimating = true;
    if (animWatchdog) clearTimeout(animWatchdog);
    animWatchdog = setTimeout(function () {
        if (!isAnimating) return;
        isAnimating = false;
        var dpr = window.devicePixelRatio || 1;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        drawPage(currentPage);
        if (drag === d) drag = null;
    }, 2000);

    function step(ts) {
        if (!startTime) startTime = ts;
        var t = Math.min((ts - startTime) / dur, 1);
        var e = 1 - Math.pow(1 - t, 3);
        dragDraw(d, from + (to - from) * e);
        if (t < 1) { requestAnimationFrame(step); return; }
        if (animWatchdog) { clearTimeout(animWatchdog); animWatchdog = null; }
        var dpr = window.devicePixelRatio || 1;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        if (commit && !d.boundary) {
            if (d.crossChapter) {
                // ✅ 跨章跟手拖拽落地：切换全局分页到邻章，再通知 Java 真正换章。
                //    Java 回送的 loadContent 用同一算法重排 → 与当前画面一致，零跳变。
                //    页码上报由 _suppressPageNotify 抑制到 loadContent 到达为止。
                swapToAdjacentChapter(d.crossChapter);
                currentPage = d.target;
                lastDragFinishTs = Date.now();
                drawPage(currentPage);
                isAnimating = false;
                if (drag === d) drag = null;
                try { if (d.dir > 0) Android.onChapterEnd(); else Android.onChapterStart(); } catch (ee) {}
                return;
            }
            currentPage = d.target;
            lastDragFinishTs = Date.now();
            drawPage(currentPage);
            notifyJavaPageChange();
        } else {
            drawPage(currentPage);
            if (commit && d.boundary) {
                try { if (d.dir > 0) Android.onChapterEnd(); else Android.onChapterStart(); } catch (ee) {}
            }
        }
        isAnimating = false;
        if (drag === d) drag = null;
    }
    requestAnimationFrame(step);
}

canvas.addEventListener('touchstart', function (e) {
    if (simulationActive) return;
    var t = e.touches && e.touches[0];
    if (!t) return;
    touchStartX = t.clientX;
    // 连续滚动模式：手势交给滚动逻辑（上下拖拽即滚动）
    if (isScrollMode()) { beginScrollTouch(t); return; }
    console.log('DBG touchstart: anim=' + isAnimating + ' pages=' + (pages?pages.length:0) + ' dragMode=' + dragMode() + ' swipe=' + swipeEnabled);
    if (isAnimating || !pages.length || !dragMode() || !swipeEnabled) { console.log('DBG touchstart BLOCKED'); drag = null; return; }
    drag = {
        mode: pageTurnMode,
        vertical: pageTurnMode === 'updown',
        start: pageTurnMode === 'updown' ? t.clientY : t.clientX,
        cross: pageTurnMode === 'updown' ? t.clientX : t.clientY,
        active: false, dir: 0, target: -1, boundary: false,
        progress: 0, raw: 0, lastMagn: 0, lastTs: Date.now(), velocity: 0
    };
}, { passive: true });

canvas.addEventListener('touchmove', function (e) {
    if (simulationActive) return;
    // 连续滚动模式：直接处理滚动拖拽
    if (isScrollMode()) { handleScrollTouchMove(e); return; }
    if (!drag) return;
    var t = e.touches && e.touches[0];
    if (!t) return;
    var pos = drag.vertical ? t.clientY : t.clientX;
    var cross = drag.vertical ? t.clientX : t.clientY;
    var delta = pos - drag.start;

    if (!drag.active) {
        // 方向判定：沿翻页轴的位移需明显大于另一根轴的位移
        if (Math.abs(delta) < DRAG_SLOP || Math.abs(delta) <= Math.abs(cross - drag.cross)) return;
        if (isAnimating || !pages.length || !dragMode() || !swipeEnabled) { drag = null; return; }
        beginDrag(drag, delta < 0 ? 1 : -1);
    }

    var size = drag.vertical ? window.innerHeight : window.innerWidth;
    var magn = -delta * drag.dir;   // 沿翻页方向的有效位移（>0 表示继续朝目标页方向）
    var raw = Math.max(0, Math.min(1, magn / size));
    drag.raw = raw;
    // 章节边界没有目标页，做橡皮筋阻尼，最多露出 12%
    drag.progress = drag.boundary ? Math.min(raw * 0.35, 0.12) : raw;

    var now = Date.now();
    var dt = now - drag.lastTs;
    if (dt > 0) {
        var v = (magn - drag.lastMagn) / dt;
        drag.velocity = drag.velocity * 0.5 + v * 0.5;
        drag.lastMagn = magn;
        drag.lastTs = now;
    }
    dragDraw(drag, drag.progress);
    e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', function (e) {
    if (simulationActive) return;
    // 连续滚动模式：交给滚动收尾（惯性 / 越界换章）
    if (isScrollMode()) { handleScrollTouchEnd(e); return; }
    var d = drag;
    drag = null;
    var ct = e.changedTouches && e.changedTouches[0];
    if (!d || !d.active) {
        // 未形成跟手拖拽（不支持的模式 / 位移过小 / 方向不符）：沿用简单滑动判定
        // 注意要尊重「滑动翻页」开关，否则关闭开关后仍能滑动翻页
        console.log('DBG touchend simple: anim=' + isAnimating + ' swipe=' + swipeEnabled + ' ct=' + (ct?ct.clientX:'null') + ' startX=' + touchStartX);
        if (isAnimating || !ct || !swipeEnabled) return;
        var dx = ct.clientX - touchStartX;
        if (dx < -50) { console.log('DBG touchend -> nextPage'); nextPage(); }
        else if (dx > 50) { console.log('DBG touchend -> prevPage'); prevPage(); }
        return;
    }
    var commit;
    if (d.boundary) {
        commit = d.raw >= DRAG_BOUNDARY_RATIO ||
                 (d.velocity >= DRAG_COMMIT_VELOCITY && d.raw >= DRAG_FLICK_MIN_RATIO);
    } else {
        commit = d.raw >= DRAG_COMMIT_RATIO ||
                 (d.velocity >= DRAG_COMMIT_VELOCITY && d.raw >= DRAG_FLICK_MIN_RATIO);
    }
    finishDrag(d, commit);
}, { passive: true });

canvas.addEventListener('touchcancel', function () {
    if (isScrollMode()) {
        if (scrollTouch) { scrollTouch = null; clampScroll(); drawScroll(); }
        return;
    }
    var d = drag;
    drag = null;
    if (d && d.active) finishDrag(d, false);
}, { passive: true });

// ============ 仿真翻页模式：章节边界翻章检测 ============
// ✅ 复用池修复：仿真模式下 canvas 触摸处理被禁用（simulationActive 时直接 return），
//    而 turn.js 在末页/首页无法翻页时没有任何「越界即换章」回调，导致 onChapterEnd/onChapterStart 永不触发，
//    表现为「最后一页翻页无法进入下一章」。
// 早期曾在 flipbookContainer 上补充滑动检测，但 turn.js 在 flipbook 上 stopPropagation 阻断了冒泡，
//    祖先节点的监听永远收不到事件（死代码）。故改在 document 级仿真触摸处理（capture 阶段，必然先到达）
//    的「滑动收尾」分支里统一处理：仅在「已在首页/末页且向边界外横向滑动」时触发换章，普通翻页仍交给 turn.js。

/**
 * Android 端 GestureDetector 的 onFling 统一交给前端决策：
 * 跟手拖拽会自行在 touchend 收尾，这里直接忽略，避免一次滑动翻两页。
 * 连续滚动模式下完全由前端 touch 处理（含惯性），此处直接消费，避免重复滚动。
 */
function onAndroidFling(deltaX) {
    if (isScrollMode()) return true;   // 滚动模式下滚动由前端处理
    if (!swipeEnabled) return true;
    if (drag && drag.active) return true;                    // 拖拽收尾会处理
    if (isAnimating) return true;                            // 已有动画在进行
    // 拖拽刚刚收尾（翻页或回弹）：无论事件先后顺序都不再重复翻页
    if (Date.now() - lastDragActivityTs < 400) return true;
    if (Date.now() - lastDragFinishTs < 400) return true;
    if (typeof deltaX !== 'number' || deltaX === 0) return true;
    if (deltaX < 0) nextPage();
    else prevPage();
    return true;
}

// ============ 连续滚动模式：手势处理 ============
/** 开始一次滚动触摸：取消惯性动画，记录起点 */
function beginScrollTouch(t) {
    if (!scrollLines || !scrollLines.length) { scrollTouch = null; return; }
    cancelScrollAnim();
    isAnimating = false;
    scrollTouch = {
        startY: t.clientY,
        startScrollY: scrollY,
        lastTs: Date.now(),
        velocity: 0,   // d(scrollY)/dt，px/ms（正=向上滚/内容下移）
        rawOver: 0,    // 越过边界的「原始」拖拽量（未阻尼），用于松手判定是否换章
        moved: false
    };
}

/** 滚动拖拽过程：根据手指位移实时更新 scrollY（带越界阻尼） */
function handleScrollTouchMove(e) {
    var t = e.touches && e.touches[0];
    if (!t || !scrollTouch) return;
    var dy = t.clientY - scrollTouch.startY;       // 手指向下移 → dy>0
    var rawNew = scrollTouch.startScrollY - dy;     // 手指上移 → scrollY 增大（看后面内容）

    // 记录越过边界的原始拖拽量（未阻尼）——松手时据此判定是否换章
    var rawOver = 0;
    if (rawNew < 0) rawOver = -rawNew;
    else if (rawNew > scrollMax) rawOver = rawNew - scrollMax;
    if (rawOver > scrollTouch.rawOver) scrollTouch.rawOver = rawOver;

    // 显示用阻尼位移：超过顶部/底部时按比例缩小，产生"拉扯感"
    var newScrollY = rawNew;
    if (rawNew < 0) newScrollY = -applyDamping(-rawNew);
    else if (rawNew > scrollMax) newScrollY = scrollMax + applyDamping(rawNew - scrollMax);

    var now = Date.now();
    var dt = now - scrollTouch.lastTs;
    if (dt > 0) {
        var v = (newScrollY - scrollY) / dt;
        scrollTouch.velocity = scrollTouch.velocity * 0.7 + v * 0.3;
    }
    scrollTouch.lastTs = now;
    if (Math.abs(dy) > 4) scrollTouch.moved = true;
    scrollY = newScrollY;
    drawScroll();
    if (e.cancelable) e.preventDefault();
}

/** 滚动松手：越界 → 回弹或换章；否则按速度惯性滑行 */
function handleScrollTouchEnd(e) {
    var st = scrollTouch;
    scrollTouch = null;
    if (!st) return;

    // 顶部越界：拖过顶部后松手
    if (scrollY < 0) {
        if (st.rawOver > scrollViewH * 0.12 || st.velocity < -0.5) {
            animateScrollTo(0, { onDone: function () { try { Android.onChapterStart(); } catch (e) {} } });
        } else {
            animateScrollTo(0);
        }
        return;
    }
    // 底部越界：拖过底部后松手
    if (scrollY > scrollMax) {
        if (st.rawOver > scrollViewH * 0.12 || st.velocity > 0.5) {
            animateScrollTo(scrollMax, { onDone: function () { try { Android.onChapterEnd(); } catch (e) {} } });
        } else {
            animateScrollTo(scrollMax);
        }
        return;
    }
    // 惯性滚动（甩动）
    if (st.moved && Math.abs(st.velocity) > 0.05) {
        startMomentum(st.velocity);
    } else {
        notifyJavaPageChange();
    }
}

// ============ Java 调用接口 ============
// ✅ 复用池 WebView 关键修复：reader.html 由池子只 loadUrl 一次（首次加载时 WebView 尚未 attach，
//    window.innerWidth/innerHeight=0）。后续 attach 到布局后，JS 视口宽高滞后于原生布局——
//    若此时恰好执行 loadContent，会在 0 宽下分页/绘制：画布 0 尺寸→整页空白，且上报给 Java 的
//    总页数是畸形值，表现为「翻不了页 / 恢复不到页」。故尺寸未就绪时先把渲染意图存起来，
//    等下一帧 / resize 回调拿到真实尺寸后再真正排版绘制。
function loadContent(chapterIndex, title, content, startPage, isLocal, progress, cachedPagesJson, cacheKey) {
    // ✅ 跨章临时 flipbook 在途时延迟应用：快速折返场景下，上一跨的 loadContent 可能迟到，
    //    此刻无条件 initSimulation 会摧毁在途 flipbook，turn.js 内部状态机崩溃
    //    （Uncaught TypeError: reading 'data'），事件链断裂、页码上报丢失（真机实测踩中）。
    //    延迟到落地后再执行；多次排队时最后一次生效（每次都是完整重渲染，幂等）。
    if (_xCrossFlipping) {
        var _xlArgs = Array.prototype.slice.call(arguments);
        setTimeout(function () { loadContent.apply(null, _xlArgs); }, 120);
        return;
    }
    // ✅ 跨章过渡窗口（三旗标任一在：卷页在途/跨章繁忙/页码上报抑制）内的 loadContent 若目标章
    //    与 JS 当前位置不一致，说明它是「用户已折返/又跨了一章」后迟到的过时回送——执行它会把
    //    用户拉回刚离开的章（「跳回未翻之前的页」）。丢弃之，并调 onChapterResync 让 Java 把索引
    //    同步到 JS 实际位置、按正确落点页重发，两端重新对齐。
    //    ⚠️ 判据必须含 _suppressPageNotify：落地即清 _xTurnBusy 后，迟到的 loadContent 仍会在
    //    抑制窗口内到达（实测被拉回刚离开的章）。窗口外（开书/目录跳章）不校验——那时 JS 索引
    //    本就靠 loadContent 设置。
    if ((_xTurnBusy || _suppressPageNotify) && typeof chapterIndex === 'number' && chapterIndex !== currentChapterIndex) {
        console.log('loadContent 过时丢弃: 来自章=' + chapterIndex + ' JS当前章=' + currentChapterIndex);
        try {
            if (typeof Android !== 'undefined' && Android && Android.onChapterResync) {
                Android.onChapterResync(currentChapterIndex, currentPage === pages.length - 1);
            }
        } catch (_e) {}
        return;
    }
    _boundaryPending = false;
    // ✅ 跨章无缝翻页：Java 侧正式 loadContent 到达 → 过渡窗口结束，恢复页码上报、解除跨章繁忙
    _suppressPageNotify = false;
    _xTurnBusy = false;
    currentChapterIndex = chapterIndex;
    chapterTitle = title;
    currentContent = preprocessContent(content);

    // ✅ 排版缓存恢复：若 Java 侧命中了「上次退出本章时的排版」（layout signature 一致），
    //    直接载入已分页的 pages，跳过整章重新分页 —— 这正是「进入书籍不再每次重排」的关键。
    //    cachedPagesJson = "{pages:[...],offsets:[...]}" 的 JSON；cacheKey 由 Java 计算并回传。
    //    占位内容 / HTML 富文本模式 下 Java 不会传 cacheKey，故此处不会误恢复。
    var _restoreOk = false;
    if (typeof cachedPagesJson !== 'undefined' && cachedPagesJson && cachedPagesJson.length > 1) {
        try {
            var _cp = JSON.parse(cachedPagesJson);
            if (_cp && _cp.pages && _cp.offsets) {
                pages = _cp.pages;
                pageStartOffsets = _cp.offsets;
                pagesRestoredFromCache = true;
                _restoreOk = true;
                // ✅ 记录分页时的视口尺寸（旧版缓存无 vw/vh 字段 → 0，恢复时校验不过会重排一次并回写新格式）
                _cachedLayoutViewport = { w: (_cp.vw | 0), h: (_cp.vh | 0) };
            }
        } catch (_e) { pagesRestoredFromCache = false; }
    }

    // ✅ 退出 HTML 富文本模式：还原被 loadHtmlContent 隐藏的 Canvas / 仿真层
    //    否则上一章是 EPUB HTML 时，本页纯文本会绘制在隐藏层之下被遮挡
    htmlMode = false;
    var _hc = document.getElementById('htmlContent');
    if (_hc) {
        _hc.style.display = 'none';
        _hc.classList.remove('scroll-flow');
        _hc.scrollTop = 0;
        clearFullscreenBackground(_hc);   // 长章底图是画在视口层上的，退章必须擦掉
    }
    // 清空分栏容器：释放上一章 DOM（EPUB 常带内联 base64 图片，占内存可观）
    var _hcols = document.getElementById('htmlColumns');
    if (_hcols) {
        htmlResetTurnLayer();   // 快照/仿真书本挂在同一个视口层里，退 HTML 模式一并拆掉
        _hcols.style.transform = '';
        _hcols.style.columnWidth = '';
        _hcols.style.columnGap = '';
        _hcols.innerHTML = '';
    }
    if (canvas) { canvas.style.display = ''; canvas.style.visibility = 'visible'; }
    var _fb = document.getElementById('flipbookContainer');
    if (_fb) _fb.style.display = '';   // 仿真模式由 initSimulation 重新显示

    // 接收本地书标志和阅读进度
    if (typeof isLocal !== 'undefined') {
        isLocalBook = isLocal;
    }
    if (typeof progress !== 'undefined') {
        bookProgress = progress;
    }

    console.log('loadContent 接收内容长度: ' + content.length);

    // ✅ 尺寸就绪前：缓存渲染意图，延迟到真实视口尺寸就绪后再绘制（避免 0 宽导致空白/畸形分页）
    if (window.innerWidth <= 0 || window.innerHeight <= 0) {
        _pendingLoad = {
            chapterIndex: chapterIndex, title: title, content: currentContent,
            startPage: startPage, isLocal: isLocal, progress: progress,
            cacheKey: cacheKey, restoreOk: _restoreOk
        };
        _scheduleLayoutRender();
        return;
    }
    _finishLoadContent({ startPage: startPage, cacheKey: cacheKey, restoreOk: _restoreOk });
}

/** 等待视口尺寸就绪后再执行真实渲染；尺寸就绪前用 rAF 轮询，不依赖 resize 事件是否准时触发 */
function _scheduleLayoutRender() {
    if (window.innerWidth > 0 && window.innerHeight > 0) {
        if (_pendingLoad) { var p = _pendingLoad; _pendingLoad = null; _finishLoadContent(p); }
    } else {
        if (typeof requestAnimationFrame === 'function') requestAnimationFrame(_scheduleLayoutRender);
        else setTimeout(_scheduleLayoutRender, 16);
    }
}

/** loadContent 的「尺寸就绪后」渲染逻辑：仅在 window.innerWidth/innerHeight 有效时调用 */
function _finishLoadContent(p) {
    var startPage = p.startPage, _restoreOk = p.restoreOk, cacheKey = p.cacheKey;
    // ✅ 排版缓存视口一致性校验：缓存 pages 是按「分页那一刻的视口尺寸」固化的一维行高布局。
    //    若当前视口与分页时不同（跨 Activity 复用 WebView 时 JS 视口值更新滞后 / 键盘或系统栏 insets
    //    变化 / 旧版缓存没有 vw/vh），直接恢复会因 drawPage 的底部越界跳行逻辑被整段砍掉若干行，
    //    表现为「正文底部空余过大、少显示好几行」。校验不过 → 丢弃缓存走重新分页，
    //    并把 _restoreOk 置 false 使重排结果按新格式回写缓存（旧脏缓存自动自愈）。
    if (pagesRestoredFromCache) {
        var _vpOk = _cachedLayoutViewport
                && _cachedLayoutViewport.w === window.innerWidth
                && _cachedLayoutViewport.h === window.innerHeight;
        if (!_vpOk) {
            pagesRestoredFromCache = false;
            _restoreOk = false;
        }
        _cachedLayoutViewport = null;
    }
    resizeCanvas();

    if (isScrollMode()) {
        // 滚动模式：resizeCanvas 已重排为长卷；按 startPage 还原阅读位置（以"屏"为单位）
        var totalScreens = virtualTotalPages();
        if (startPage === -1) {
            scrollY = scrollMax;                     // 跳到本章末尾
        } else if (typeof startPage === 'number' && startPage > 0 && startPage <= totalScreens) {
            scrollY = (startPage - 1) * (scrollViewH || window.innerHeight);
        } else {
            scrollY = 0;
        }
        clampScroll();
        drawScroll();
    } else {
        if (startPage === -1 && pages.length > 0) {
            currentPage = pages.length - 1;
        } else if (typeof startPage === 'number' && startPage > 0 && startPage <= pages.length) {
            currentPage = startPage - 1;
        } else {
            currentPage = 0;
        }
        // ✅ 关键修复（覆盖全部主题模式）：从排版缓存恢复章节时，pages 携带「上次分页时固化的文字色/背景」，
        //    与当前主题（夜间 / 日间纯色 / 护眼绿 / 羊皮纸 / 纹理）不符，会导致正文消失或颜色错乱。
        //    此处用当前主题的色值重新对齐缓存页：夜间走 setNightMode(true)，其余走 setTextColor/setBackgroundColor
        //    （setNightMode/setTextColor 会遍历 pages 改 color 并重绘，与阅读中切换主题的行为一致）；
        //    纹理模式额外用 _pendingTexture 重新拉起纹理。覆盖「WebView 宽度就绪晚于 loadContent」的重进路径；
        //    宽度就绪早于 loadContent 的路径由 ReadActivity.renderChapterContent 在 loadContent 之后调用
        //    applySettingsToWebView_inner() 覆盖。
        if (pagesRestoredFromCache) {
            if (isNightMode) {
                setNightMode(true);
            } else {
                setTextColor(textColor);
                setBackgroundColor(bgColor);
                if (typeof _pendingTexture !== 'undefined' && _pendingTexture) {
                    setBackgroundTexture(_pendingTexture);
                }
            }
        }

        console.log('reader.html 开始绘制第 ' + (currentPage + 1) + ' 页');

        // ✅ 仿真模式：跳过 canvas 直接渲染为翻页页（canvas 已隐藏）
        // 非仿真模式：正常绘制到 canvas
        if (pageTurnMode === 'simulation') {
            initSimulation();
        } else {
            drawPage(currentPage);
            // 如果之前处于仿真占位模式，现在切换到非仿真需清理
            if (_simulationPlaceholderActive || simulationActive) {
                destroySimulation();
            }
        }
    }

    // ✅ 排版缓存回写：本次是「纯文本 + 非滚动模式 + 真正重新分页」且 cacheKey 有效时，
    //    把分页结果交给 Java 落盘，下次进入本书同章同排版即可跳过重新分页。
    //    占位内容 / 滚动模式(updown) / 已从缓存恢复(_restoreOk) 时不回写。
    //    ✅ 回写带上分页时刻的视口 vw/vh，恢复时据此校验视口一致性（防跨会话尺寸错位 → 底部跳行）。
    if (!_restoreOk && !isScrollMode()
            && typeof cacheKey !== 'undefined' && cacheKey && cacheKey.length > 0
            && typeof Android !== 'undefined' && Android && Android.cacheChapterLayout) {
        try { Android.cacheChapterLayout(cacheKey, JSON.stringify({pages: pages, offsets: pageStartOffsets, vw: window.innerWidth, vh: window.innerHeight})); } catch (_e2) {}
    }

    notifyJavaPageChange();
    console.log('DBG loadContent end: startPage=' + startPage + ' pages=' + pages.length + ' currentPage=' + currentPage + ' scroll=' + isScrollMode() + ' sim=' + simulationActive);
}

// ============ 内容预处理 ============
function preprocessContent(text) {
    if (!text) return '';
    // 将 <br>, <br/>, <p>, </p>, <div>, </div> 等转为换行
    text = text.replace(/<br\s*\/?>/gi, '\n');
    text = text.replace(/<\/p>/gi, '\n');
    text = text.replace(/<p[^>]*>/gi, '');
    text = text.replace(/<\/div>/gi, '\n');
    text = text.replace(/<div[^>]*>/gi, '');
    // 去除其余 HTML 标签
    text = text.replace(/<[^>]+>/g, '');
    // 解码常见 HTML 实体
    text = text.replace(/&nbsp;/g, ' ');
    text = text.replace(/&lt;/g, '<');
    text = text.replace(/&gt;/g, '>');
    text = text.replace(/&amp;/g, '&');
    text = text.replace(/&quot;/g, '"');
    text = text.replace(/&#39;/g, "'");
    // 统一换行符
    text = text.replace(/\r\n/g, '\n');
    text = text.replace(/\r/g, '\n');
    // 合并连续空行（超过2个空行压缩为2个）
    text = text.replace(/\n{3,}/g, '\n\n');
    return text;
}

// ============ HTML 富文本渲染模式（保留 EPUB 样式） ============
// 仅当章节携带 HTML 内容（loadHtmlContent）时启用；普通纯文本仍走 Canvas 路径。
// 分页方式与多看 / Readium / epub.js 一致：用 CSS 多列（column-width）把正文横向排成 N 列，
// "一列 = 一页"，翻页 = 整组平移（translateX）。这样 HTML 模式的"页"与 Canvas 引擎的"页"
// 语义统一，goToPage / nextPage / prevPage / virtualTotalPages / virtualCurrentPage 可直接复用。
// pageTurnMode === 'updown' 时切换为单列连续滚动（scrolled），即改造前的行为。
var htmlMode = false;
var htmlFlow = 'paginated';   // 'paginated'（横向分栏翻页）| 'scrolled'（上下滚动）
var htmlPage = 0;             // 当前页（0 起）
var htmlPageCount = 1;        // 本章总页数
var htmlColW = 0;             // 单列宽（= 一页正文宽）
var htmlGap = 0;              // 列间距
var htmlStep = 0;             // 每页平移距离 = 列宽 + 列间距
var htmlClientH = 0;          // 视口高度（缓存）

function isHtmlMode() { return htmlMode; }

// 把当前主题（背景/文字色/字号/字体）应用到 HTML 容器，保持与 Canvas 模式视觉一致。
// keepPosition !== false 时，重排后按原进度比例还原位置（改字号 / 切模式不该跳回开头）。
function applyHtmlTheme(keepPosition) {
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols) return;
    c.classList.toggle('html-night', !!isNightMode);   // 全面屏页的夜间暗纱/文字提亮靠它
    c.style.backgroundColor = bgColor;
    c.style.color = textColor;
    cols.style.fontSize = fontSize + 'px';
    cols.style.lineHeight = lineHeightRatio;
    cols.style.fontFamily = fontFamily;
    applyHtmlFlow(keepPosition !== false);
}

// 记录当前章内进度（0~1），用于重排后按比例还原阅读位置
function htmlPositionRatio() {
    var c = document.getElementById('htmlContent');
    if (!c) return 0;
    if (htmlFlow === 'scrolled') {
        var max = c.scrollHeight - c.clientHeight;
        return max > 0 ? Math.min(1, Math.max(0, c.scrollTop / max)) : 0;
    }
    return htmlPageCount > 1 ? htmlPage / (htmlPageCount - 1) : 0;
}

// 依据 pageTurnMode 决定分页方式（横向分栏 / 上下滚动），并重新计算列宽与页数。
// keepPosition 为真时按原进度比例还原位置。
function applyHtmlFlow(keepPosition) {
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols || !htmlMode) return;
    // 重排会让既有快照与新的列宽/页边距对不上，先把动画层整个拆掉（分页参数按新尺寸重算）
    htmlResetTurnLayer();
    var ratio = keepPosition ? htmlPositionRatio() : 0;
    var scrolled = (pageTurnMode === 'updown');
    htmlFlow = scrolled ? 'scrolled' : 'paginated';
    cols.style.transform = '';
    if (scrolled) {
        // 单列连续滚动：恢复原生纵向滚动
        c.classList.add('scroll-flow');
        cols.style.columnWidth = '';
        cols.style.columnGap = '';
    } else {
        c.classList.remove('scroll-flow');
    }
    layoutHtmlColumns();
    if (!keepPosition) {
        htmlGoToPage(0);
    } else if (htmlFlow === 'scrolled') {
        var max = c.scrollHeight - c.clientHeight;
        c.scrollTop = Math.max(0, Math.round(ratio * max));
        notifyJavaPageChange();
    } else {
        htmlGoToPage(Math.round(ratio * (htmlPageCount - 1)));
    }
    if (htmlFlow === 'paginated') htmlInitSim();
    updateHtmlHeaderFooter();
}

// 计算页边距 / 列宽 / 列间距，并重新测量总页数（不改动当前位置）。
// 要点：容器宽度 = 视口宽，column-width 也 = 一列正文宽，因此只排得下 1 列；
// 超出列高的内容会横向溢出成"额外列"（正是我们要的多页），由视口 overflow:hidden 裁剪。
function layoutHtmlColumns() {
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols) return;
    var W = c.clientWidth || window.innerWidth || 1;
    // 为页眉页脚预留空间（与 Canvas 模式一致），避免正文被覆盖：
    // 页眉占用 headerFooterFontSize + 10 + 半行；页脚占用 headerFooterFontSize + 12。
    var headerSpace = (showHeaderFooter && chapterTitle) ? (headerFooterFontSize + 10 + Math.floor(fontSize / 2)) : 0;
    var footerSpace = showHeaderFooter ? (headerFooterFontSize + 12) : 0;
    var pgSide = padding;                     // 左右页边距
    var pgTop = topPadding + headerSpace;     // 顶部留白（避开状态栏 / 页眉）+ 页眉高度
    var pgBottom = padding + footerSpace;
    htmlClientH = c.clientHeight || window.innerHeight || 1;
    // 「全面屏」页要分两种：整页就是一张画的章，和「正文很长但 body 挂了张底图（多为纸纹）」的章。
    // 只有前者才把整列收归自己（分页盒内外边距取 0，页边距降为页内 padding），这样背景图按「整屏」
    // cover，用户改页边距 / 开关页眉页脚都不再参与它的几何。
    // 为什么不用负 margin 出血：多列布局按「列内容盒底」折断碎片，负 margin 只挪盒子、不延长碎片，
    // 底部永远留一条 (页边距 + 页脚高) 的空白带（真机实测 48 CSS px）；侧向负 margin 还会把盒子
    // 撑成跨两列，背景图按两倍列宽 cover 缩放后被裁，画面看着就「不对」。
    // 判据用「收归整列之后还剩几页」而不是「普通页边距下剩几页」：卷首画自带 margin-top:50% 之类的
    // 高外框，按普通页边距量会多出 30~50px 的溢出被折成两页，从而被误判成长章节。
    var fs = cols.querySelector('.epub-chapter.epub-fs');
    if (!fs) clearFullscreenBackground(c);
    var side = fs ? 0 : pgSide, top = fs ? 0 : pgTop, bottom = fs ? 0 : pgBottom;
    setPagePadding(cols, side, top, bottom);
    if (fs) applyFullscreenPage(fs, pgTop, pgSide, pgBottom, true);
    if (htmlFlow === 'scrolled') {
        htmlGap = 0;
        htmlStep = 0;
        htmlColW = Math.max(1, W - side * 2);
        var sc = Math.max(1, Math.ceil(c.scrollHeight / htmlClientH));
        if (fs && sc > 1) {
            sc = restorePageMargins(fs, cols, W, pgTop, pgSide, pgBottom, true);
            side = pgSide;
        }
        htmlPageCount = sc;
        return;
    }
    // 列间距 = 屏宽 6%（不小于 16px）：页与页之间留出可见空白
    htmlGap = Math.max(16, Math.round(W * 0.06));
    htmlColW = Math.max(1, W - side * 2);
    cols.style.columnWidth = htmlColW + 'px';
    cols.style.columnGap = htmlGap + 'px';
    htmlStep = htmlColW + htmlGap;
    var count = measureColumnCount(cols, side);
    if (fs && count > 1) restorePageMargins(fs, cols, W, pgTop, pgSide, pgBottom, false);
    htmlPageCount = count;
}

/**
 * 长章节退回普通页边距：撤掉整页画外框，重量分页盒与页数。
 * @return {number} 退回后的页数（滚动模式用；分页模式已就地更新 htmlPageCount）
 */
function restorePageMargins(fs, cols, W, top, side, bottom, scrolled) {
    applyFullscreenPage(fs, top, side, bottom, false);
    setPagePadding(cols, side, top, bottom);
    htmlColW = Math.max(1, W - side * 2);
    if (scrolled) return Math.max(1, Math.ceil(document.getElementById('htmlContent').scrollHeight / htmlClientH));
    cols.style.columnWidth = htmlColW + 'px';
    htmlStep = htmlColW + htmlGap;
    htmlPageCount = measureColumnCount(cols, side);
    return htmlPageCount;
}

/** 分页盒的页边距：同时把「一页正文高」写给插图当高度上限（见 #htmlContent img 的 max-height） */
function setPagePadding(cols, side, top, bottom) {
    cols.style.padding = top + 'px ' + side + 'px ' + bottom + 'px ' + side + 'px';
    cols.style.setProperty('--page-body-h',
            Math.max(1, (document.getElementById('htmlContent').clientHeight || window.innerHeight || 1) - top - bottom) + 'px');
}

/** 由 scrollWidth 反推列数；个别 WebView 内核不算溢出列时改用最后一个子元素的右边界兜底 */
function measureColumnCount(cols, side) {
    var span = cols.scrollWidth - side * 2;
    var count = Math.max(1, Math.round((span + htmlGap) / htmlStep));
    if (count <= 1) {
        var lastRight = htmlLastColumnRight(cols, side);
        if (lastRight > htmlColW) {
            count = Math.max(1, Math.round((lastRight + htmlGap) / htmlStep));
        }
    }
    return count;
}

/**
 * 全面屏页排版。onePage=true 时盒子正好等于一整列（宽 = 视口宽，高 = min-height = 视口高），
 * 背景图因此铺满整屏；高度不超出列内容盒 → 不会被折断到下一列，也就不会留下底部空白带。
 * onePage=false（正文跨多页）时保留正常页边距给文本，底图则交给视口层铺满四周：
 * 碎片盒最多只有一页正文那么大，画在它身上的图必然被页边距内缩，而原书写的是
 * background-attachment: fixed —— 作者要的就是「钉在屏幕上、四周无留白」。
 */
function applyFullscreenPage(fs, top, side, bottom, onePage) {
    var c = document.getElementById('htmlContent');
    if (!onePage) {
        fs.classList.remove('epub-fs-one');
        fs.style.margin = '';
        fs.style.padding = '';
        fs.style.minHeight = '';
        fs.style.backgroundSize = '';
        fs.style.backgroundRepeat = '';
        hoistFullscreenBackground(fs, c);
        return;
    }
    clearFullscreenBackground(c);
    fs.classList.add('epub-fs-one');
    fs.style.margin = '0';
    fs.style.padding = top + 'px ' + side + 'px ' + bottom + 'px ' + side + 'px';
    fs.style.minHeight = htmlClientH + 'px';
    fs.style.backgroundSize = '';
    fs.style.backgroundRepeat = '';
}

// 底图被挪到视口层的那个元素；换章 / 退回整页画模式时按它把内联样式擦干净。
var _fsBleedSource = null;

function hoistFullscreenBackground(fs, c) {
    if (!c || !fs) return;
    var st = getComputedStyle(fs);
    var img = st.backgroundImage;
    if (!img || img === 'none') { clearFullscreenBackground(c); return; }
    // 书中普遍写 cover；没写尺寸的按屏宽屏高铺开，别让原图尺寸决定留白。
    var size = st.backgroundSize;
    c.style.backgroundImage = img;
    c.style.backgroundSize = (!size || size === 'auto auto' || size === 'auto') ? 'cover' : size;
    c.style.backgroundPosition = st.backgroundPosition || 'center';
    c.style.backgroundRepeat = st.backgroundRepeat || 'no-repeat';
    c.classList.add('fs-bleed');
    fs.style.backgroundImage = 'none';
    _fsBleedSource = fs;
}

function clearFullscreenBackground(c) {
    if (_fsBleedSource) {
        _fsBleedSource.style.backgroundImage = '';
        _fsBleedSource = null;
    }
    if (!c) return;
    c.classList.remove('fs-bleed');
    c.style.backgroundImage = '';
    c.style.backgroundSize = '';
    c.style.backgroundPosition = '';
    c.style.backgroundRepeat = '';
}

// 遍历正文的直接子元素，取最靠右的边界（相对第一列左边缘），用于反推总列数
function htmlLastColumnRight(cols, side) {
    // 章内样式是 <style>（display:none，无布局盒），必须按类名取正文容器，不能拿第一个子元素
    var chapter = cols.querySelector('.epub-chapter');
    if (!chapter) return 0;
    var base = cols.getBoundingClientRect().left + side;
    var kids = chapter.children;
    var maxRight = 0;
    for (var i = 0; i < kids.length; i++) {
        var r = kids[i].getBoundingClientRect().right - base;
        if (r > maxRight) maxRight = r;
    }
    return maxRight;
}

function loadHtmlContent(chapterIndex, title, html, startPage, isLocal, progress) {
    _boundaryPending = false;
    _suppressPageNotify = false;
    _xTurnBusy = false;
    currentChapterIndex = chapterIndex;
    chapterTitle = title;
    if (typeof isLocal !== 'undefined') isLocalBook = isLocal;
    if (typeof progress !== 'undefined') bookProgress = progress;

    htmlMode = true;
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols) return;
    htmlPage = 0;
    htmlPageCount = 1;
    // 上一章的快照/仿真书本与新正文的列宽无关，换章第一件事就是拆动画层
    htmlResetTurnLayer();
    cols.style.transform = '';
    // .epub-chapter 包装层由 Java 侧连书中 body 的 class 一起产出（全面屏页要靠那个 class 命中背景图），
    //    这里不再二次包裹；空章兜底一个空容器，保证 .epub-chapter 选择器始终有落点。
    cols.innerHTML = html || '<div class="epub-chapter"></div>';
    c.style.display = 'block';
    c.scrollTop = 0;
    // 隐藏 Canvas / 仿真层，避免拦截触摸与重绘
    if (canvas) canvas.style.display = 'none';
    var fb = document.getElementById('flipbookContainer');
    if (fb) fb.style.display = 'none';
    if (_simulationPlaceholderActive || simulationActive) { try { destroySimulation(); } catch (e) {} }

    applyHtmlTheme(false);   // 先按当前主题落样式（此刻尺寸可能还没稳定）

    // 等一帧让布局生效后再精确测量、定位到 startPage
    requestAnimationFrame(function () {
        applyHtmlTheme(true);
        if (startPage === -1) {
            htmlGoToPage(htmlPageCount - 1);                    // 跳到本章末尾
        } else if (typeof startPage === 'number' && startPage > 0) {
            htmlGoToPage(startPage - 1);
        } else {
            htmlGoToPage(0);
        }
        notifyJavaPageChange();
    });
    console.log('loadHtmlContent 接收 HTML 长度: ' + (html ? html.length : 0) + ' flow=' + htmlFlow);
}

function htmlClientHeight() {
    var c = document.getElementById('htmlContent');
    return (c ? c.clientHeight : 0) || htmlClientH || window.innerHeight || 1;
}
function htmlTotalPages() { return htmlPageCount; }
function htmlCurrentPage() {
    if (htmlFlow === 'scrolled') {
        var c = document.getElementById('htmlContent');
        var h = htmlClientHeight();
        if (!c || h <= 0) return 0;
        return Math.min(htmlPageCount - 1, Math.max(0, Math.floor((c.scrollTop + h / 2) / h)));
    }
    return htmlPage;
}
/**
 * HTML 模式下刷新页眉页脚覆盖层（Canvas 模式由 canvas 自带绘制，这里仅补 HTML 模式）。
 * 页眉：章节标题（左对齐，顶部 topPadding 处）。
 * 页脚：左=电量/时间（可选），右=页码/进度（本地书追加百分比）。
 * 仅在 htmlMode 且 showHeaderFooter 开启时显示；其余情况隐藏。
 */
function updateHtmlHeaderFooter() {
    var hdr = document.getElementById('htmlHeader');
    var ftr = document.getElementById('htmlFooter');
    if (!hdr || !ftr) return;
    if (!htmlMode || !showHeaderFooter) {
        hdr.style.display = 'none';
        ftr.style.display = 'none';
        return;
    }
    // 页眉：章节标题
    if (chapterTitle) {
        hdr.textContent = chapterTitle;
        hdr.style.display = 'block';
        hdr.style.color = headerFooterColor;
        hdr.style.fontSize = headerFooterFontSize + 'px';
        hdr.style.paddingLeft = padding + 'px';
        hdr.style.paddingRight = padding + 'px';
        hdr.style.top = topPadding + 'px';
    } else {
        hdr.style.display = 'none';
    }
    // 页脚：左=电量/时间（可选），右=页码/进度
    var total = virtualTotalPages();
    var cur = virtualCurrentPage();
    var rightText = cur + '/' + total;
    if (isLocalBook && typeof bookProgress !== 'undefined') rightText += ' ' + bookProgress + '%';
    var leftEl = document.getElementById('htmlFooterLeft');
    var rightEl = document.getElementById('htmlFooterRight');
    if (leftEl) {
        if (showBatteryTime && (batteryText || timeText)) {
            leftEl.textContent = (batteryText || '') + (batteryText && timeText ? '  ' : '') + (timeText || '');
            leftEl.style.display = 'inline';
        } else {
            leftEl.textContent = '';
            leftEl.style.display = 'none';
        }
    }
    if (rightEl) {
        rightEl.textContent = rightText;
        rightEl.style.display = 'inline';
    }
    ftr.style.display = 'flex';
    ftr.style.color = headerFooterColor;
    ftr.style.fontSize = headerFooterFontSize + 'px';
    ftr.style.paddingLeft = padding + 'px';
    ftr.style.paddingRight = padding + 'px';
    ftr.style.bottom = '12px';
}
/** 无动画跳转到指定页（0 起） */
function htmlGoToPage(p) {
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols) return;
    if (p < 0) p = 0;
    if (p >= htmlPageCount) p = htmlPageCount - 1;
    if (htmlFlow === 'scrolled') {
        htmlPage = p;
        c.scrollTop = p * htmlClientHeight();
    } else {
        htmlEndTurn(true);            // 在途动画先落地（会把 htmlPage 同步到落点）
        htmlPage = p;
        if (htmlSim) htmlSimGoTo(p);
        else htmlSetStripPage(p);
    }
    notifyJavaPageChange();
    updateHtmlHeaderFooter();
}

// ============ HTML 模式的翻页动画（覆盖 / 平移 / 淡入 / 仿真） ============
// 正文是「一整条多列纸带按页平移」，动画期间连纸带一起搬会把相邻页拖着走，
// 所以覆盖 / 淡入改用「快照页」演：纸带静止当旧页，快照当新页压过来 / 淡进来，
// 收尾时把纸带落到目标页、快照销毁。平移不需要快照（目标页就在纸带的下一列）。
// 见 #htmlTurn 的样式注释：本层压在正文之上、页眉页脚之下，动画期间页眉页脚不闪。

var _htmlTurn = null;     // { from, to, dir, mode, node, boundary }
var _htmlTurnRaf = 0;
var _htmlDrag = null;
var htmlSim = null;       // 仿真模式下的 turn.js 书本状态

function htmlViewW() {
    var c = document.getElementById('htmlContent');
    return (c ? c.clientWidth : 0) || window.innerWidth || 1;
}

function htmlTurnHost() { return document.getElementById('htmlTurn'); }

/** 把真纸带落到第 p 页（动画收尾 / 无动画跳页都走这里，保证位移口径只有一处） */
function htmlSetStripPage(p) {
    var cols = document.getElementById('htmlColumns');
    if (!cols) return;
    cols.style.transform = 'translateX(' + (-p * htmlStep) + 'px)';
}

/** 克隆第 p 页为一张独立快照：外层带上视口层的底色/底图，内层是整条纸带的副本 */
function htmlSnapNode(p) {
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols) return null;
    var cs = getComputedStyle(c);
    var node = document.createElement('div');
    node.className = 'html-snap' + (c.classList.contains('fs-bleed') ? ' fs-bleed' : '');
    node.style.backgroundColor = cs.backgroundColor;
    node.style.backgroundImage = cs.backgroundImage;
    node.style.backgroundSize = cs.backgroundSize;
    node.style.backgroundPosition = cs.backgroundPosition;
    var strip = cols.cloneNode(true);
    // 克隆会连内联样式一起抄：真纸带此刻可能正被隐藏（仿真模式），必须显式恢复可见
    strip.style.visibility = 'visible';
    strip.style.transform = 'translateX(' + (-p * htmlStep) + 'px)';
    node.appendChild(strip);
    return node;
}

/** 搭起一次翻页：需要快照的模式先建快照。返回 null 表示建不出来，调用方退回无动画跳页。 */
function htmlBeginTurn(from, to, dir, mode) {
    var host = htmlTurnHost();
    if (!host || _htmlTurn) return null;
    var boundary = (to < 0 || to >= htmlPageCount);
    var t = { from: from, to: boundary ? from : to, dir: dir, mode: mode, node: null, boundary: boundary };
    if (!boundary && (mode === 'cover' || mode === 'fade')) {
        t.node = htmlSnapNode(t.to);
        if (!t.node) return null;
        if (mode === 'cover') t.node.className += (dir > 0 ? ' cover-next' : ' cover-prev');
        else t.node.style.opacity = '0';
        host.appendChild(t.node);
    }
    host.style.display = 'block';
    _htmlTurn = t;
    return t;
}

/** 拆掉一次翻页：commit=false 表示回弹（纸带留在原页） */
function htmlEndTurn(commit) {
    if (_htmlTurnRaf) { cancelAnimationFrame(_htmlTurnRaf); _htmlTurnRaf = 0; }
    var t = _htmlTurn;
    _htmlTurn = null;
    if (t) {
        // 纸带落点就是「当前页」：在这里同步 htmlPage，拖拽提交与动画跳页共用一条口径
        var land = commit === false ? t.from : t.to;
        htmlPage = land;
        htmlSetStripPage(land);
    }
    var host = htmlTurnHost();
    if (host && !htmlSim) { host.innerHTML = ''; host.style.display = 'none'; }
    isAnimating = false;
}

/** 按进度 p（0=当前页，1=目标页）画一帧 */
function htmlApplyTurn(t, p) {
    var cols = document.getElementById('htmlColumns');
    var W = htmlStep;
    if (t.boundary) {
        // 章节边界没有目标页：整条纸带做阻尼位移，露出底色当「翻到头了」的反馈
        if (cols) cols.style.transform = 'translateX(' + (-t.from * W + t.dir * p * W * 0.35) + 'px)';
        return;
    }
    if (t.mode === 'slide') {
        if (cols) cols.style.transform = 'translateX(' + (-(t.from + t.dir * p) * W) + 'px)';
        return;
    }
    if (!t.node) return;
    if (t.mode === 'fade') t.node.style.opacity = p;
    else t.node.style.transform = 'translateX(' + (t.dir * (1 - p) * W) + 'px)';
}

/** 把当前翻页从 fromP 演到 toP（toP<1 即回弹），结束后收尾 */
function htmlRunTurn(fromP, toP, ms, onDone) {
    var t = _htmlTurn;
    if (!t) { isAnimating = false; if (onDone) onDone(); return; }
    isAnimating = true;
    var t0 = null;
    var frame = function (ts) {
        _htmlTurnRaf = 0;
        if (_htmlTurn !== t) return;            // 期间被重排 / 换章拆掉，交给那一次的处理
        if (t0 === null) t0 = ts;
        var k = ms <= 0 ? 1 : Math.min(1, (ts - t0) / ms);
        htmlApplyTurn(t, fromP + (toP - fromP) * (1 - Math.pow(1 - k, 3)));
        if (k < 1) { _htmlTurnRaf = requestAnimationFrame(frame); return; }
        htmlEndTurn(toP >= 1);
        if (onDone) onDone();
    };
    _htmlTurnRaf = requestAnimationFrame(frame);
}

/** 支持跟手拖拽的 HTML 档位；仿真由 turn.js 自己跟手，上下滚动交给原生滚动 */
function htmlDragMode() {
    if (!htmlMode || htmlFlow === 'scrolled' || htmlSim) return null;
    return (pageTurnMode === 'cover' || pageTurnMode === 'slide' || pageTurnMode === 'fade') ? pageTurnMode : null;
}

function htmlBeginDrag(d, dir) {
    var to = d.from + dir;
    var mode = htmlDragMode();
    if (!mode) { htmlCancelDrag(d); return; }
    var t = htmlBeginTurn(d.from, to, dir, mode);
    if (!t) { htmlCancelDrag(d); return; }
    d.turn = t;
    isAnimating = true;                 // 拖拽期间屏蔽外部翻页（音量键 / 进度条 / 自动翻页）
    lastDragActivityTs = Date.now();
}

function htmlUpdateDrag(d, delta) {
    var size = htmlViewW();
    var magn = -delta * d.dir;
    d.raw = Math.max(0, Math.min(1, magn / size));
    if (!d.turn.boundary) htmlApplyTurn(d.turn, d.raw);
    else htmlApplyTurn(d.turn, Math.min(d.raw * 0.35, 0.12));
}

function htmlFinishDrag(d, commit) {
    var t = d.turn;
    _htmlDrag = null;
    lastDragFinishTs = Date.now();
    lastDragActivityTs = Date.now();
    if (!t) { isAnimating = false; return; }
    if (t.boundary) {
        if (commit || (d.velocity >= DRAG_COMMIT_VELOCITY && d.raw >= DRAG_FLICK_MIN_RATIO)) {
            htmlEndTurn(false);         // 先落回原页，换章由 Java 回调后的 loadHtmlContent 接手
            try { if (t.dir > 0) Android.onChapterEnd(); else Android.onChapterStart(); } catch (e) {}
            return;
        }
        htmlRunTurn(0, 0, ANIM_DURATION);
        return;
    }
    var done = commit || d.raw >= DRAG_COMMIT_RATIO ||
               (d.velocity >= DRAG_COMMIT_VELOCITY && d.raw >= DRAG_FLICK_MIN_RATIO);
    var back = d.raw;
    htmlRunTurn(back, done ? 1 : 0, Math.round(ANIM_DURATION * (done ? 1 - back : back)), function () {
        if (done) { notifyJavaPageChange(); updateHtmlHeaderFooter(); }
    });
}

function htmlCancelDrag(d) {
    _htmlDrag = null;
    if (d && d.turn) htmlEndTurn(false);
    else isAnimating = false;
}

document.addEventListener('touchstart', function (e) {
    if (!htmlMode || htmlSim || _htmlDrag) return;
    var t = e.touches && e.touches[0];
    if (!t) return;
    _htmlDrag = { start: t.clientX, cross: t.clientY, from: htmlPage, dir: 0, turn: null,
                  raw: 0, velocity: 0, lastMagn: 0, lastTs: Date.now(), active: false };
}, { passive: true });

document.addEventListener('touchmove', function (e) {
    var d = _htmlDrag;
    if (!d) return;
    var t = e.touches && e.touches[0];
    if (!t) return;
    var delta = t.clientX - d.start;
    if (!d.active) {
        if (!htmlDragMode() || !swipeEnabled || isAnimating) { _htmlDrag = null; return; }
        // 方向判定：横向位移要明显大于纵向，且越过起手势阈值
        if (Math.abs(delta) < DRAG_SLOP || Math.abs(delta) <= Math.abs(t.clientY - d.cross)) return;
        d.dir = delta < 0 ? 1 : -1;
        d.active = true;
        htmlBeginDrag(d, d.dir);
        if (!_htmlDrag) return;
    }
    var now = Date.now(), dt = now - d.lastTs;
    if (dt > 0) {
        var v = (-delta * d.dir - d.lastMagn) / dt;
        d.velocity = d.velocity * 0.5 + v * 0.5;
        d.lastMagn = -delta * d.dir;
        d.lastTs = now;
    }
    htmlUpdateDrag(d, delta);
    e.preventDefault();     // 横向翻页吃掉这次滚动，避免 WebView 顺带动别的容器
}, { passive: false });

document.addEventListener('touchend', function (e) {
    var d = _htmlDrag;
    _htmlDrag = null;
    if (!d || !d.active) return;
    var ct = e.changedTouches && e.changedTouches[0];
    if (ct) {
        var delta = ct.clientX - d.start;
        htmlUpdateDrag(d, delta);
    }
    var raw = d.raw;
    var go = raw >= (d.turn && d.turn.boundary ? DRAG_BOUNDARY_RATIO : DRAG_COMMIT_RATIO) ||
             (d.velocity >= DRAG_COMMIT_VELOCITY && raw >= DRAG_FLICK_MIN_RATIO);

}, { passive: true });

document.addEventListener('touchcancel', function () {
    var d = _htmlDrag;
    _htmlDrag = null;
    if (d && d.active) htmlFinishDrag(d, false);
}, { passive: true });

// 「上下」档的滚动是 #htmlContent 自己的原生滚动，不经过任何翻页函数：不接 scroll 事件的话，
// 页脚页码会一直停在进档那一刻，退出后 Java 记的位置也还是旧的。
// scroll 不冒泡，但捕获阶段能收到，故挂在 document 上（本层脚本执行时容器已在 DOM 里）。
var _htmlScrollRaf = 0;
document.addEventListener('scroll', function () {
    if (!htmlMode || htmlFlow !== 'scrolled' || _htmlScrollRaf) return;
    _htmlScrollRaf = requestAnimationFrame(function () {
        _htmlScrollRaf = 0;
        if (!htmlMode || htmlFlow !== 'scrolled') return;
        var c = document.getElementById('htmlContent');
        if (!c) return;
        var p = Math.max(0, Math.min(htmlPageCount - 1, Math.round(c.scrollTop / htmlClientHeight())));
        if (p === htmlPage) return;
        htmlPage = p;
        notifyJavaPageChange();
        updateHtmlHeaderFooter();
    });
}, { passive: true, capture: true });

// 「上下」档滚到顶/底后原生滚动就吃住，再拽不出任何动作，换章只能靠目录/音量键。
// canvas 的上下档是自绘滚动，越界阻尼后在 touchend 换章；这里在原生滚动上补同一判据：
// 只在「贴边 + 同向继续拖」时累计越界量，阈值与 canvas 取齐（12% 视口高，或越界段速度 0.5px/ms）。
// 挂捕获阶段：#htmlContent 自身要消费这些触摸做原生滚动，冒泡阶段不保证能收到。
var _htmlEdgeDrag = null;
document.addEventListener('touchstart', function (e) {
    var c = document.getElementById('htmlContent');
    var t = e.touches && e.touches[0];
    if (!htmlMode || htmlFlow !== 'scrolled' || !c || !t) { _htmlEdgeDrag = null; return; }
    _htmlEdgeDrag = { c: c, y: t.clientY, ts: Date.now(), over: 0, v: 0, dir: 0 };
}, { passive: true, capture: true });

document.addEventListener('touchmove', function (e) {
    var st = _htmlEdgeDrag;
    if (!st) return;
    var t = e.touches && e.touches[0];
    if (!t) return;
    var c = st.c;
    var dy = st.y - t.clientY;          // >0 = 手指上滑，即往下读
    st.y = t.clientY;
    var atTop = c.scrollTop <= 0;
    var atBottom = c.scrollTop + c.clientHeight >= c.scrollHeight - 1;
    var over = (dy > 0 && atBottom) ? dy : (dy < 0 && atTop ? -dy : 0);
    if (over === 0) return;             // 还在正常滚动区间，整套交给原生滚动
    st.dir = dy > 0 ? 1 : -1;           // over 取的是绝对值，方向只能看手指本身
    st.over += over;
    var now = Date.now(), dt = now - st.ts;
    if (dt > 0) st.v = st.v * 0.7 + (Math.abs(over) / dt) * 0.3;
    st.ts = now;
}, { passive: true, capture: true });

document.addEventListener('touchend', function () {
    var st = _htmlEdgeDrag;
    _htmlEdgeDrag = null;
    if (!st || !st.dir) return;
    if (st.over > htmlClientHeight() * 0.12 || st.v > 0.5) htmlBoundarySwap(st.dir);
}, { passive: true, capture: true });

document.addEventListener('touchcancel', function () { _htmlEdgeDrag = null; }, { passive: true, capture: true });

/**
 * 带翻页动画地切到指定页。覆盖 / 平移 / 淡入各按自己的动效演；
 * 仿真由 turn.js 卷页（见 htmlSimTurn），上下滚动模式退化为纵向滚动。
 */
function htmlTurnTo(p, animate) {
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols) return;
    if (p < 0) p = 0;
    if (p >= htmlPageCount) p = htmlPageCount - 1;
    if (p === htmlPage) return;
    if (htmlFlow === 'scrolled') {
        htmlPage = p;
        c.scrollTop = p * htmlClientHeight();
        notifyJavaPageChange();
        return;
    }
    if (_htmlTurn) htmlEndTurn(true);   // 在途的拖拽/动画先落地，避免两套动画叠加把纸带画歪
    var from = htmlPage, dir = p > from ? 1 : -1;
    var mode = (animate === false || pageTurnMode === 'none') ? null : pageTurnMode;
    if (mode !== 'cover' && mode !== 'slide' && mode !== 'fade') mode = null;
    if (htmlSim) {
        htmlPage = p;
        // 卷页到位后 turned 回调会上报；但目标页已在视野内时 turn.js 不回调，这里兜底同步一次
        if (htmlSimGoTo(p)) { notifyJavaPageChange(); updateHtmlHeaderFooter(); return; }
    }
    htmlPage = p;
    if (mode && htmlBeginTurn(from, p, dir, mode)) {
        htmlRunTurn(0, 1, ANIM_DURATION);
    } else {
        htmlSetStripPage(p);
    }
    notifyJavaPageChange();
    updateHtmlHeaderFooter();
}

// ---- 仿真：turn.js 直接吃快照页（canvas 路径喂的是整页位图，两条路互不影响） ----

/** 一页书纸 = 快照页 + turn.js 认的 p{n} 类名（类名优先于 addPage 的显式页码） */
function htmlSimPage(p) {
    var node = htmlSnapNode(p);
    if (!node) return null;
    node.className += ' page p' + (p + 1);
    return node;
}

/** 预置当前页前后的书纸：turn.js 拖拽折页阶段不触发 missing，缺页会露出空白 */
function htmlSimEnsure(center) {
    if (!htmlSim) return;
    var fb = $('#htmlFlipbook');
    try {
        var data = fb.data();
        if (!data || !data.pageObjs || !fb.turn('is')) return;
        for (var off = -2; off <= 3; off++) {
            var idx = center + off;
            if (idx < 0 || idx >= htmlPageCount || data.pageObjs[idx + 1]) continue;
            var el = htmlSimPage(idx);
            if (el) fb.turn('addPage', el, idx + 1);
        }
    } catch (e) {
        console.error('htmlSimEnsure 异常: ' + e);
    }
}

function htmlInitSim() {
    if (!htmlMode || htmlFlow === 'scrolled' || pageTurnMode !== 'simulation') return;
    htmlDestroySim();
    var host = htmlTurnHost();
    var first = host && htmlSimPage(htmlPage);
    if (!first) return;
    var book = document.createElement('div');
    book.id = 'htmlFlipbook';
    book.className = 'fbk';
    book.appendChild(first);
    host.innerHTML = '';
    host.appendChild(book);
    host.classList.add('html-sim');
    host.style.display = 'block';
    // 书本接管显示：真纸带藏起来（快照与真页逐像素对齐，见 htmlSnapNode），但底色/页眉页脚照旧
    var cols = document.getElementById('htmlColumns');
    if (cols) cols.style.visibility = 'hidden';
    htmlSim = true;
    $('#htmlFlipbook').turn({
        width: htmlViewW(),
        height: htmlClientH || htmlClientHeight(),
        display: 'single',
        duration: 500,
        gradients: true,
        acceleration: true,
        elevation: 60,
        page: htmlPage + 1,
        pages: htmlPageCount,
        when: {
            turning: function (event, page) {
                isAnimating = true;
                htmlPage = Math.max(0, Math.min(htmlPageCount - 1, page - 1));
            },
            turned: function (event, page) {
                isAnimating = false;
                htmlPage = Math.max(0, Math.min(htmlPageCount - 1, page - 1));
                htmlSimEnsure(htmlPage);
                notifyJavaPageChange();
                updateHtmlHeaderFooter();
            },
            missing: function (event, missingPages) {
                var fb = $('#htmlFlipbook');
                for (var i = 0; i < missingPages.length; i++) {
                    var idx = missingPages[i] - 1;
                    if (idx < 0 || idx >= htmlPageCount) continue;
                    var el = htmlSimPage(idx);
                    if (el) fb.turn('addPage', el, missingPages[i]);
                }
            }
        }
    });
    setTimeout(function () { htmlSimEnsure(htmlPage); }, 0);
}

function htmlDestroySim() {
    try {
        var fb = $('#htmlFlipbook');
        if (fb.length && fb.turn('is')) fb.turn('destroy');
    } catch (e) {
        console.error('htmlDestroySim 异常: ' + e);
    }
    htmlSim = null;
    var host = htmlTurnHost();
    if (host) {
        host.classList.remove('html-sim');
        if (!_htmlTurn) { host.innerHTML = ''; host.style.display = 'none'; }
    }
    var cols = document.getElementById('htmlColumns');
    if (cols) {
        // 书本在途时纸带是隐藏的，卷到第几页它并不知道；重新显示前按 htmlPage 补一次位移，
        // 否则切回覆盖/平移档会把纸带留在进仿真前的那一页。
        cols.style.visibility = '';
        htmlSetStripPage(htmlPage);
    }
}

/** 仿真模式下的跳页：交给 turn.js 卷过去（与 canvas 路径同一口径） */
function htmlSimGoTo(p) {
    if (!htmlSim) return false;
    try {
        $('#htmlFlipbook').turn('page', p + 1);
        return true;
    } catch (e) {
        return false;
    }
}

/** 仿真模式下的章界越界滑动：turn.js 在首页/末页卷不动也没有越界回调，这里补一次换章。
 *  与 canvas 路径共用 _boundaryPending 守卫，防止一次手势连跳两章。 */
function htmlSimBoundary(dir) {
    if (_boundaryPending) return;
    _boundaryPending = true;
    setTimeout(function () { _boundaryPending = false; }, 1500);
    try { if (dir > 0) Android.onChapterEnd(); else Android.onChapterStart(); } catch (e) {}
}

// turn.js 在书本元素上 stopPropagation，冒泡阶段的监听永远收不到（canvas 路径踩过同一坑），
// 所以章界判定也必须挂在捕获阶段。只记起点，判定放在 touchend，普通卷页仍交给 turn.js。
var _htmlSimSwipe = null;
document.addEventListener('touchstart', function (e) {
    if (!htmlSim) { _htmlSimSwipe = null; return; }
    var t = e.touches && e.touches[0];
    _htmlSimSwipe = t ? { x: t.clientX, y: t.clientY } : null;
}, true);
document.addEventListener('touchend', function (e) {
    var s = _htmlSimSwipe;
    _htmlSimSwipe = null;
    if (!s || !htmlSim) return;
    var ct = e.changedTouches && e.changedTouches[0];
    if (!ct) return;
    var dx = ct.clientX - s.x;
    if (Math.abs(dx) < 30 || Math.abs(dx) <= Math.abs(ct.clientY - s.y)) return;
    if (dx < 0) {
        if (htmlPage >= htmlPageCount - 1) htmlSimBoundary(1);
    } else if (htmlPage <= 0) {
        htmlSimBoundary(-1);
    }
}, true);
document.addEventListener('touchcancel', function () { _htmlSimSwipe = null; }, true);

/** 换章 / 重排 / 改档位时拆掉整个动画层，保证不留半张快照 */
function htmlResetTurnLayer() {
    _htmlDrag = null;
    htmlEndTurn(true);
    htmlDestroySim();
}
function htmlNextPage() {
    if (htmlFlow === 'scrolled') {
        var c = document.getElementById('htmlContent');
        if (!c) return;
        if (c.scrollTop + c.clientHeight + 2 >= c.scrollHeight) {
            try { Android.onChapterEnd(); } catch (e) {}
            return;
        }
        c.scrollTop = Math.min(c.scrollHeight - c.clientHeight, c.scrollTop + c.clientHeight);
        notifyJavaPageChange();
        return;
    }
    if (htmlPage >= htmlPageCount - 1) {
        try { Android.onChapterEnd(); } catch (e) {}
        return;
    }
    htmlTurnTo(htmlPage + 1, true);
}
function htmlPrevPage() {
    if (htmlFlow === 'scrolled') {
        var c = document.getElementById('htmlContent');
        if (!c) return;
        if (c.scrollTop <= 0) {
            try { Android.onChapterStart(); } catch (e) {}
            return;
        }
        c.scrollTop = Math.max(0, c.scrollTop - c.clientHeight);
        notifyJavaPageChange();
        return;
    }
    if (htmlPage <= 0) {
        try { Android.onChapterStart(); } catch (e) {}
        return;
    }
    htmlTurnTo(htmlPage - 1, true);
}
function htmlCurrentPageText() {
    var cols = document.getElementById('htmlColumns');
    if (!cols) return '';
    return cols.innerText || cols.textContent || '';
}

// 视口尺寸变化（横竖屏切换等）：重新分栏并保持阅读位置
window.addEventListener('resize', function () {
    if (htmlMode) applyHtmlTheme(true);
});

// HTML 富文本模式下的「点击三分区」处理：左 1/3 上一页、右 1/3 下一页、中间 1/3 切换导航栏。
// 由 Android 端在「仿真翻页」分支回调（该模式下 Android 的 onSingleTapConfirmed 不自行处理点击）；
// 非仿真模式仍由 Android 三分区统一下发，因此这里不再注册容器级触摸监听——
// 否则一次点击会被两端各处理一次，表现为「点一下翻两屏」。
//
// ★ 参数是「相对 WebView 宽度的比例」(0~1)，不是像素！
//   原因：Android 传过来的是**物理像素**（1080 宽的屏就是 0~1080），
//   而这里的 window.innerWidth 是 **CSS 像素**（1080 / dpr3 ≈ 360）。
//   若直接拿物理像素和 window.innerWidth 比，屏幕正中间(540)会被判成
//   「> 2w/3 = 240」→ 走 nextPage() 翻页，于是点屏幕中央只会翻页、
//   永远调不出上下导航栏（用户表现为「点击不显示导航栏」）。
function onAndroidTap(ratio) {
    if (!htmlMode) return false;   // 非 HTML 模式：保持原有前端行为不变
    var f = ratio / 1;             // 归一化比例 0~1
    if (!isFinite(f)) return false;
    if (f < 0) f = 0;
    if (f > 1) f = 1;
    if (f < 1 / 3) {
        prevPage();
    } else if (f > 2 / 3) {
        nextPage();
    } else {
        try { Android.toggleNavigation(); } catch (e) {}
    }
    return true;
}

function setFontSize(size) {
    fontSize = size;
    titleFontSize = size + 4;
    topPadding = (vPadding >= 0) ? vPadding : padding + fontSize; // 字号变化时同步顶部边距（显式上下边距优先）
    if (htmlMode) { applyHtmlTheme(); return; }   // HTML 模式：直接套用样式，跳过 canvas 重排
    if (currentContent) {

            relayoutAndRedraw();
            if (simulationActive) reinitSimulation();

}

function setFontFamily(name) {
    if (name === '__system__') {
        // 系统字体：使用系统默认字体栈
        fontFamily = 'sans-serif';
    } else {
        fontFamily = name;
    }
    if (htmlMode) { applyHtmlTheme(); return; }   // HTML 模式：直接套用样式，跳过 canvas 重排

}

/**
 * 阅读排版参数（设置弹窗「间距」行）：行距倍数 / 段距（行）/ 左右边距 px / 上下边距 px。
 * padTB 传 -1 表示跟随默认公式（左右边距 + 字号行高）；运行中直调会立即重排当前章，
 * 在 beginSettingsBatch 批处理期间则只更新变量，由 finishSettingsBatch 统一重绘。
 */
function setTypesetting(lineRatio, paraGap, padLR, padTB) {
    lineHeightRatio = lineRatio;
    paraGapRatio = paraGap;
    padding = padLR;
    vPadding = padTB;
    topPadding = (vPadding >= 0) ? vPadding : padding + fontSize;
    if (htmlMode) { applyHtmlTheme(); return; }   // HTML 模式：直接套用样式，跳过 canvas 重排
    if (currentContent) {

            relayoutAndRedraw();
            if (simulationActive) reinitSimulation();
        }
    }
}

function loadCustomFont(src, name) {
    // 如果字体已经在 document.fonts 中，直接切换并重绘（避免重复异步加载）
    try {
        var iter = document.fonts.values();
        var entry = iter.next();
        while (!entry.done) {
            if (entry.value.family === '"' + name + '"' || entry.value.family === name) {
                fontFamily = name;
                if (currentContent && !_deferDraw) {
                    // 已注册字体再次切换：同样等该具体字体可用后再重绘，避免首绘回退
                    var _dFn = function() {
                        relayoutAndRedraw();
                        if (simulationActive) reinitSimulation();
                    };
                    var _p2 = (typeof fontSize !== 'undefined' ? fontSize : 18) + 'px ' + name;
                    if (document.fonts && document.fonts.load) {
                        Promise.resolve(document.fonts.load(_p2)).then(_dFn, _dFn);
                    } else {
                        _dFn();
                    }
                    setTimeout(_dFn, 150);
                }
                return;
            }
            entry = iter.next();
        }
    } catch (e) {}

    var wasDeferred = _deferDraw;
    var font = new FontFace(name, 'url(' + src + ')');
    font.load().then(function(loaded) {
        document.fonts.add(loaded);
        fontFamily = name;
        // ✅ 修复「点击切换无反应 / 需退出重进才生效」：
        // document.fonts.ready 在某些 Chromium 版本下不能可靠地让 Canvas 立即应用
        // 刚加入的自定义字体（首绘仍回退系统字体）。改用 document.fonts.load('18px 字体名')
        // 显式等待「该具体字体」真正可用后再重排重绘；setTimeout 兜底保证即使 Promise 异常也必重绘。
        var redrawFn = function() {
            if (currentContent) {
                relayoutAndRedraw();
                if (simulationActive) reinitSimulation();
            }
        };
        var _probe = (typeof fontSize !== 'undefined' ? fontSize : 18) + 'px ' + name;
        if (document.fonts && document.fonts.load) {
            Promise.resolve(document.fonts.load(_probe)).then(redrawFn, redrawFn);
        } else {
            redrawFn();
        }
        setTimeout(redrawFn, 150);
        // If batch was active, finish it now that font is loaded
        if (wasDeferred) {
            _deferDraw = false;
        }
    }).catch(function(err) {
        console.error('加载自定义字体失败: ' + err);
        // 加载失败时不强行改字体，保持当前阅读字体；必要时补一次重绘
        if (wasDeferred) finishSettingsBatch();
        else if (currentContent) relayoutAndRedraw();
    });
}

function setBackgroundColor(color) {
    bgColor = color;
    if (htmlMode) { applyHtmlTheme(); return; }
    // ✅ 在仿真模式下，通过样式表规则统一更新容器和 wrapper 背景（含纹理同步，折角不镂空）
    if (_simulationPlaceholderActive || simulationActive) {
        $('#flipbook .page-div').css('background-color', color);
        syncSimulationBackground();
    }
    if (!_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();

}

function setTextColor(color) {
    textColor = color;
    if (htmlMode) { applyHtmlTheme(); return; }   // HTML 模式：直接套用样式，跳过 canvas 重排
    for (var i = 0; i < pages.length; i++) {
        for (var j = 0; j < pages[i].length; j++) {
            pages[i][j].color = color;

}

function setBackgroundTexture(src) {
    if (htmlMode) { applyHtmlTheme(); return; }   // HTML 模式：纹理暂不适用，仅套用当前底色
    // 如果 bgTextureImg 已经加载了同一张图，直接重绘（避免重复异步加载）
    if (bgTextureImg && bgTextureImg.complete && bgTextureImg.src && bgTextureImg.src.indexOf(src) !== -1) {
        if (currentContent && !_deferDraw) {

            $('#flipbook .page-div').css('background-size', '100% 100%');

        if (_simulationPlaceholderActive || simulationActive) {

function clearBackgroundTexture() {
    bgTextureImg = null;
    if (htmlMode) { applyHtmlTheme(); return; }   // HTML 模式：仅套用当前底色
    // ✅ 仿真模式（占位/激活）：清除纹理只留纯色（样式表规则统一同步）
    if (_simulationPlaceholderActive) {
        $('#flipbook .page-div').css('background-image', 'none');
    }
    if (_simulationPlaceholderActive || simulationActive) {
        syncSimulationBackground();
    }
    if (currentContent && !_deferDraw) {

function setNightMode(enable) {
    isNightMode = enable;
    bgTextureImg = null;

    } else {

    // ✅ 夜间模式切换时立即更新仿真容器和 wrapper 背景（纹理已清除，样式表统一同步）
    if (_simulationPlaceholderActive || simulationActive) {

            'background-color': bgColor,
            'background-image': 'none'
        });

        for (var j = 0; j < pages[i].length; j++) {
            pages[i][j].color = textColor;
        }
    }
    if (!_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

// 将 #RRGGBB / #RGB 在 a→b 之间按 t(0..1) 插值，返回 #RRGGBB
function lerpColor(a, b, t) {
    function norm(c) {
        if (c.length === 4) return '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
        return c;
    }
    a = norm(a); b = norm(b);
    var ar = parseInt(a.substr(1, 2), 16), ag = parseInt(a.substr(3, 2), 16), ab = parseInt(a.substr(5, 2), 16);
    var br = parseInt(b.substr(1, 2), 16), bg = parseInt(b.substr(3, 2), 16), bb = parseInt(b.substr(5, 2), 16);
    var r = Math.round(ar + (br - ar) * t);
    var g = Math.round(ag + (bg - ag) * t);
    var bl = Math.round(ab + (bb - ab) * t);
    return '#' + (0x1000000 + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}

/**
 * 平滑切换日/夜间：由原生侧传入起止颜色与时长（毫秒），逐帧插值。
 * enable: 目标是否为夜间；durationMs: 过渡时长；from/to 分别为起始/目标背景与文字色
 *
 * ⚠️ 三种渲染方式的「可见层」不同，必须分别驱动，否则会出现「导航栏渐变、正文瞬间跳变」：
 *   1) Canvas（覆盖/滑动/淡入/上下滚动）：redrawCurrent() 画的就是可见层，逐帧重绘即可；
 *   2) HTML 富文本（本地 EPUB 保留样式）：可见层是 #htmlContent 的 CSS 底色，逐帧改样式即可（不重排）；
 *   3) 仿真翻页（pageTurnMode === 'simulation'）：可见层是「整页渲染位图」(<img>)，
 *      位图只能靠重建换色，而重建（destroy + init + 逐页 toDataURL）既贵又带 80ms 防抖 ——
 *      逐帧调用只会被反复推迟，最终在渐变结束后才执行一次，正文于是整块跳变。
 *      故过渡期间把可见层临时换成可逐帧重绘的 canvas（与仿真页位图同源、视觉一致），
 *      动画收尾再按目标配色立即重建位图并交还仿真层。
 *      仿真的「占位页」只是纯色块（无位图），逐帧改其底色即可。
 */
function animateNightMode(enable, durationMs, fromBg, fromText, toBg, toText) {
    isNightMode = enable;
    bgTextureImg = null;

    // 过渡期间由 canvas 接管可见层（仅真仿真需要，且 HTML 模式不走 canvas）
    var simTakeover = simulationActive && !htmlMode;
    if (simTakeover) {
        canvas.style.visibility = 'visible';
        $('#flipbookContainer').css('display', 'none');
        redrawCurrent();   // 先把当前页补画到 canvas，接管瞬间不露空白
    }

    // 逐帧把插值后的配色画到当前可见层上
    function paintFrame() {
        if (_deferDraw) return;
        if (htmlMode) { applyHtmlThemeColors(); return; }  // HTML 模式：只改配色，不重排
        redrawCurrent();                                   // Canvas / 仿真接管：逐帧重绘
    }

    var start = null;
    function frame(ts) {
        if (start === null) start = ts;
        var t = durationMs <= 0 ? 1 : Math.min(1, (ts - start) / durationMs);
        var e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // ease-in-out
        bgColor = lerpColor(fromBg, toBg, e);
        textColor = lerpColor(fromText, toText, e);
        // 同步仿真/翻页容器底色
        if (_simulationPlaceholderActive || simulationActive) syncSimulationBackground();
        // 仿真占位页（纯色块，无位图）：逐帧跟随底色
        if (_simulationPlaceholderActive) {
            $('#flipbook .page-div').css('background-color', bgColor);
        }
        // 更新已布局页面的文字颜色缓存
        if (typeof pages !== 'undefined') {
            for (var i = 0; i < pages.length; i++) {
                if (!pages[i]) continue;
                for (var j = 0; j < pages[i].length; j++) {
                    pages[i][j].color = textColor;
                }
            }
        }
        paintFrame();
        if (t < 1) {
            requestAnimationFrame(frame);
            return;
        }
        // ---- 终帧：落定精确值，并把可见层交还给目标渲染方式 ----
        bgColor = toBg; textColor = toText;
        paintFrame();
        if (simTakeover) {
            // 立即按目标配色重建仿真位图（不走 80ms 防抖），随后 canvas 由 initSimulation 重新隐藏
            restartSimulationNow();
        }
    }
    requestAnimationFrame(frame);
}

/** HTML 富文本模式：仅刷新正文配色（不重排、不改阅读位置），供日夜渐变逐帧调用。 */
function applyHtmlThemeColors() {
    var c = document.getElementById('htmlContent');
    if (!c) return;
    c.classList.toggle('html-night', !!isNightMode);
    c.style.backgroundColor = bgColor;
    c.style.color = textColor;
}

// 设置页眉页脚显示
function setShowHeaderFooter(show) {
    showHeaderFooter = show;
    if (htmlMode) { applyHtmlFlow(true); return; }   // HTML 模式：重排版预留空间并刷新覆盖层
    if (!_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

// 设置自动翻页倒计时（秒）；>0 时在页眉右侧显示小倒计时，<=0 时隐藏
var autoPageCountdown = 0;
function setAutoPageCountdown(sec) {
    sec = sec | 0;
    if (sec !== autoPageCountdown) {
        autoPageCountdown = sec;
        if (!_deferDraw) redrawCurrent();
    }
}

// 设置页眉页脚字体大小
function setHeaderFooterFontSize(size) {
    headerFooterFontSize = size;
    if (htmlMode) { applyHtmlFlow(true); return; }   // HTML 模式：预留空间随字号变化，刷新覆盖层
    if (!_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

// 设置电量时间显示开关
function setShowBatteryTime(show) {
    showBatteryTime = show;
    if (htmlMode) { updateHtmlHeaderFooter(); return; }
    if (!_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

// 更新电量时间数据
function updateBatteryTime(level, time) {
    batteryText = level;
    timeText = time;
    if (htmlMode) { updateHtmlHeaderFooter(); return; }
    if (showBatteryTime && !_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

function beginSettingsBatch() {
    _deferDraw = true;
}

function finishSettingsBatch() {
    _deferDraw = false;
    if (currentContent) {
        drawPage(currentPage);
        notifyJavaPageChange();
        if (simulationActive) reinitSimulation();
    }
}

function jumpToPage(pageNumber) {
    goToPage(pageNumber - 1);
}

// ============ 后台预计算 ============
function preCalculate(content) {
    var oldContent = currentContent;
    var oldTitle = chapterTitle;
    var oldFontSize = fontSize;
    var oldFontFamily = fontFamily;
    // 暂存当前滚动状态，避免预计算污染正在阅读的滚动位置
    var oldLines = scrollLines, oldH = scrollContentHeight, oldMax = scrollMax,
        oldVH = scrollViewH, oldVW = scrollViewW, oldSY = scrollY;
    var processed = preprocessContent(content);
    currentContent = processed;
    chapterTitle = '';
    paginate(processed, '');
    var totalPages = pages.length;
    if (isScrollMode()) {
        layoutScroll(processed, '');
        totalPages = Math.max(1, Math.ceil((scrollContentHeight || scrollViewH || 1) / (scrollViewH || 1)));
    }
    var summary = {
        totalPages: totalPages,
        fontSize: fontSize,
        width: window.innerWidth,
        height: window.innerHeight,
        pageStarts: pageStartOffsets
    };
    currentContent = oldContent;
    chapterTitle = oldTitle;
    fontSize = oldFontSize;
    fontFamily = oldFontFamily;
    scrollLines = oldLines; scrollContentHeight = oldH; scrollMax = oldMax;
    scrollViewH = oldVH; scrollViewW = oldVW; scrollY = oldSY;
    return JSON.stringify(summary);
}

// ============ 初始化 ============
resizeCanvas();
</script>
