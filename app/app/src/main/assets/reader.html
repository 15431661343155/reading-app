}, true);
document.addEventListener('touchcancel', function () { _simTapStart = null; }, true);

/**
 * 书中页内锚点（{@code <a href="#x">}）不归原生拦截管：Chromium 把同文档跳转当成不通知客户端的导航，
 * shouldOverrideUrlLoading 压根不会被调到，于是 WebView 自己去滚 #htmlContent —— 而分页是把整列按页
 * 平移的，这一滚会把相邻两页错开半列（实测点书中「页内锚点」后满屏文字被切成两截）。就地取消默认行为。
 * 指向别的文档的链接（http(s)、包内相对 xhtml）仍会走原生拦截。
 */
document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (a) e.preventDefault();
}, true);

// ============ 仿真模式跨章无缝卷页（临时双页 flipbook） ============
// turn.js 的 flipbook 页数即本章页数，无法原地追加邻章页，因此用「临时双页 flipbook」完成跨章：
//   前向（本章末页 → 下一章第 1 页）：p1=本章末页位图、p2=下一章第 1 页位图，
//       初始停在 p1，程序化 turn('next') → 末页卷起露出下一章首页，与普通卷页观感一致；
//   后向（本章首页 → 上一章末页）：p1=上一章末页位图、p2=本章首页位图，
//       初始停在 p2，程序化 turn('previous') → 上一章末页从左侧卷入盖住屏幕。
// 落地后重建正式 flipbook（initSimulation），画面与落地帧完全一致 → 零跳变，
// 再回调 Android.onChapterEnd/onChapterStart，Java 回送的 loadContent 结果一致。
// 注意：前向在起飞前就把全局分页切到下一章（swapToAdjacentChapter），后向在落地时才切换。
var _xCrossFlipping = false;   // 临时 flipbook 跨章卷页在途（含 500ms 动画与落地重建）
var _xflipArmed = false;       // ✅ 临时书本的 turn('next') 已发出；armed 之后的 turned 才是真正落点
var _xflipInitPage = 0;        // ✅ 临时书本初始页号；turned(page===初始页) 是 turn() 初始化误触发
var _xflipSeq = 0;             // ✅ 本次跨章的序号；3s 兜底只认自己那一次，防止旧计时器掐断新跨章

/** ✅ 跨章在途延迟器：跨章卷页期间，任何会 paginate/重绘/重建仿真层的异步回调
 *  （字体加载回调、setFontSize/setFontFamily 的 reinitSimulation 防抖定时器等）若此刻执行，
 *  会 destroySimulation 摧毁在途临时 flipbook → turned 永不到达 → 3s 兜底按失败回退，
 *  表现为「换章翻页有时跳回翻页前的页面」。字体回调到达时机随机（网络/缓存），故偶发。
 *  在途时统一延迟到落地后执行；落地后立即照常执行。 */
function xDefer(fn) {
    if (!_xCrossFlipping) { fn(); return; }
    setTimeout(function () { xDefer(fn); }, 120);
}

/** 临时把全局 pages/chapterTitle 换成目标章后渲染第 idx 页位图；渲染完立即还原。
 *  若该槽位原本无缓存则顺手清掉，防止污染当前章的同序号页位图（simPageCache 按索引存）。 */
function simRenderUrlForPages(pArr, title, idx) {
    var sPages = pages, sTitle = chapterTitle;
    pages = pArr; chapterTitle = title;
    var had = (simPageCache[idx] !== undefined);
    var url = null;
    try { url = renderPageToCache(idx); } catch (e) { url = null; }
    pages = sPages; chapterTitle = sTitle;
    if (!had && url !== null) { try { delete simPageCache[idx]; } catch (e2) {} }
    return url;
}

/** 仿真跨章无缝卷页：构建临时双页 flipbook 并程序化翻页。成功接管返回 true（换章回调由落地时发出） */
function simStartCrossFlip(xt) {
    if (_xCrossFlipping) return false;
    if (!xt || !xt.pages || !xt.pages.length) return false;
    var forward = xt.dir > 0;
    var frontUrl = null, underEl = null, initPage = 1;

    try {
        if (forward) {
            // 起飞前先把全局分页切到下一章（落地后 Java loadContent 结果一致）
            xt.saved = { pages: pages, offsets: pageStartOffsets, title: chapterTitle,
                         content: currentContent, index: currentChapterIndex, page: currentPage };
            frontUrl = simPageCache[currentPage];
            if (frontUrl === undefined) frontUrl = renderPageToCache(currentPage);
            if (!frontUrl) return false;
            swapToAdjacentChapter(xt);
            currentPage = 0;
            delete simPageCache[0];              // 防止命中旧章第 1 页的同序号缓存
            underEl = createSimPageElement(0);   // 下一章第 1 页（读新全局）
            initPage = 1;
        } else {
            // 全局暂不切换（落地时再切）；先渲染上一章末页位图
            var zLast = xt.pages.length - 1;
            frontUrl = simRenderUrlForPages(xt.pages, xt.title, zLast);
            if (!frontUrl) return false;
            beginCrossChapterWindow();
            underEl = createSimPageElement(0);   // 本章第 1 页（读当前全局）
            initPage = 2;
        }
    } catch (e) {
        console.error('simStartCrossFlip 准备失败: ' + e.message);
        return false;
    }

    _xCrossFlipping = true;
    _xflipArmed = false;
    _xflipInitPage = initPage;
    var seq = ++_xflipSeq;
    // 兜底：turn.js 事件异常未落地时，3 秒后强制按失败收尾。
    // ⚠️ 必须认序号：连续跨章时（约 2s 一次）上一条的 3s 计时器会在新一条还在途时到点，
    //    拿旧 xt 掐断新书本并把全局分页还原到旧章 → 表现为「一次手势跳两章」或「落点回到翻页前」。
    setTimeout(function() { if (_xCrossFlipping && _xflipSeq === seq) simFinishCrossFlip(xt, false); }, 3000);

    // 类名显式重排：p1=卷动页（front）、p2=落点页（under），避免 createSimPageElement 的 p1 类名冲突
    underEl.attr('class', 'page-div p2 page fixed');
    var frontEl = $('<div class="page-div p1 page fixed"></div>');
    frontEl.css({ 'background-color': bgColor });
    var imgF = document.createElement('img');
    imgF.src = frontUrl;
    imgF.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;';
    imgF.className = 'page-content';
    frontEl[0].appendChild(imgF);

    destroySimulation();                       // 拆掉旧 flipbook（此时 simulationActive 仍为 true）
    simulationActive = false;                  // 折页在途期间屏蔽仿真触摸处理（touch 分支等）
    canvas.style.visibility = 'hidden';
    $('#flipbookContainer').css('display', 'block');
    // ✅ 在途期间屏蔽 flipbook 指针事件：程序化卷页若被用户触摸打断，turn.js 会走取消路径
    //    不再触发 turned → 只能等 3s 兜底按失败回退（表现为换章后 ~3s 跳回原章）。
    //    我们的触摸处理在 document 层且 simulationActive=false 已屏蔽，不受影响。
    $('#flipbook').css('pointer-events', 'none');
    syncSimulationBackground();
    var flipbook = $('#flipbook');
    flipbook.empty();
    flipbook.append(frontEl).append(underEl);

    var W = window.innerWidth, H = window.innerHeight;
    flipbook.turn({
        width: W, height: H, display: 'single', duration: 500,
        gradients: true, acceleration: true, elevation: 60,
        // ✅ 起页必须按方向给：单页模式 turn('previous') 是 _view(page).shift()-1 且被 max(1,…) 夹住，
        //    停在 p1 时它是空操作（不 turning 也不 turned），后向只能撞 3s 兜底回退。
        //    前向起于 p1（本章末页）卷起露 p2，后向起于 p2（本章首页）由 p1 从左侧卷入盖住屏幕。
        page: initPage, pages: 2,
        when: {
            start: function (event, opts) {
                // 底层静止区保险：用「落点页」（下一章第 1 页 = underEl）位图铺 wrapper 背景
                // （与 simOnFlipStart 同理）。单页模式 p1 被 turn.js 隐藏、露出的正是这层背景，
                // 铺错就演成「卷完还停在原页」→ 落地重建才跳变。
                // 后向时 p2 就是屏幕起始页，这层背景被它自己盖住，铺哪张都不影响观感。
                try {
                    var uimg = underEl.find('img')[0];
                    var url = (uimg && uimg.src) || frontUrl;
                    var styleEl = document.getElementById('simUnderPageStyle');
                    if (!styleEl) {
                        styleEl = document.createElement('style');
                        styleEl.id = 'simUnderPageStyle';
                        document.head.appendChild(styleEl);
                    }
                    styleEl.textContent = '#flipbook .page-wrapper {' +
                        ' background-image: url(' + url + ') !important;' +
                        ' background-size: 100% 100% !important;' +
                        ' background-repeat: no-repeat !important;' +
                        ' background-position: 0 0 !important; }';
                    var pt = document.querySelector('#flipbook .page.p-temporal');
                    if (pt) pt.style.display = '';
                } catch (e) {}
            },
            end: function (event, opts, completed) {
                if (!_xflipArmed) return;
                if (completed) return;                 // 成功：交给 _eventEnd → _fitPage → turned 落地
                // ⚠️ 程序化翻页不存在「取消」。此 end(false) 是 turn.js _fitPage 内部 turn("stop")
                //    的正常收尾（成功翻页后必伴随一次），只清视觉残留，绝不能当失败回退——
                //    否则会同步 destroy 临时 flipbook，摧毁紧随其后的 turned 事件链（已踩坑）。
                //    失败收尾由 fire 异常分支与 3s 兜底负责。
                simOnFlipEnd();
            },
            turned: function (event, page) {
                // ✅ turn.js 在 turn() 初始化时就会触发一次 turned(page=初始页)（实测 t≈55~115ms），
                //    并非翻页落点；只有 turn('next'/'previous') 发出（armed）之后的 turned 才算落地。
                if (!_xflipArmed) return;
                if (page === _xflipInitPage) return;   // 双保险：初始页的 turned 不是落点
                simOnFlipEnd();
                simFinishCrossFlip(xt, true);
            },
            missing: function () {}
        }
    });

    setTimeout(function() {
        try {
            // ✅ 若收尾已发生（如 init 误触发被拦截前后的异常路径），此刻 #flipbook 可能已是
            //    重建后的正式 flipbook——绝不能再对它发 turn('next'/'previous')（会误翻一页并污染进度）。
            if (!_xCrossFlipping) return;
            var fb = $('#flipbook');
            if (!fb.data() || !fb.turn('is')) { simFinishCrossFlip(xt, false); return; }
            _xflipArmed = true;                // 翻页指令已发出：之后的 turned 才是落点
            fb.turn(forward ? 'next' : 'previous');
        } catch (e) { simFinishCrossFlip(xt, false); }
    }, 30);
    return true;
}

/** 仿真跨章卷页收尾：completed=true 落地目标章并重建正式 flipbook；false 回退触发前状态 */
function simFinishCrossFlip(xt, completed) {
    if (!_xCrossFlipping) return;
    _xCrossFlipping = false;
    try {
        var fb = $('#flipbook');
        if (fb.data() && fb.turn('is')) fb.turn('destroy');
    } catch (e) {}
    $('#flipbook').empty();
    $('#flipbook').css('pointer-events', '');   // ✅ 恢复指针事件（临时 flipbook 期间被屏蔽，见 simStartCrossFlip）
    if (completed) {
        if (xt.dir < 0) {
            // 后向：落地时才把全局分页切到上一章，落点为其最后一页
            swapToAdjacentChapter(xt);
            currentPage = xt.pages.length - 1;
        }
        // 前向：起飞前已切换，currentPage 已是 0
        // ✅ 落地即解除「跨章繁忙」：此后用户立刻再跨章，桥可按 Java 已推进的索引正常取邻章，
        //    不必等 loadContent 回送（期间快速再翻会被拒走旧流程、撞上去重窗被吞=点一下无反应）。
        //    _suppressPageNotify 仍保持到 loadContent 到达（页码上报窗口保护不变）；
        //    迟到的过时 loadContent 由 loadContent 内的 onChapterResync 校验兜住。
        _xTurnBusy = false;
    } else {
        // 失败回退：恢复触发前状态（前向已切全局需还原；后向全局未动）；换章回调未发出，旗标自行清除
        if (xt.dir > 0 && xt.saved) {
            pages = xt.saved.pages; pageStartOffsets = xt.saved.offsets;
            chapterTitle = xt.saved.title; currentContent = xt.saved.content;
            currentChapterIndex = xt.saved.index; currentPage = xt.saved.page;
        }
        _suppressPageNotify = false;
        _xTurnBusy = false;
    }
    initSimulation();     // 重建正式 flipbook（画面与落地帧/原帧一致）
    if (completed) {
        try { if (xt.dir > 0) Android.onChapterEnd(); else Android.onChapterStart(); } catch (e) {}
    }
}

/**
 * ✅ 章节边界事件（由 turn.min.js 的 _eventReleased 在目标页越界时触发）：
 * 本章最后一页继续向后滑 → dir=+1 请求下一章；本章第一页继续向前滑 → dir=-1 请求上一章。
 * 说明：不能用 when 注册——turn.js 的 destroy 只会解绑内置事件，
 * 自定义事件会随每次重建累积，导致一次滑动跳多章。故在脚本层绑定一次。
 */
$('#flipbook').on('boundary', function(event, dir) {
    pagerBoundaryOnce(dir);
});

// 翻页结束：
//   1. 清除底层页背景样式，恢复正常纹理
//   2. 清理书页背面，隐藏 p-temporal
function simOnFlipEnd() {
    if (_simBackRAF) { cancelAnimationFrame(_simBackRAF); _simBackRAF = null; }
    simClearBack();
    // 清除底层页背景样式
    var underStyleEl = document.getElementById('simUnderPageStyle');
    if (underStyleEl) underStyleEl.textContent = '';
    var pt = document.querySelector('#flipbook .page.p-temporal');
    if (pt) pt.style.display = 'none';
    // 恢复纹理兜底
    syncSimulationBackground();
}

function initSimulation() {
    // ✅ 跨章在途闸门：Java 在 loadContent 之外单独发送的伴随指令（setPageTurnMode、设置批处理等）
    //    不走 loadContent 的延迟队列——它们若在跨章卷页中途执行，会 destroySimulation 拆掉在途
    //    临时 flipbook，turn.js 内部状态机崩溃（Uncaught reading 'data'），事件链断裂。
    //    在途时延迟到落地后执行：届时正式 flipbook 已由落地逻辑重建，本调用幂等无害。
    //    （落地路径 simFinishCrossFlip 调用本函数时 _xCrossFlipping 已复位，不受影响。）
    if (_xCrossFlipping) { setTimeout(initSimulation, 120); return; }
    if (pages.length === 0) return;

    // 清理可能存在的占位页，并将 simulationActive 统一在初始化后设置
    clearSimulationPlaceholder();

    // 如果已处于仿真激活状态，先销毁（destroySimulation 会重置 simulationActive=false）
    if (simulationActive) {
        destroySimulation();
    }
    simulationActive = true;
    simPageCache = {};
    _simFoldActive = false; // 重建书本，清理上一次可能残留的折页状态

    if (!renderCanvas) {
        renderCanvas = document.createElement('canvas');
        renderCtx = renderCanvas.getContext('2d');
    }
    // ✅ 仿真页位图按 simRenderDpr 渲染（见上方说明），避免满屏 3x 大图 toDataURL 导致进入阅读器长时间白屏。
    renderCanvas.width = Math.round(window.innerWidth * simRenderDpr);
    renderCanvas.height = Math.round(window.innerHeight * simRenderDpr);

    var flipbook = $('#flipbook');
    flipbook.empty();

    var W = window.innerWidth;
    var H = window.innerHeight;

    // ✅ 关键修复：预渲染当前页（currentPage）为图片后再启动 turn.js
    // 避免 turn.js 初始化期间出现空页
    var firstPageIdx = currentPage;
    if (firstPageIdx < 0 || firstPageIdx >= pages.length) firstPageIdx = 0;

    // 先填充当前页（带正确背景色）再启动 turn.js；
    // createSimPageElement 会带上 p{n} 类名，保证从章节中间恢复时页码不错位
    flipbook.append(createSimPageElement(firstPageIdx));

    // 确保容器背景与内容一致（含纹理：正反书页背景统一由 syncSimulationBackground 同步）
    $('#flipbookContainer').css('display', 'block');
    syncSimulationBackground();

    // 隐藏底层 canvas（仿真模式下始终由 flipbook 容器承担显示）
    canvas.style.visibility = 'hidden';

    flipbook.turn({
        width: W,
        height: H,
        display: 'single',
        duration: 500,  // 翻页动画时长，500ms 比默认 600ms 更流畅
        gradients: true,
        acceleration: true,
        elevation: 60,
        dragSlop: DRAG_SLOP,  // 点按不翘角，横向拖拽越过这个距离才起卷（turn.min.js 自定义键）
        page: firstPageIdx + 1,  // 当前页，从 1 开始
        pages: pages.length,
        when: {
            start: function(event, opts) {
                // 记录折页已开始（供"折页取消"兜底清理使用）
                _simFoldActive = true;
                _simFoldSeq++;
                // 新的一次折页重新允许请求跨章（上一次跨章失败/未完成时也能重试）
                _boundaryPending = false;
                // 翻页开始：确保目标页已加入 DOM（底层静止区域才能显示下一页），
                // 同时清空书页背面残留内容，让背面保持空白纸张效果
                if (opts && opts.next) simOnFlipStart(opts.next);
            },
            end: function(event, opts, completed) {
                // turn.js 折页收尾：completed=false 表示折页被取消（未翻页），
                // 此时不会触发 turned，需立即清理书页背面与底层页样式
                if (completed) return;
                if (!_simFoldActive) return;
                _simFoldActive = false;
                simOnFlipEnd();
            },
            turning: function(event, page) {
                currentPage = page - 1;
                notifyJavaPageChange();
            },
            turned: function(event, page) {
                _simFoldActive = false;
                currentPage = page - 1;
                // 仿真模式下 canvas 已隐藏，无需 drawPage（避免无效渲染消耗性能）
                // 翻页结束：清理书页背面，隐藏 p-temporal
                simOnFlipEnd();
                // 翻页结束后预加载新位置附近的页面（前两页~后三页），
                // 保证下一次拖拽翻页时露出的页面已有内容
                ensureSimulationPages(currentPage);
            },
            missing: function(event, missingPages) {
                for (var i = 0; i < missingPages.length; i++) {
                    var pg = missingPages[i];
                    var idx = pg - 1;
                    if (idx >= 0 && idx < pages.length) {
                        // 页面不存在时渲染并注册（松手触发 missing 的兜底路径）
                        flipbook.turn('addPage', createSimPageElement(idx), pg);
                    }
                }
                // 直接同步背景，避免 setTimeout 延迟导致的闪烁
                syncSimulationBackground();
            }
        }
    });

    // ✅ 预加载当前页附近的页面为页对象：turn.js 拖拽折页阶段不会触发 missing，必须提前加入 DOM 才不会露空白。
    //    但整章逐页 toDataURL 很重（满屏大图），若同步执行会阻塞首屏出图 → 长时间白屏。
    //    故把「相邻页预渲染」移出关键路径：当前页已渲染并显示 flipbook 后，下一帧再补相邻页；
    //    期间若用户抢先翻页，由 turn.js 的 missing 事件兜底补页，不会露空白。
    setTimeout(function() {
        if (simulationActive) ensureSimulationPages(firstPageIdx);
    }, 0);

    // 初始化时隐藏 p-temporal（书页背面），避免其背景色遮挡当前页正面内容。
    // p-temporal 仅在翻页动画期间由 simOnFlipStart 显示，翻页结束由 simOnFlipEnd 隐藏。
    var initPt = document.querySelector('#flipbook .page.p-temporal');
    if (initPt) initPt.style.display = 'none';
}

function destroySimulation() {
    // 同时处理"占位模式"与"仿真激活"两种状态的清理
    if (!simulationActive && !_simulationPlaceholderActive) return;
    simulationActive = false;
    _simFoldActive = false;
    clearSimulationPlaceholder();
    try {
        var flipbook = $('#flipbook');
        if (flipbook.data() && flipbook.turn('is')) {
            flipbook.turn('destroy');
        }
    } catch (e) {
        console.error('销毁 flipbook 异常: ' + e);
    }
    $('#flipbookContainer').css({ display: 'none' });
    // ✅ 恢复 canvas 显示（切换模式或退出仿真模式时）
    canvas.style.visibility = 'visible';
    simPageCache = {};
}

function renderPageToCache(pageIndex) {
    var dpr = simRenderDpr || Math.min(window.devicePixelRatio || 1, 2);

    // Render to off-screen canvas to avoid flickering the main display
    renderCtx.setTransform(1, 0, 0, 1, 0, 0);
    renderCtx.scale(dpr, dpr);

    var savedPage = currentPage;
    currentPage = pageIndex;
    var realCtx = ctx;
    ctx = renderCtx;
    drawPage(pageIndex);
    ctx = realCtx;
    currentPage = savedPage;

    var dataUrl = renderCanvas.toDataURL('image/jpeg', 0.85);
    simPageCache[pageIndex] = dataUrl;
    return dataUrl;
}

// ✅ 创建仿真页元素：内容为整页渲染图，类名 p{n} 让 turn.js
// 按类名注册页码（addPage 中类名优先于显式页码参数，避免恢复到章中间时错位）
// 说明：内容必须用 <img> 子节点承载（而非仅 CSS background-image），
// 因为 turn.js 折页动画会把页元素的 DOM 子节点复制进折页层；
// 仅靠 background-image 会让折页层在动画期间是空白，导致翻页时下一页不显示。
// 添加 fixed 类：turn.js 的 _necessPage 会保留有 fixed 类的页在 DOM 中，
// 防止 _removeFromDOM 在 range 变化时把预加载的相邻页移除，
// 确保翻页时底层静止区域能正确显示下一页内容。
function createSimPageElement(pageIndex) {
    if (simPageCache[pageIndex] === undefined) {
        renderPageToCache(pageIndex);
    }
    var element = $('<div class="page-div p' + (pageIndex + 1) + ' page fixed"></div>');
    element.css({
        // 保留底色，作为折页层内的兜底；正页内容由 img 子节点呈现
        'background-color': bgColor
    });
    // 用 <img> 承载整页渲染图：位置铺满，保证折页时也能被 turn.js 复制
    var img = document.createElement('img');
    img.src = simPageCache[pageIndex];
    img.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;';
    img.className = 'page-content';
    element[0].appendChild(img);
    return element;
}

/**
 * ✅ 预加载当前页附近的页面（前两页 ~ 后三页）为 turn.js 页对象。
 * 原因：turn.js 只在"松手"(_turnPage)时才触发 missing 事件补页，
 * 拖拽折页的整个过程中下一页根本不在 DOM 里，导致翻页时露出的下一页为空。
 * 必须提前把相邻页作为页对象加入 flipbook，拖拽时才能立即看到内容。
 */
function ensureSimulationPages(centerIdx) {
    if (!simulationActive || !pages.length) return;
    var flipbook = $('#flipbook');
    try {
        var data = flipbook.data();
        if (!data || !data.pageObjs || !flipbook.turn('is')) return;
        var added = false;
        // 预加载范围：前两页 ~ 后三页（共6页），减少翻页时即时渲染
        for (var off = -2; off <= 3; off++) {
            var idx = centerIdx + off;
            if (idx < 0 || idx >= pages.length) continue;
            var pg = idx + 1;
            if (data.pageObjs[pg]) continue; // 已存在，无需重复添加
            flipbook.turn('addPage', createSimPageElement(idx), pg);
            added = true;
        }
        // 只有实际添加了新页时才同步背景，避免不必要的重绘
        if (added) syncSimulationBackground();
    } catch (e) {
        console.error('ensureSimulationPages 异常: ' + e);
    }
}

/**
 * 立即按当前配色重建仿真书页（不走防抖）。
 * 供「日夜渐变收尾」这类必须精确定时的场景使用：仿真页的内容是「整页渲染位图」，
 * 只能靠重建来换色，防抖会把它推迟到调用结束后 80ms 才执行。
 */
function restartSimulationNow() {
    if (_reinitTimer) { clearTimeout(_reinitTimer); _reinitTimer = null; }
    destroySimulation();
    simulationActive = false; // ensure clean state
    initSimulation();
}

function reinitSimulation() {
    if (!simulationActive) return;
    // Debounce: wait for all pending settings calls before rebuilding
    if (_reinitTimer) clearTimeout(_reinitTimer);
    // ✅ xDefer：防抖定时器若在跨章在途窗口内到期，会摧毁临时 flipbook（见 xDefer 注释）
    _reinitTimer = setTimeout(function() {
        _reinitTimer = null;
        xDefer(restartSimulationNow);
    }, 80);
}

// ============ 连续滚动模式（'updown'） ============
// 进入该模式后，内容不再分页，而是连成一张长卷，靠上下拖拽滚动显示。

/** 是否处于连续滚动模式 */
function isScrollMode() {
    return pageTurnMode === 'updown';
}

/** 粘性页眉高度（章节标题固定显示在顶部）。关闭页眉或空标题时为 0 */
function scrollHeaderHeight() {
    if (showHeaderFooter && chapterTitle) return headerFooterFontSize + SCROLL_HEADER_EXTRA;
    return 0;
}

/** 把整章内容排版成连续行（不分页），填充 scrollLines / scrollContentHeight / scrollMax */
function layoutScroll(text, title) {
    scrollLines = [];
    if (!text && !title) { scrollContentHeight = 0; scrollMax = 0; return; }
    var W = window.innerWidth;
    var maxWidth = W - padding * 2;
    var headerH = scrollHeaderHeight();
    var top = headerH + topPadding;
    var footerReserved = 17;
    var bottomPad = footerReserved + 24; // 末行不被页脚遮挡
    var y = top;

    if (title) {
        ctx.font = 'bold ' + titleFontSize + 'px ' + fontFamily;
        var titleLines = splitTextToLines(title, maxWidth);
        titleLines.forEach(function (line) {
            scrollLines.push({ text: line, fontSize: titleFontSize, bold: true, color: textColor, y: y,
                justLast: true });   // 标题不参与两端对齐
            y += titleFontSize * 1.6;
        });
        y += titleFontSize * 0.8; // 标题后空行
    }

    ctx.font = fontSize + 'px ' + fontFamily;
    var indent = '\u3000\u3000';
    var paragraphs = text.split('\n');
    paragraphs.forEach(function (para) {
        if (para.length === 0) {
            y += fontSize * lineHeightRatio * paraGapRatio;
            return;
        }
        var trimmed = para.replace(/^[\s\u3000]+/, '');
        var indentedPara = indent + trimmed;
        var lines = splitTextToLines(indentedPara, maxWidth);
        lines.forEach(function (line, li) {
            scrollLines.push({ text: line, fontSize: fontSize, bold: false, color: textColor, y: y,
                justLast: li === lines.length - 1 });   // 段落末行不拉伸，其余行两端对齐
            y += fontSize * lineHeightRatio;
        });
    });

    y += bottomPad;
    scrollContentHeight = y;
    scrollViewW = W;
    scrollViewH = window.innerHeight;
    scrollMax = Math.max(0, scrollContentHeight - scrollViewH);
    clampScroll();
}

/** 约束 scrollY 在 [0, scrollMax] 范围内 */
function clampScroll() {
    if (scrollY < 0) scrollY = 0;
    if (scrollY > scrollMax) scrollY = scrollMax;
}

/** 取消正在进行的滚动动画（惯性 / 程序化跳转） */
function cancelScrollAnim() {
    if (scrollAnimId) { cancelAnimationFrame(scrollAnimId); scrollAnimId = 0; }
    isAnimating = false;
}

/** 绘制当前滚动视口（仅渲染可视区域内的行，性能友好） */
function drawScroll() {
    var dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    var W = window.innerWidth, H = window.innerHeight;

    // 背景（底色 + 纹理）
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);
    if (bgTextureImg && bgTextureImg.complete) ctx.drawImage(bgTextureImg, 0, 0, W, H);

    // 页眉 / 页脚带高度：正文渲染时避开这两个区域，正文不侵入页眉页脚位置。
    // 粘性带从 topPadding 起算，与 layoutScroll() 预留的顶距一致，并与其他翻页模式的页眉上边距相同。
    var headerBand = (showHeaderFooter && chapterTitle) ? (topPadding + headerFooterFontSize + SCROLL_HEADER_EXTRA) : 0;
    var footerBand = showHeaderFooter ? (headerFooterFontSize + 20) : 0;

    // 顶部粘性页眉（章节标题）—— 与其他翻页模式保持一致：
    // 背景使用页面底色 + 纹理（不单独覆盖成不透明块），标题字体/颜色/左对齐/距上边框(topPadding)均相同。
    // 正文已用 clip 排除此区域，不会从下方透出，因此无需不透明遮罩。
    if (showHeaderFooter && chapterTitle) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, W, headerBand);
        if (bgTextureImg && bgTextureImg.complete) ctx.drawImage(bgTextureImg, 0, 0, W, H);
        ctx.font = headerFooterFontSize + 'px ' + fontFamily;
        ctx.fillStyle = headerFooterColor;
        ctx.textAlign = 'left';
        ctx.fillText(chapterTitle, padding, topPadding + headerFooterFontSize);
        // 自动翻页倒计时：页眉右侧小字
        if (autoPageCountdown > 0) {
            ctx.textAlign = 'right';
            ctx.fillText(autoPageCountdown + 's', W - padding, topPadding + headerFooterFontSize);
            ctx.textAlign = 'left';
        }
    }

    // 正文（仅绘制可视区域行；用 clip 排除页眉/页脚带，正文不会显示在这两个位置）
    var top = scrollY, H2 = H;
    ctx.textAlign = 'left';
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, headerBand, W, Math.max(0, H - headerBand - footerBand));
    ctx.clip();
    for (var i = 0; i < scrollLines.length; i++) {
        var line = scrollLines[i];
        var lineH = line.fontSize * (line.bold ? 1.6 : lineHeightRatio);
        var screenY = line.y - scrollY;
        if (screenY + lineH < 0) continue;   // 在视口上方
        if (screenY > H2) break;              // 在视口下方（行已按 y 升序）
        ctx.font = (line.bold ? 'bold ' : '') + line.fontSize + 'px ' + fontFamily;
        ctx.fillStyle = line.color || textColor;
        // maxWidth 与 layoutScroll 的断行宽度同源（W - padding*2），保证拉伸目标与排版基准一致
        fillLineText(line.text, padding, screenY + line.fontSize, W - padding * 2, line.justLast);
    }
    ctx.restore();

    // 页脚（页码 / 进度）
    if (showHeaderFooter) {
        var total = virtualTotalPages();
        var cur = virtualCurrentPage();
        var footerText = cur + '/' + total;
        if (isLocalBook && typeof bookProgress !== 'undefined') footerText += ' ' + bookProgress + '%';
        ctx.font = headerFooterFontSize + 'px ' + fontFamily;
        ctx.fillStyle = headerFooterColor;
        ctx.textAlign = 'right';
        ctx.fillText(footerText, W - padding, H - 15);
        if (showBatteryTime && (batteryText || timeText)) {
            ctx.textAlign = 'left';
            var leftInfo = batteryText + (batteryText && timeText ? '  ' : '') + timeText;
            ctx.fillText(leftInfo, padding, H - 15);
        }
        ctx.textAlign = 'left';
    }
}

/** 越界阻尼：拖过章节边界时位移按比例缩小，产生"拉扯感" */
function applyDamping(x) { return x * 0.4; }

/** 平滑滚动到指定偏移（程序化跳转 / 越界回弹）。opts.onDone 在动画结束后回调 */
function animateScrollTo(targetY, opts) {
    opts = opts || {};
    cancelScrollAnim();
    targetY = Math.max(0, Math.min(scrollMax, targetY));
    isAnimating = true;
    var from = scrollY, to = targetY, start = null, dur = opts.dur || 260;
    function step(ts) {
        if (start === null) start = ts;
        var t = Math.min((ts - start) / dur, 1);
        var e = 1 - Math.pow(1 - t, 3);
        scrollY = from + (to - from) * e;
        drawScroll();
        if (t < 1) {
            scrollAnimId = requestAnimationFrame(step);
        } else {
            scrollAnimId = 0;
            isAnimating = false;
            scrollY = to;
            if (opts.onDone) opts.onDone();
            notifyJavaPageChange();
        }
    }
    scrollAnimId = requestAnimationFrame(step);
}

/** 惯性滚动：松手后按速度继续滑行并自然减速 */
function startMomentum(v) {
    cancelScrollAnim();
    isAnimating = true;
    var last = null;
    function step(ts) {
        if (last === null) last = ts;
        var dt = (ts - last) / 1000;
        if (dt > 0.05) dt = 0.05;
        last = ts;
        scrollY += v * dt * 1000;       // v: px/ms
        v *= Math.exp(-dt / 0.3);       // 时间相关的指数衰减，帧率无关
        if (scrollY < 0) { scrollY = 0; v = 0; }
        if (scrollY > scrollMax) { scrollY = scrollMax; v = 0; }
        drawScroll();
        if (Math.abs(v) > 0.02 && scrollY > 0 && scrollY < scrollMax) {
            scrollAnimId = requestAnimationFrame(step);
        } else {
            scrollAnimId = 0;
            isAnimating = false;
            notifyJavaPageChange();
        }
    }
    scrollAnimId = requestAnimationFrame(step);
}

/** 向下滚动一屏（点击"下一页"区域 / 自动翻页） */
function scrollNextScreen() {
    if (scrollY >= scrollMax - 0.5) { try { Android.onChapterEnd(); } catch (e) {} return; }
    animateScrollTo(Math.min(scrollMax, scrollY + scrollViewH));
}

/** 向上滚动一屏（点击"上一页"区域 / 自动翻页） */
function scrollPrevScreen() {
    if (scrollY <= 0.5) { try { Android.onChapterStart(); } catch (e) {} return; }
    animateScrollTo(Math.max(0, scrollY - scrollViewH));
}

/** 「页」口径的总数与当前页：分页档 = 本章页数，长卷档以「屏」为页，
 *  使进度条/书签/跳转的契约对两条路一致 */
function virtualTotalPages() {
    return pagerBackend().virtualTotal();
}
function virtualCurrentPage() {
    return pagerBackend().virtualPos();
}

/** 仅重绘当前显示（不改变排版）：滚动模式画长卷，否则画当前分页页 */
function redrawCurrent() {
    if (isScrollMode()) drawScroll();
    else drawPage(currentPage);
}

/** 重排版并立即重绘（字体/字号变化导致内容高度改变时使用） */
function relayoutAndRedraw() {
    if (!currentContent) return;
    if (isScrollMode()) {
        layoutScroll(currentContent, chapterTitle);
        clampScroll();
    } else {
        paginate(currentContent, chapterTitle);
        if (currentPage >= pages.length) currentPage = pages.length - 1;
        if (currentPage < 0) currentPage = 0;
    }
    redrawCurrent();
    notifyJavaPageChange();
}

// ============ 跟手拖拽翻页（两条渲染路共用一套状态机）============
// 状态机只把「手势」翻译成进度 p（0=当前页，1=目标页），画什么全交给统一动画层：
// 起势定方向 → turnBegin 搭起静止层与移动节点 → 每次位移 turnApply 一帧 →
// 松手按「滑动距离 + 速度」决定演到目标页还是回弹。
// canvas 一路旧版每帧四次全屏 getImageData/putImageData 的位图合成、HTML 一路另写的那一套
// 快照拖拽，都在这一步收掉：可拖档位、阈值、阻尼口径两端自此同一个值。
// 章节边界（首页向前 / 末页向后）没有目标页可渲染，改为橡皮筋阻尼，
// 松手且达到阈值时才请求换章，避免误触跳章。
var swipeEnabled = true;          // 与 Android「滑动翻页」开关同步
var drag = null;                  // 当前触摸/拖拽状态
var lastDragFinishTs = 0;         // 最近一次拖拽完成翻页的时间（防止与 Android onFling 重复翻页）
var lastDragActivityTs = 0;       // 最近一次拖拽收尾（含回弹）的时间
// ⚠️ 必须大于系统的点击判定阈值（ViewConfiguration touch slop = 8dp，CSS px 与 dp 等价）：
// 否则一次「点击」只要手指漂几像素就会进入跟手拖拽，既吞掉 Android 端的点击翻页，
// 还可能因为瞬时速度被算成甩动而翻到反方向的页。
var DRAG_SLOP = 16;               // 判定为拖拽的最小位移（CSS px）
var DRAG_COMMIT_RATIO = 0.2;      // 松手完成翻页所需的最小滑动比例
var DRAG_BOUNDARY_RATIO = 0.2;    // 章节边界触发换章的最小滑动比例
var DRAG_FLICK_MIN_RATIO = 0.08;  // 按速度判定甩动时的最小滑动比例（防点击抖动误翻）
var DRAG_COMMIT_VELOCITY = 0.45;  // px/ms：快速甩动时降低距离要求

var touchStartX = 0;

/** Android「滑动翻页」开关同步 */
function setSwipeEnabled(enabled) {
    swipeEnabled = !!enabled;
    if (!swipeEnabled && drag && drag.active) finishDrag(drag, false);
}

/** 支持跟手翻页的档位：'none' 本无动效、'updown' 是连续滚动、仿真由书本自己跟手，都不进这套 */
function dragMode() {
    return (pageTurnMode === 'cover' || pageTurnMode === 'slide' || pageTurnMode === 'fade') ? pageTurnMode : null;
}

/** 仿真书本的元素，两条路各自的容器；没在用仿真书本时 null */
function simBookEl() {
    if (htmlSim) return document.getElementById('htmlFlipbook');
    if (simulationActive) return document.getElementById('flipbook');
    return null;
}

/** 此刻有没有折页真正在途（turn.js 只在这种情况下才会发 released） */
function simFoldBusy() {
    var el = htmlSim ? document.getElementById('htmlFlipbook') : null;
    if (!el || !window.$) return false;
    try {
        var d = $(el).data();
        var mv = d && d.pageMv;
        if (!mv || !mv.length) return false;
        var pg = d.pages[mv[0]];
        var f = pg && pg.length && pg.data().f;
        return !!(f && f.corner);
    } catch (e) {
        return false;
    }
}

var _simTrack = null;   // 仿真档的滑行量度（书本自己跟手，本文件的 drag 状态机不参它的拖拽）
var _simFling = null;   // {dir, ratio, velocity} —— 捕获阶段写、released 读，一次手势只留一份意图

/** 仿真档记下滑行的方向与速度，松手判定要用（见 simTakeRelease） */
function simTrackMove(t) {
    if (!t || !_simTrack) return;
    var now = Date.now(), dt = now - _simTrack.ts;
    if (dt <= 0) return;
    var v = Math.abs(t.clientX - _simTrack.x) / dt;
    _simTrack.v = _simTrack.v * 0.5 + v * 0.5;
    _simTrack.x = t.clientX;
    _simTrack.ts = now;
}

/**
 * 折页自己收到 released 时接管这次松手。
 * 挂在页面节点上：turn.js 的 released 由折页触发、冒泡到书本，目标阶段的这里早于书本的松手判定。
 * 非要不接管不可是因为它那套判定只会「先 turn('stop') 拆掉在途折页、再从头卷一遍」：折页是整条
 * 多列纸带的副本，摘出与插回各要一次整页重排（真机微基准单趟 75~140ms，同屏副本越多越贵），
 * 于是松手那一下整本书冻住、折页重卷 —— 观感就是「刷新闪动」。接管之后要翻就接着当前折角把
 * 这一卷走完（不拆不重卷），不翻才照它原来的样子 800ms 回弹。
 * 翻不翻的阈值与其它四档同口径（DRAG_COMMIT_RATIO / 甩动速度），中线判据仍保留作兜底。
 */
function simTakeRelease(e, p) {
    var pg = $(this), f = pg.data() && pg.data().f;
    var book = f && f.opts && f.opts.turn;
    if (!book || !f.corner) return;            // 没有折页在途：这次手势不归这里收尾
    var d = book.data();
    var point = p || f.corner;
    // 倒放的折页是「上一页」那张纸（纸面从左外扫进来），它的 opts.next 指回当前页，落点要认这张纸自己的页号
    var rev = !!(f.corner.rev || point.rev);
    var nx = rev ? f.opts.page : f.opts.next;
    var tp = d.totalPages || 0;
    var corner = point.corner || f.corner.corner || '';
    var w = pg.width() || 1;
    // turn.js 原口径：拖过页宽一半算翻（br/tr 折角从右往左卷，x 越来越小）。倒放是同一条线的反向：折点从 -w
    // 起，越过 0 才算整页落平盖住当前页，没到 0 就退回屏幕外。
    var pastMid = rev ? point.x > 0 :
            (corner === 'br' || corner === 'tr' ? point.x < w / 2 : point.x > w / 2);
    var fl = _simFling;
    _simFling = null;
    var want = !!fl && fl.dir === (nx > d.page ? 1 : -1) &&
            (fl.ratio >= DRAG_COMMIT_RATIO ||
                    (fl.velocity >= DRAG_COMMIT_VELOCITY && fl.ratio >= DRAG_FLICK_MIN_RATIO));
    e.stopPropagation();   // 书本不再判第二次（它判完就是拆了重卷）
    e.preventDefault();    // 折页自己的回弹也不做，收尾统一在下面
    d.mouseAction = false;
    if (!(nx >= 1 && nx <= tp)) {               // 越出本章：纸面回弹，换章交给章界那两条分支
        pg.flip('hideFoldedPage', true);
        return;
    }
    if (!pastMid && !want) {
        pg.flip('hideFoldedPage', true);
        return;
    }
    try {
        // 与 turn.js 的 _turnPage 同口径，只把 turn('stop') 那一趟省下来
        book.triggerHandler($.Event('turning'), [nx, book.turn('view', nx)]);
        d.page = nx;
        d.tpage = nx;
        book.turn('update');
        pg.flip('turnPage');
    } catch (err) {
        pg.flip('hideFoldedPage', true);
    }
}

/** 把指定页渲染到离屏 canvas（直接复用 drawPage，省去 getImageData 的开销） */
function renderPageTo(cvs, pageIndex) {
    if (!cvs) cvs = document.createElement('canvas');
    if (cvs.width !== canvas.width || cvs.height !== canvas.height) {
        cvs.width = canvas.width;
        cvs.height = canvas.height;
    }
    var octx = cvs.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.scale(dpr, dpr);
    var mainCtx = ctx;
    ctx = octx;
    try {
        drawPage(pageIndex);
    } finally {
        ctx = mainCtx;
    }
    return cvs;
}

/** 把邻章分页结果的指定页渲染到离屏 canvas：临时交换全局 pages/chapterTitle 复用 drawPage
 *  （drawPage 页码用 pageIndex 参数、页眉读 chapterTitle，均不读 currentPage，交换面最小） */
function renderAdjacentPageTo(cvs, xt, pageIdx) {
    if (!cvs) cvs = document.createElement('canvas');
    if (cvs.width !== canvas.width || cvs.height !== canvas.height) {
        cvs.width = canvas.width;
        cvs.height = canvas.height;
    }
    var octx = cvs.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.scale(dpr, dpr);
    var mainCtx = ctx;
    var sPages = pages, sTitle = chapterTitle;
    ctx = octx;
    pages = xt.pages;
    chapterTitle = xt.title;
    try {
        drawPage(pageIdx);
    } finally {
        ctx = mainCtx;
        pages = sPages;
        chapterTitle = sTitle;
    }
    return cvs;
}

/** 起势：定方向与目标页（撞章界时试着取邻章负载），并搭起动画层 */
function beginDrag(d, dir) {
    var b = d.base;
    var target = d.from + dir;
    var boundary = (target < 0 || target >= b.count());
    var xt = null;
    if (boundary && b.fetchAdjacent) {
        // ✅ 邻章已预加载：拖拽直接跟手展示邻章首/末页（与普通翻页观感一致），不再做橡皮筋
        xt = b.fetchAdjacent(dir);
        if (xt) {
            boundary = false;
            target = dir > 0 ? 0 : xt.count - 1;
        }
    }
    d.dir = dir;
    d.target = target;
    d.boundary = !xt && boundary;
    d.xt = xt;
    d.active = true;
    isAnimating = true;                 // 拖拽期间屏蔽外部翻页（音量键 / 进度条 / 自动翻页）
    var spec = { base: b, from: d.from, to: target, dir: dir, mode: d.mode, boundary: d.boundary,
                 drag: true };
    if (xt) {
        // 邻章那一页还不在全局分页里，静止层画不到 —— 两页都只认现成节点
        spec.nodes = { from: b.pageNode(d.from), to: xt.node(target) };
        // 落地时先把全局分页换成邻章，静止层与页码才对得上；Java 回送 loadContent 后过渡窗口结束。
        //    必须用 xt.land 而不是写死 canvas 那一只：两条渲染路各自的「换掉当前章」都收在 xt.land 里
        //    （canvas 换全局分页，HTML 换纸带本体并把 _htmlXReady 交出去）。写死的那一路在 EPUB 上
        //    只改了页码不改纸带，落地的节点被回收 → 旧章纸带回脸，Java 回送的正文只能整章重建 = 闪一下。
        spec.preLand = xt.land;
    }
    d.turn = turnBegin(spec);
    if (!d.turn) {
        // 搭不起来（节点取不到 / 容器缺失）：退回去掉跟手的简单滑动判定
        isAnimating = false;
        d.active = false;
        d.failed = true;
        return;
    }
    lastDragActivityTs = Date.now();
}

/** 手指位移 → 进度：越出章界没有目标页，做橡皮筋阻尼，最多露出 12% */
function updateDrag(d, delta) {
    var size = d.base.pageW() || 1;
    var magn = -delta * d.dir;   // 沿翻页方向的有效位移（>0 表示继续朝目标页方向）
    d.raw = Math.max(0, Math.min(1, magn / size));
    d.progress = d.turn.boundary ? Math.min(d.raw * 0.35, 0.12) : d.raw;
    turnApply(d.turn, d.progress);
}

/** 松手收尾：commit=true 翻到目标页（跨章则切分页并请求换章），false 回弹到当前页 */
function finishDrag(d, commit) {
    if (!d || !d.active) return;
    d.active = false;
    drag = null;
    lastDragActivityTs = Date.now();
    var t = d.turn;
    if (!t) { isAnimating = false; return; }
    if (t.boundary) {
        // 先回弹到原页，落地后再请求换章：Java 回送的邻章正文接着把新页放上静止层
        turnRun(d.progress, 0, Math.max(90, Math.round(ANIM_DURATION * d.progress)), function () {
            if (!commit) return;
            lastDragFinishTs = Date.now();
            pagerNotifyChapter(d.dir);
        });
        return;
    }
    var done = commit || d.raw >= DRAG_COMMIT_RATIO ||
               (d.velocity >= DRAG_COMMIT_VELOCITY && d.raw >= DRAG_FLICK_MIN_RATIO);
    turnRun(d.progress, done ? 1 : 0,
            Math.max(90, Math.round(ANIM_DURATION * (done ? 1 - d.progress : d.progress))),
            function () {
                if (!done) return;
                lastDragFinishTs = Date.now();
                // 跨章：preLand 已把全局分页换到邻章并把页码上报压住，这里只通知 Java 真正换章
                if (d.xt) pagerNotifyChapter(d.dir);
            });
}

// 挂 document 捕获阶段：两条路的正文分属不同容器（#readerCanvas / #htmlContent），
// 挂在正文上就只有一条路收得到；捕获阶段也保证早于任何容器自己的滚动处理拿到手势。
document.addEventListener('touchstart', function (e) {
    var t = e.touches && e.touches[0];
    if (!t) return;
    touchStartX = t.clientX;
    drag = null;
    _simFling = null;
    var b = pagerBackend();
    if (b.simOn()) {                             // 仿真书本自己跟手，这里只留起点给章界判定
        if (htmlSim) {
            // 书本会在邻页进range时临时把它们重新装进折页包装盒，搬一次清一次节点事件，
            // addPage 时绑的那次可能已经被抹掉。手势起手补一遍，此后到松手之前不会再搬。
            htmlSimBindRelease();
            _simTrack = { x: t.clientX, ts: Date.now(), v: 0 };
        } else {
            _simTrack = null;
        }
        // 两个方向都归书本自己跟手：左向是正向卷页，右向是同一卷页的时间倒放（turn.min.js 的
        // _dragCorner 对右向给出 rev 折角，折的是上一页那张纸，折点按手指位置反向映射）。本章首页
        // 右滑时书本卷不起来，那一侧的横向滑动仍归首页的章界换章判定
        // （canvas 见 _simTapStart，HTML 见 _htmlSimSwipe）。
        return;
    }
    if (b.flow() === 'scroll') {                 // 连续滚动：canvas 自绘滚动，HTML 用原生滚动
        if (!htmlMode) beginScrollTouch(t);
        return;
    }
    if (isAnimating || !b.count() || !dragMode() || !swipeEnabled) return;
    drag = { base: b, mode: pageTurnMode, from: b.pos(), start: t.clientX, cross: t.clientY,
             active: false, failed: false, dir: 0, target: -1, boundary: false, xt: null,
             turn: null, raw: 0, progress: 0, lastMagn: 0, lastTs: Date.now(), velocity: 0 };
}, { passive: true, capture: true });

document.addEventListener('touchmove', function (e) {
    if (scrollTouch) { handleScrollTouchMove(e); return; }
    var d = drag;
    // 仿真档的滑行量度照常记：书本自己跟手，本状态机不参它的拖拽，松手判定要用这份量度
    if (_simTrack) simTrackMove(e.touches && e.touches[0]);
    if (!d) return;                                    // 仿真档不在这里立拖拽状态
    var t = e.touches && e.touches[0];
    if (!t) return;
    var delta = t.clientX - d.start;
    if (!d.active) {
        if (d.failed) return;
        // 方向判定：横向位移要明显大于纵向，且越过起手势阈值
        if (Math.abs(delta) < DRAG_SLOP || Math.abs(delta) <= Math.abs(t.clientY - d.cross)) return;
        if (isAnimating || !d.base.count() || !dragMode() || !swipeEnabled) {
            drag = null;
            return;
        }
        beginDrag(d, delta < 0 ? 1 : -1);
        if (!d.active) return;
    }
    var magn = -delta * d.dir;
    var now = Date.now(), dt = now - d.lastTs;
    if (dt > 0) {
        var v = (magn - d.lastMagn) / dt;
        d.velocity = d.velocity * 0.5 + v * 0.5;
        d.lastMagn = magn;

// ============ 仿真翻页模式：章节边界翻章检测 ============
// ✅ 复用池修复：仿真模式下 canvas 触摸处理被禁用（simulationActive 时直接 return），
//    而 turn.js 在末页/首页无法翻页时没有任何「越界即换章」回调，导致 onChapterEnd/onChapterStart 永不触发，
//    表现为「最后一页翻页无法进入下一章」。
// 早期曾在 flipbookContainer 上补充滑动检测，但 turn.js 在 flipbook 上 stopPropagation 阻断了冒泡，
//    祖先节点的监听永远收不到事件（死代码）。故改在 document 级仿真触摸处理（capture 阶段，必然先到达）
//    的「滑动收尾」分支里统一处理：仅在「已在首页/末页且向边界外横向滑动」时触发换章，普通翻页仍交给 turn.js。

/**

 * 跟手拖拽会自行在 touchend 收尾，这里直接忽略，避免一次滑动翻两页。

function onAndroidFling(deltaX) {
    if (isScrollMode()) return true;   // 滚动模式下滚动由前端处理
    if (!swipeEnabled) return true;
    if (drag && drag.active) return true;                    // 拖拽收尾会处理
    if (isAnimating) return true;                            // 已有动画在进行
    // 拖拽刚刚收尾（翻页或回弹）：无论事件先后顺序都不再重复翻页
    if (Date.now() - lastDragActivityTs < 400) return true;
    if (Date.now() - lastDragFinishTs < 400) return true;
    if (typeof deltaX !== 'number' || deltaX === 0) return true;
    if (deltaX < 0) nextPage();
    else prevPage();
    return true;

// ============ 连续滚动模式：手势处理 ============
/** 开始一次滚动触摸：取消惯性动画，记录起点 */
function beginScrollTouch(t) {
    if (!scrollLines || !scrollLines.length) { scrollTouch = null; return; }

    scrollTouch = {
        startY: t.clientY,
        startScrollY: scrollY,
        lastTs: Date.now(),
        velocity: 0,   // d(scrollY)/dt，px/ms（正=向上滚/内容下移）
        rawOver: 0,    // 越过边界的「原始」拖拽量（未阻尼），用于松手判定是否换章
        moved: false

/** 滚动拖拽过程：根据手指位移实时更新 scrollY（带越界阻尼） */
function handleScrollTouchMove(e) {
    var t = e.touches && e.touches[0];

    var dy = t.clientY - scrollTouch.startY;       // 手指向下移 → dy>0
    var rawNew = scrollTouch.startScrollY - dy;     // 手指上移 → scrollY 增大（看后面内容）

    // 记录越过边界的原始拖拽量（未阻尼）——松手时据此判定是否换章
    var rawOver = 0;
    if (rawNew < 0) rawOver = -rawNew;
    else if (rawNew > scrollMax) rawOver = rawNew - scrollMax;
    if (rawOver > scrollTouch.rawOver) scrollTouch.rawOver = rawOver;

    // 显示用阻尼位移：超过顶部/底部时按比例缩小，产生"拉扯感"
    var newScrollY = rawNew;
    if (rawNew < 0) newScrollY = -applyDamping(-rawNew);
    else if (rawNew > scrollMax) newScrollY = scrollMax + applyDamping(rawNew - scrollMax);

    var now = Date.now();
    var dt = now - scrollTouch.lastTs;
    if (dt > 0) {
        var v = (newScrollY - scrollY) / dt;
        scrollTouch.velocity = scrollTouch.velocity * 0.7 + v * 0.3;
    }
    scrollTouch.lastTs = now;
    if (Math.abs(dy) > 4) scrollTouch.moved = true;
    scrollY = newScrollY;
    drawScroll();
    if (e.cancelable) e.preventDefault();

/** 滚动松手：越界 → 回弹或换章；否则按速度惯性滑行 */
function handleScrollTouchEnd(e) {
    var st = scrollTouch;
    scrollTouch = null;
    if (!st) return;

    if (scrollY < 0) {
        if (st.rawOver > scrollViewH * 0.12 || st.velocity < -0.5) {
            animateScrollTo(0, { onDone: function () { try { Android.onChapterStart(); } catch (e) {} } });
        } else {
            animateScrollTo(0);
        }
        return;
    }
    // 底部越界：拖过底部后松手
    if (scrollY > scrollMax) {
        if (st.rawOver > scrollViewH * 0.12 || st.velocity > 0.5) {
            animateScrollTo(scrollMax, { onDone: function () { try { Android.onChapterEnd(); } catch (e) {} } });
        } else {
            animateScrollTo(scrollMax);
        }
        return;
    }
    // 惯性滚动（甩动）
    if (st.moved && Math.abs(st.velocity) > 0.05) {
        startMomentum(st.velocity);
    } else {
        notifyJavaPageChange();
    }

// ============ Java 调用接口 ============
/**
 * 换书清场：复用池的 WebView 跨 Activity 常驻，文档还停在上一本书的那一页，
 * 而新书要先拿到目录、再回源正文才谈得上渲染 —— 这段加载期用户读到的是上一本书的正文。
 * 这里只把两路渲染清空、位置状态归零，主题底色/字体/纹理一概不动，也不重载 reader.html
 * （那等于把复用池省下的冷启动又还回去）。Java 侧只在「池里那份文档属于另一本书」时调它，
 * 同一本书退出再进仍保留旧画面，那是秒开的一部分。
 */
function clearReaderDocument() {
    // 跨章那套在途状态一并作废：不清的话，新书第一章恰好撞上 _xTurnBusy 窗口时，
    // loadHtmlContent 会走「邻章排版盒已换上、Java 正文只当确认」的快路，把旧书的纸带原样留在场上。
    _xTurnBusy = false;
    _xCrossFlipping = false;
    _boundaryPending = false;
    _htmlXReady = null;
    _htmlContentGen++;          // 旧书的每一页副本都出局：签名再像也不能复用
    if (htmlMode) {
        htmlResetTurnLayer();                   // 仿真书本 + 动画层 + 邻章排版盒
        htmlDisposeMirrors();
        var c = document.getElementById('htmlContent');
        var cols = document.getElementById('htmlColumns');
        clearFullscreenBackground(c);           // 整页画的背景挂在视口层上，不清就换书还衬着一张旧封面
        if (cols) { cols.innerHTML = ''; cols.style.transform = ''; }
        if (c) c.scrollTop = 0;
        htmlPage = 0;
        htmlPageCount = 1;
    } else {
        if (simulationActive || _simulationPlaceholderActive) { try { destroySimulation(); } catch (e) {} }
        pages = [];
        pageStartOffsets = [];
        currentPage = 0;
        currentContent = '';
        drawBlank();
    }
    chapterTitle = '';
    bookProgress = 0;
    updateHtmlHeaderFooter();   // 页眉的章节名、页脚的页码也是上一本书的
}


// ✅ 复用池 WebView 关键修复：reader.html 由池子只 loadUrl 一次（首次加载时 WebView 尚未 attach，
//    window.innerWidth/innerHeight=0）。后续 attach 到布局后，JS 视口宽高滞后于原生布局——
//    若此时恰好执行 loadContent，会在 0 宽下分页/绘制：画布 0 尺寸→整页空白，且上报给 Java 的
//    总页数是畸形值，表现为「翻不了页 / 恢复不到页」。故尺寸未就绪时先把渲染意图存起来，
//    等下一帧 / resize 回调拿到真实尺寸后再真正排版绘制。
function loadContent(chapterIndex, title, content, startPage, isLocal, progress, cachedPagesJson, cacheKey) {

    //    此刻无条件 initSimulation 会摧毁在途 flipbook，turn.js 内部状态机崩溃
    //    （Uncaught TypeError: reading 'data'），事件链断裂、页码上报丢失（真机实测踩中）。

    //    与 JS 当前位置不一致，说明它是「用户已折返/又跨了一章」后迟到的过时回送——执行它会把
    //    用户拉回刚离开的章（「跳回未翻之前的页」）。丢弃之，并调 onChapterResync 让 Java 把索引
    //    同步到 JS 实际位置、按正确落点页重发，两端重新对齐。
    //    ⚠️ 判据必须含 _suppressPageNotify：落地即清 _xTurnBusy 后，迟到的 loadContent 仍会在
    //    抑制窗口内到达（实测被拉回刚离开的章）。窗口外（开书/目录跳章）不校验——那时 JS 索引
    //    本就靠 loadContent 设置。
    if ((_xTurnBusy || _suppressPageNotify) && typeof chapterIndex === 'number' && chapterIndex !== currentChapterIndex) {

        try {

    _suppressPageNotify = false;
    _xTurnBusy = false;
    currentChapterIndex = chapterIndex;
    chapterTitle = title;
    currentContent = preprocessContent(content);

    // ✅ 排版缓存恢复：若 Java 侧命中了「上次退出本章时的排版」（layout signature 一致），
    //    直接载入已分页的 pages，跳过整章重新分页 —— 这正是「进入书籍不再每次重排」的关键。
    //    cachedPagesJson = "{pages:[...],offsets:[...]}" 的 JSON；cacheKey 由 Java 计算并回传。

    var _restoreOk = false;

                pageStartOffsets = _cp.offsets;
                pagesRestoredFromCache = true;
                _restoreOk = true;

    htmlMode = false;
    var _hc = document.getElementById('htmlContent');
    if (_hc) {
        _hc.style.display = 'none';
        _hc.classList.remove('scroll-flow');
        _hc.scrollTop = 0;
        clearFullscreenBackground(_hc);   // 长章底图是画在视口层上的，退章必须擦掉
    }

    var _hcols = document.getElementById('htmlColumns');
    if (_hcols) {
        htmlResetTurnLayer();   // 快照/仿真书本挂在同一个视口层里，退 HTML 模式一并拆掉
        _hcols.style.transform = '';
        _hcols.style.columnWidth = '';
        _hcols.style.columnGap = '';
        _hcols.innerHTML = '';
    }
    if (canvas) { canvas.style.display = ''; canvas.style.visibility = 'visible'; }
    var _fb = document.getElementById('flipbookContainer');
    if (_fb) _fb.style.display = '';   // 仿真模式由 initSimulation 重新显示

    if (typeof isLocal !== 'undefined') {
        isLocalBook = isLocal;
    }
    if (typeof progress !== 'undefined') {
        bookProgress = progress;
    }

    console.log('loadContent 接收内容长度: ' + content.length);

    // ✅ 尺寸就绪前：缓存渲染意图，延迟到真实视口尺寸就绪后再绘制（避免 0 宽导致空白/畸形分页）
    if (window.innerWidth <= 0 || window.innerHeight <= 0) {
        _pendingLoad = {
            chapterIndex: chapterIndex, title: title, content: currentContent,
            startPage: startPage, isLocal: isLocal, progress: progress,
            cacheKey: cacheKey, restoreOk: _restoreOk

/** 等待视口尺寸就绪后再执行真实渲染；尺寸就绪前用 rAF 轮询，不依赖 resize 事件是否准时触发 */
function _scheduleLayoutRender() {
    if (window.innerWidth > 0 && window.innerHeight > 0) {
        if (_pendingLoad) { var p = _pendingLoad; _pendingLoad = null; _finishLoadContent(p); }
    } else {

        else setTimeout(_scheduleLayoutRender, 16);
    }

/** loadContent 的「尺寸就绪后」渲染逻辑：仅在 window.innerWidth/innerHeight 有效时调用 */

    //    变化 / 旧版缓存没有 vw/vh），直接恢复会因 drawPage 的底部越界跳行逻辑被整段砍掉若干行，

    if (pagesRestoredFromCache) {

                && _cachedLayoutViewport.w === window.innerWidth
                && _cachedLayoutViewport.h === window.innerHeight;
        if (!_vpOk) {
            pagesRestoredFromCache = false;
            _restoreOk = false;
        }
        _cachedLayoutViewport = null;
    }
    resizeCanvas();

    if (isScrollMode()) {
        // 滚动模式：resizeCanvas 已重排为长卷；按 startPage 还原阅读位置（以"屏"为单位）
        var totalScreens = virtualTotalPages();

            scrollY = 0;
        }

        drawScroll();

        } else {
            currentPage = 0;
        }
        // ✅ 关键修复（覆盖全部主题模式）：从排版缓存恢复章节时，pages 携带「上次分页时固化的文字色/背景」，
        //    与当前主题（夜间 / 日间纯色 / 护眼绿 / 羊皮纸 / 纹理）不符，会导致正文消失或颜色错乱。
        //    此处用当前主题的色值重新对齐缓存页：夜间走 setNightMode(true)，其余走 setTextColor/setBackgroundColor
        //    （setNightMode/setTextColor 会遍历 pages 改 color 并重绘，与阅读中切换主题的行为一致）；
        //    纹理模式额外用 _pendingTexture 重新拉起纹理。覆盖「WebView 宽度就绪晚于 loadContent」的重进路径；

        if (pagesRestoredFromCache) {

            }

    //    把分页结果交给 Java 落盘，下次进入本书同章同排版即可跳过重新分页。
    //    占位内容 / 滚动模式(updown) / 已从缓存恢复(_restoreOk) 时不回写。
    //    ✅ 回写带上分页时刻的视口 vw/vh，恢复时据此校验视口一致性（防跨会话尺寸错位 → 底部跳行）。
    if (!_restoreOk && !isScrollMode()
            && typeof cacheKey !== 'undefined' && cacheKey && cacheKey.length > 0
            && typeof Android !== 'undefined' && Android && Android.cacheChapterLayout) {

    }

}

// ============ 内容预处理 ============
function preprocessContent(text) {
    if (!text) return '';
    // 将 <br>, <br/>, <p>, </p>, <div>, </div> 等转为换行
    text = text.replace(/<br\s*\/?>/gi, '\n');
    text = text.replace(/<\/p>/gi, '\n');
    text = text.replace(/<p[^>]*>/gi, '');
    text = text.replace(/<\/div>/gi, '\n');
    text = text.replace(/<div[^>]*>/gi, '');
    // 去除其余 HTML 标签
    text = text.replace(/<[^>]+>/g, '');
    // 解码常见 HTML 实体
    text = text.replace(/&nbsp;/g, ' ');
    text = text.replace(/&lt;/g, '<');
    text = text.replace(/&gt;/g, '>');
    text = text.replace(/&amp;/g, '&');
    text = text.replace(/&quot;/g, '"');
    text = text.replace(/&#39;/g, "'");
    // 统一换行符
    text = text.replace(/\r\n/g, '\n');
    text = text.replace(/\r/g, '\n');
    // 合并连续空行（超过2个空行压缩为2个）
    text = text.replace(/\n{3,}/g, '\n\n');
    return text;
}

// ============ HTML 富文本渲染模式（保留 EPUB 样式） ============
// 仅当章节携带 HTML 内容（loadHtmlContent）时启用；普通纯文本仍走 Canvas 路径。
// 分页方式与多看 / Readium / epub.js 一致：用 CSS 多列（column-width）把正文横向排成 N 列，
// "一列 = 一页"，翻页 = 整组平移（translateX）。这样 HTML 模式的"页"与 Canvas 引擎的"页"
// 语义统一，goToPage / nextPage / prevPage / virtualTotalPages / virtualCurrentPage 可直接复用。
// pageTurnMode === 'updown' 时切换为单列连续滚动（scrolled），即改造前的行为。
var htmlMode = false;
var htmlFlow = 'paginated';   // 'paginated'（横向分栏翻页）| 'scrolled'（上下滚动）
var htmlPage = 0;             // 当前页（0 起）
var htmlPageCount = 1;        // 本章总页数
var htmlColW = 0;             // 单列宽（= 一页正文宽）
var htmlGap = 0;              // 列间距
var htmlStep = 0;             // 每页平移距离 = 列宽 + 列间距
var htmlClientH = 0;          // 视口高度（缓存）

// 把当前主题（背景/文字色/字号/字体）应用到 HTML 容器，保持与 Canvas 模式视觉一致。
// keepPosition !== false 时，重排后按原进度比例还原位置（改字号 / 切模式不该跳回开头）。
function applyHtmlTheme(keepPosition, deferSimBuild) {
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols) return;
    c.classList.toggle('html-night', !!isNightMode);   // 全面屏页的夜间暗纱/文字提亮靠它
    c.style.backgroundColor = bgColor;
    c.style.color = textColor;
    cols.style.fontSize = fontSize + 'px';
    cols.style.lineHeight = lineHeightRatio;
    cols.style.fontFamily = fontFamily;
    applyHtmlFlow(keepPosition !== false, deferSimBuild);
}

// ============ 设置变更后的统一重建（HTML 纸带一路）============
// 与 canvas 一路同构：改配色只需重画（redrawCurrent 的对应物），改排版才整章重排
// （relayoutAndRedraw 的对应物）。设置弹窗一次改多个参数，_deferDraw 期间只登记最重的那一档，
// 由 finishSettingsBatch 收尾做一次 —— 否则八个 setter 就是八次重排加八次重建仿真书本。
var _htmlRebuild = '';

function rebuildHtml(kind) {
    _htmlRebuild = (kind === 'layout' || _htmlRebuild === 'layout') ? 'layout' : 'colors';
    if (_deferDraw) return;
    flushHtmlRebuild();
}

function flushHtmlRebuild() {
    if (!_htmlRebuild) return;
    var kind = _htmlRebuild;
    _htmlRebuild = '';
    if (kind === 'layout') applyHtmlTheme(true);
    else applyHtmlThemeColors();
}

// 记录当前章内进度（0~1），用于重排后按比例还原阅读位置
function htmlPositionRatio() {
    var c = document.getElementById('htmlContent');
    if (!c) return 0;
    if (htmlFlow === 'scrolled') {
        var max = c.scrollHeight - c.clientHeight;
        return max > 0 ? Math.min(1, Math.max(0, c.scrollTop / max)) : 0;
    }
    return htmlPageCount > 1 ? htmlPage / (htmlPageCount - 1) : 0;
}

// ============ 仿真书本的「这一本还配不配得上当前正文」判据 ============
// 书本的每一页都是整条多列纸带的副本，建一本要五次整页重排（真机 200~280ms）。Java 每次回送正文
// 之后还要连推整套外观参数（档位一次、设置批次一次），参数一个字没变时旧路会把刚建好的书拆了重建
// —— 真机实测一次换章建三本、卡 1.2s。签名全等就说明副本仍旧合用，原样留着。
// 判据取「排版输入 + 量出来的输出」两头：只认输入会漏掉图片异步解码撑长纸带那种情况（页数变了而
// 书本的 totalPages 还停在旧值，末页就翻不出去）；只认输出会漏掉字体刚加载到位那种字形变了、
// 页数恰好没变的情况（见 loadCustomFont 里那两处 _htmlLayoutBump）。
var _htmlContentGen = 0;   // 纸带正文换了一代（整段 innerHTML 重写）
var _htmlLayoutBump = 0;   // 签名表达不出来的「必须重建」：自定义字体加载到位
var _htmlLayerSig = '';    // 当前这本仿真书本按哪个签名建的；拆掉即清空

function htmlLayerSignature() {
    return [pageTurnMode, htmlViewW(), htmlClientH, window.innerWidth, window.innerHeight,
            Math.round(htmlStep), Math.round(htmlColW), Math.round(htmlGap), htmlPageCount,
            currentChapterIndex, _htmlContentGen, _htmlLayoutBump,
            fontSize, lineHeightRatio, paraGapRatio, fontFamily, padding, vPadding, topPadding,
            showHeaderFooter ? 1 : 0, headerFooterFontSize, chapterTitle || '',
            bgColor, textColor, isNightMode ? 1 : 0].join('#');
}

// 依据 pageTurnMode 决定分页方式（横向分栏 / 上下滚动），并重新计算列宽与页数。
// keepPosition 为真时按原进度比例还原位置。
// deferSimBuild：排完几何但不建仿真书本。换章那一路要用 —— 同步趟里量到的尺寸可能还没稳定，
// 等一帧后的精确趟才是书本该照的几何；两头各建一本等于白付一次整本书的重排（真机单趟约 250ms），
// 中间那一帧露出的是已经排好的真纸带，不是空白。
function applyHtmlFlow(keepPosition, deferSimBuild) {
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols || !htmlMode) return;
    var ratio = keepPosition ? htmlPositionRatio() : 0;
    var scrolled = (pageTurnMode === 'updown');
    htmlFlow = scrolled ? 'scrolled' : 'paginated';
    cols.style.transform = '';
    if (scrolled) {
        // 单列连续滚动：恢复原生纵向滚动
        c.classList.add('scroll-flow');
        cols.style.columnWidth = '';
        cols.style.columnGap = '';
    } else {
        c.classList.remove('scroll-flow');
    }
    layoutHtmlColumns();
    // 量完才知道新几何配不配得上手上这本：对不上才把动画层整个拆掉（副本按新尺寸重画）。
    // #htmlContent 是定尺寸的视口层、副本又不在真纸带里，故旧书留在场上不影响这一趟测量。
    var sig = htmlLayerSignature();
    var reuse = !!htmlSim && sig === _htmlLayerSig;
    if (!reuse) htmlResetTurnLayer();
    if (!keepPosition) {
        htmlGoToPage(0);
    } else if (htmlFlow === 'scrolled') {
        var max = c.scrollHeight - c.clientHeight;
        c.scrollTop = Math.max(0, Math.round(ratio * max));
        notifyJavaPageChange();
    } else {
        htmlGoToPage(Math.round(ratio * (htmlPageCount - 1)));
    }
    // 签名全等就别碰书本：htmlInitSim 头一件事是拆掉旧书，所以「免重建」必须连它一起跳过。
    if (htmlFlow === 'paginated') {
        if (deferSimBuild) {
            // 换章的同步趟只量几何，书本留给下一帧那一趟（尺寸可能还没稳定）
        } else if (reuse) {
            // 副本只是给下一次拖拽预备的，晚一帧无妨
            setTimeout(function () { htmlSimEnsure(htmlPage); }, 0);
        } else {
            htmlInitSim();
        }
    }
    updateHtmlHeaderFooter();
}

// 计算页边距 / 列宽 / 列间距，并重新测量总页数（不改动当前位置）。
// 要点：容器宽度 = 视口宽，column-width 也 = 一列正文宽，因此只排得下 1 列；
// 超出列高的内容会横向溢出成"额外列"（正是我们要的多页），由视口 overflow:hidden 裁剪。
// colsOverride：只给「量邻章」那一路用 —— 邻章纸带盒不靠抢 id 上位（那要先插到真纸带前面、
//    量完再挪回末尾，一来一回各一次整章重排），它排在视口层末尾、由参数直接交进来。
function layoutHtmlColumns(colsOverride) {
    var c = document.getElementById('htmlContent');
    var cols = colsOverride || document.getElementById('htmlColumns');
    if (!c || !cols) return;
    var W = c.clientWidth || window.innerWidth || 1;
    // 为页眉页脚预留空间（与 Canvas 模式一致），避免正文被覆盖：
    // 页眉占用 headerFooterFontSize + 10 + 半行；页脚占用 headerFooterFontSize + 12。
    var headerSpace = (showHeaderFooter && chapterTitle) ? (headerFooterFontSize + 10 + Math.floor(fontSize / 2)) : 0;
    var footerSpace = showHeaderFooter ? (headerFooterFontSize + 12) : 0;
    var pgSide = padding;                     // 左右页边距
    var pgTop = topPadding + headerSpace;     // 顶部留白（避开状态栏 / 页眉）+ 页眉高度
    var pgBottom = padding + footerSpace;
    htmlClientH = c.clientHeight || window.innerHeight || 1;
    // 「全面屏」页要分两种：整页就是一张画的章，和「正文很长但 body 挂了张底图（多为纸纹）」的章。
    // 只有前者才把整列收归自己（分页盒内外边距取 0，页边距降为页内 padding），这样背景图按「整屏」
    // cover，用户改页边距 / 开关页眉页脚都不再参与它的几何。
    // 为什么不用负 margin 出血：多列布局按「列内容盒底」折断碎片，负 margin 只挪盒子、不延长碎片，
    // 底部永远留一条 (页边距 + 页脚高) 的空白带（真机实测 48 CSS px）；侧向负 margin 还会把盒子
    // 撑成跨两列，背景图按两倍列宽 cover 缩放后被裁，画面看着就「不对」。
    // 判据用「收归整列之后还剩几页」而不是「普通页边距下剩几页」：卷首画自带 margin-top:50% 之类的
    // 高外框，按普通页边距量会多出 30~50px 的溢出被折成两页，从而被误判成长章节。
    var fs = cols.querySelector('.epub-chapter.epub-fs');
    if (!fs) clearFullscreenBackground(c);
    var side = fs ? 0 : pgSide, top = fs ? 0 : pgTop, bottom = fs ? 0 : pgBottom;
    setPagePadding(cols, side, top, bottom);
    if (fs) applyFullscreenPage(fs, pgTop, pgSide, pgBottom, true);
    if (htmlFlow === 'scrolled') {
        htmlGap = 0;
        htmlStep = 0;
        htmlColW = Math.max(1, W - side * 2);
        var sc = Math.max(1, Math.ceil(c.scrollHeight / htmlClientH));
        if (fs && sc > 1) {
            sc = restorePageMargins(fs, cols, W, pgTop, pgSide, pgBottom, true);
            side = pgSide;
        }
        htmlPageCount = sc;
        return;
    }
    // 列间距 = 屏宽 6%（不小于 16px），且不得小于「两页各自的内侧留白」，见 setHtmlColumnGeom
    setHtmlColumnGeom(cols, W, side);
    var count = measureColumnCount(cols, side);
    if (fs && count > 1) restorePageMargins(fs, cols, W, pgTop, pgSide, pgBottom, false);
    htmlPageCount = count;
}

/**
 * 纸带的分栏几何：列宽 = 视口宽 - 左右页边距，列间距按「至少 2× 页边距」兜底。
 * 为什么间距要跟页边距挂钩：每页是把整条纸带平移 -p*htmlStep 摆进视口这个窗口的，
 * 下一列的左边缘落在 W - (页边距 - 列间距) 处。列间距一旦小于页边距，下一页最左边
 * (页边距 - 列间距) px 就落在窗口里，正文左右两缘各露出一条被切齐的字（默认边距 24 /
 * 间距 22 → 2px；边距拉到 40 → 18px）。取 2× 页边距时 htmlStep 恰好等于视口宽，
 * 一页 = 一个视口，镜像池停在左侧那张也不会和当前页错位。
 */
function setHtmlColumnGeom(cols, W, side) {
    htmlGap = Math.max(16, Math.round(W * 0.06), side * 2);
    htmlColW = Math.max(1, W - side * 2);
    cols.style.columnWidth = htmlColW + 'px';
    cols.style.columnGap = htmlGap + 'px';
    htmlStep = htmlColW + htmlGap;
}

/**
 * 长章节退回普通页边距：撤掉整页画外框，重量分页盒与页数。
 * @return {number} 退回后的页数（滚动模式用；分页模式已就地更新 htmlPageCount）
 */
function restorePageMargins(fs, cols, W, top, side, bottom, scrolled) {
    applyFullscreenPage(fs, top, side, bottom, false);
    setPagePadding(cols, side, top, bottom);
    if (scrolled) {
        htmlColW = Math.max(1, W - side * 2);
        return Math.max(1, Math.ceil(document.getElementById('htmlContent').scrollHeight / htmlClientH));
    }
    setHtmlColumnGeom(cols, W, side);   // 整页画那趟是按 side=0 量的，退回普通边距要连列间距一起重算
    htmlPageCount = measureColumnCount(cols, side);
    return htmlPageCount;
}

/** 分页盒的页边距：同时把「一页正文高」写给插图当高度上限（见 #htmlContent img 的 max-height） */
function setPagePadding(cols, side, top, bottom) {
    cols.style.padding = top + 'px ' + side + 'px ' + bottom + 'px ' + side + 'px';
    cols.style.setProperty('--page-body-h',
            Math.max(1, (document.getElementById('htmlContent').clientHeight || window.innerHeight || 1) - top - bottom) + 'px');
}

/** 由 scrollWidth 反推列数；个别 WebView 内核不算溢出列时改用最后一个子元素的右边界兜底 */
function measureColumnCount(cols, side) {
    var span = cols.scrollWidth - side * 2;
    var count = Math.max(1, Math.round((span + htmlGap) / htmlStep));
    if (count <= 1) {
        var lastRight = htmlLastColumnRight(cols, side);
        if (lastRight > htmlColW) {
            count = Math.max(1, Math.round((lastRight + htmlGap) / htmlStep));
        }
    }
    return count;
}

/**
 * 全面屏页排版。onePage=true 时盒子正好等于一整列（宽 = 视口宽，高 = min-height = 视口高），
 * 背景图因此铺满整屏；高度不超出列内容盒 → 不会被折断到下一列，也就不会留下底部空白带。
 * onePage=false（正文跨多页）时保留正常页边距给文本，底图则交给视口层铺满四周：
 * 碎片盒最多只有一页正文那么大，画在它身上的图必然被页边距内缩，而原书写的是
 * background-attachment: fixed —— 作者要的就是「钉在屏幕上、四周无留白」。
 */
function applyFullscreenPage(fs, top, side, bottom, onePage) {
    var c = document.getElementById('htmlContent');
    if (!onePage) {
        fs.classList.remove('epub-fs-one');
        fs.style.margin = '';
        fs.style.padding = '';
        fs.style.minHeight = '';
        fs.style.backgroundSize = '';
        fs.style.backgroundRepeat = '';
        hoistFullscreenBackground(fs, c);
        return;
    }
    clearFullscreenBackground(c);
    fs.classList.add('epub-fs-one');
    fs.style.margin = '0';
    fs.style.padding = top + 'px ' + side + 'px ' + bottom + 'px ' + side + 'px';
    fs.style.minHeight = htmlClientH + 'px';
    fs.style.backgroundSize = '';
    fs.style.backgroundRepeat = '';
}

// 底图被挪到视口层的那个元素；换章 / 退回整页画模式时按它把内联样式擦干净。
var _fsBleedSource = null;

function hoistFullscreenBackground(fs, c) {
    if (!c || !fs) return;
    var st = getComputedStyle(fs);
    var img = st.backgroundImage;
    if (!img || img === 'none') { clearFullscreenBackground(c); return; }
    // 书中普遍写 cover；没写尺寸的按屏宽屏高铺开，别让原图尺寸决定留白。
    var size = st.backgroundSize;
    c.style.backgroundImage = img;
    c.style.backgroundSize = (!size || size === 'auto auto' || size === 'auto') ? 'cover' : size;
    c.style.backgroundPosition = st.backgroundPosition || 'center';
    c.style.backgroundRepeat = st.backgroundRepeat || 'no-repeat';
    c.classList.add('fs-bleed');
    fs.style.backgroundImage = 'none';
    _fsBleedSource = fs;
}

function clearFullscreenBackground(c) {
    if (_fsBleedSource) {
        _fsBleedSource.style.backgroundImage = '';
        _fsBleedSource = null;
    }
    if (!c) return;
    c.classList.remove('fs-bleed');
    c.style.backgroundImage = '';
    c.style.backgroundSize = '';
    c.style.backgroundPosition = '';
    c.style.backgroundRepeat = '';
}

// 遍历正文的直接子元素，取最靠右的边界（相对第一列左边缘），用于反推总列数
function htmlLastColumnRight(cols, side) {
    // 章内样式是 <style>（display:none，无布局盒），必须按类名取正文容器，不能拿第一个子元素
    var chapter = cols.querySelector('.epub-chapter');
    if (!chapter) return 0;
    var base = cols.getBoundingClientRect().left + side;
    var kids = chapter.children;
    var maxRight = 0;
    for (var i = 0; i < kids.length; i++) {
        var r = kids[i].getBoundingClientRect().right - base;
        if (r > maxRight) maxRight = r;
    }
    return maxRight;
}

function loadHtmlContent(chapterIndex, title, html, startPage, isLocal, progress, paintGen) {
    // 无缝跨章的落地确认：这一章的 HTML 刚由邻章排版盒换上（逐字节相同），Java 回送的正文就只当确认 ——
    //    不重建 DOM、不重排：纸带已经是排好的那条，再排一次会把已解码的插图重刷一遍，白闪一下。
    //    判据三样都缺一不可：跨章窗口还在（_xTurnBusy，超时即失效）、索引就是本章、HTML 逐字相同。
    if (_xTurnBusy && _htmlXReady != null && chapterIndex === currentChapterIndex
            && html === _htmlXReady
            && (startPage === null || startPage === undefined || startPage === 1 || startPage === -1)) {
        _htmlXReady = null;
        _boundaryPending = false;
        _suppressPageNotify = false;
        _xTurnBusy = false;
        if (typeof isLocal !== 'undefined') isLocalBook = isLocal;
        if (typeof progress !== 'undefined') bookProgress = progress;
        chapterTitle = title;
        htmlGoToPage(startPage === -1 ? htmlPageCount - 1 : htmlPage);   // 落点就是该到的页，只校准
        notifyJavaPageChange();
        updateHtmlHeaderFooter();
        notifyJavaPainted(paintGen);
        return;
    }
    _htmlXReady = null;
    _boundaryPending = false;
    _suppressPageNotify = false;
    _xTurnBusy = false;
    currentChapterIndex = chapterIndex;
    chapterTitle = title;
    if (typeof isLocal !== 'undefined') isLocalBook = isLocal;
    if (typeof progress !== 'undefined') bookProgress = progress;

    htmlMode = true;
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols) return;
    htmlPage = 0;
    htmlPageCount = 1;
    // 上一章的快照/仿真书本与新正文的列宽无关，换章第一件事就是拆动画层
    htmlResetTurnLayer();
    cols.style.transform = '';
    // .epub-chapter 包装层由 Java 侧连书中 body 的 class 一起产出（全面屏页要靠那个 class 命中背景图），
    //    这里不再二次包裹；空章兜底一个空容器，保证 .epub-chapter 选择器始终有落点。
    cols.innerHTML = html || '<div class="epub-chapter"></div>';
    _htmlContentGen++;   // 正文换代：旧书本的每一页副本都是上一章的纸，签名再像也不能留
    c.style.display = 'block';
    c.scrollTop = 0;
    // 隐藏 Canvas / 仿真层，避免拦截触摸与重绘
    if (canvas) canvas.style.display = 'none';
    var fb = document.getElementById('flipbookContainer');
    if (fb) fb.style.display = 'none';
    if (_simulationPlaceholderActive || simulationActive) { try { destroySimulation(); } catch (e) {} }

    applyHtmlTheme(false, true);   // 先按当前主题落样式并量几何（此刻尺寸可能还没稳定，书本留给下一趟）

    // 等一帧让布局生效后再精确测量、定位到 startPage
    requestAnimationFrame(function () {
        applyHtmlTheme(true);
        if (startPage === -1) {
            htmlGoToPage(htmlPageCount - 1);                    // 跳到本章末尾
        } else if (typeof startPage === 'number' && startPage > 0) {
            htmlGoToPage(startPage - 1);
        } else {
            htmlGoToPage(0);
        }
        notifyJavaPageChange();
        notifyJavaPainted(paintGen);
    });
    console.log('loadHtmlContent 接收 HTML 长度: ' + (html ? html.length : 0) + ' flow=' + htmlFlow);
}

function htmlClientHeight() {
    var c = document.getElementById('htmlContent');
    return (c ? c.clientHeight : 0) || htmlClientH || window.innerHeight || 1;
}
function htmlCurrentPage() {
    if (htmlFlow === 'scrolled') {
        var c = document.getElementById('htmlContent');
        var h = htmlClientHeight();
        if (!c || h <= 0) return 0;
        return Math.min(htmlPageCount - 1, Math.max(0, Math.floor((c.scrollTop + h / 2) / h)));
    }
    return htmlPage;
}
/**
 * HTML 模式下刷新页眉页脚覆盖层（Canvas 模式由 canvas 自带绘制，这里仅补 HTML 模式）。
 * 页眉：章节标题（左对齐，顶部 topPadding 处）。
 * 页脚：左=电量/时间（可选），右=页码/进度（本地书追加百分比）。
 * 仅在 htmlMode 且 showHeaderFooter 开启时显示；其余情况隐藏。
 */
function updateHtmlHeaderFooter() {
    var hdr = document.getElementById('htmlHeader');
    var ftr = document.getElementById('htmlFooter');
    if (!hdr || !ftr) return;
    if (!htmlMode || !showHeaderFooter) {
        hdr.style.display = 'none';
        ftr.style.display = 'none';
        return;
    }
    // 页眉：章节标题
    if (chapterTitle) {
        hdr.textContent = chapterTitle;
        hdr.style.display = 'block';
        hdr.style.color = headerFooterColor;
        hdr.style.fontSize = headerFooterFontSize + 'px';
        hdr.style.paddingLeft = padding + 'px';
        hdr.style.paddingRight = padding + 'px';
        hdr.style.top = topPadding + 'px';
    } else {
        hdr.style.display = 'none';
    }
    // 页脚：左=电量/时间（可选），右=页码/进度
    var total = virtualTotalPages();
    var cur = virtualCurrentPage();
    var rightText = cur + '/' + total;
    if (isLocalBook && typeof bookProgress !== 'undefined') rightText += ' ' + bookProgress + '%';
    var leftEl = document.getElementById('htmlFooterLeft');
    var rightEl = document.getElementById('htmlFooterRight');
    if (leftEl) {
        if (showBatteryTime && (batteryText || timeText)) {
            leftEl.textContent = (batteryText || '') + (batteryText && timeText ? '  ' : '') + (timeText || '');
            leftEl.style.display = 'inline';
        } else {
            leftEl.textContent = '';
            leftEl.style.display = 'none';
        }
    }
    if (rightEl) {
        rightEl.textContent = rightText;
        rightEl.style.display = 'inline';
    }
    ftr.style.display = 'flex';
    ftr.style.color = headerFooterColor;
    ftr.style.fontSize = headerFooterFontSize + 'px';
    ftr.style.paddingLeft = padding + 'px';
    ftr.style.paddingRight = padding + 'px';
    ftr.style.bottom = '12px';
}
/** 无动画落到指定页（0 起）：重排与换章定位用的内部入口，
 *  对外（Java 跳页）走统一控制层的 goToPage，那里还要钳制页码与判在途。 */
function htmlGoToPage(p) {
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols) return;
    if (p < 0) p = 0;
    if (p >= htmlPageCount) p = htmlPageCount - 1;
    if (htmlFlow === 'scrolled') { HtmlPaging.scrollGoto(p); return; }
    turnSettle();                 // 在途动画先落地（会把 htmlPage 同步到落点）
    if (htmlSim) { if (!htmlSimPlace(p)) HtmlPaging.simGoto(p); return; }
    HtmlPaging.show(p);
}

// ============ HTML 一路的动画层后端（覆盖 / 平移 / 淡入 / 仿真）============
// 正文是「一整条多列纸带按页平移」，动画期间连纸带一起搬会把相邻页拖着走，
// 所以淡入与向后覆盖用「纸带快照」演：纸带静止当旧页，快照当新页压过来 / 淡进来。
// 平移与章界阻尼不建快照 —— 纸带本身就是轨道，直接搬它（见 HtmlPaging.trackSlide）。
// 向前覆盖另走一条：抬 #htmlStack 把活动页整张推走，新页的快照垫在底下按露出的宽度才画
// （见 htmlPushCard；快照当移动层时第一帧要栅格化一整页正文，是真机上剩下的那点掉帧）。
// 动效本身与 canvas 一路共用同一套（turnBegin / turnApply / turnRun / turnFinish）。

var htmlSim = null;       // 仿真模式下的 turn.js 书本状态
var _htmlStripBlanked = false;   // 真纸带被跨章动画藏起来了（见 htmlBlankStrip）

function htmlViewW() {
    var c = document.getElementById('htmlContent');
    return (c ? c.clientWidth : 0) || window.innerWidth || 1;
}

function htmlTurnHost() { return document.getElementById('htmlTurn'); }

/**
 * 覆盖档向前能推的「正文卡片」= #htmlStack。推不走就返回 null，调用方退回快照移动层：
 *   - 向后翻一律不推：向后要演的是「上一页从左侧整页盖进来」，动的必须是进来的那一页，
 *     而卡片是当下这一页 —— 推它右让就变成「底下的上一页静止显出」，那是另一种观感
 *     （真机逐像素比过：向前推与旧画法最坏差 0/255，向后差 203/255、均值 34）。
 *     向后的掉帧改由「按移动层起势预热镜像」去消（见 htmlPrimeMirrorPage）；
 *   - 仿真书本与上下档：当前页不是由一次位移决定的，搬卡片等于搬错东西；
 *   - 视口层挂了底图出血（fs-bleed，长章纸纹）：卡片要涂不透明纸面才盖得住底下的快照，
 *     连视口层的底图和夜间暗纱就一起被抹掉了，翻页时整屏一亮；
 *   - 要翻进去的那一页没有正停在池子里的镜像（还没预热上）：垫底那张得当场重画一整页，
 *     推与不推一样掉帧，不如走老路。
 */
/** 视口层里的「正文卡片」= 真纸带那一层。跨章落地是身份互换（预排盒当上卡片，旧卡片摘掉），
 *  它未必还排在第一个子节点，所以按 id 找、不按位置找（见 swapToAdjacentHtmlChapter）。 */
function htmlStackEl(c) {
    for (var i = 0; i < c.children.length; i++) {
        var e = c.children[i];
        if (e.id === 'htmlStack') return e;
    }
    return null;
}

function htmlPushCard(dir) {
    if (dir < 0 || htmlSim || htmlFlow !== 'paginated') return null;
    var c = document.getElementById('htmlContent');
    var card = c && htmlStackEl(c);
    if (!card || !card.firstElementChild
            || card.firstElementChild.id !== 'htmlColumns') return null;
    if (c.classList.contains('fs-bleed')) return null;
    return htmlMirrorParked(htmlPage + dir) ? card : null;
}

/** 池子里有没有一张空闲镜像正停在第 i 页 —— 停着即纹理是热的，借来垫底不用当场栅格化一整页 */
function htmlMirrorParked(i) {
    for (var k = 0; k < _htmlMirrors.length; k++) {
        var m = _htmlMirrors[k];
        if (m.free && m.gen === _htmlMirrorGen && m.parked === i) return true;
    }
    return false;
}

/** 把真纸带落到第 p 页（动画收尾 / 无动画跳页都走这里，保证位移口径只有一处） */
function htmlSetStripPage(p) {
    var cols = document.getElementById('htmlColumns');
    if (!cols) return;
    if (_htmlStripBlanked) { cols.style.visibility = ''; _htmlStripBlanked = false; }
    cols.style.transform = 'translateX(' + (-p * htmlStep) + 'px)';
}

/** 跨章动画期间把真纸带藏起来：两页都由快照节点出演且铺满视口，纸带只会在节点边缘漏出一像素 */
function htmlBlankStrip() {
    var cols = document.getElementById('htmlColumns');
    if (!cols) return;
    cols.style.visibility = 'hidden';
    _htmlStripBlanked = true;
}

/**
 * 视口层的「纸面」= 底色 + 底图，读成数组好一次算完多处用。
 * 快照页（仿真书本、翻页动画层、淡入垫层）是一张张独立纸面，挂在 #htmlTurn 里但
 * 不吃 #htmlContent 的 background 继承，所以抄的时候要连底图一起抄 —— 长章的出血底图就在这一层。
 */
function htmlPaper() {
    var c = document.getElementById('htmlContent');
    if (!c) return null;
    var cs = getComputedStyle(c);
    return [cs.backgroundColor, cs.backgroundImage, cs.backgroundSize, cs.backgroundPosition];
}

function paintHtmlPaper(node, paper) {
    if (!node) return;
    if (!paper) {
        paper = htmlPaper();
        if (!paper) return;
    }
    var st = node.style;
    st.backgroundColor = paper[0];
    st.backgroundImage = paper[1];
    st.backgroundSize = paper[2];
    st.backgroundPosition = paper[3];
}

/** 克隆第 p 页为一张独立快照：外层带上视口层的底色/底图，内层是整条纸带的副本 */
function htmlSnapNode(p) {
    var c = document.getElementById('htmlContent');
    var cols = document.getElementById('htmlColumns');
    if (!c || !cols) return null;
    var node = document.createElement('div');
    node.className = 'html-snap' + (c.classList.contains('fs-bleed') ? ' fs-bleed' : '');
    paintHtmlPaper(node);
    var strip = cols.cloneNode(true);
    // 副本一律不带走 id：满文档只有真纸带那一条 #htmlColumns，getElementById 才不会被副本抢走
    // （样式改按 .html-cols 命中，副本带着 class 一起抄过来，分栏/字号/两端对齐照旧生效）
    strip.removeAttribute('id');
    // 克隆会连内联样式一起抄：真纸带此刻可能正被隐藏（仿真模式、跨章落地前的 blank），
    // 抄来的 hidden 得解掉 —— 但只能解成 inherit，不能写成 visible：
    // 复用池把镜像「停」在文档里靠的是外层 visibility:hidden，子节点上一个写死的 visible
    // 会把继承链打断，停着的快照就还在原处照画，屏幕上叠出第二页。
    strip.style.visibility = 'inherit';
    strip.style.transform = 'translateX(' + (-p * htmlStep) + 'px)';
    node.appendChild(strip);
    return node;
}

// ============ 快照镜像池（HTML 一路翻页不掉帧的关键）============
/* 一枚快照 = 整条纸带的副本。冷做一张并不贵（cloneNode 3ms），贵的是把它挂进文档：
   多列流必须从头重排一遍，真机实测 53ms，动画的第一帧就空在那儿；摘掉它再来一次又要 15ms
   —— 一次翻页前后共掉 70ms 上下，观感就是「按下去先卡一下再滑」。
   副本的布局只在正文或排版口径变了之后才作废，所以每章留着一两张已排好的镜像来回借：
   借 = 改内层纸带的 translateX + 抬到不透明（实测 1ms），还 = 只把 alpha 归零、留在文档里。
   停着的时候用 opacity:0 而不是 visibility:hidden：隐藏会让合成器丢掉这一层已经栅格化好的画面，
   下次借出去先重画一整页（真机实测每翻一页多掉 6~9 帧 50ms），而 alpha=0 的层纹理还在，抬起来就走。
   留在文档里也是前提：宿主 #htmlTurn 一旦 display:none，池内节点的布局会被一起丢掉，
   重新打开就是整章重排（实测 11ms），所以本路的宿主常开。 */
var _htmlMirrors = [];              // [{ node, strip, free, gen, parked }] —— parked = 纸带此刻停在哪一页
var _htmlMirrorTimer = 0;
var _htmlMirrorGen = 0;             // 正文口径的代次：作废时进一代，在途那几张归还时按代次清出去
var _HTML_MIRROR_MAX = 3;           // 淡入两页同屏 + 拖拽中途改向，三张兜得住；再多就是白占内存

/** 这一档同时需要几张镜像：覆盖档前后各一张预停在目标页上（向前当推卡片的垫底页，向后当移动层，
    见 htmlPrimeMirrorPage）；淡入一次要旧页新页各一张，前后两个方向都要停满，故要「当前 + 下一页 + 上一页」
    三张 —— 少一张就是向后翻当场重画一整页（真机 8 页连翻掉 6.2% 帧）；平移/上下一张就够转起来 */
function htmlMirrorWant() {
    return pageTurnMode === 'fade' ? 3 : (pageTurnMode === 'cover' ? 2 : 1);
}

/** 造一张并当场量一次布局 —— 这 53ms 只该出现在预热里，不该出现在翻页里 */
function htmlMakeMirror(i) {
    var host = htmlTurnHost();
    if (!host || htmlSim) return null;
    var node = htmlSnapNode(i);
    if (!node) return null;
    node.className = 'turn-page ' + node.className;
    var strip = node.querySelector('.html-cols');
    // 副本里的纸带动不了（动的是外层 .turn-page），留着 CSS 给真纸带的那条 will-change 只会
    // 让它按整条纸带的宽度（4010px 见方 = 12030×2400 设备像素）去开合成层；关掉它，快照层就只有视口大
    if (strip) strip.style.willChange = 'auto';
    node.style.opacity = '0';
    host.style.display = 'block';
    host.appendChild(node);
    void node.offsetHeight;         // 隐藏态不排版，必须在这里把重排付掉，借出去才快得起来
    var m = { node: node, strip: strip, free: true, gen: _htmlMirrorGen, parked: i };
    _htmlMirrors.push(m);
    return m;
}

/** 借第 i 页：优先挑已经停在这一页的镜像（改位移等于要重新栅格化一整页），命中只改位移；
    池子还没预热上就当场造一张，并留下继续用 */
function htmlBorrowMirror(i) {
    var pick = -1;
    for (var k = 0; k < _htmlMirrors.length; k++) {
        var m = _htmlMirrors[k];
        if (!m.free || m.gen !== _htmlMirrorGen) continue;
        if (m.parked === i) { pick = k; break; }
        if (pick < 0) pick = k;
    }
    if (pick >= 0) {
        var hit = _htmlMirrors[pick];
        hit.free = false;
        hit.parked = i;
        if (hit.strip) hit.strip.style.transform = 'translateX(' + (-i * htmlStep) + 'px)';
        // 预热可能把这张按「移动层的起势」停着（外层整页挪开一页 + cover 投影）。交出去先归位：
        // 静止页与推卡片的垫底页要的是 0 位移，移动层的位移随后由 turnApply 按方向写回。
        hit.node.style.transform = '';
        hit.node.classList.remove('cover');
        // 挂着的时候可能正好被改过配色（日夜渐变逐帧只刷已知的几张），借出去前对一次账
        var c = document.getElementById('htmlContent');
        if (c) hit.node.classList.toggle('fs-bleed', c.classList.contains('fs-bleed'));
        paintHtmlPaper(hit.node);
        hit.node.style.opacity = '1';
        return hit.node;
    }
    var made = _htmlMirrors.length < _HTML_MIRROR_MAX ? htmlMakeMirror(i) : null;
    if (made) {
        made.free = false;
        made.node.style.opacity = '1';
        return made.node;
    }
    var once = htmlSnapNode(i);     // 池满（连点 / 拖拽改向）：给一张游离快照，回收时直接摘掉
    if (once) once.className = 'turn-page ' + once.className;
    return once;
}

/** 还：镜像藏起来留在池里，非池内节点（游离快照、淡入垫层、邻章排版盒）照旧摘出文档 */
function htmlRecycleMirror(n) {
    if (!n) return;
    for (var k = 0; k < _htmlMirrors.length; k++) {
        var m = _htmlMirrors[k];
        if (m.node !== n) continue;
        // 借出去之后换过章/重排过：这张的内容已经对不上新口径，回收时直接出局，不能当空闲的借给下一章
        if (m.gen !== _htmlMirrorGen) {
            _htmlMirrors.splice(k, 1);
            if (n.parentNode) n.parentNode.removeChild(n);
            return;
        }
        m.free = true;
        n.style.opacity = '0';
        n.style.transform = '';
        // 档位class（cover 要投影）是一次性的，留着下次当静止页就会平白多出一道阴影
        n.className = 'turn-page html-snap';
        return;
    }
    if (n.parentNode) n.parentNode.removeChild(n);
}

/** 邻章预排盒用完回到待命位：留在视口层里藏起来 —— 搬出文档等于把刚排好的整章丢掉，
 *  下次取用又要 50~133ms 重排（镜像池同一套道理，见上面那段注释） */
function htmlParkXtBox(box) {
    box.style.visibility = 'hidden';
    box.style.transform = '';
    box.style.zIndex = '';
    box.className = 'html-snap';
    var c = document.getElementById('htmlContent');
    if (c && box.parentNode !== c) c.appendChild(box);   // 兜底：万一还在宿主里，回到视口层才待命
}

/** 动画层交还页节点：预排盒原地停放，其余按镜像池的规矩办（池内留着复用、游离的摘掉） */
function htmlRecyclePageNode(n) {
    if (n && n.__xtBox) { htmlParkXtBox(n); return; }
    htmlRecycleMirror(n);
}

/** 作废整池：换章 / 重排 / 进仿真都会让副本与新口径对不上。在途的那几张不硬摘，回收时按代次出局 */
function htmlDisposeMirrors() {
    _htmlMirrorGen++;
    if (_htmlMirrorTimer) { clearTimeout(_htmlMirrorTimer); _htmlMirrorTimer = 0; }
    for (var k = _htmlMirrors.length - 1; k >= 0; k--) {
        var m = _htmlMirrors[k];
        if (!m.free) continue;
        if (m.node.parentNode) m.node.parentNode.removeChild(m.node);
        _htmlMirrors.splice(k, 1);
    }
}

/** 翻完一页 / 跳页 / 重排之后补池：一次只排一张，避开动画在途，把 53ms 放到用户看不见的时候付 */
function htmlScheduleMirrorWarm() {
    if (_htmlMirrorTimer) return;
    if (!htmlMode || htmlSim || htmlFlow !== 'paginated') return;
    _htmlMirrorTimer = setTimeout(function () {
        _htmlMirrorTimer = 0;
        if (!htmlMode || htmlSim || htmlFlow !== 'paginated') return;
        // 动画在途 / 手指还按着都别付这 53ms：整章量版落在 touchStart 与首个 touchMove 之间，
        // 观感就是「按下去先卡一下再滑」。让开一拍再来，且不能就此放弃 —— 错过这一拍，
        // 下一次补池要等用户真翻一页才发生，而那一页正是当场造镜像、当场卡的地方。
        if (_turn || isAnimating || drag) { htmlScheduleMirrorWarm(); return; }
        var free = 0;
        for (var k = 0; k < _htmlMirrors.length; k++) {
            if (_htmlMirrors[k].free && _htmlMirrors[k].gen === _htmlMirrorGen) free++;
        }
        if (free < htmlMirrorWant()) {
            htmlMakeMirror(htmlPage);
            htmlScheduleMirrorWarm();
        } else {
            htmlPrimeMirrorPage();
            htmlScheduleXWarm();   // 池子热了，接着把章界那头的邻章也空闲排好（见那里）
        }
    }, 320);
}

/** 快照层贵在第一帧要把一整页正文从零栅格化（真机 8 页连翻掉 5~8% 帧、最坏一帧 83ms）。
    补完池的空档里把空闲镜像先停到要翻进去的那一页、抬到 1% 透明度让栅格化趁用户停顿时跑完，再归零：
    借出去就只剩改 alpha，实测向前同一串 8 页连翻 0 掉帧、最坏一帧 16.7ms。
    用 1% 而不是 0 —— 全透明的层 Blink 压根不出纹理，池里那张热的是「眼下这一页」，要翻进去的那页还是生的。
    真机量过 1% 的残影：整屏最大逐像素差 3/255、均值 0.48，肉眼看不出（5% 才开始显形）。
    覆盖档向前推卡片、向后由快照当移动层从左侧盖入（见 htmlPushCard），所以两张的停法不一样：
    下一页那张按 0 位移摆好当垫底，上一页那张连移动层的起势一起摆（见下面 targets[j] === prev）。
