    <style>
    body {

        overflow: hidden;
        background-color: #FFFFFF;
    }
    canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* 由页面自己处理滑动（跟手拖拽翻页），避免浏览器把手势当成滚动/缩放吃掉 */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;

    /* ===== HTML 富文本渲染模式（保留 EPUB 样式）=====
       仅在章节携带 HTML 内容时启用；普通纯文本仍走 Canvas 路径。
       分页方式与多看 / Readium / epub.js 一致：用 CSS 多列（column-width）
       把正文横向排成 N 列，"一列 = 一页"，翻页 = 整组平移（translateX）。
       #htmlContent 是固定尺寸的"视口"（负责裁剪），#htmlColumns 是横向溢出
       成多列的"纸带"（负责承载内容与平移）。
       pageTurnMode 为 'updown' 时切换到 .scroll-flow：退化为单列连续滚动。 */
    #htmlContent {
        position: fixed;
        left: 0; top: 0; right: 0; bottom: 0;
        overflow: hidden;              /* 裁剪视口之外的那些列 */
        display: none;
        z-index: 30;
        box-sizing: border-box;
        background-color: #FFFFFF;
        color: #1D1D1F;
        padding: 0;
    }
    #htmlColumns {
        height: 100%;
        box-sizing: border-box;
        column-fill: auto;             /* 填满一列高度再流到下一列（默认 balance 会把内容均摊，不适用） */
        -webkit-column-fill: auto;
        font-size: 18px;
        line-height: 1.8;
        will-change: transform;
    }
    /* 上下滚动模式：取消分栏，恢复原生纵向滚动（即改造前的行为） */
    #htmlContent.scroll-flow {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
    }
    #htmlContent.scroll-flow #htmlColumns {
        height: auto;
        column-width: auto !important;
        column-gap: 0 !important;
        transform: none !important;
        will-change: auto;
    }
    /* 正文容器背景交给阅读器主题，避免书中 body 的背景色块盖住主题底色 */
    #htmlContent .epub-chapter { margin: 0; background-color: transparent !important; }
    /* 「全面屏」页：书中把整页版式挂在 body.foo{background-image:url(..)} 上，包装层已带上同一个 class
       （见 LocalBookParser.buildEpubHtmlContent）。原书普遍写 fixed：那是给「一屏一页」的阅读器用的，
       在本阅读器会钉在视口上不随翻页移动（且 #htmlColumns 的 transform 会让 fixed 退化成相对定位），
       所以一律按 scroll 画在碎片上。 */
    #htmlContent .epub-chapter.epub-fs { background-attachment: scroll !important; }
    /* 长章节（跨多页）的底图不画在碎片盒上，改画在视口层 #htmlContent 上 —— 见 hoistFullscreenBackground。
       夜间同样要压暗纱，否则四周出血后整屏亮图会把灰字吃掉：::before 在 #htmlColumns 与页眉页脚之前
       绘制，只压图不压字；用 fixed 是因为滚动模式下 #htmlContent 自己就是滚动容器，absolute 会随内容滚走。 */
    #htmlContent.html-night.fs-bleed::before {
        content: ""; position: fixed; left: 0; top: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, .52); pointer-events: none;
    }
    /* 真正「整页就是一张画」的章（只占一页）才收归整列：外框尺寸由 layoutHtmlColumns 逐次写入，
       这里只锁住与分页布局有关的两件事。 */
    #htmlContent .epub-chapter.epub-fs-one {
        box-sizing: border-box;
        position: relative;
    }
    /* 夜间：图上盖一层暗纱，文字层反色并复位色相 —— 书中紫/朱砂仍认得出，但不再是压在亮图上的暗字。
       position:relative 是必需的：定位的 ::before 按绘制顺序在普通流内容之上，不抬起来暗纱会盖住文字。
       只作用于整页画：长章节的 body 底图多是纸纹，给 143 页正文逐段反色会把夜读字色弄反。 */
    #htmlContent.html-night .epub-chapter.epub-fs-one::before {
        content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, .52);
    }
    #htmlContent.html-night .epub-chapter.epub-fs-one > * {
        position: relative;
        filter: invert(1) hue-rotate(180deg);
    }
    /* 页内若真嵌了插图，父层反色会连图一起反掉，这里对图再反一次抵回去 */
    #htmlContent.html-night .epub-chapter.epub-fs-one img,
    #htmlContent.html-night .epub-chapter.epub-fs-one svg { filter: invert(1) hue-rotate(180deg); }
    /* 图片不得跨列断裂；高度上限用 --page-body-h（= 一列正文高，layoutHtmlColumns 每次写入），
       因为「一页能装下多高」由分页盒决定，写死 vh 会在页眉页脚占高较大时顶破列高，
       整张图被 break-inside:avoid 推去下一页，看起来就像「图没解析出来」。 */
    #htmlContent img {
        max-width: 100%; max-height: var(--page-body-h, 88vh); height: auto; object-fit: contain;
        break-inside: avoid; -webkit-column-break-inside: avoid;
    }
    #htmlContent p { margin: 0 0 0.6em 0; text-indent: 2em; }
    #htmlContent h1, #htmlContent h2, #htmlContent h3,
    #htmlContent h4, #htmlContent h5, #htmlContent h6 {
        text-indent: 0; line-height: 1.3; margin: 0.8em 0 0.4em 0;
        break-after: avoid; -webkit-column-break-after: avoid;
    }
    #htmlContent a { color: inherit; }
    #htmlContent pre, #htmlContent table, #htmlContent blockquote, #htmlContent figure {
        break-inside: avoid; -webkit-column-break-inside: avoid;
    }
    /* 正文两端对齐：与 Canvas 模式（fillLineText）同一口径，让每行填满列宽、左右边距严格相等。
       书籍自带 text-align 会盖过默认继承的 left，故用 !important 锁住。
       只作用于正文块级元素，标题的原有对齐（常见居中）保持不动。 */
    #htmlColumns p, #htmlColumns div, #htmlColumns li, #htmlColumns dd,
    #htmlColumns blockquote, #htmlColumns figcaption {
        text-align: justify !important;
        text-justify: inter-ideograph;
    }
    /* 依赖空白与边框的排版不参与两端对齐，否则代码/表格会被拉变形 */
    #htmlColumns pre, #htmlColumns code, #htmlColumns kbd, #htmlColumns samp,
    #htmlColumns table, #htmlColumns th, #htmlColumns td {
        text-align: left !important;
    }
    /* ===== HTML 模式的页眉页脚覆盖层（Canvas 模式由 canvas 自带绘制，这里仅补 HTML 模式）=====
       用 position:fixed 钉在视口上/下边缘，不随 #htmlColumns 的 translateX 平移，
       也不随上下滚动模式的内容滚动；pointer-events:none 让点击穿透到正文用于翻页。 */
    #htmlHeader, #htmlFooter {
        position: fixed;
        left: 0; right: 0;
        pointer-events: none;
        color: #8E8E93;
        font-size: 12px;
        line-height: 1;

        overflow: hidden;

    #htmlFooter {

        display: none;
        align-items: center;

    #htmlFooter span { white-space: nowrap; }
    #htmlFooterRight { margin-left: auto; text-align: right; }
    /* ===== HTML 模式的翻页动画层（覆盖 / 淡入 / 仿真）=====
       正文是「一整条多列纸带按页平移」，动画期间不能连纸带一起搬（相邻页会跟着动），
       所以把纸带连视口底色/底图一起克隆成「快照页」放进本层，动画收尾再把真纸带落到目标页。
       克隆保留 id="htmlColumns" → 分栏、字号、两端对齐那批 #htmlColumns 规则照旧命中；
       真纸带在文档序里排得更靠前，getElementById 仍然先取到它。
       z-index 20：压在正文之上、页眉页脚（35）之下 —— 动画期间页眉页脚不闪不跳。 */
    #htmlTurn {
        position: absolute;
        left: 0; top: 0; right: 0; bottom: 0;
        z-index: 20;
        display: none;
        overflow: hidden;
        pointer-events: none;   /* 快照只负责显示；仿真模式下由 .html-sim 打开触摸 */
    }
    #htmlTurn.html-sim { pointer-events: auto; }
    #htmlTurn .html-snap {
        position: absolute;
        left: 0; top: 0; width: 100%; height: 100%;
        overflow: hidden;
        will-change: transform, opacity;

    /* 覆盖翻页：新页压过来那条前缘的投影（方向决定投影落在哪一侧） */
    #htmlTurn .html-snap.cover-next { box-shadow: -14px 0 26px rgba(0, 0, 0, .26); }
    #htmlTurn .html-snap.cover-prev { box-shadow: 14px 0 26px rgba(0, 0, 0, .26); }
    /* 快照自带夜间底图暗纱：真视口层那条在本层之下，长章图页翻页时才不会一亮一暗 */
    #htmlContent.html-night #htmlTurn .html-snap.fs-bleed::before {
        content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, .52); pointer-events: none;
    }
    /* 仿真卷页的书本容器（与 canvas 路径的 #flipbook 各一只，结构样式按 .fbk 共用） */
    #htmlFlipbook { position: absolute; left: 0; top: 0; background-color: transparent; }
    #flipbookContainer {

        width: 100%;

        -webkit-backface-visibility: visible !important;
        backface-visibility: visible !important;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.03);
        position: absolute;
        top: 0;

    /* turn.js 翻页：wrapper 保持与页面一致的底色，翻折处不镂空 */

    .fbk .turn-page,
    .fbk .turn-page-wrapper,

    #flipbook .page-div::before {

        top: 0;
        left: 0;
        right: 0;
        bottom: 0;

<script>
// ============ 状态变量 ============
var canvas = document.getElementById('readerCanvas');
var ctx = canvas.getContext('2d');

var currentContent = '';
var chapterTitle = '';
var currentChapterIndex = -1;
var pages = [];
var pageStartOffsets = [];
var pagesRestoredFromCache = false; // ✅ 排版缓存恢复标记：loadContent 从 Java 缓存载入 pages 后置位，resizeCanvas 据此跳过整章重新分页

var _resizeScheduled = false;       // ✅ 复用池修复：resizeCanvas 在 0 尺寸时避免重复排队的标记

// 默认字体大小（根据屏幕宽度动态调整）
var fontSize = Math.max(14, Math.floor(window.innerWidth / 24));
var lineHeightRatio = 1.8;
var paraGapRatio = 0.5;   // 段间距（行）：空行高度 = 行高 × paraGapRatio（默认 0.5 行 = 原半行高）

var vPadding = -1;        // 上下边距（px）：-1 = 跟随旧公式 padding + fontSize；>=0 = 显式值

// 启动期"待应用"的字体/纹理（由 Android 注入 init script 设置）
var _pendingFontPath = null;
var _pendingFontName = null;
var _pendingTexture = null;
var _pendingResourcesLoading = false;

/**
 * ✅ 立即启动加载待加载的字体/纹理资源（由 init script 调用）
 * 在 HTML 加载完成时就开始，使后续 loadContent 调用时字体/纹理可能已经就绪
 */
function startPendingResources() {
    // 字体
    if (_pendingFontPath && _pendingFontName) {
        var fp = _pendingFontPath, fn = _pendingFontName;
        try {
            var font = new FontFace(fn, 'url(' + fp + ')');
            font.load().then(function(loaded) {
                document.fonts.add(loaded);
                fontFamily = fn;
                _pendingFontPath = null;
                _pendingFontName = null;
                // ✅ 与 loadCustomFont 一致：用 document.fonts.load 显式等待该具体字体就绪再重绘

                var redrawFn = function() {
                    xDefer(function() {
                    if (currentContent) {
                        if (isScrollMode()) {
                            layoutScroll(currentContent, chapterTitle);
                            clampScroll();
                            drawScroll();
                        } else {
                            paginate(currentContent, chapterTitle);
                            drawPage(currentPage);
                        }
                        if (pageTurnMode === 'simulation' && simulationActive) {
                            destroySimulation();
                            initSimulation();
                        }
                        notifyJavaPageChange();
                    }
                    });
                };
                var _probe = (typeof fontSize !== 'undefined' ? fontSize : 18) + 'px ' + fn;
                if (document.fonts && document.fonts.load) {
                    Promise.resolve(document.fonts.load(_probe)).then(redrawFn, redrawFn);
                } else {
                    redrawFn();
                }
                setTimeout(redrawFn, 150);
            }).catch(function(err) {
                console.error('字体加载失败: ' + err);
                _pendingFontPath = null;
                _pendingFontName = null;
            });

            console.error('字体初始化失败: ' + e);
            _pendingFontPath = null;
            _pendingFontName = null;
        }
    }

    // 纹理
    if (_pendingTexture) {
        var tx = _pendingTexture;
        var img = new Image();
        img.onload = function() {
            bgTextureImg = img;
            _pendingTexture = null;
            // ✅ 如果在仿真模式（含占位模式），纹理加载完成时同步所有容器/背面页背景
            if (pageTurnMode === 'simulation') {

                    $('#flipbook .page-div').css('background-image', 'url(' + img.src + ')');
                    $('#flipbook .page-div').css('background-size', '100% 100%');

            }
            if (currentContent) {
                if (isScrollMode()) {
                    drawScroll();
                } else {
                    drawPage(currentPage);
                }
                // ✅ 仿真模式激活时重建 flipbook，使已缓存的页面位图重新带纹理渲染
                if (simulationActive) reinitSimulation();
            }
        };
        img.onerror = function() {
            console.error('纹理加载失败: ' + tx);
            _pendingTexture = null;
        };
        img.src = tx;
    }
}

var isNightMode = false;

var batteryText = '';
var timeText = '';

// ============ 连续滚动模式（'updown' 即滚动模式）状态 ============

var scrollLines = [];           // 整章连续行（不分页）：{text, fontSize, bold, color, y}
var scrollContentHeight = 0;    // 内容总高度（CSS px，含顶部页眉留白与底部留白）
var scrollY = 0;                // 当前滚动偏移（CSS px，0 = 顶部）
var scrollMax = 0;              // 最大可滚动偏移 = max(0, 内容高 - 视口高)
var scrollViewW = 0, scrollViewH = 0; // 视口尺寸（CSS px）
var scrollTouch = null;         // 当前滚动触摸状态
var scrollAnimId = 0;           // requestAnimationFrame 句柄（用于取消动画）
var SCROLL_HEADER_EXTRA = 14;   // 粘性页眉额外高度（CSS px）

// ============ 仿真翻页背景同步 ============
/**
 * ✅ 将当前背景色 + 纹理统一同步到仿真翻页的所有相关元素。
 * 关键点：turn.js 在翻页开始时才动态创建书页背面（div.page.p-temporal，
 * 即 pageObjs[0]），因此必须用样式表规则（而非内联样式）写入，
 * 这样延迟创建的背面页也能自动继承纹理背景，保证正反书页一致。
 */
function syncSimulationBackground() {
    var styleEl = document.getElementById('simBgStyle');
    if (!styleEl) return;

    var hasTexture = !!(bgTextureImg && bgTextureImg.complete && bgTextureImg.src);
    var texUrl = hasTexture ? 'url(' + bgTextureImg.src + ')' : 'none';

    // turn.js 4.1.0 单页模式相关元素：
    //   #flipbook .page-wrapper      —— 每页的外层 wrapper
    //   #flipbook .page.p-temporal   —— 翻页时动态创建/复用的书页背面（pageObjs[0]），
    //                                  会在首次翻页后才存在于 DOM，且可能残留历史内联样式，
    //                                  故必须用 !important 样式表规则覆盖。
    // 注意：不能对 .page 一刀切——内容页 .page-div 也会被 turn.js 加上 page 类，
    //       其内联 background-image 是渲染好的页面内容图，不可被纹理覆盖。
    var selectors = '#flipbookContainer, #flipbook, ' +
                    '#flipbook .page-wrapper, ' +
                    '#flipbook .turn-page-wrapper, #flipbook .turn-page, ' +
                    '#flipbook .page.p-temporal';

    var css = '';
    // 1. 统一底色（纹理之下的兜底色）
    css += selectors + ' { background-color: ' + bgColor + ' !important; }\n';
    // 2. 纹理背景：容器 + wrapper + 书页背面，保证正反书页背景一致
    css += selectors + ' { background-image: ' + texUrl + ' !important; ' +
           'background-size: 100% 100% !important; ' +
           'background-repeat: no-repeat !important; }\n';

    styleEl.textContent = css;
}

// ============ 初始化 Canvas 尺寸 ============
function resizeCanvas() {
    // ✅ 复用池修复：视口尺寸未就绪（window.innerWidth/innerHeight<=0）时绝不分页/绘制，
    //    否则会得到 0 尺寸画布（整页空白）与畸形 pages；等下一帧尺寸就绪后再执行。
    if (window.innerWidth <= 0 || window.innerHeight <= 0) {
        if (!_resizeScheduled) {
            _resizeScheduled = true;
            var _rf = function () { _resizeScheduled = false; resizeCanvas(); };
            if (typeof requestAnimationFrame === 'function') requestAnimationFrame(_rf);
            else setTimeout(_rf, 16);
        }
        return;
    }
    var dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    // 设置 CSS 尺寸（已通过样式 100% 覆盖，这里再确保）
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0); // 重置变换
    ctx.scale(dpr, dpr);
    if (currentContent) {
        if (isScrollMode()) {
            layoutScroll(currentContent, chapterTitle);
            drawScroll();
        } else {
            // ✅ 若本次是从排版缓存恢复（loadContent 已载入 pages），跳过整章重新分页；
            //    仅重绘并重建仿真层。窗口 resize / 设置变更等场景 pagesRestoredFromCache 已复位为 false，
            //    仍会走下方 paginate 正常重排。
            if (!pagesRestoredFromCache) {
                paginate(currentContent, chapterTitle);
            }
            pagesRestoredFromCache = false;
            drawPage(currentPage);
            if (simulationActive) reinitSimulation();
        }
    }
}

// ✅ 复用池修复：resize 回调重排后，向 Java 回传真实总页数（首屏若曾在 0 宽下分页，总页数会是畸形值，需在此纠正）
window.addEventListener('resize', function () {
    resizeCanvas();
    if (typeof Android !== 'undefined' && Android) notifyJavaPageChange();
});

// ============ 分页核心 ============
function paginate(text, title) {
    pages = [];
    pageStartOffsets = [];
    if (!text && !title) return;

    var maxWidth = window.innerWidth - padding * 2;
    // 页脚固定在 window.innerHeight - 15 处，预留少量间距
    var footerReserved = 17;
    // 可用内容高度 = 屏幕高度 - 顶部padding - 底部页脚预留
    var contentAreaHeight = window.innerHeight - topPadding - footerReserved;
    var maxHeight = contentAreaHeight;
    
    // 如果显示页眉，需要减去页眉占用的空间
    var headerOffset = 0;
    if (showHeaderFooter && title) {
        headerOffset = headerFooterFontSize + 10 + Math.floor(fontSize / 2); // 页眉高度 + 间距(10px) + 正文与页眉之间再加半行
        maxHeight -= headerOffset;
    }
    
    var currentPageLines = [];
    var currentPageHeight = 0;
    var globalOffset = 0;

    // 处理标题
    if (title) {
        ctx.font = 'bold ' + titleFontSize + 'px ' + fontFamily;
        var titleLines = splitTextToLines(title, maxWidth);
        titleLines.forEach(function(line) {
            var h = titleFontSize * 1.6;
            if (currentPageHeight + h > maxHeight) {
                pages.push(currentPageLines.slice());
                pageStartOffsets.push(globalOffset);
                currentPageLines = [];
                currentPageHeight = 0;
            }
            currentPageLines.push({text: line, fontSize: titleFontSize, bold: true, color: textColor,
                justLast: true});   // 标题不参与两端对齐，保持左对齐
            currentPageHeight += h;
        });
        // 标题后空行：必须生成占位行（blank），否则 drawPage 的 y 不会推进这段高度，
        // 分页高度累计与绘制 y 轨迹脱节 → 标题页正文行数被压少 + 底部空出一大块
        var blankH = titleFontSize * 0.8;
        if (currentPageHeight + blankH > maxHeight) {
            pages.push(currentPageLines.slice());
            pageStartOffsets.push(globalOffset);
            currentPageLines = [];
            currentPageHeight = 0;
            // 换页后空行落在页首：直接丢弃（页首不留段间距，与主流阅读器一致）
        } else {
            currentPageLines.push({blank: true, h: blankH, color: textColor});
            currentPageHeight += blankH;
        }
    }

    // 处理正文
    ctx.font = fontSize + 'px ' + fontFamily;
    var indent = '\u3000\u3000'; // 两个全角空格（首行缩进）
    var paragraphs = text.split('\n');
    paragraphs.forEach(function(para, paraIndex) {
        if (para.length === 0) {
            // 空行：段落间距（行距 × 段距倍数，默认半行高）
            var h = fontSize * lineHeightRatio * paraGapRatio;
            // ✅ 修复「页面行数不够/底部空余过大」：
            //    原实现空行只累加分页高度、不生成行对象，而 drawPage 的 y 只按行对象推进，
            //    两者高度基准脱节 → 含空行的页正文被压少 1~2 行且底部空出一大块（无空行的页又排满）。
            //    现将空行落为占位行（blank），绘制 y 同步推进，分页与绘制完全一致。
            // 页首空行（刚换页/章首）直接丢弃：段间距不延续到新页首
            if (currentPageHeight === 0) {
                globalOffset += 1;
                return;
            }
            // 空行落在换页边界：换页并丢弃该空行（页底段间距本就不可见，且避免新页开头虚占半行）
            // 注意 push 的偏移与原实现一致：先 push 当前 globalOffset，再 +1
            if (currentPageHeight + h > maxHeight) {
                pages.push(currentPageLines.slice());
                pageStartOffsets.push(globalOffset);
                currentPageLines = [];
                currentPageHeight = 0;
                globalOffset += 1;
                return;
            }
            currentPageLines.push({blank: true, h: h, color: textColor});
            currentPageHeight += h;
            globalOffset += 1;
            return;
        }

        // 去除段首已有缩进（全角空格、半角空格），再统一添加两格缩进
        var trimmed = para.replace(/^[\s\u3000]+/, '');
        var indentedPara = indent + trimmed;
        var lines = splitTextToLines(indentedPara, maxWidth);
        lines.forEach(function(line, li) {
            var h = fontSize * lineHeightRatio;
            if (currentPageHeight + h > maxHeight) {
                pages.push(currentPageLines.slice());
                pageStartOffsets.push(globalOffset);
                currentPageLines = [];
                currentPageHeight = 0;
            }
            // justLast：段落末行保持左对齐，其余行拉伸到满宽（两端对齐），
            // 让左右边距严格相等，而不是右端随机留下 0~1 个字宽
            currentPageLines.push({text: line, fontSize: fontSize, bold: false, color: textColor,
                justLast: li === lines.length - 1});
            currentPageHeight += h;
        });
        globalOffset += para.length + 1;
    });

    if (currentPageLines.length > 0) {
        pages.push(currentPageLines.slice());
        pageStartOffsets.push(globalOffset);
    }
    console.log('DBG paginate: innerW=' + window.innerWidth + ' innerH=' + window.innerHeight + ' pages=' + pages.length);
}

function splitTextToLines(text, maxWidth) {
    var lines = [];
    var currentLine = '';
    // ✅ 性能优化：累计已测宽度，避免每加一个字就把整行重新 measureText（原实现是 O(n^2)，
    //    长章节首屏分页会阻塞 WebView 主线程数秒，导致进入阅读器后翻页无响应）。
    //    改为只测单个字宽度并累加，复杂度降为 O(n)；CJK 等宽无字距，结果与原实现一致；
    //    少量带 kerning 的拉丁文仅在换行边界处可能有亚像素差异，不影响阅读。
    var currentWidth = 0;
    for (var i = 0; i < text.length; i++) {
        var ch = text.charAt(i);
        var chWidth = ctx.measureText(ch).width;
        if (currentLine.length > 0 && currentWidth + chWidth > maxWidth) {
            lines.push(currentLine);
            currentLine = ch;
            currentWidth = chWidth;
        } else {
            currentLine += ch;
            currentWidth += chWidth;
        }
    }
    if (currentLine.length > 0) {
        lines.push(currentLine);
    }
    return lines;
}

/**
 * 两端对齐绘制一行正文（justify）。
 *
 * 为什么需要它：正文原先是「左对齐 + 行宽只受上限约束」——splitTextToLines 里
 * `currentWidth + chWidth > maxWidth` 才换行。中文等宽，行宽必然取整到「整数个字宽」，
 * 而 maxWidth = innerWidth - padding*2 通常不是整数倍，于是每行右端恒定剩下
 * `maxWidth mod 字宽` 的空白（0 ~ 1 个字宽）。
 * 结果：左边距恒为 padding，右边距 = padding + 这段剩余，恒 ≥ 左边距、平均大半个字宽，
 * 也就是「正文右边空白总比左边宽」——分页 / 滚动 / HTML 三条路径同一策略，故三处都可见。
 *
 * 做法：把剩余宽度均摊到字间隙，逐字绘制，使行总宽精确等于 maxWidth，左右边距因此严格相等。
 * 段落末行（justLast）与章节标题不拉伸，保持左对齐（常规排版如此）。
 */
function fillLineText(text, x, y, maxWidth, justLast) {
    if (!text) return;
    if (justLast || maxWidth <= 0) { ctx.fillText(text, x, y); return; }
    var w = ctx.measureText(text).width;
    var slots = text.length - 1;
    // 剩余不足半像素或已是单字符行：逐字画没有收益，直接整行绘制省开销
    if (slots <= 0 || w >= maxWidth - 0.5) { ctx.fillText(text, x, y); return; }
    var extra = (maxWidth - w) / slots;
    var cx = x;
    for (var i = 0; i < text.length; i++) {
        var ch = text.charAt(i);
        ctx.fillText(ch, cx, y);
        cx += ctx.measureText(ch).width + extra;
    }
}

// ============ 绘制指定页 ============
function drawPage(pageIndex) {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    if (bgTextureImg && bgTextureImg.complete) {
        ctx.drawImage(bgTextureImg, 0, 0, window.innerWidth, window.innerHeight);
    }

    if (pageIndex < 0 || pageIndex >= pages.length) return;

    var lines = pages[pageIndex];
    var y = topPadding;
    var maxY = window.innerHeight - 17; // 页脚预留空间，与分页计算一致
    
    // 绘制页眉（如果启用）
    if (showHeaderFooter && chapterTitle) {
        ctx.font = headerFooterFontSize + 'px ' + fontFamily;
        ctx.fillStyle = headerFooterColor; // 使用浅灰色
        ctx.textAlign = 'left'; // 左对齐
        ctx.fillText(chapterTitle, padding, topPadding + headerFooterFontSize);
        // 自动翻页倒计时：页眉右侧小字
        if (autoPageCountdown > 0) {
            ctx.textAlign = 'right';
            ctx.fillText(autoPageCountdown + 's', window.innerWidth - padding, topPadding + headerFooterFontSize);
            ctx.textAlign = 'left';
        }
        y = topPadding + headerFooterFontSize + 10 + Math.floor(fontSize / 2); // 页眉后再加 10px + 半行间距
    }
    
    lines.forEach(function(line) {
        // ✅ 空行占位行：只推进 y、不绘制文字 —— 与 paginate 的高度累计保持同一基准，
        //    否则 y 比分页高度慢，含空行的页底部会空出一大块（分页/绘制脱节修复的一半）
        if (line.blank) {
            if (y + line.h > maxY) {
                return;
            }
            y += line.h;
            return;
        }
        var lineH = line.fontSize * (line.bold ? 1.6 : lineHeightRatio);
        // 检查是否超出底部边界
        if (y + lineH > maxY) {
            return; // 跳过超出的行
        }
        
        if (line.bold) {
            ctx.font = 'bold ' + line.fontSize + 'px ' + fontFamily;
        } else {
            ctx.font = line.fontSize + 'px ' + fontFamily;
        }
        ctx.fillStyle = line.color || textColor;
        // maxWidth 必须与 paginate 断行时同源，否则拉伸目标宽度会与实际排版宽度错位
        fillLineText(line.text, padding, y + line.fontSize, window.innerWidth - padding * 2, line.justLast);
        y += lineH;
    });
    
    //  绘制页脚（如果启用）
    if (showHeaderFooter && pages.length > 0) {
        var footerText = (pageIndex + 1) + '/' + pages.length;
        
        ctx.font = headerFooterFontSize + 'px ' + fontFamily;
        ctx.fillStyle = headerFooterColor; // 使用浅灰色
        
        // 左侧：电量和时间
        if (showBatteryTime && (batteryText || timeText)) {
            var leftInfo = batteryText + (batteryText && timeText ? '  ' : '') + timeText;
            ctx.textAlign = 'left';
            ctx.fillText(leftInfo, padding, window.innerHeight - 15);
        }
        
        // 右侧：页码
        // 本地书显示阅读百分比
        if (typeof isLocalBook !== 'undefined' && isLocalBook && typeof bookProgress !== 'undefined') {
            var progressText = ' ' + bookProgress + '%';
            ctx.textAlign = 'right'; // 右对齐
            ctx.fillText(footerText + progressText, window.innerWidth - padding, window.innerHeight - 15);
        } else {
            ctx.textAlign = 'right'; // 右对齐
            ctx.fillText(footerText, window.innerWidth - padding, window.innerHeight - 15);
        }
        ctx.textAlign = 'left'; // 重置对齐方式
    }
}

// ============ 翻页控制 ============
function goToPage(page) {
    if (isHtmlMode()) { htmlGoToPage(page); return; }
    if (isScrollMode()) {
        cancelScrollAnim();
        animateScrollTo(page * (scrollViewH || window.innerHeight));
        return;
    }
    if (isAnimating || _xCrossFlipping) return;
    if (page < 0) page = 0;
    if (page >= pages.length) page = pages.length - 1;
    if (page === currentPage) return;
    if (simulationActive) {
        $('#flipbook').turn('page', page + 1);
        return;
    }
    var oldPage = currentPage;
    currentPage = page;
    if (pageTurnMode === 'none') {
        drawPage(currentPage);
        notifyJavaPageChange();
    } else {
        animateTurn(oldPage, currentPage, page > oldPage);
    }
}

function nextPage() {
    console.log('DBG nextPage: pages=' + (pages?pages.length:'(none)') + ' anim=' + isAnimating + ' sim=' + simulationActive + ' mode=' + pageTurnMode + ' swipe=' + swipeEnabled + ' dragMode=' + dragMode() + ' cur=' + currentPage);
    if (isAnimating || _xCrossFlipping) return;
    if (isHtmlMode()) { htmlNextPage(); return; }
    if (isScrollMode()) { scrollNextScreen(); return; }
    try {
        if (simulationActive) {
            if (currentPage < pages.length - 1) {
                $('#flipbook').turn('next');
            } else {
                // ✅ 邻章已预加载：无缝卷页换章（与普通卷页同观感）；未就绪走原有加载流程
                var xtSimNext = tryFetchAdjacentChapter(1);
                if (xtSimNext && simStartCrossFlip(xtSimNext)) return;
                Android.onChapterEnd();
            }
            return;
        }
        if (currentPage < pages.length - 1) {
            var oldPage = currentPage;
            currentPage++;
            if (pageTurnMode === 'none') {
                drawPage(currentPage);
                notifyJavaPageChange();
            } else {
                animateTurn(oldPage, currentPage, true);
            }
        } else {
            // ✅ 邻章已预加载：换章复用换页动画（跨章无缝），未就绪走原有加载流程
            var xtNext = tryFetchAdjacentChapter(1);
            if (xtNext) { crossChapterTapTurn(xtNext); return; }
            Android.onChapterEnd();
        }
    } catch (e) {
        console.error('nextPage异常: ' + e.message);
        isAnimating = false;
    }
}

function prevPage() {
    if (isAnimating || _xCrossFlipping) return;
    if (isHtmlMode()) { htmlPrevPage(); return; }
    if (isScrollMode()) { scrollPrevScreen(); return; }
    try {
        if (simulationActive) {
            if (currentPage > 0) {
                $('#flipbook').turn('previous');
            } else {
                // ✅ 邻章（上一章）已预加载：无缝卷页换章，落点为上一章最后一页
                var xtSimPrev = tryFetchAdjacentChapter(-1);
                if (xtSimPrev && simStartCrossFlip(xtSimPrev)) return;
                try { Android.onChapterStart(); } catch(e) {}
            }
            return;
        }
        if (currentPage > 0) {
            var oldPage = currentPage;
            currentPage--;
            if (pageTurnMode === 'none') {
                drawPage(currentPage);
                notifyJavaPageChange();
            } else {
                animateTurn(oldPage, currentPage, false);
            }
        } else {
            // ✅ 邻章（上一章）已预加载：换章复用换页动画，落点为上一章最后一页
            var xtPrev = tryFetchAdjacentChapter(-1);
            if (xtPrev) { crossChapterTapTurn(xtPrev); return; }
            try { Android.onChapterStart(); } catch(e) {}
        }
    } catch (e) {
        console.error('prevPage异常: ' + e.message);
        isAnimating = false;
    }
}

// ✅ 新增：获取当前页的文本内容（用于书签预览）
function getCurrentPageText() {
    if (isHtmlMode()) { return htmlCurrentPageText(); }
    if (isScrollMode()) {
        if (!scrollLines || scrollLines.length === 0) return "";
        var textLines = [];
        for (var i = 0; i < scrollLines.length; i++) {
            var line = scrollLines[i];
            // 仅取当前视口附近的若干行作为预览
            var screenY = line.y - scrollY;
            if (screenY < -line.fontSize * 2) continue;
            if (screenY > window.innerHeight) break;
            if (line.text && line.text.trim() !== "") textLines.push(line.text);
        }
        return textLines.join("\n");
    }

    if (currentPage < 0 || currentPage >= pages.length) return "";

    var lines = pages[currentPage];
    if (!lines || lines.length === 0) return "";

    // 提取所有行的文本，用换行符连接
    var textLines = [];
    for (var j = 0; j < lines.length; j++) {
        if (lines[j].text && lines[j].text.trim() !== "") {
            textLines.push(lines[j].text);
        }
    }

    return textLines.join("\n");
}

function notifyJavaPageChange() {
    // ✅ 跨章无缝翻页：全局 pages 已切到邻章、但 Java 侧 currentChapterIndex 尚未推进的过渡窗口内，
    //    禁止上报页码（否则会用旧章索引 + 新章页码写进度，造成进度错乱）。loadContent 到达后解除。
    if (_suppressPageNotify) return;
    try {
        if (typeof Android === 'undefined' || !Android) return;
        Android.onPageChanged(virtualCurrentPage(), virtualTotalPages());
    } catch(e) {}
}

// ============ 跨章无缝翻页（预加载就绪时，换章复用换页动画） ============
// Java 侧 getAdjacentChapterPayload(dir) 同步返回邻章已就绪正文（JSON: {index,title,content}），
// 未就绪返回空串。拿到后先把全局 pages 整体切换成邻章分页结果，再走与普通换页完全相同的动画
// （或跟手拖拽位图）；落地后才回调 Android.onChapterEnd/onChapterStart，Java 回送的 loadContent
// 用同一算法同一视口重排 → 结果与已显示页面完全一致 → 视觉零跳变。
var _suppressPageNotify = false;   // 过渡窗口内抑制页码上报（见 notifyJavaPageChange）
var _xTurnBusy = false;            // 跨章换章在途（防止窗口期内再次抓取邻章导致连环切换）

function tryFetchAdjacentChapter(dir) {
    if (_xTurnBusy) return null;
    if (typeof Android === 'undefined' || !Android || !Android.getAdjacentChapterPayload) return null;
    var raw = null;
    try { raw = Android.getAdjacentChapterPayload(dir > 0 ? 1 : -1); } catch (e) { return null; }
    if (!raw) return null;
    var pl = null;
    try { pl = JSON.parse(raw); } catch (e2) { return null; }
    if (!pl || typeof pl.index !== 'number' || !pl.content || !String(pl.content).trim()) return null;
    if (pl.index === currentChapterIndex) return null;
    // ✅ 邻章索引必须与 JS 当前位置严格相邻（dir 方向 ±1）。
    //    Java 侧索引可能因回调被去重窗口吞掉等原因滞后于 JS——不相邻说明两端失步，
    //    拒绝该负载走 Java 加载链路自我修正（loadContent 会把索引拉回一致），
    //    否则会按失步索引换章，把用户抛回刚读过的章节或倒退两章。
    if (pl.index !== currentChapterIndex + (dir > 0 ? 1 : -1)) return null;
    var text = preprocessContent(String(pl.content));
    if (!text || !text.trim()) return null;
    // 临时分页：swap 全局 → paginate → 还原（paginate 只写 pages/pageStartOffsets，同步执行无重入）
    var sPages = pages, sOffsets = pageStartOffsets, sTitle = chapterTitle, sContent = currentContent;
    chapterTitle = pl.title || '';
    paginate(text, chapterTitle);
    var xPages = pages, xOffsets = pageStartOffsets;
    pages = sPages; pageStartOffsets = sOffsets; chapterTitle = sTitle; currentContent = sContent;
    if (!xPages || !xPages.length) return null;
    return { dir: (dir > 0 ? 1 : -1), index: pl.index, title: (pl.title || ''),
             content: text, pages: xPages, offsets: xOffsets };
}

/** 把全局分页状态整体切换为邻章（此后 drawPage / 页码上报 / 目录页码都基于新章） */
function swapToAdjacentChapter(xt) {
    pages = xt.pages;
    pageStartOffsets = xt.offsets;
    chapterTitle = xt.title;
    currentContent = xt.content;
    currentChapterIndex = xt.index;
    _suppressPageNotify = true;
    _xTurnBusy = true;
    // 兜底：Java loadContent 正常到达时会清这两个旗标；此处超时兜底防极端情况长期卡死
    setTimeout(function() { _suppressPageNotify = false; _xTurnBusy = false; }, 2000);
}

/** 跨章「点击 / 音量键 / 自动翻页」翻页：与普通换页同一套动画，落地后再通知 Java 真正换章 */
function crossChapterTapTurn(xt) {
    if (isAnimating) return;
    var toPage = xt.dir > 0 ? 0 : xt.pages.length - 1;
    if (pageTurnMode === 'none') {
        // none 模式换页本就无动画：直接切换，与换页观感一致
        swapToAdjacentChapter(xt);
        currentPage = toPage;
        drawPage(currentPage);
        try { if (xt.dir > 0) Android.onChapterEnd(); else Android.onChapterStart(); } catch (e) {}
        return;
    }
    var oldImg = null;
    try { oldImg = ctx.getImageData(0, 0, canvas.width, canvas.height); } catch (e) { oldImg = null; }
    if (!oldImg) {
        // 截图失败（极端环境）→ 退回原有换章流程
        try { if (xt.dir > 0) Android.onChapterEnd(); else Android.onChapterStart(); } catch (e2) {}
        return;
    }
    swapToAdjacentChapter(xt);
    currentPage = toPage;
    drawPage(currentPage);
    var newImg = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var tmpOld = document.createElement('canvas');
    tmpOld.width = canvas.width; tmpOld.height = canvas.height;
    tmpOld.getContext('2d').putImageData(oldImg, 0, 0);
    var tmpNew = document.createElement('canvas');
    tmpNew.width = canvas.width; tmpNew.height = canvas.height;
    tmpNew.getContext('2d').putImageData(newImg, 0, 0);
    startTurnFrames(tmpOld, tmpNew, toPage, xt.dir > 0, function() {
        try { if (xt.dir > 0) Android.onChapterEnd(); else Android.onChapterStart(); } catch (e) {}
    });
}

// ============ 翻页动画系统 ============
var ANIM_DURATION = 280;

function setPageTurnMode(mode) {
    var wasSimulation = simulationActive || _simulationPlaceholderActive;
    var wasScroll = (pageTurnMode === 'updown');
    cancelScrollAnim();
    pageTurnMode = mode;
    // ✅ HTML 富文本模式下由 HTML 容器自管布局：按新模式在「横向分栏翻页」与
    //    「上下滚动」之间切换并重排，重排里会顺带建/拆仿真书本（见 htmlInitSim）。
    //    canvas 路径的那套 flipbook/位图重排一概不碰，两条路各用各的书本容器。
    if (htmlMode) { applyHtmlTheme(true); return; }
    if (mode === 'simulation') {
        if (!wasSimulation) {
            if (currentContent) {
                initSimulation();
            } else {
                // 还没有章节内容：先展示占位书本，等 loadContent 到达再重建
                showSimulationPlaceholder();
            }
        }
    } else {
        if (wasSimulation) {
            destroySimulation();
        }
        if (mode === 'updown') {
            // 进入连续滚动模式：取消 canvas 隐藏（若从仿真切换），重排为长卷并绘制
            canvas.style.visibility = 'visible';
            if (currentContent) {
                layoutScroll(currentContent, chapterTitle);
                clampScroll();
                drawScroll();
                notifyJavaPageChange();
            }
        } else {
            // 普通分页模式：若从滚动模式切出，恢复分页并回到首页
            if (wasScroll && currentContent) {
                paginate(currentContent, chapterTitle);
                currentPage = 0;
                drawPage(currentPage);
                notifyJavaPageChange();
            }
        }
    }
}

/** 通用翻页帧循环：tmpOld/tmpNew 为两页位图，按当前 pageTurnMode 合成 280ms 动画；
 *  结束后恢复 toPage 正常绘制并解除 isAnimating；onDone 可选（跨章落地时用于通知 Java 换章） */
function startTurnFrames(tmpOld, tmpNew, toPage, isForward, onDone) {
    isAnimating = true;
    // 超时保护：2秒后强制恢复
    if (animWatchdog) clearTimeout(animWatchdog);
    animWatchdog = setTimeout(function() {
        if (isAnimating) {
            console.warn('翻页动画超时，强制恢复');
            isAnimating = false;
        }
    }, 2000);
    var dpr = window.devicePixelRatio || 1;
    var CW = canvas.width;   // 实际像素宽
    var CH = canvas.height;  // 实际像素高
    var startTime = null;
    function frame(timestamp) {
        try {
            if (!startTime) startTime = timestamp;
            var progress = Math.min((timestamp - startTime) / ANIM_DURATION, 1);
            var ease = 1 - Math.pow(1 - progress, 3);

            // 重置变换，直接用实际像素坐标操作
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            switch (pageTurnMode) {
                case 'cover':
                    drawCoverAnim(tmpOld, tmpNew, CW, CH, ease, isForward);
                    break;
                case 'slide':
                    drawSlideAnim(tmpOld, tmpNew, CW, CH, ease, isForward);
                    break;
                case 'updown':
                    drawUpDownAnim(tmpOld, tmpNew, CW, CH, ease, isForward);
                    break;
                case 'fade':
                    drawFadeAnim(tmpOld, tmpNew, CW, CH, ease);
                    break;
                default:
                    drawCoverAnim(tmpOld, tmpNew, CW, CH, ease, isForward);
            }

            if (progress < 1) {
                requestAnimationFrame(frame);
            } else {
                // 动画结束，恢复 DPR 变换并正常绘制
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                currentPage = toPage;
                drawPage(currentPage);
                notifyJavaPageChange();
                isAnimating = false;
                if (animWatchdog) { clearTimeout(animWatchdog); animWatchdog = null; }
                if (onDone) onDone();
            }
        } catch (e) {
            // 动画出错时安全恢复状态，防止 isAnimating 卡死
            console.error('翻页动画异常: ' + e.message);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            currentPage = toPage;
            drawPage(currentPage);
            notifyJavaPageChange();
            isAnimating = false;
            if (animWatchdog) { clearTimeout(animWatchdog); animWatchdog = null; }
            if (onDone) onDone();
        }
    }
    requestAnimationFrame(frame);
}

function animateTurn(fromPage, toPage, isForward) {
    var dpr = window.devicePixelRatio || 1;
    var CW = canvas.width;   // 实际像素宽
    var CH = canvas.height;  // 实际像素高

    var tmpNew, tmpOld;
    try {
        // 截取旧页画面（用实际像素尺寸）
        var savedPage = currentPage;
        currentPage = fromPage;
        var oldImg = ctx.getImageData(0, 0, CW, CH);
        // 截取新页画面
        currentPage = toPage;
        drawPage(toPage);
        var newImg = ctx.getImageData(0, 0, CW, CH);
        currentPage = savedPage;

        // 将新页像素放入离屏 canvas（同样用实际像素尺寸）
        tmpNew = document.createElement('canvas');
        tmpNew.width = CW;
        tmpNew.height = CH;
        tmpNew.getContext('2d').putImageData(newImg, 0, 0);

        // 将旧页像素放入离屏 canvas
        tmpOld = document.createElement('canvas');
        tmpOld.width = CW;
        tmpOld.height = CH;
        tmpOld.getContext('2d').putImageData(oldImg, 0, 0);
    } catch (e) {
        console.error('翻页截图异常: ' + e.message);
        // 截图失败，直接跳到目标页
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        currentPage = toPage;
        drawPage(currentPage);
        notifyJavaPageChange();
        isAnimating = false;
        return;
    }

    startTurnFrames(tmpOld, tmpNew, toPage, isForward);
}

// 覆盖动画：两个方向观感不同（刻意不对称，两个方向都跟手）
//   下一页（forward）：当前页在上层向左滑走 → 露出底层的下一页
//   上一页（backward）：上一页在上层从左侧滑入 → 覆盖住当前页
function drawCoverAnim(oldCvs, newCvs, CW, CH, p, forward) {
    var topCvs, bottomCvs, topX;
    if (forward) {
        bottomCvs = newCvs; topCvs = oldCvs; topX = -CW * p;        // 当前页左移，露出新页
    } else {
        bottomCvs = oldCvs; topCvs = newCvs; topX = -CW * (1 - p);  // 上一页从左滑入覆盖
    }
    ctx.drawImage(bottomCvs, 0, 0);
    // 上层页的右边缘（两个方向都是这条边掠过下层页），在其右侧投阴影
    var shW = 8;
    var edge = topX + CW;
    if (edge > 0 && edge < CW) {
        var l = Math.max(0, edge), r = Math.min(CW, edge + shW);
        if (r > l) {
            var g = ctx.createLinearGradient(l, 0, r, 0);
            g.addColorStop(0, 'rgba(0,0,0,0.25)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(l, 0, r - l, CH);
        }
    }
    ctx.drawImage(topCvs, topX, 0);
}

// 平移动画：旧页滑出 + 新页滑入
function drawSlideAnim(oldCvs, newCvs, CW, CH, p, forward) {
    ctx.clearRect(0, 0, CW, CH);
    var oldOff = forward ? (-CW * p) : (CW * p);
    var newOff = forward ? (CW * (1 - p)) : (-CW * (1 - p));
    ctx.drawImage(oldCvs, oldOff, 0);
    ctx.drawImage(newCvs, newOff, 0);
}

// 上下动画：垂直滑动
function drawUpDownAnim(oldCvs, newCvs, CW, CH, p, forward) {
    ctx.clearRect(0, 0, CW, CH);
    var oldOff = forward ? (-CH * p) : (CH * p);
    var newOff = forward ? (CH * (1 - p)) : (-CH * (1 - p));
    ctx.drawImage(oldCvs, 0, oldOff);
    ctx.drawImage(newCvs, 0, newOff);
}

// 淡入动画：交叉淡入淡出
function drawFadeAnim(oldCvs, newCvs, CW, CH, p) {
    ctx.clearRect(0, 0, CW, CH);
    ctx.globalAlpha = 1 - p;
    ctx.drawImage(oldCvs, 0, 0);
    ctx.globalAlpha = p;
    ctx.drawImage(newCvs, 0, 0);
    ctx.globalAlpha = 1;
}

// 仿真翻书动画：带3D透视的翻页效果
function drawSimulationAnim(oldCvs, newCvs, CW, CH, p, forward) {
    // 翻页中点时透视变形最强
    var perspective = Math.sin(p * Math.PI) * 0.055;
    var vShrink = CH * perspective;  // 上下各收缩的像素
    var hShift  = CW * perspective * 0.35; // 远端水平偏移

    if (forward) {
        var slideX = CW * (1 - p); // 新页左边缘位置

        // 1. 底层背景
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, CW, CH);

        // 2. 旧页（静止不动）
        ctx.drawImage(oldCvs, 0, 0);

        // 3. 旧页上随翻页移动的阴影
        var shL = Math.max(0, slideX - CW * 0.1);
        var shR = Math.min(CW, slideX + CW * 0.03);
        if (shR > shL) {
            var sg = ctx.createLinearGradient(shL, 0, shR, 0);
            sg.addColorStop(0, 'rgba(0,0,0,0)');
            sg.addColorStop(1, 'rgba(0,0,0,0.25)');
            ctx.fillStyle = sg;
            ctx.fillRect(shL, 0, shR - shL, CH);
        }

        // 4. 新页（带3D透视变形：上下收窄 + 梯形倾斜）
        ctx.save();
        ctx.beginPath();
        // 梯形：左侧（铰链边）全高，右侧（自由边）收缩
        ctx.moveTo(slideX, vShrink * 0.3);
        ctx.lineTo(slideX + CW, vShrink);
        ctx.lineTo(slideX + CW, CH - vShrink);
        ctx.lineTo(slideX, CH - vShrink * 0.3);
        ctx.closePath();
        ctx.clip();
        // 将新页绘制到梯形区域内
        ctx.drawImage(newCvs, slideX, 0);
        ctx.restore();

        // 5. 新页左边缘高光（纸张边缘反光）
        var hlL = Math.max(0, slideX);
        var hlR = Math.min(CW, slideX + 5);
        if (hlR > hlL && slideX > 0 && slideX < CW) {
            var hl = ctx.createLinearGradient(hlL, 0, hlR, 0);
            hl.addColorStop(0, 'rgba(255,255,255,0.4)');
            hl.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = hl;
            ctx.fillRect(hlL, 0, hlR - hlL, CH);
        }

        // 6. 新页表面微弱暗角（靠近铰链处）
        var cL = Math.max(0, slideX);
        var cR = Math.min(CW, slideX + CW * 0.05);
        if (cR > cL && slideX > 0 && slideX < CW) {
            var cg = ctx.createLinearGradient(cL, 0, cR, 0);
            cg.addColorStop(0, 'rgba(0,0,0,0.05)');
            cg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = cg;
            ctx.fillRect(cL, 0, cR - cL, CH);
        }

    } else {
        // ===== 向右翻（镜像处理）=====
        var slideX2 = -CW * (1 - p); // 新页左边缘位置（负值→右移）

        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, CW, CH);

        ctx.drawImage(oldCvs, 0, 0);

        // 旧页上阴影
        var shL2 = Math.max(0, slideX2 + CW - CW * 0.03);
        var shR2 = Math.min(CW, slideX2 + CW + CW * 0.1);
        if (shR2 > shL2) {
            var sg2 = ctx.createLinearGradient(shL2, 0, shR2, 0);
            sg2.addColorStop(0, 'rgba(0,0,0,0.25)');
            sg2.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = sg2;
            ctx.fillRect(shL2, 0, shR2 - shL2, CH);
        }

        // 新页（带透视：右侧铰链边全高，左侧自由边收缩）
        var nLeft = slideX2;
        var nRight = slideX2 + CW;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(nLeft, vShrink);
        ctx.lineTo(nRight, vShrink * 0.3);
        ctx.lineTo(nRight, CH - vShrink * 0.3);
        ctx.lineTo(nLeft, CH - vShrink);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(newCvs, nLeft, 0);
        ctx.restore();

        // 新页右边缘高光
        var hlL2 = Math.max(0, nRight - 5);
        var hlR2 = Math.min(CW, nRight);
        if (hlR2 > hlL2 && nRight > 0 && nRight < CW) {
            var hl2 = ctx.createLinearGradient(hlL2, 0, hlR2, 0);
            hl2.addColorStop(0, 'rgba(255,255,255,0)');
            hl2.addColorStop(1, 'rgba(255,255,255,0.4)');
            ctx.fillStyle = hl2;
            ctx.fillRect(hlL2, 0, hlR2 - hlL2, CH);
        }

        // 新页暗角
        var cL2 = Math.max(0, nRight - CW * 0.05);
        var cR2 = Math.min(CW, nRight);
        if (cR2 > cL2 && nRight > 0 && nRight < CW) {
            var cg2 = ctx.createLinearGradient(cL2, 0, cR2, 0);
            cg2.addColorStop(0, 'rgba(0,0,0,0)');
            cg2.addColorStop(1, 'rgba(0,0,0,0.05)');
            ctx.fillStyle = cg2;
            ctx.fillRect(cL2, 0, cR2 - cL2, CH);
        }
    }
}

// ============ turn.js 仿真翻页 ============
var _reinitTimer = null;
var _simulationPlaceholderActive = false;

// ✅ 在章节内容到达前，先展示一个"空白书本"外观，替代默认的米黄 canvas 空白
// 效果：进入阅读器时，立即看到一个与最终书本风格一致的空页，而不是突变
function showSimulationPlaceholder() {
    if (_simulationPlaceholderActive) return;
    _simulationPlaceholderActive = true;

    // 1. 隐藏底层 canvas（仿真模式下始终由 flipbook 容器承担显示）
    canvas.style.visibility = 'hidden';

    // 2. 显示翻页容器，应用当前背景色/纹理（样式表规则统一同步，含延迟创建的背面页）
    var $container = $('#flipbookContainer');
    $container.css('display', 'block');
    syncSimulationBackground();
    // ✅ 纹理未加载完成时，直接用 URL 让浏览器并行加载（视觉上更快）
    if (!(bgTextureImg && bgTextureImg.complete) && _pendingTexture) {
        $container.css('background-image', 'url(' + _pendingTexture + ')');
        $container.css('background-size', '100% 100%');
    }

    // 3. 添加一个占位页（带正确背景色/纹理，不使用 turn.js 动画）
    var $flipbook = $('#flipbook');
    $flipbook.empty();
    var placeholder = $('<div class="page-div"></div>');
    placeholder.css({
        'background-color': bgColor,
        'width': '100%',
        'height': '100%'
    });
    if (bgTextureImg && bgTextureImg.complete) {
        placeholder.css('background-image', 'url(' + bgTextureImg.src + ')');
        placeholder.css('background-size', '100% 100%');
    } else if (_pendingTexture) {
        placeholder.css('background-image', 'url(' + _pendingTexture + ')');
        placeholder.css('background-size', '100% 100%');
    }
    $flipbook.append(placeholder);

    // 4. 不调用 turn()，保持最简单的 DOM 结构，等内容到达后 initSimulation 会清理并重建
}

// ✅ 清理占位模式（initSimulation 会重建真正的 turn.js 翻页）
function clearSimulationPlaceholder() {
    if (!_simulationPlaceholderActive) return;
    _simulationPlaceholderActive = false;
    var $flipbook = $('#flipbook');
    $flipbook.empty();
}

// ============ 仿真翻页：书页背面与底层页管理 ============
// turn.js single 模式下：
//   - 被翻起页面的背面（.page.p-temporal）→ 空白纸张背面
//   - 下一页内容 → 应在底层静止区域显示
// 翻页时当前页的 pageObj 被移到翻页层，pageWrapper 变空，
// 但 syncSimulationBackground 给 .page-wrapper 设置了底色（!important），
// 导致底层被遮挡。因此在翻页开始时把目标页渲染图设为 .page-wrapper 背景
// （!important 覆盖底色），当前页 pageObj 移走后即露出下一页内容；
// 翻页结束后清除，恢复正常纹理背景。
var _simBackRAF = null;

// 清空 p-temporal 上可能残留的内容（背景图、img 子节点），
// 让书页背面保持纯空白（由 syncSimulationBackground 统一的底色/纹理）
function simClearBack() {
    var styleEl = document.getElementById('simBackStyle');
    if (styleEl) styleEl.textContent = '';
    $('#flipbook .page.p-temporal').each(function () {
        var old = this.querySelector('img');
        if (old) old.remove();
    });
}

// 翻页开始：
//   1. 把目标页渲染图设为 .page-wrapper 背景，当前页 pageObj 移走后即露出下一页
//   2. 清空书页背面残留内容，显示 p-temporal
// 注意：不在翻页开始时调用 ensureSimulationPages，因为 addPage 内部会调用 turn("stop")，
// 会中断正在开始的翻页动画。相邻页在初始化和翻页完成后预加载即可。
function simOnFlipStart(targetPageNum) {
    if (_simBackRAF) { cancelAnimationFrame(_simBackRAF); _simBackRAF = null; }
    simClearBack();
    // 确保 p-temporal 可见（turn.js 翻页动画需要它作为背面）
    var pt = document.querySelector('#flipbook .page.p-temporal');
    if (pt) pt.style.display = '';

    // 把目标页渲染图设为 .page-wrapper 背景（!important 覆盖 syncSimulationBackground 的底色）
    var targetIdx = targetPageNum - 1;
    if (targetIdx >= 0 && targetIdx < pages.length) {
        if (simPageCache[targetIdx] === undefined) renderPageToCache(targetIdx);
        var url = simPageCache[targetIdx];
        var styleEl = document.getElementById('simUnderPageStyle');
        if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = 'simUnderPageStyle';
            document.head.appendChild(styleEl);
        }
        styleEl.textContent = '#flipbook .page-wrapper {' +
            ' background-image: url(' + url + ') !important;' +
            ' background-size: 100% 100% !important;' +
            ' background-repeat: no-repeat !important;' +
            ' background-position: 0 0 !important;' +
            ' }';
    }
}

/**
 * ✅ 兜底清理：折页被取消（拖拽未跨过中线、点击后松手、章节边界放弃翻页）时，
 * turn.js 不走 turnPage 动画，也不会触发 turned 事件（正常由 when.end 收尾），
 * 若连 end 都没收到，书页背面（p-temporal）与底层页背景样式会一直残留
 * → 页面上会盖着一张空白纸。这里做延时兜底。
 */
function simScheduleFoldCleanup() {
    if (!simulationActive) return;
    var seq = _simFoldSeq;
    setTimeout(function() {
        if (!simulationActive) return;
        // 期间又开始了新的折页，交给那一次的收尾处理
        if (!_simFoldActive || _simFoldSeq !== seq) return;
        _simFoldActive = false;
        try { $('#flipbook').turn('stop'); } catch (e) {}
        simOnFlipEnd();
    }, 900); // hideFoldedPage 回弹动画 800ms
}
document.addEventListener('touchend', simScheduleFoldCleanup, false);
document.addEventListener('touchcancel', simScheduleFoldCleanup, false);

/**
 * ✅ 仿真模式下的"点击翻页"（左1/3 上一页 / 右1/3 下一页 / 中间 切换导航栏）。
 * 仿真拖拽翻页已完全由 turn.js 接管（Android 端 onFling 在该模式下让位），
 * 点击也一样：Android 端 onSingleTapConfirmed 在仿真模式下不再翻页，
 * 统一由这里处理，避免"点一下翻两页"（turn.js 与 Android 各翻一次）。
 * 用捕获阶段监听，确保在 turn.js 的 document 处理器之前拿到事件。
 */
var _simTapStart = null;
// 本次触摸的起点是否落在中间 1/3（导航栏开关区）
var _simCenterHold = false;

function simInCenterZone(x) {
    var w = window.innerWidth || document.documentElement.clientWidth || 1;
    return x >= w / 3 && x <= w * 2 / 3;
}

document.addEventListener('touchstart', function (e) {
    if (!simulationActive) { _simTapStart = null; _simCenterHold = false; return; }
    var t = e.touches && e.touches[0];
    if (!t) { _simTapStart = null; _simCenterHold = false; return; }
    _simTapStart = { x: t.clientX, y: t.clientY, time: Date.now(), moved: false };
    // 中间 1/3 只用于开关导航栏。turn.js 在 sheet 效果下把屏幕任意点都算作书角
    // （_cornerActivated：按 x/y 落在哪半屏决定 tl/tr/bl/br），touchstart 里就会
    // _showFoldedPage() 把书角翘起来 → 点中间也会看到书页跟手。这里整段掐断。
    _simCenterHold = simInCenterZone(t.clientX);
    if (_simCenterHold) e.stopPropagation();
}, true);
document.addEventListener('touchmove', function (e) {
    if (_simCenterHold) e.stopPropagation();
    if (!_simTapStart || !e.touches || !e.touches[0]) return;
    var t = e.touches[0];
    if (Math.abs(t.clientX - _simTapStart.x) > 12 || Math.abs(t.clientY - _simTapStart.y) > 12) {
        _simTapStart.moved = true;   // 判定为拖拽，交给 turn.js
    }
}, true);
document.addEventListener('touchend', function (e) {
    var hold = _simCenterHold;
    _simCenterHold = false;
    if (hold) e.stopPropagation();   // 中间区没有折页，无需 turn.js 收尾
    if (!simulationActive || !_simTapStart) return;
    var s = _simTapStart;
    _simTapStart = null;
    var ct = e.changedTouches && e.changedTouches[0];
    var dx = ct ? ct.clientX - s.x : 0;
    if (s.moved) {
        var absDx = Math.abs(dx);
        var dy = ct ? ct.clientY - s.y : 0;
        // ✅ 仿真模式边界换章：已在末页/首页且向边界外横向滑动时，turn.js 无法继续翻页，
        //    这里补一次「换章」。普通翻页仍交给 turn.js（仅边界触发，不冲突）。
        //    ⚠️ 必须与 turn.js 的 boundary 事件共用 _boundaryPending 守卫：一次手势会被
        //    「本分支」与「turn.js 的 boundary 事件」各触发一次 onChapterEnd/onChapterStart，
        //    导致连跳两章（先进入下一章、约 1s 后跳到再下一章）。统一走 simBoundarySwap 保证单次换章。
        if (absDx >= 30 && absDx > Math.abs(dy)) {
            if (dx < 0 && currentPage >= (pages ? pages.length - 1 : 0)) { simBoundarySwap(1); return; }
            if (dx > 0 && currentPage <= 0) { simBoundarySwap(-1); return; }
        }
        // 中间区滑动：turn.js 已被屏蔽，这里补一次翻页（无跟手动画，但仍能翻）
        if (hold) {
            if (dx < -30) nextPage();
            else if (dx > 30) prevPage();
        }
        return;
    }
    if (Date.now() - s.time > 250) return;
    var w = window.innerWidth || document.documentElement.clientWidth;
    if (s.x < w / 3) {
        prevPage();
    } else if (s.x > w * 2 / 3) {
        nextPage();
    } else {
        try { Android.toggleNavigation(); } catch (err) {}
    }
}, true);
document.addEventListener('touchcancel', function () { _simTapStart = null; _simCenterHold = false; }, true);

/**
 * 书中页内锚点（{@code <a href="#x">}）不归原生拦截管：Chromium 把同文档跳转当成不通知客户端的导航，
 * shouldOverrideUrlLoading 压根不会被调到，于是 WebView 自己去滚 #htmlContent —— 而分页是把整列按页
 * 平移的，这一滚会把相邻两页错开半列（实测点书中「页内锚点」后满屏文字被切成两截）。就地取消默认行为。
 * 指向别的文档的链接（http(s)、包内相对 xhtml）仍会走原生拦截。
 */
document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (a) e.preventDefault();
}, true);

/**
 * ✅ 仿真模式章节边界换章（单一权威入口）：
 * 一次手势（无论是 document 级滑动分支，还是 turn.js 的 boundary 事件）只允许换一章，
 * 用 _boundaryPending 守卫。dir>0 下一章，dir<0 上一章。
 * ⚠️ 之所以需要统一：一次章末滑动会被「document 级滑动分支」与「turn.js boundary 事件」
 * 各触发一次，若各自独立调用 onChapterEnd 就会连跳两章（先进入下一章、约 1s 后跳到再下一章）。
 * 兜底解锁：跨章失败（如"已经是最后一章"）时不会触发 loadContent，需自行复位。
 */
function simBoundarySwap(dir) {
    if (_xCrossFlipping) return;
    if (_boundaryPending) return;
    _boundaryPending = true;
    setTimeout(function() { _boundaryPending = false; }, 1500);
    // ✅ 邻章已就绪 → 无缝卷页换章（与普通卷页同观感）；未就绪 → 原有加载流程。
    //    turn.js 的 boundary 事件处于其内部状态机中，同步 destroy flipbook 有风险 → 下一拍再拆。
    var xt = null;
    try { xt = tryFetchAdjacentChapter(dir); } catch (e) { xt = null; }
    if (xt) {
        setTimeout(function() {
            if (!simStartCrossFlip(xt)) {
                try { if (dir > 0) Android.onChapterEnd(); else Android.onChapterStart(); } catch (e) {}
            }
        }, 0);
        return;
    }
    try {
        if (dir > 0) Android.onChapterEnd();
        else Android.onChapterStart();
    } catch (e) {}
}

// ============ 仿真模式跨章无缝卷页（临时双页 flipbook） ============
// turn.js 的 flipbook 页数即本章页数，无法原地追加邻章页，因此用「临时双页 flipbook」完成跨章：
//   前向（本章末页 → 下一章第 1 页）：p1=本章末页位图、p2=下一章第 1 页位图，
//       初始停在 p1，程序化 turn('next') → 末页卷起露出下一章首页，与普通卷页观感一致；
//   后向（本章首页 → 上一章末页）：p1=上一章末页位图、p2=本章首页位图，
//       初始停在 p2，程序化 turn('previous') → 上一章末页从左侧卷入盖住屏幕。
// 落地后重建正式 flipbook（initSimulation），画面与落地帧完全一致 → 零跳变，
// 再回调 Android.onChapterEnd/onChapterStart，Java 回送的 loadContent 结果一致。
// 注意：前向在起飞前就把全局分页切到下一章（swapToAdjacentChapter），后向在落地时才切换。
var _xCrossFlipping = false;   // 临时 flipbook 跨章卷页在途（含 500ms 动画与落地重建）
var _xflipArmed = false;       // ✅ turn('next'/'previous') 已发出；armed 之后的 turned 才是真正落点
var _xflipInitPage = 0;        // ✅ 临时 flipbook 初始页号；turned(page===初始页) 是 turn() 初始化误触发

/** ✅ 跨章在途延迟器：跨章卷页期间，任何会 paginate/重绘/重建仿真层的异步回调
 *  （字体加载回调、setFontSize/setFontFamily 的 reinitSimulation 防抖定时器等）若此刻执行，
 *  会 destroySimulation 摧毁在途临时 flipbook → turned 永不到达 → 3s 兜底按失败回退，
 *  表现为「换章翻页有时跳回翻页前的页面」。字体回调到达时机随机（网络/缓存），故偶发。
 *  在途时统一延迟到落地后执行；落地后立即照常执行。 */
function xDefer(fn) {
    if (!_xCrossFlipping) { fn(); return; }
    setTimeout(function () { xDefer(fn); }, 120);
}

/** 临时把全局 pages/chapterTitle 换成目标章后渲染第 idx 页位图；渲染完立即还原。
 *  若该槽位原本无缓存则顺手清掉，防止污染当前章的同序号页位图（simPageCache 按索引存）。 */
function simRenderUrlForPages(pArr, title, idx) {
    var sPages = pages, sTitle = chapterTitle;
    pages = pArr; chapterTitle = title;
    var had = (simPageCache[idx] !== undefined);
    var url = null;
    try { url = renderPageToCache(idx); } catch (e) { url = null; }
    pages = sPages; chapterTitle = sTitle;
    if (!had && url !== null) { try { delete simPageCache[idx]; } catch (e2) {} }
    return url;
}

/** 仿真跨章无缝卷页：构建临时双页 flipbook 并程序化翻页。成功接管返回 true（换章回调由落地时发出） */
function simStartCrossFlip(xt) {
    if (_xCrossFlipping) return false;
    if (!xt || !xt.pages || !xt.pages.length) return false;
    var forward = xt.dir > 0;
    var frontUrl = null, underEl = null, initPage = 1;

    try {
        if (forward) {
            // 起飞前先把全局分页切到下一章（落地后 Java loadContent 结果一致）
            xt.saved = { pages: pages, offsets: pageStartOffsets, title: chapterTitle,
                         content: currentContent, index: currentChapterIndex, page: currentPage };
            frontUrl = simPageCache[currentPage];
            if (frontUrl === undefined) frontUrl = renderPageToCache(currentPage);
            if (!frontUrl) return false;
            swapToAdjacentChapter(xt);
            currentPage = 0;
            delete simPageCache[0];              // 防止命中旧章第 1 页的同序号缓存
            underEl = createSimPageElement(0);   // 下一章第 1 页（读新全局）
            initPage = 1;
        } else {
            // 全局暂不切换（落地时再切）；先渲染上一章末页位图
            var zLast = xt.pages.length - 1;
            frontUrl = simRenderUrlForPages(xt.pages, xt.title, zLast);
            if (!frontUrl) return false;
            _suppressPageNotify = true;
            _xTurnBusy = true;
            setTimeout(function() { _suppressPageNotify = false; _xTurnBusy = false; }, 2000);
            underEl = createSimPageElement(0);   // 本章第 1 页（读当前全局）
            initPage = 2;
        }
    } catch (e) {
        console.error('simStartCrossFlip 准备失败: ' + e.message);
        return false;
    }

    _xCrossFlipping = true;
    _xflipArmed = false;
    _xflipInitPage = initPage;
    // 兜底：turn.js 事件异常未落地时，3 秒后强制按失败收尾
    setTimeout(function() { if (_xCrossFlipping) simFinishCrossFlip(xt, false); }, 3000);

    // 类名显式重排：p1=卷动页（front）、p2=落点页（under），避免 createSimPageElement 的 p1 类名冲突
    underEl.attr('class', 'page-div p2 page fixed');
    var frontEl = $('<div class="page-div p1 page fixed"></div>');
    frontEl.css({ 'background-color': bgColor });
    var imgF = document.createElement('img');
    imgF.src = frontUrl;
    imgF.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;';
    imgF.className = 'page-content';
    frontEl[0].appendChild(imgF);

    destroySimulation();                       // 拆掉旧 flipbook（此时 simulationActive 仍为 true）
    simulationActive = false;                  // 折页在途期间屏蔽仿真触摸处理（touch 分支等）
    canvas.style.visibility = 'hidden';
    $('#flipbookContainer').css('display', 'block');
    // ✅ 在途期间屏蔽 flipbook 指针事件：程序化卷页若被用户触摸打断，turn.js 会走取消路径
    //    不再触发 turned → 只能等 3s 兜底按失败回退（表现为换章后 ~3s 跳回原章）。
    //    我们的触摸处理在 document 层且 simulationActive=false 已屏蔽，不受影响。
    $('#flipbook').css('pointer-events', 'none');
    syncSimulationBackground();
    var flipbook = $('#flipbook');
    flipbook.empty();
    flipbook.append(frontEl).append(underEl);

    var W = window.innerWidth, H = window.innerHeight;
    flipbook.turn({
        width: W, height: H, display: 'single', duration: 500,
        gradients: true, acceleration: true, elevation: 60,
        page: initPage, pages: 2,
        when: {
            start: function (event, opts) {
                // 底层静止区保险：用「落点页」位图铺 wrapper 背景（与 simOnFlipStart 同理）。
                // ⚠️ 落点页随方向而异：前向落点 = underEl（下一章第 1 页）；
                //    后向落点 = frontEl（上一章末页 = frontUrl）。后向若沿用 underEl 的位图
                //    （它是当前章第 1 页，单页模式 p1 被 turn.js 隐藏、露出的正是这层背景），
                //    卷页全程露出的仍是原章内容，落地重建后才跳变成上一章末页（已踩坑）。
                try {
                    var url;
                    if (forward) {
                        var uimg = underEl.find('img')[0];
                        url = (uimg && uimg.src) || frontUrl;
                    } else {
                        url = frontUrl;
                    }
                    var styleEl = document.getElementById('simUnderPageStyle');
                    if (!styleEl) {
                        styleEl = document.createElement('style');
                        styleEl.id = 'simUnderPageStyle';
                        document.head.appendChild(styleEl);
                    }
                    styleEl.textContent = '#flipbook .page-wrapper {' +
                        ' background-image: url(' + url + ') !important;' +
                        ' background-size: 100% 100% !important;' +
                        ' background-repeat: no-repeat !important;' +
                        ' background-position: 0 0 !important; }';
                    var pt = document.querySelector('#flipbook .page.p-temporal');
                    if (pt) pt.style.display = '';
                } catch (e) {}
            },
            end: function (event, opts, completed) {
                if (!_xflipArmed) return;
                if (completed) return;                 // 成功：交给 _eventEnd → _fitPage → turned 落地
                // ⚠️ 程序化翻页不存在「取消」。此 end(false) 是 turn.js _fitPage 内部 turn("stop")
                //    的正常收尾（成功翻页后必伴随一次），只清视觉残留，绝不能当失败回退——
                //    否则会同步 destroy 临时 flipbook，摧毁紧随其后的 turned 事件链（已踩坑）。
                //    失败收尾由 fire 异常分支与 3s 兜底负责。
                simOnFlipEnd();
            },
            turned: function (event, page) {
                // ✅ turn.js 在 turn() 初始化时就会触发一次 turned(page=初始页)（实测 t≈55~115ms），
                //    并非翻页落点；只有 turn('next'/'previous') 发出（armed）之后的 turned 才算落地。
                if (!_xflipArmed) return;
                if (page === _xflipInitPage) return;   // 双保险：初始页的 turned 不是落点
                simOnFlipEnd();
                simFinishCrossFlip(xt, true);
            },
            missing: function () {}
        }
    });

    setTimeout(function() {
        try {
            // ✅ 若收尾已发生（如 init 误触发被拦截前后的异常路径），此刻 #flipbook 可能已是
            //    重建后的正式 flipbook——绝不能再对它发 turn('next'/'previous')（会误翻一页并污染进度）。
            if (!_xCrossFlipping) return;
            var fb = $('#flipbook');
            if (!fb.data() || !fb.turn('is')) { simFinishCrossFlip(xt, false); return; }
            _xflipArmed = true;                // 翻页指令已发出：之后的 turned 才是落点
            fb.turn(forward ? 'next' : 'previous');
        } catch (e) { simFinishCrossFlip(xt, false); }
    }, 30);
    return true;
}

/** 仿真跨章卷页收尾：completed=true 落地目标章并重建正式 flipbook；false 回退触发前状态 */
function simFinishCrossFlip(xt, completed) {
    if (!_xCrossFlipping) return;
    _xCrossFlipping = false;
    try {
        var fb = $('#flipbook');
        if (fb.data() && fb.turn('is')) fb.turn('destroy');
    } catch (e) {}
    $('#flipbook').empty();
    $('#flipbook').css('pointer-events', '');   // ✅ 恢复指针事件（临时 flipbook 期间被屏蔽，见 simStartCrossFlip）
    if (completed) {
        if (xt.dir < 0) {
            // 后向：落地时才把全局分页切到上一章，落点为其最后一页
            swapToAdjacentChapter(xt);
            currentPage = xt.pages.length - 1;
        }
        // 前向：起飞前已切换，currentPage 已是 0
        // ✅ 落地即解除「跨章繁忙」：此后用户立刻再跨章，桥可按 Java 已推进的索引正常取邻章，
        //    不必等 loadContent 回送（期间快速再翻会被拒走旧流程、撞上去重窗被吞=点一下无反应）。
        //    _suppressPageNotify 仍保持到 loadContent 到达（页码上报窗口保护不变）；
        //    迟到的过时 loadContent 由 loadContent 内的 onChapterResync 校验兜住。
        _xTurnBusy = false;
    } else {
        // 失败回退：恢复触发前状态（前向已切全局需还原；后向全局未动）；换章回调未发出，旗标自行清除
        if (xt.dir > 0 && xt.saved) {
            pages = xt.saved.pages; pageStartOffsets = xt.saved.offsets;
            chapterTitle = xt.saved.title; currentContent = xt.saved.content;
            currentChapterIndex = xt.saved.index; currentPage = xt.saved.page;
        }
        _suppressPageNotify = false;
        _xTurnBusy = false;
    }
    initSimulation();     // 重建正式 flipbook（画面与落地帧/原帧一致）
    if (completed) {
        try { if (xt.dir > 0) Android.onChapterEnd(); else Android.onChapterStart(); } catch (e) {}
    }
}

/**
 * ✅ 章节边界事件（由 turn.min.js 的 _eventReleased 在目标页越界时触发）：
 * 本章最后一页继续向后滑 → dir=+1 请求下一章；本章第一页继续向前滑 → dir=-1 请求上一章。
 * 说明：不能用 when 注册——turn.js 的 destroy 只会解绑内置事件，
 * 自定义事件会随每次重建累积，导致一次滑动跳多章。故在脚本层绑定一次。
 * 统一走 simBoundarySwap（与 document 级滑动分支共用 _boundaryPending 守卫），保证单次换章。
 */
$('#flipbook').on('boundary', function(event, dir) {
    simBoundarySwap(dir);
});

// 翻页结束：
//   1. 清除底层页背景样式，恢复正常纹理
//   2. 清理书页背面，隐藏 p-temporal
function simOnFlipEnd() {
    if (_simBackRAF) { cancelAnimationFrame(_simBackRAF); _simBackRAF = null; }
    simClearBack();
    // 清除底层页背景样式
    var underStyleEl = document.getElementById('simUnderPageStyle');
    if (underStyleEl) underStyleEl.textContent = '';
    var pt = document.querySelector('#flipbook .page.p-temporal');
    if (pt) pt.style.display = 'none';
    // 恢复纹理兜底
    syncSimulationBackground();
}

function initSimulation() {
    // ✅ 跨章在途闸门：Java 在 loadContent 之外单独发送的伴随指令（setPageTurnMode、设置批处理等）
    //    不走 loadContent 的延迟队列——它们若在跨章卷页中途执行，会 destroySimulation 拆掉在途
    //    临时 flipbook，turn.js 内部状态机崩溃（Uncaught reading 'data'），事件链断裂。
    //    在途时延迟到落地后执行：届时正式 flipbook 已由落地逻辑重建，本调用幂等无害。
    //    （落地路径 simFinishCrossFlip 调用本函数时 _xCrossFlipping 已复位，不受影响。）
    if (_xCrossFlipping) { setTimeout(initSimulation, 120); return; }
    if (pages.length === 0) return;

    // 清理可能存在的占位页，并将 simulationActive 统一在初始化后设置
    clearSimulationPlaceholder();

    // 如果已处于仿真激活状态，先销毁（destroySimulation 会重置 simulationActive=false）
    if (simulationActive) {
        destroySimulation();
    }
    simulationActive = true;
    simPageCache = {};
    _simFoldActive = false; // 重建书本，清理上一次可能残留的折页状态

    if (!renderCanvas) {
        renderCanvas = document.createElement('canvas');
        renderCtx = renderCanvas.getContext('2d');
    }
    // ✅ 仿真页位图按 simRenderDpr 渲染（见上方说明），避免满屏 3x 大图 toDataURL 导致进入阅读器长时间白屏。
    renderCanvas.width = Math.round(window.innerWidth * simRenderDpr);
    renderCanvas.height = Math.round(window.innerHeight * simRenderDpr);

    var flipbook = $('#flipbook');
    flipbook.empty();

    var W = window.innerWidth;
    var H = window.innerHeight;

    // ✅ 关键修复：预渲染当前页（currentPage）为图片后再启动 turn.js
    // 避免 turn.js 初始化期间出现空页
    var firstPageIdx = currentPage;
    if (firstPageIdx < 0 || firstPageIdx >= pages.length) firstPageIdx = 0;

    // 先填充当前页（带正确背景色）再启动 turn.js；
    // createSimPageElement 会带上 p{n} 类名，保证从章节中间恢复时页码不错位
    flipbook.append(createSimPageElement(firstPageIdx));

    // 确保容器背景与内容一致（含纹理：正反书页背景统一由 syncSimulationBackground 同步）
    $('#flipbookContainer').css('display', 'block');
    syncSimulationBackground();

    // 隐藏底层 canvas（仿真模式下始终由 flipbook 容器承担显示）
    canvas.style.visibility = 'hidden';

    flipbook.turn({
        width: W,
        height: H,
        display: 'single',
        duration: 500,  // 翻页动画时长，500ms 比默认 600ms 更流畅
        gradients: true,
        acceleration: true,
        elevation: 60,
        page: firstPageIdx + 1,  // 当前页，从 1 开始
        pages: pages.length,
        when: {
            start: function(event, opts) {
                // 记录折页已开始（供"折页取消"兜底清理使用）
                _simFoldActive = true;
                _simFoldSeq++;
                // 新的一次折页重新允许请求跨章（上一次跨章失败/未完成时也能重试）
                _boundaryPending = false;
                // 翻页开始：确保目标页已加入 DOM（底层静止区域才能显示下一页），
                // 同时清空书页背面残留内容，让背面保持空白纸张效果
                if (opts && opts.next) simOnFlipStart(opts.next);
            },
            end: function(event, opts, completed) {
                // turn.js 折页收尾：completed=false 表示折页被取消（未翻页），
                // 此时不会触发 turned，需立即清理书页背面与底层页样式
                if (completed) return;
                if (!_simFoldActive) return;
                _simFoldActive = false;
                simOnFlipEnd();
            },
            turning: function(event, page) {
                currentPage = page - 1;
                notifyJavaPageChange();
            },
            turned: function(event, page) {
                _simFoldActive = false;
                currentPage = page - 1;
                // 仿真模式下 canvas 已隐藏，无需 drawPage（避免无效渲染消耗性能）
                // 翻页结束：清理书页背面，隐藏 p-temporal
                simOnFlipEnd();
                // 翻页结束后预加载新位置附近的页面（前两页~后三页），
                // 保证下一次拖拽翻页时露出的页面已有内容
                ensureSimulationPages(currentPage);
            },
            missing: function(event, missingPages) {
                for (var i = 0; i < missingPages.length; i++) {
                    var pg = missingPages[i];
                    var idx = pg - 1;
                    if (idx >= 0 && idx < pages.length) {
                        // 页面不存在时渲染并注册（松手触发 missing 的兜底路径）
                        flipbook.turn('addPage', createSimPageElement(idx), pg);
                    }
                }
                // 直接同步背景，避免 setTimeout 延迟导致的闪烁
                syncSimulationBackground();
            }
        }
    });

    // ✅ 预加载当前页附近的页面为页对象：turn.js 拖拽折页阶段不会触发 missing，必须提前加入 DOM 才不会露空白。
    //    但整章逐页 toDataURL 很重（满屏大图），若同步执行会阻塞首屏出图 → 长时间白屏。
    //    故把「相邻页预渲染」移出关键路径：当前页已渲染并显示 flipbook 后，下一帧再补相邻页；
    //    期间若用户抢先翻页，由 turn.js 的 missing 事件兜底补页，不会露空白。
    setTimeout(function() {
        if (simulationActive) ensureSimulationPages(firstPageIdx);
    }, 0);

    // 初始化时隐藏 p-temporal（书页背面），避免其背景色遮挡当前页正面内容。
    // p-temporal 仅在翻页动画期间由 simOnFlipStart 显示，翻页结束由 simOnFlipEnd 隐藏。
    var initPt = document.querySelector('#flipbook .page.p-temporal');
    if (initPt) initPt.style.display = 'none';
}

function destroySimulation() {
    // 同时处理"占位模式"与"仿真激活"两种状态的清理
    if (!simulationActive && !_simulationPlaceholderActive) return;
    simulationActive = false;
    _simFoldActive = false;
    clearSimulationPlaceholder();
    try {
        var flipbook = $('#flipbook');
        if (flipbook.data() && flipbook.turn('is')) {
            flipbook.turn('destroy');
        }
    } catch (e) {
        console.error('销毁 flipbook 异常: ' + e);
    }
    $('#flipbookContainer').css({ display: 'none' });
    // ✅ 恢复 canvas 显示（切换模式或退出仿真模式时）
    canvas.style.visibility = 'visible';
    simPageCache = {};
}

function renderPageToCache(pageIndex) {
    var dpr = simRenderDpr || Math.min(window.devicePixelRatio || 1, 2);

    // Render to off-screen canvas to avoid flickering the main display
    renderCtx.setTransform(1, 0, 0, 1, 0, 0);
    renderCtx.scale(dpr, dpr);

    var savedPage = currentPage;
    currentPage = pageIndex;
    var realCtx = ctx;
    ctx = renderCtx;
    drawPage(pageIndex);
    ctx = realCtx;
    currentPage = savedPage;

    var dataUrl = renderCanvas.toDataURL('image/jpeg', 0.85);
    simPageCache[pageIndex] = dataUrl;
    return dataUrl;
}

// ✅ 创建仿真页元素：内容为整页渲染图，类名 p{n} 让 turn.js
// 按类名注册页码（addPage 中类名优先于显式页码参数，避免恢复到章中间时错位）
// 说明：内容必须用 <img> 子节点承载（而非仅 CSS background-image），
// 因为 turn.js 折页动画会把页元素的 DOM 子节点复制进折页层；
// 仅靠 background-image 会让折页层在动画期间是空白，导致翻页时下一页不显示。
// 添加 fixed 类：turn.js 的 _necessPage 会保留有 fixed 类的页在 DOM 中，
// 防止 _removeFromDOM 在 range 变化时把预加载的相邻页移除，
// 确保翻页时底层静止区域能正确显示下一页内容。
function createSimPageElement(pageIndex) {
    if (simPageCache[pageIndex] === undefined) {
        renderPageToCache(pageIndex);
    }
    var element = $('<div class="page-div p' + (pageIndex + 1) + ' page fixed"></div>');
    element.css({
        // 保留底色，作为折页层内的兜底；正页内容由 img 子节点呈现
        'background-color': bgColor
    });
    // 用 <img> 承载整页渲染图：位置铺满，保证折页时也能被 turn.js 复制
    var img = document.createElement('img');
    img.src = simPageCache[pageIndex];
    img.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;';
    img.className = 'page-content';
    element[0].appendChild(img);
    return element;
}

/**
 * ✅ 预加载当前页附近的页面（前两页 ~ 后三页）为 turn.js 页对象。
 * 原因：turn.js 只在"松手"(_turnPage)时才触发 missing 事件补页，
 * 拖拽折页的整个过程中下一页根本不在 DOM 里，导致翻页时露出的下一页为空。
 * 必须提前把相邻页作为页对象加入 flipbook，拖拽时才能立即看到内容。
 */
function ensureSimulationPages(centerIdx) {
    if (!simulationActive || !pages.length) return;
    var flipbook = $('#flipbook');
    try {
        var data = flipbook.data();
        if (!data || !data.pageObjs || !flipbook.turn('is')) return;
        var added = false;
        // 预加载范围：前两页 ~ 后三页（共6页），减少翻页时即时渲染
        for (var off = -2; off <= 3; off++) {
            var idx = centerIdx + off;
            if (idx < 0 || idx >= pages.length) continue;
            var pg = idx + 1;
            if (data.pageObjs[pg]) continue; // 已存在，无需重复添加
            flipbook.turn('addPage', createSimPageElement(idx), pg);
            added = true;
        }
        // 只有实际添加了新页时才同步背景，避免不必要的重绘
        if (added) syncSimulationBackground();
    } catch (e) {
        console.error('ensureSimulationPages 异常: ' + e);
    }
}

/**
 * 立即按当前配色重建仿真书页（不走防抖）。
 * 供「日夜渐变收尾」这类必须精确定时的场景使用：仿真页的内容是「整页渲染位图」，
 * 只能靠重建来换色，防抖会把它推迟到调用结束后 80ms 才执行。
 */
function restartSimulationNow() {
    if (_reinitTimer) { clearTimeout(_reinitTimer); _reinitTimer = null; }
    destroySimulation();
    simulationActive = false; // ensure clean state
    initSimulation();
}

function reinitSimulation() {
    if (!simulationActive) return;
    // Debounce: wait for all pending settings calls before rebuilding
    if (_reinitTimer) clearTimeout(_reinitTimer);
    // ✅ xDefer：防抖定时器若在跨章在途窗口内到期，会摧毁临时 flipbook（见 xDefer 注释）
    _reinitTimer = setTimeout(function() {
        _reinitTimer = null;
        xDefer(restartSimulationNow);
    }, 80);
}

// ============ 连续滚动模式（'updown'） ============
// 进入该模式后，内容不再分页，而是连成一张长卷，靠上下拖拽滚动显示。

/** 是否处于连续滚动模式 */
function isScrollMode() {
    return pageTurnMode === 'updown';
}

/** 粘性页眉高度（章节标题固定显示在顶部）。关闭页眉或空标题时为 0 */
function scrollHeaderHeight() {
    if (showHeaderFooter && chapterTitle) return headerFooterFontSize + SCROLL_HEADER_EXTRA;
    return 0;
}

/** 把整章内容排版成连续行（不分页），填充 scrollLines / scrollContentHeight / scrollMax */
function layoutScroll(text, title) {
    scrollLines = [];
    if (!text && !title) { scrollContentHeight = 0; scrollMax = 0; return; }
    var W = window.innerWidth;
    var maxWidth = W - padding * 2;
    var headerH = scrollHeaderHeight();
    var top = headerH + topPadding;
    var footerReserved = 17;
    var bottomPad = footerReserved + 24; // 末行不被页脚遮挡
    var y = top;

    if (title) {
        ctx.font = 'bold ' + titleFontSize + 'px ' + fontFamily;
        var titleLines = splitTextToLines(title, maxWidth);
        titleLines.forEach(function (line) {
            scrollLines.push({ text: line, fontSize: titleFontSize, bold: true, color: textColor, y: y,
                justLast: true });   // 标题不参与两端对齐
            y += titleFontSize * 1.6;
        });
        y += titleFontSize * 0.8; // 标题后空行
    }

    ctx.font = fontSize + 'px ' + fontFamily;
    var indent = '\u3000\u3000';
    var paragraphs = text.split('\n');
    paragraphs.forEach(function (para) {
        if (para.length === 0) {
            y += fontSize * lineHeightRatio * paraGapRatio;
            return;
        }
        var trimmed = para.replace(/^[\s\u3000]+/, '');
        var indentedPara = indent + trimmed;
        var lines = splitTextToLines(indentedPara, maxWidth);
        lines.forEach(function (line, li) {
            scrollLines.push({ text: line, fontSize: fontSize, bold: false, color: textColor, y: y,
                justLast: li === lines.length - 1 });   // 段落末行不拉伸，其余行两端对齐
            y += fontSize * lineHeightRatio;
        });
    });

    y += bottomPad;
    scrollContentHeight = y;
    scrollViewW = W;
    scrollViewH = window.innerHeight;
    scrollMax = Math.max(0, scrollContentHeight - scrollViewH);
    clampScroll();
}

/** 约束 scrollY 在 [0, scrollMax] 范围内 */
function clampScroll() {
    if (scrollY < 0) scrollY = 0;
    if (scrollY > scrollMax) scrollY = scrollMax;
}

/** 取消正在进行的滚动动画（惯性 / 程序化跳转） */
function cancelScrollAnim() {
    if (scrollAnimId) { cancelAnimationFrame(scrollAnimId); scrollAnimId = 0; }
    isAnimating = false;
}

/** 绘制当前滚动视口（仅渲染可视区域内的行，性能友好） */
function drawScroll() {
    var dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    var W = window.innerWidth, H = window.innerHeight;

    // 背景（底色 + 纹理）
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);
    if (bgTextureImg && bgTextureImg.complete) ctx.drawImage(bgTextureImg, 0, 0, W, H);

    // 页眉 / 页脚带高度：正文渲染时避开这两个区域，正文不侵入页眉页脚位置。
    // 粘性带从 topPadding 起算，与 layoutScroll() 预留的顶距一致，并与其他翻页模式的页眉上边距相同。
    var headerBand = (showHeaderFooter && chapterTitle) ? (topPadding + headerFooterFontSize + SCROLL_HEADER_EXTRA) : 0;
    var footerBand = showHeaderFooter ? (headerFooterFontSize + 20) : 0;

    // 顶部粘性页眉（章节标题）—— 与其他翻页模式保持一致：
    // 背景使用页面底色 + 纹理（不单独覆盖成不透明块），标题字体/颜色/左对齐/距上边框(topPadding)均相同。
    // 正文已用 clip 排除此区域，不会从下方透出，因此无需不透明遮罩。
    if (showHeaderFooter && chapterTitle) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, W, headerBand);
        if (bgTextureImg && bgTextureImg.complete) ctx.drawImage(bgTextureImg, 0, 0, W, H);
        ctx.font = headerFooterFontSize + 'px ' + fontFamily;
        ctx.fillStyle = headerFooterColor;
        ctx.textAlign = 'left';
        ctx.fillText(chapterTitle, padding, topPadding + headerFooterFontSize);
        // 自动翻页倒计时：页眉右侧小字
        if (autoPageCountdown > 0) {
            ctx.textAlign = 'right';
            ctx.fillText(autoPageCountdown + 's', W - padding, topPadding + headerFooterFontSize);
            ctx.textAlign = 'left';
        }
    }

    // 正文（仅绘制可视区域行；用 clip 排除页眉/页脚带，正文不会显示在这两个位置）
    var top = scrollY, H2 = H;
    ctx.textAlign = 'left';
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, headerBand, W, Math.max(0, H - headerBand - footerBand));
    ctx.clip();
    for (var i = 0; i < scrollLines.length; i++) {
        var line = scrollLines[i];
        var lineH = line.fontSize * (line.bold ? 1.6 : lineHeightRatio);
        var screenY = line.y - scrollY;
        if (screenY + lineH < 0) continue;   // 在视口上方
        if (screenY > H2) break;              // 在视口下方（行已按 y 升序）
        ctx.font = (line.bold ? 'bold ' : '') + line.fontSize + 'px ' + fontFamily;
        ctx.fillStyle = line.color || textColor;
        // maxWidth 与 layoutScroll 的断行宽度同源（W - padding*2），保证拉伸目标与排版基准一致
        fillLineText(line.text, padding, screenY + line.fontSize, W - padding * 2, line.justLast);
    }
    ctx.restore();

    // 页脚（页码 / 进度）
    if (showHeaderFooter) {
        var total = virtualTotalPages();
        var cur = virtualCurrentPage();
        var footerText = cur + '/' + total;
        if (isLocalBook && typeof bookProgress !== 'undefined') footerText += ' ' + bookProgress + '%';
        ctx.font = headerFooterFontSize + 'px ' + fontFamily;
        ctx.fillStyle = headerFooterColor;
        ctx.textAlign = 'right';
        ctx.fillText(footerText, W - padding, H - 15);
        if (showBatteryTime && (batteryText || timeText)) {
            ctx.textAlign = 'left';
            var leftInfo = batteryText + (batteryText && timeText ? '  ' : '') + timeText;
            ctx.fillText(leftInfo, padding, H - 15);
        }
        ctx.textAlign = 'left';
    }
}

/** 越界阻尼：拖过章节边界时位移按比例缩小，产生"拉扯感" */
function applyDamping(x) { return x * 0.4; }

/** 平滑滚动到指定偏移（程序化跳转 / 越界回弹）。opts.onDone 在动画结束后回调 */
function animateScrollTo(targetY, opts) {
    opts = opts || {};
    cancelScrollAnim();
    targetY = Math.max(0, Math.min(scrollMax, targetY));
    isAnimating = true;
    var from = scrollY, to = targetY, start = null, dur = opts.dur || 260;
    function step(ts) {
        if (start === null) start = ts;
        var t = Math.min((ts - start) / dur, 1);
        var e = 1 - Math.pow(1 - t, 3);
        scrollY = from + (to - from) * e;
        drawScroll();
        if (t < 1) {
            scrollAnimId = requestAnimationFrame(step);
        } else {
            scrollAnimId = 0;
            isAnimating = false;
            scrollY = to;
            if (opts.onDone) opts.onDone();
            notifyJavaPageChange();
        }
    }
    scrollAnimId = requestAnimationFrame(step);
}

/** 惯性滚动：松手后按速度继续滑行并自然减速 */
function startMomentum(v) {
    cancelScrollAnim();
    isAnimating = true;
    var last = null;
    function step(ts) {
        if (last === null) last = ts;
        var dt = (ts - last) / 1000;
        if (dt > 0.05) dt = 0.05;
        last = ts;
        scrollY += v * dt * 1000;       // v: px/ms
        v *= Math.exp(-dt / 0.3);       // 时间相关的指数衰减，帧率无关
        if (scrollY < 0) { scrollY = 0; v = 0; }
        if (scrollY > scrollMax) { scrollY = scrollMax; v = 0; }
        drawScroll();
