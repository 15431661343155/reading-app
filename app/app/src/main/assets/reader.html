    node.className += ' page p' + (p + 1);
    return node;
}

/**
 * 把松手接管绑到书本里的书纸上 —— 必须在交进书本之后绑。
 * released 由折页节点触发、冒泡到书本，挂在节点上才早于书本那套「先拆折页再重卷」的判定
 * （见 simTakeRelease）。先前绑在节点上等于没绑：turn.js 给折页做包装盒时要把节点搬进盒子，
 * 这一搬把节点上的 jQuery 事件数据整个清掉（真机查书本内 .page 节点，released 绑定数恒为 0），
 * 于是接管从没赶上松手，松手那一帧白丢 100ms 布局、折页冻住再重卷。
 * canvas 那一路的 #flipbook 不走这里，不受影响。
 */
function htmlSimBindRelease() {
    var host = document.getElementById('htmlFlipbook');
    if (!host) return;
    var nodes = host.querySelectorAll('.html-snap');
    for (var i = 0; i < nodes.length; i++) {
        var ev = $._data(nodes[i], 'events');
        if (ev && ev.released) continue;
        $(nodes[i]).on('released', simTakeRelease);
    }
}

/** 交一页进书本：addPage 会把节点搬进包装盒，搬完才绑得住 */
function htmlSimAddPage(fb, el, n) {
    fb.turn('addPage', el, n);
    htmlSimBindRelease();
}

/** 预置当前页前后的书纸：turn.js 拖拽折页阶段不触发 missing，缺页会露出空白 */
function htmlSimEnsure(center) {
    if (!htmlSim) return;
    var fb = $('#htmlFlipbook');
    try {
        var data = fb.data();
        if (!data || !data.pageObjs || !fb.turn('is')) return;
        for (var off = -2; off <= 3; off++) {
            var idx = center + off;
            if (idx < 0 || idx >= htmlPageCount || data.pageObjs[idx + 1]) continue;
            var el = htmlSimPage(idx);
            if (el) htmlSimAddPage(fb, el, idx + 1);
        }
    } catch (e) {
        console.error('htmlSimEnsure 异常: ' + e);
    }
}

function htmlInitSim() {
    if (!htmlMode || htmlFlow === 'scrolled' || pageTurnMode !== 'simulation') return;
    htmlDestroySim();
    var host = htmlTurnHost();
    var first = host && htmlSimPage(htmlPage);
    if (!first) return;
    var book = document.createElement('div');
    book.id = 'htmlFlipbook';
    book.className = 'fbk';
    book.appendChild(first);
    host.innerHTML = '';
    host.appendChild(book);
    host.classList.add('html-sim');
    host.style.display = 'block';
    // 书本接管显示：真纸带藏起来（快照与真页逐像素对齐，见 htmlSnapNode），但底色/页眉页脚照旧
    var cols = document.getElementById('htmlColumns');
    if (cols) cols.style.visibility = 'hidden';
    htmlSim = true;
    // 折页层是 turn.js 在翻页那一刻才造的，只能靠样式表规则提前备好纸面（同 canvas 一路的理由）
    syncSimulationBackground();
    $('#htmlFlipbook').turn({
        width: htmlViewW(),
        height: htmlClientH || htmlClientHeight(),
        display: 'single',
        duration: 500,
        gradients: true,
        acceleration: true,
        elevation: 60,
        dragSlop: DRAG_SLOP,  // 点按不翘角，横向拖拽越过这个距离才起卷（turn.min.js 自定义键）
        page: htmlPage + 1,
        pages: htmlPageCount,
        when: {
            turning: function (event, page) {
                isAnimating = true;
                htmlPage = Math.max(0, Math.min(htmlPageCount - 1, page - 1));
            },
            end: function (event, opts, completed) {
                // 折页被取消（拖拽未过中线、被下一次 turn('page') 打断）时 turn.js 不回 turned，
                // 而本路的 isAnimating 只在 turned 里清 —— 不在此兜底就再也没人能解锁，整本书点不动。
                // canvas 那一路有 when.end + simScheduleFoldCleanup 双保险，这里补齐同一口径。
                if (completed) return;
                htmlSimClearSettle();
                isAnimating = false;
                updateHtmlHeaderFooter();
            },
            turned: function (event, page) {
                htmlSimClearSettle();
                isAnimating = false;
                htmlPage = Math.max(0, Math.min(htmlPageCount - 1, page - 1));
                // 落地这一帧不叠第二趟重排：turn.js 刚在 _fitPage 里把书纸摘了又插（真机 90~150ms），
                // 当场再补五页副本会把新页稳定后的第一帧一起吞掉。副本只是给下一次拖拽预备的，晚一帧无妨。
                setTimeout(function () { htmlSimEnsure(htmlPage); }, 0);
                notifyJavaPageChange();
                updateHtmlHeaderFooter();
            },
            missing: function (event, missingPages) {
                var fb = $('#htmlFlipbook');
                for (var i = 0; i < missingPages.length; i++) {
                    var idx = missingPages[i] - 1;
                    if (idx < 0 || idx >= htmlPageCount) continue;
                    var el = htmlSimPage(idx);
                    if (el) htmlSimAddPage(fb, el, missingPages[i]);
                }
            }
        }
    });
    htmlSimBindRelease();     // 首叶也是 addPage 之前就绑的，搬过之后同样作废，统一在这里补
    setTimeout(function () { htmlSimEnsure(htmlPage); }, 0);
    // 记下这本是按哪个签名建的：下一次重排若签名全等，就原样留着它（见 htmlLayerSignature）
    _htmlLayerSig = htmlLayerSignature();
}

function htmlDestroySim() {
    _htmlLayerSig = '';      // 书一拆，「按哪个签名建的」就作废了
    // 书本容器接下来可能被整个清空，池里的镜像挂在同一个容器里，先作废免得留下指向已摘节点的额度
    htmlDisposeMirrors();
    htmlSimClearSettle();
    try {
        var fb = $('#htmlFlipbook');
        if (fb.length && fb.turn('is')) {
            // 先让整本书离体，再交给 turn.js 拆：它的 destroy 是逐页 removePage，每页都要重排
            // 剩下所有页的包装盒（真机 6 页 ≈ 400ms，全耗在同步布局上）。摘出文档后这些几何读写
            // 不再触发布局，剩下的只是对象清理。detach 会让 turn.js 摸不到 parent()，故它挂在
            // host 上的 start 监听必须由我们先摘掉，否则每建一本书就漏一个指向死书的回调。
            var d = fb.data(), onStart = d && d.eventHandlers && d.eventHandlers.start;
            if (onStart) fb.parent().unbind('start', onStart);
            fb.detach();
            fb.turn('destroy');
        }
    } catch (e) {
        console.error('htmlDestroySim 异常: ' + e);
    }
    htmlSim = null;
    var host = htmlTurnHost();
    if (host) {
        host.classList.remove('html-sim');
        if (!_turn) { host.innerHTML = ''; host.style.display = 'none'; }
    }
    var cols = document.getElementById('htmlColumns');
    if (cols) {
        // 书本在途时纸带是隐藏的，卷到第几页它并不知道；重新显示前按 htmlPage 补一次位移，
        // 否则切回覆盖/平移档会把纸带留在进仿真前的那一页。
        cols.style.visibility = '';
        htmlSetStripPage(htmlPage);
    }
}

/** 仿真模式下的跳页：交给 turn.js 卷过去（与 canvas 路径同一口径） */
var _htmlSimSettleTimer = 0;

function htmlSimClearSettle() {
    if (_htmlSimSettleTimer) { clearTimeout(_htmlSimSettleTimer); _htmlSimSettleTimer = 0; }
}

function htmlSimGoTo(p) {
    if (!htmlSim) return false;
    try {
        $('#htmlFlipbook').turn('page', p + 1);
        // 程序化卷页再兜一层：turn.js 若既不回 turned 也不回 end（折页被打断后可能两个都吞掉），
        // 900ms（> 卷页时长 500ms）后强制解锁，否则 isAnimating 会把翻页彻底锁死。
        htmlSimClearSettle();
        _htmlSimSettleTimer = setTimeout(function () {
            _htmlSimSettleTimer = 0;
            if (!htmlSim) return;
            isAnimating = false;
            htmlSimEnsure(htmlPage);
            updateHtmlHeaderFooter();
        }, 900);
        return true;
    } catch (e) {
        return false;
    }
}

/**
 * 无动画把书本摆到第 p 页（0 起）—— 进书定位、重排还原位置、换章落地都属「摆」不属「翻」。
 * turn.js 的 page 只有在「初始化那一趟（done=false）」或目标已在当前视图里才走 _fitPage（原地摆），
 * 否则一律 _turnPage 演一次卷页。先前这些位置都交给 simGoto，于是恢复阅读位置时先亮本章首页、
 * 再当着用户卷到目标页（真机观感：进阅读器闪一下并带一次翻页动画；改字号一类重排同理）。
 * done 只被三处读：addPage 借它决定要不要先 stop（_fitPage 自己会 stop，与初始化那趟同序），
 * direction 借它决定要不要重设尺寸，page 借它选路径 —— 这一趟同步借完即还原，不外泄。
 */
function htmlSimPlace(p) {
    if (!htmlSim) return false;
    var fb = $('#htmlFlipbook');
    var d = fb.data();
    if (!d) return false;
    var wasDone = d.done;
    d.done = false;
    try {
        fb.turn('page', p + 1);
    } catch (e) {
        d.done = wasDone;
        return false;
    }
    d.done = wasDone;
    htmlPage = Math.max(0, Math.min(htmlPageCount - 1, p));
    updateHtmlHeaderFooter();
    return true;
}

// turn.js 在书本元素上 stopPropagation，冒泡阶段的监听永远收不到（canvas 路径踩过同一坑），
// 所以章界判定也必须挂在捕获阶段。只记起点，判定放在 touchend，普通卷页仍交给 turn.js。
// 越界判定落在末页/首页时交给 pagerBoundaryOnce —— 仿真档 turn.js 卷不动也不回调，得自己补一次换章。
var _htmlSimSwipe = null;
document.addEventListener('touchstart', function (e) {
    if (!htmlSim) { _htmlSimSwipe = null; return; }
    var t = e.touches && e.touches[0];
    _htmlSimSwipe = t ? { x: t.clientX, y: t.clientY } : null;
}, true);
document.addEventListener('touchend', function (e) {
    var s = _htmlSimSwipe;
    _htmlSimSwipe = null;
    if (!s || !htmlSim) return;
    var ct = e.changedTouches && e.changedTouches[0];
    if (!ct) return;
    var dx = ct.clientX - s.x;
    if (Math.abs(dx) < 30 || Math.abs(dx) <= Math.abs(ct.clientY - s.y)) return;
    if (dx < 0) {
        if (htmlPage >= htmlPageCount - 1) pagerBoundaryOnce(1);
    } else if (htmlPage <= 0) {
        pagerBoundaryOnce(-1);
    }
}, true);
document.addEventListener('touchcancel', function () { _htmlSimSwipe = null; }, true);

/** 换章 / 重排 / 改档位时拆掉整个动画层，保证不留半张快照 */
function htmlResetTurnLayer() {
    turnReset();
    htmlDestroySim();
    disposeHtmlXStrip();   // 邻章排版盒与新正文的列宽无关，一并丢掉
}
function htmlCurrentPageText() {
    var cols = document.getElementById('htmlColumns');
    if (!cols) return '';
    return cols.innerText || cols.textContent || '';
}

// 视口尺寸变化（横竖屏切换等）：重新分栏并保持阅读位置
window.addEventListener('resize', function () {
    if (htmlMode) applyHtmlTheme(true);
});

// HTML 富文本模式下的「点击三分区」：由 Android 端在「仿真翻页」分支回调。
// canvas 一路必须在这里返回 false —— 它的仿真点击已由 document 级触摸处理（见 _simTapStart 那段）
// 接管，两端各处理一次就是「点一下翻两页」。
function onAndroidTap(ratio) {
    if (!htmlMode) return false;
    return pagerTapZone(ratio);
}

function setFontSize(size) {
    fontSize = size;
    titleFontSize = size + 4;
    topPadding = (vPadding >= 0) ? vPadding : padding + fontSize; // 字号变化时同步顶部边距（显式上下边距优先）
    if (htmlMode) { rebuildHtml('layout'); return; }   // HTML 模式：字号进列高，要重排（批量设置时只登记）
    if (currentContent) {
        if (!_deferDraw) {
            relayoutAndRedraw();
            if (simulationActive) reinitSimulation();
        }
    }
}

function setFontFamily(name) {
    if (name === '__system__') {
        // 系统字体：使用系统默认字体栈
        fontFamily = 'sans-serif';
    } else {
        fontFamily = name;
    }
    if (htmlMode) { rebuildHtml('layout'); return; }   // HTML 模式：换字面要重排（字体量度不同，列数会变）
    if (currentContent) {
        if (!_deferDraw) {
            relayoutAndRedraw();
            if (simulationActive) reinitSimulation();
        }
    }
}

/**
 * 阅读排版参数（设置弹窗「间距」行）：行距倍数 / 段距（行）/ 左右边距 px / 上下边距 px。
 * padTB 传 -1 表示跟随默认公式（左右边距 + 字号行高）；运行中直调会立即重排当前章，
 * 在 beginSettingsBatch 批处理期间则只更新变量，由 finishSettingsBatch 统一重绘。
 */
function setTypesetting(lineRatio, paraGap, padLR, padTB) {
    lineHeightRatio = lineRatio;
    paraGapRatio = paraGap;
    padding = padLR;
    vPadding = padTB;
    topPadding = (vPadding >= 0) ? vPadding : padding + fontSize;
    if (htmlMode) { rebuildHtml('layout'); return; }   // HTML 模式：行距/段距/边距都进列高，要重排
    if (currentContent) {
        if (!_deferDraw) {
            relayoutAndRedraw();
            if (simulationActive) reinitSimulation();
        }
    }
}

function loadCustomFont(src, name) {
    // 如果字体已经在 document.fonts 中，直接切换并重绘（避免重复异步加载）
    try {
        var iter = document.fonts.values();
        var entry = iter.next();
        while (!entry.done) {
            if (entry.value.family === '"' + name + '"' || entry.value.family === name) {
                fontFamily = name;
                // 纸带一路不看 currentContent（那是 canvas 的正文缓存），字体到位就得重排
                if (htmlMode || (currentContent && !_deferDraw)) {
                    // 已注册字体再次切换：同样等该具体字体可用后再重绘，避免首绘回退
                    var _dFn = function() {
                        if (htmlMode) { _htmlLayoutBump++; rebuildHtml('layout'); return; }
                        relayoutAndRedraw();
                        if (simulationActive) reinitSimulation();
                    };
                    var _p2 = (typeof fontSize !== 'undefined' ? fontSize : 18) + 'px ' + name;
                    if (document.fonts && document.fonts.load) {
                        Promise.resolve(document.fonts.load(_p2)).then(_dFn, _dFn);
                    } else {
                        _dFn();
                    }
                    setTimeout(_dFn, 150);
                }
                return;
            }
            entry = iter.next();
        }
    } catch (e) {}

    var wasDeferred = _deferDraw;
    var font = new FontFace(name, 'url(' + src + ')');
    font.load().then(function(loaded) {
        document.fonts.add(loaded);
        fontFamily = name;
        // ✅ 修复「点击切换无反应 / 需退出重进才生效」：
        // document.fonts.ready 在某些 Chromium 版本下不能可靠地让 Canvas 立即应用
        // 刚加入的自定义字体（首绘仍回退系统字体）。改用 document.fonts.load('18px 字体名')
        // 显式等待「该具体字体」真正可用后再重排重绘；setTimeout 兜底保证即使 Promise 异常也必重绘。
        var redrawFn = function() {
            if (htmlMode) { _htmlLayoutBump++; rebuildHtml('layout'); return; }
            if (currentContent) {
                relayoutAndRedraw();
                if (simulationActive) reinitSimulation();
            }
        };
        var _probe = (typeof fontSize !== 'undefined' ? fontSize : 18) + 'px ' + name;
        if (document.fonts && document.fonts.load) {
            Promise.resolve(document.fonts.load(_probe)).then(redrawFn, redrawFn);
        } else {
            redrawFn();
        }
        setTimeout(redrawFn, 150);
        // If batch was active, finish it now that font is loaded
        if (wasDeferred) {
            _deferDraw = false;
        }
    }).catch(function(err) {
        console.error('加载自定义字体失败: ' + err);
        // 加载失败时不强行改字体，保持当前阅读字体；必要时补一次重绘
        if (wasDeferred) finishSettingsBatch();
        else if (currentContent) relayoutAndRedraw();
    });
}

function setBackgroundColor(color) {
    bgColor = color;
    if (htmlMode) { rebuildHtml('colors'); return; }   // HTML 模式：底色不影响排版，只刷配色
    // ✅ 在仿真模式下，通过样式表规则统一更新容器和 wrapper 背景（含纹理同步，折角不镂空）
    if (_simulationPlaceholderActive || simulationActive) {
        $('#flipbook .page-div').css('background-color', color);
        syncSimulationBackground();
    }
    if (!_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

function setTextColor(color) {
    textColor = color;
    if (htmlMode) { rebuildHtml('colors'); return; }   // HTML 模式：文字色靠继承，不重排
    for (var i = 0; i < pages.length; i++) {
        for (var j = 0; j < pages[i].length; j++) {
            pages[i][j].color = color;
        }
    }
    if (!_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

function setBackgroundTexture(src) {
    if (htmlMode) { rebuildHtml('colors'); return; }   // HTML 模式：用户纹理不参与（正文自带底图），只刷配色
    // 如果 bgTextureImg 已经加载了同一张图，直接重绘（避免重复异步加载）
    if (bgTextureImg && bgTextureImg.complete && bgTextureImg.src && bgTextureImg.src.indexOf(src) !== -1) {
        if (currentContent && !_deferDraw) {
            redrawCurrent();
            if (simulationActive) reinitSimulation();
        }
        return;
    }

    var img = new Image();
    img.onload = function() {
        bgTextureImg = img;
        // ✅ 仿真占位模式：加载完成后立即更新占位页背景
        if (_simulationPlaceholderActive) {
            $('#flipbook .page-div').css('background-image', 'url(' + img.src + ')');
            $('#flipbook .page-div').css('background-size', '100% 100%');
        }
        // ✅ 仿真模式（占位/激活）：统一同步容器与翻页背面纹理
        if (_simulationPlaceholderActive || simulationActive) {
            syncSimulationBackground();
        }
        if (currentContent) {
            if (!_deferDraw) {
                redrawCurrent();
                if (simulationActive) reinitSimulation();
            }
        }
    };
    img.onerror = function() {
        console.error('加载纹理背景失败: ' + src);
    };
    img.src = src;
}

function clearBackgroundTexture() {
    bgTextureImg = null;
    if (htmlMode) { rebuildHtml('colors'); return; }   // HTML 模式：同上，只刷配色
    // ✅ 仿真模式（占位/激活）：清除纹理只留纯色（样式表规则统一同步）
    if (_simulationPlaceholderActive) {
        $('#flipbook .page-div').css('background-image', 'none');
    }
    if (_simulationPlaceholderActive || simulationActive) {
        syncSimulationBackground();
    }
    if (currentContent && !_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

function setNightMode(enable) {
    isNightMode = enable;
    bgTextureImg = null;
    if (enable) {
        bgColor = '#1A1A1A';
        textColor = '#AAAAAA';
    } else {
        bgColor = '#F5F5DC';
        textColor = '#333333';
    }
    if (htmlMode) { rebuildHtml('colors'); return; }   // HTML 模式：日/夜只换配色（含快照页纸面），不重排
    // ✅ 夜间模式切换时立即更新仿真容器和 wrapper 背景（纹理已清除，样式表统一同步）
    if (_simulationPlaceholderActive || simulationActive) {
        $('#flipbook .page-div').css({
            'background-color': bgColor,
            'background-image': 'none'
        });
        syncSimulationBackground();
    }
    for (var i = 0; i < pages.length; i++) {
        for (var j = 0; j < pages[i].length; j++) {
            pages[i][j].color = textColor;
        }
    }
    if (!_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

// 将 #RRGGBB / #RGB 在 a→b 之间按 t(0..1) 插值，返回 #RRGGBB
function lerpColor(a, b, t) {
    function norm(c) {
        if (c.length === 4) return '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
        return c;
    }
    a = norm(a); b = norm(b);
    var ar = parseInt(a.substr(1, 2), 16), ag = parseInt(a.substr(3, 2), 16), ab = parseInt(a.substr(5, 2), 16);
    var br = parseInt(b.substr(1, 2), 16), bg = parseInt(b.substr(3, 2), 16), bb = parseInt(b.substr(5, 2), 16);
    var r = Math.round(ar + (br - ar) * t);
    var g = Math.round(ag + (bg - ag) * t);
    var bl = Math.round(ab + (bb - ab) * t);
    return '#' + (0x1000000 + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}

/**
 * 平滑切换日/夜间：由原生侧传入起止颜色与时长（毫秒），逐帧插值。
 * enable: 目标是否为夜间；durationMs: 过渡时长；from/to 分别为起始/目标背景与文字色
 *
 * ⚠️ 三种渲染方式的「可见层」不同，必须分别驱动，否则会出现「导航栏渐变、正文瞬间跳变」：
 *   1) Canvas（覆盖/滑动/淡入/上下滚动）：redrawCurrent() 画的就是可见层，逐帧重绘即可；
 *   2) HTML 富文本（本地 EPUB 保留样式）：可见层是 #htmlContent 的 CSS 底色，逐帧改样式即可（不重排）；
 *   3) 仿真翻页（pageTurnMode === 'simulation'）：可见层是「整页渲染位图」(<img>)，
 *      位图只能靠重建换色，而重建（destroy + init + 逐页 toDataURL）既贵又带 80ms 防抖 ——
 *      逐帧调用只会被反复推迟，最终在渐变结束后才执行一次，正文于是整块跳变。
 *      故过渡期间把可见层临时换成可逐帧重绘的 canvas（与仿真页位图同源、视觉一致），
 *      动画收尾再按目标配色立即重建位图并交还仿真层。
 *      仿真的「占位页」只是纯色块（无位图），逐帧改其底色即可。
 */
function animateNightMode(enable, durationMs, fromBg, fromText, toBg, toText) {
    isNightMode = enable;
    bgTextureImg = null;

    // 过渡期间由 canvas 接管可见层（仅真仿真需要，且 HTML 模式不走 canvas）
    var simTakeover = simulationActive && !htmlMode;
    if (simTakeover) {
        canvas.style.visibility = 'visible';
        $('#flipbookContainer').css('display', 'none');
        redrawCurrent();   // 先把当前页补画到 canvas，接管瞬间不露空白
    }

    // 逐帧把插值后的配色画到当前可见层上
    function paintFrame() {
        if (_deferDraw) return;
        if (htmlMode) { applyHtmlThemeColors(); return; }  // HTML 模式：只改配色，不重排
        redrawCurrent();                                   // Canvas / 仿真接管：逐帧重绘
    }

    var start = null;
    function frame(ts) {
        if (start === null) start = ts;
        var t = durationMs <= 0 ? 1 : Math.min(1, (ts - start) / durationMs);
        var e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // ease-in-out
        bgColor = lerpColor(fromBg, toBg, e);
        textColor = lerpColor(fromText, toText, e);
        // 同步仿真/翻页容器底色
        if (_simulationPlaceholderActive || simulationActive) syncSimulationBackground();
        // 仿真占位页（纯色块，无位图）：逐帧跟随底色
        if (_simulationPlaceholderActive) {
            $('#flipbook .page-div').css('background-color', bgColor);
        }
        // 更新已布局页面的文字颜色缓存
        if (typeof pages !== 'undefined') {
            for (var i = 0; i < pages.length; i++) {
                if (!pages[i]) continue;
                for (var j = 0; j < pages[i].length; j++) {
                    pages[i][j].color = textColor;
                }
            }
        }
        paintFrame();
        if (t < 1) {
            requestAnimationFrame(frame);
            return;
        }
        // ---- 终帧：落定精确值，并把可见层交还给目标渲染方式 ----
        bgColor = toBg; textColor = toText;
        paintFrame();
        if (simTakeover) {
            // 立即按目标配色重建仿真位图（不走 80ms 防抖），随后 canvas 由 initSimulation 重新隐藏
            restartSimulationNow();
        }
    }
    requestAnimationFrame(frame);
}

/** HTML 富文本模式：仅刷新正文配色（不重排、不改阅读位置），供日夜渐变逐帧调用。 */
function applyHtmlThemeColors() {
    var c = document.getElementById('htmlContent');
    if (!c) return;
    c.classList.toggle('html-night', !!isNightMode);
    c.style.backgroundColor = bgColor;
    c.style.color = textColor;
    // 在途的快照页不吃上面这两行（它们各自带一份纸面底色），不逐张跟上就会「字已经入夜、纸还是日间」
    var host = htmlTurnHost();
    if (host && host.firstChild) {
        var paper = htmlPaper();
        var pages = host.querySelectorAll('.html-snap,.turn-back');
        for (var i = 0; i < pages.length; i++) paintHtmlPaper(pages[i], paper);
    }
    // 仿真书本的折页层不在上面这个查询里（turn.js 自己造节点），跟着同一次配色重发规则
    if (htmlSim) syncSimulationBackground();
}

// 设置页眉页脚显示
function setShowHeaderFooter(show) {
    showHeaderFooter = show;
    if (htmlMode) { rebuildHtml('layout'); return; }   // HTML 模式：页眉页脚的预留空间变了，重排
    if (!_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

// 设置自动翻页倒计时（秒）；>0 时在页眉右侧显示小倒计时，<=0 时隐藏
var autoPageCountdown = 0;
function setAutoPageCountdown(sec) {
    sec = sec | 0;
    if (sec !== autoPageCountdown) {
        autoPageCountdown = sec;
        if (!_deferDraw) redrawCurrent();
    }
}

// 设置页眉页脚字体大小
function setHeaderFooterFontSize(size) {
    headerFooterFontSize = size;
    if (htmlMode) { rebuildHtml('layout'); return; }   // HTML 模式：预留空间随字号变化，重排
    if (!_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

// 设置电量时间显示开关
function setShowBatteryTime(show) {
    showBatteryTime = show;
    if (htmlMode) { updateHtmlHeaderFooter(); return; }
    if (!_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

// 更新电量时间数据
function updateBatteryTime(level, time) {
    batteryText = level;
    timeText = time;
    if (htmlMode) { updateHtmlHeaderFooter(); return; }
    if (showBatteryTime && !_deferDraw) {
        redrawCurrent();
        if (simulationActive) reinitSimulation();
    }
}

function beginSettingsBatch() {
    _deferDraw = true;
}

function finishSettingsBatch() {
    _deferDraw = false;
    if (htmlMode) { flushHtmlRebuild(); return; }   // 纸带一路：整批只重建一次（配色档连在途快照页一起刷）
    if (currentContent) {
        drawPage(currentPage);
        notifyJavaPageChange();
        if (simulationActive) reinitSimulation();
    }
}

function jumpToPage(pageNumber) {
    goToPage(pageNumber - 1);
}

// ============ 后台预计算 ============
function preCalculate(content) {
    var oldContent = currentContent;
    var oldTitle = chapterTitle;
    var oldFontSize = fontSize;
    var oldFontFamily = fontFamily;
    // 暂存当前滚动状态，避免预计算污染正在阅读的滚动位置
    var oldLines = scrollLines, oldH = scrollContentHeight, oldMax = scrollMax,
        oldVH = scrollViewH, oldVW = scrollViewW, oldSY = scrollY;
    var processed = preprocessContent(content);
    currentContent = processed;
    chapterTitle = '';
    paginate(processed, '');
    var totalPages = pages.length;
    if (isScrollMode()) {
        layoutScroll(processed, '');
        totalPages = Math.max(1, Math.ceil((scrollContentHeight || scrollViewH || 1) / (scrollViewH || 1)));
    }
    var summary = {
        totalPages: totalPages,
        fontSize: fontSize,
        width: window.innerWidth,
        height: window.innerHeight,
        pageStarts: pageStartOffsets
    };
    currentContent = oldContent;
    chapterTitle = oldTitle;
    fontSize = oldFontSize;
    fontFamily = oldFontFamily;
    scrollLines = oldLines; scrollContentHeight = oldH; scrollMax = oldMax;
    scrollViewH = oldVH; scrollViewW = oldVW; scrollY = oldSY;
    return JSON.stringify(summary);
}

// ============ 初始化 ============
resizeCanvas();
</script>
